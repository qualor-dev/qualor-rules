                  - pattern: '$CALL({..., url: $FIRST + $PART + $S2, ...}, ...)'
                  - pattern-not: '$CALL({..., url: $X + $O1 + $O2 + $O3, ...}, ...)'
                  - pattern-not: '$CALL({..., url: "$U" + $S1 + $S2, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: $FIRST + $PART + $S2 + $S3, ...}, ...)'
                  - pattern-not: '$CALL({..., url: $X + $O1 + $O2 + $O3 + $O4, ...}, ...)'
                  - pattern-not: '$CALL({..., url: "$U" + $S1 + $S2 + $S3, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: $FIRST + $PART + $S2 + $S3 + $S4, ...}, ...)'
                  - pattern-not: '$CALL({..., url: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...)'
                  - pattern-not: '$CALL({..., url: "$U" + $S1 + $S2 + $S3 + $S4, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: $FIRST + $PART + $S2 + $S3 + $S4 + $S5, ...}, ...)'
                  - pattern-not: '$CALL({..., url: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...)'
                  - pattern-not: '$CALL({..., url: "$U" + $S1 + $S2 + $S3 + $S4 + $S5, ...}, ...)'
              # the url option of a request object (axios, got): templates. The first interpolation when the template starts with it, or
              # when the text before it does not end the host; the second when two start the template
              # or follow a scheme.
              - patterns:
                  - pattern: '$CALL({..., url: `${$PART}...`, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: `$H${$PART}...`, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $H
                      regex: ^(?!(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\]+[/?#\\]|/[^/\\]|[?#]|[\w.~-]+/)
              - patterns:
                  - pattern: '$CALL({..., url: `$H${$A}${$PART}...`, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $H
                      regex: ^(?!(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\]+[/?#\\]|/[^/\\]|[?#]|[\w.~-]+/)
              - patterns:
                  - pattern: '$CALL({..., url: `${$P}${$PART}...`, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: `${$P}://${$PART}...`, ...}, ...)'
              - patterns:
                  - pattern: '$CALL({..., url: `${$P}//${$PART}...`, ...}, ...)'
              # http/https request options: the host.
              - patterns:
                  - pattern-either:
                      - pattern: '$CALL({..., host: $PART, ...}, ...)'
                      - pattern: '$CALL({..., hostname: $PART, ...}, ...)'
          - focus-metavariable: $PART
