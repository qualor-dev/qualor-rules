                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $Y, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: `...`, ...}, ...})'
              # the Location value: the first part of a concatenation of k parts (not of k + 1)
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $PART + $S1, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $PART + $S1 + $S2, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $PART + $S1 + $S2 + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $PART + $S1 + $S2 + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $PART + $S1 + $S2 + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...})'
              # the Location value: the second part, after a constant string that does not end with a path separator after the host
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + $PART + $S2, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + $PART + $S2 + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + $PART + $S2 + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + $PART + $S2 + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...})'
              # the Location value: the third part, after a constant string and a constant without a path separator (a scheme, then a constant host name)
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + "=~/^[^/?#\\\\]*$/" + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + "=~/^[^/?#\\\\]*$/" + $PART + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + "=~/^[^/?#\\\\]*$/" + $PART + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "$U" + "=~/^[^/?#\\\\]*$/" + $PART + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...})'
              # the Location value: the third part, after a scheme alone and slashes (with or without host text)
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "=~/^[a-zA-Z][a-zA-Z0-9+.-]*:$/" + "=~/^[/\\\\]{1,2}[^/?#\\\\]*$/" + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "=~/^[a-zA-Z][a-zA-Z0-9+.-]*:$/" + "=~/^[/\\\\]{1,2}[^/?#\\\\]*$/" + $PART + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "=~/^[a-zA-Z][a-zA-Z0-9+.-]*:$/" + "=~/^[/\\\\]{1,2}[^/?#\\\\]*$/" + $PART + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: "=~/^[a-zA-Z][a-zA-Z0-9+.-]*:$/" + "=~/^[/\\\\]{1,2}[^/?#\\\\]*$/" + $PART + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...})'
              # the Location value: the second part, after a start that is not a constant string
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $FIRST + $PART, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "$U" + $S1, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $FIRST + $PART + $S2, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "$U" + $S1 + $S2, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $FIRST + $PART + $S2 + $S3, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "$U" + $S1 + $S2 + $S3, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $FIRST + $PART + $S2 + $S3 + $S4, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "$U" + $S1 + $S2 + $S3 + $S4, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: $FIRST + $PART + $S2 + $S3 + $S4 + $S5, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...}, ...})'
                  - pattern-not: 'new $NR(..., {..., headers: {..., $H: "$U" + $S1 + $S2 + $S3 + $S4 + $S5, ...}, ...})'
              # the Location value: templates. The first interpolation when the template starts with it, or when the text before it does not end the host; the second when two start the template or follow a scheme.
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: `${$PART}...`, ...}, ...})'
              - patterns:
                  - metavariable-regex:
                      metavariable: $TXT
                      regex: ^(?!(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\]+[/?#\\]|/[^/\\]|[?#]|[\w.~-]+/)
                  - pattern-either:
                      - patterns:
                          - pattern: 'new $NR(..., {..., headers: {..., $H: `$TXT${$PART}...`, ...}, ...})'
                      - patterns:
                          - pattern: 'new $NR(..., {..., headers: {..., $H: `$TXT${$A}${$PART}...`, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: `${$P}${$PART}...`, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: `${$P}://${$PART}...`, ...}, ...})'
              - patterns:
                  - pattern: 'new $NR(..., {..., headers: {..., $H: `${$P}//${$PART}...`, ...}, ...})'
          - focus-metavariable: $PART
