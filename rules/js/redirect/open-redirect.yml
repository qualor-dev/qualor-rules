                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + "=~/^[^/?#\\\\]*$/" + $PART, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + "=~/^[^/?#\\\\]*$/" + $PART + $S3, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + "$A" + $PART + $S3, ...)'
