                          - pattern-either:
                              - patterns:
                                  - pattern: '$OBJ.$M(`$H${$PART}...`, ...)'
                              - patterns:
                                  - pattern: '$OBJ.$M(`$H${$A}${$PART}...`, ...)'
                      - patterns:
                          - pattern: '$OBJ.$M(`${$P}${$PART}...`, ...)'
                      - patterns:
                          - pattern: '$OBJ.$M(`${$P}://${$PART}...`, ...)'
                      - patterns:
                          - pattern: '$OBJ.$M(`${$P}//${$PART}...`, ...)'
              # Express and the Pages Router: res.redirect(status, url).
              - patterns:
                  - pattern-either:
                      # the second argument: the whole value, when it is neither a concatenation nor a template
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $Y, ...)'
                          - pattern-not: '$OBJ.redirect($X, `...`, ...)'
                      # the second argument: the first part of a concatenation of k parts (not of k + 1)
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART + $S1, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART + $S1 + $S2, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART + $S1 + $S2 + $S3, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART + $S1 + $S2 + $S3 + $S4, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4 + $O5, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, $PART + $S1 + $S2 + $S3 + $S4 + $S5, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...)'
                      # the second argument: the second part, after a constant string that does not end with a path separator after the host
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + $PART, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + $PART + $S2, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + $PART + $S2 + $S3, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + $PART + $S2 + $S3 + $S4, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3 + $S4, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4 + $O5, ...)'
                      - patterns:
                          - pattern: '$OBJ.redirect($X, "$U" + $PART + $S2 + $S3 + $S4 + $S5, ...)'
                          - pattern-not: '$OBJ.redirect($X, "=~/^(?:(?:[a-zA-Z][a-zA-Z0-9+.-]*:)?//[^/?#\\\\]+[/?#\\\\]|/[^/\\\\]|[?#]|[\\w.~-]+/)/" + $PART + $S2 + $S3 + $S4 + $S5, ...)'
                          - pattern-not: '$OBJ.redirect($X, $X + $O1 + $O2 + $O3 + $O4 + $O5 + $O6, ...)'
