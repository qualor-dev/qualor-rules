          - pattern-either:
              - pattern: $TABLE[$KEY]
              - pattern: $TABLE.get($KEY)
          # A table the file writes to after its declaration, in any function, is no allow-list.
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE[$K2] = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.$PROP = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.set(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.push(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.unshift(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.splice(...);
              ...
          - pattern-not-inside: |
