              ...
    pattern-sinks:
      # The command of exec/execSync (run by a shell) and the program of execFile, execFileSync,
      # spawn, spawnSync and fork: the first argument of the child_process functions.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $CP = require($M)
                          ...
                      - pattern-inside: |
                          import * as $CP from $M;
                          ...
                      - pattern-inside: |
                          import $CP from $M;
                          ...
                  - pattern: $CP.$FN($CMD, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FN, ...} = require($M);
                          ...
                      - pattern-inside: |
                          import {..., $FN, ...} from $M;
                          ...
                  - pattern: $FN($CMD, ...)
              - pattern: require($M).$FN($CMD, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(node:)?child_process["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)$
          - focus-metavariable: $CMD
      # The arguments of execFile, execFileSync, spawn and spawnSync when the shell option is set:
      # they are joined into a command line for the shell.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $CP = require($M)
                          ...
                      - pattern-inside: |
                          import * as $CP from $M;
                          ...
                      - pattern-inside: |
                          import $CP from $M;
                          ...
                  - pattern: '$CP.$FN($PROG, $ARGS, {..., shell: $SHELL, ...}, ...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FN, ...} = require($M);
                          ...
                      - pattern-inside: |
                          import {..., $FN, ...} from $M;
                          ...
                  - pattern: '$FN($PROG, $ARGS, {..., shell: $SHELL, ...}, ...)'
              - pattern: 'require($M).$FN($PROG, $ARGS, {..., shell: $SHELL, ...}, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(node:)?child_process["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(execFile|execFileSync|spawn|spawnSync)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^(?!false$|undefined$|null$|0$|""$|''$)
          - focus-metavariable: $ARGS
      # A shell program given its command in the argument array. The shapes are string-regex
      # patterns ("=~/.../"): they match the string's text as written in the source (escapes
      # not decoded) and, unlike metavariable-regex, keep OpenGrep's prefilter small.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $CP = require($M)
                          ...
                      - pattern-inside: |
                          import * as $CP from $M;
                          ...
                      - pattern-inside: |
                          import $CP from $M;
                          ...
                  - pattern: '$CP.$FN($SHELLPROG, $SHELLARGS, ...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FN, ...} = require($M);
                          ...
                      - pattern-inside: |
                          import {..., $FN, ...} from $M;
                          ...
                  - pattern: '$FN($SHELLPROG, $SHELLARGS, ...)'
              - pattern: 'require($M).$FN($SHELLPROG, $SHELLARGS, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(node:)?child_process["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(execFile|execFileSync|spawn|spawnSync)$
          - pattern-either:
              # A POSIX shell after its command flag (-c, also in a flag cluster such as -lc): the
              # next element is the command line; later ones are only its positional parameters
              # ($0, $1, ...).
              - pattern: '$CALL("=~/^((/usr)?(/local)?/bin/)?(sh|bash|zsh|dash|ksh|ash)$/", [..., "=~/^-[A-Za-z]*c[A-Za-z]*$/", $SCRIPT, ...], ...)'
              # cmd.exe (any path and case) after /c or /k, also after other switches: every
              # later element is part of the command line it runs.
              - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?cmd(\.exe)?$/", [..., "=~/^/[cCkK]$/", ..., $SCRIPT, ...], ...)'
              # PowerShell (pwsh, powershell.exe, any path; parameter names in any case): every
              # element after -Command (-c) is part of the command; the first element after
              # -CommandWithArgs (-cwa) and the element after -EncodedCommand (-e, -ec) are the
              # command; the element after -File (-f) is the script to run. Not after -File (all
              # later elements are the script's parameters), after the command of -cwa (all
              # later elements fill $args) or, for pwsh, after a .ps1 script given without -File
              # (File is pwsh's default parameter). about_PowerShell_exe names no default
              # parameter for powershell.exe, so there `x.ps1 -c <request>` is taken as -Command.
              - patterns:
                  - pattern-either:
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?(pwsh|powershell)(\.exe)?$/", [..., "=~/(?i)^-(c|command)$/", ..., $SCRIPT, ...], ...)'
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?(pwsh|powershell)(\.exe)?$/", [..., "=~/(?i)^-(cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", $SCRIPT, ...], ...)'
                  - pattern-not: '$CALL($PS, [..., "=~/(?i)^-(f|file|cwa|commandwithargs)$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...], ...)'
                  - pattern-not: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?pwsh(\.exe)?$/", [..., "=~/(?i)\.ps1$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...], ...)'
                  # pwsh: a first element that is no parameter name is the script (File is the
                  # default parameter), so what follows are its parameters.
                  - pattern-not: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?pwsh(\.exe)?$/", ["=~/^[^-]/", ..., $SCRIPT, ...], ...)'
              # The first positional element, before any command parameter: for pwsh the script
              # to run (File is the default parameter); for powershell.exe either a script or a
              # command. Positional means first, or after a switch (about_pwsh's parameters
              # without a value), or after a parameter with its value (-Version takes a value in
              # powershell.exe only). Not after a command parameter or -File; for pwsh also not
              # after a .ps1 element or when the first element is a script (a string that is no
              # parameter name): what follows are that script's parameters. For powershell.exe,
              # whose docs name no default parameter, those stay reported.
              - patterns:
                  - pattern-either:
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?(pwsh|powershell)(\.exe)?$/", [$SCRIPT, ...], ...)'
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?(pwsh|powershell)(\.exe)?$/", [..., "=~/(?i)^-(login|l|interactive|i|mta|sta|noexit|noe|nologo|nol|noninteractive|noni|noprofile|nop|noprofileloadtime|sshservermode|sshs)$/", $SCRIPT, ...], ...)'
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?(pwsh|powershell)(\.exe)?$/", [..., "=~/(?i)^-(configurationfile|configurationname|config|custompipename|executionpolicy|ex|ep|inputformat|inp|if|outputformat|o|of|settingsfile|settings|windowstyle|w|workingdirectory|wd|wo|psconsolefile)$/", $VALUE, $SCRIPT, ...], ...)'
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?powershell(\.exe)?$/", [..., "=~/(?i)^-version$/", $VALUE, $SCRIPT, ...], ...)'
                      # powershell.exe given a first element that is no parameter name: it and
                      # every later element are taken for one command.
                      - pattern: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?powershell(\.exe)?$/", ["=~/^[^-]/", ..., $SCRIPT, ...], ...)'
                  - pattern-not: '$CALL($PS, [..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...], ...)'
                  - pattern-not: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?pwsh(\.exe)?$/", [..., "=~/(?i)\.ps1$/", ..., $SCRIPT, ...], ...)'
                  - pattern-not: '$CALL("=~/(?i)^([a-z]:)?(.*[/\\])?pwsh(\.exe)?$/", ["=~/^[^-]/", ..., $SCRIPT, ...], ...)'
          - focus-metavariable: $SCRIPT
      # util.promisify() of exec or execFile, as in the Node.js documentation.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $P = $PROMISIFY(require($M).$FN)
                      ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $CP = require($M)
                          ...
                      - pattern-inside: |
                          import * as $CP from $M;
                          ...
                      - pattern-inside: |
                          import $CP from $M;
                          ...
                  - pattern-inside: |
                      $P = $PROMISIFY($CP.$FN)
                      ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FN, ...} = require($M);
                          ...
                      - pattern-inside: |
                          import {..., $FN, ...} from $M;
                          ...
                  - pattern-inside: |
                      $P = $PROMISIFY($FN)
                      ...
          - pattern: $P($CMD, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(node:)?child_process["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(exec|execFile)$
          - metavariable-regex:
              metavariable: $PROMISIFY
              regex: ^(\w+\.)?promisify$
          - focus-metavariable: $CMD
