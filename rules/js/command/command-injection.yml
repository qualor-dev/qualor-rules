rules:
  - id: js.command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches an operating system command: run through a shell (exec,
      execSync, the shell option of spawn and execFile, or a shell program such as `sh -c` or
      `pwsh -Command`), its shell metacharacters can start other commands, and as the program
      name it runs whatever the client names. Run a fixed program with
      an argument array and no shell (`execFile('git', ['log', ref])`), and check values against an
      allow-list.
    metadata:
      title: OS command built from HTTP request data (Node.js)
      cwe: ['CWE-78']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [express, nextjs, fastify, node-child-process]
      sources:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
        - https://nodejs.org/api/child_process.html
        - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pwsh
        - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe?view=powershell-5.1
        - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cmd
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - The shell option is recognised in an options object literal of the call; options built
    #   before the call (`const options = { shell: true }`) are not followed.
    # - An allow-list check before the call (`if (!TOOLS.includes(x)) return`) is not recognised as
    #   a guard; an allow-list that yields constants is (a ternary, or a lookup in an object, array
    #   or Map declared const in the file with literal keys and values, comments allowed,
    #   optionally in Object.freeze). A table the file writes to after its declaration is not
    #   trusted. Tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - A shell program's command is followed when the argument array is written in the call
    #   (`spawn('sh', ['-c', cmd])`); an array built before the call is not.
    # - PowerShell parameters are recognised by the names about_pwsh lists (-Command/-c,
    #   -CommandWithArgs/-cwa, -EncodedCommand/-e/-ec, -File/-f; any case), for pwsh and
    #   powershell.exe alike; other shortened names (`-Comm`, `-enc`) are not. A script given
    #   without -File exempts the elements after it for pwsh only (File is pwsh's default
    #   parameter); about_PowerShell_exe names no default parameter, so for powershell.exe
    #   `x.ps1 -c <request>`, `x.ps1 <request>` and every element after a first element that is
    #   no parameter name are reported as one command. A request value as the first positional
    #   element (a script for pwsh) is reported. For pwsh, a first element that is no parameter
    #   name is taken for the script, with or without .ps1; a script without .ps1 after pwsh's
    #   own switches (`-NoProfile ./deploy -i <request>`) is not, so the switch name after it
    #   reads as pwsh's own (todook). For powershell.exe, a positional element after switches
    #   (`-NoProfile x.ps1 <request>`) is not followed (todoruleid).
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    # - A request field with a default value in a destructured parameter (`({ query = {} }, res)`)
    #   is not a source (OpenGrep's object patterns do not match it); one with a default in a
    #   declaration is.
    # - child_process functions are recognised through require() and import of `child_process` or
    #   `node:child_process` (module object, destructured or named imports, `require(...).exec`)
    #   and util.promisify() of exec or execFile; renamed imports (`exec as run`) are not.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions. A field
      # destructured from the request in a declaration (`const { query: { q } } = req;`, also
      # renamed or nested) is the same request data.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request, and may destructure it.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # The handlers above when they destructure the request in the parameter list
      # (`({ query, params: { id } }, res) => ...`, `async ({ body }) => ...` for Fastify, also
      # typed); each field binds its value. One branch with a generic field, whose handler and
      # field tests are exclusions, and a text condition that the file names a field (over the
      # whole file, intersected with the handler): OpenGrep keeps the rule's prefilter (its
      # 50,000-clause limit) and the scan stays fast.
      - patterns:
          - pattern-either:
              - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                - metavariable-regex:
                    metavariable: $RES
                    regex: ^(?!(res|resp|response|reply|rep|h|ctx|next|_res|_response)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $ROUTE
                    regex: ^(?!(get|head|post|put|delete|options|patch|all)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $PATH
                    regex: ^(?!["'`]/)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
                - metavariable-regex:
                    metavariable: $F
                    regex: ^(?!(query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)$)
          - pattern-regex: (?s)\A.*\b(?:query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)\b.*\z
          - focus-metavariable: $V
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments. Both
      # may be destructured, in a declaration or in the parameter list (`GET({ nextUrl })`,
      # `POST(request, { params: { slug } })`).
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - pattern: 'var {..., $F: $V, ...} = $CTX;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it. Only the lookup itself is clean: a
      # fallback to request data (`T[k] || req.query.x`, `T.get(k) ?? x`) still carries it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\