rules:
  - id: js.code-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Data from the HTTP request is run as JavaScript code (eval, the Function constructor or the
      node:vm module), so a client can run any code in this server process. node:vm is no sandbox
      either. Do not build code from request data: parse data with JSON.parse(), pass request
      values to fixed code as arguments or context values, use an expression parser that cannot
      reach JavaScript, or pick the code from an allow-list.
    metadata:
      title: JavaScript code built from HTTP request data (Node.js)
      cwe: ['CWE-94', 'CWE-95']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [express, nextjs, fastify, node-http, node-vm]
      sources:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://cwe.mitre.org/data/definitions/95.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/Function
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse
        - https://nodejs.org/api/vm.html
        - https://nodejs.org/api/timers.html
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nodejs.org/api/http.html
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A check of the code before the call (a regular expression that allows only digits and
    #   operators) is not followed: the checked value is still reported.
    # - An allow-list lookup yields constants only in a table declared const in the file with
    #   literal keys and values (comments allowed, optionally in Object.freeze) that the file never
    #   writes to; tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments.
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: $CTX.params
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {params}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {params}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}: $T, ...) { ... }'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: params
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s+as\s+const)?$
          - pattern-either:
              - pattern: $TABLE[$KEY]
              - pattern: $TABLE.get($KEY)
          # A table the file writes to after its declaration, in any function, is no allow-list.
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE[$K2] = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.$PROP = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.set(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.push(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.unshift(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.splice(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              Object.assign($TABLE, ...);
              ...
    # setTimeout() and setInterval() are no sinks here: Node.js throws a TypeError for a callback
    # that is not a function, so a string given to them is never run as code on the server.
    pattern-sinks:
      # eval(), also called indirectly ((0, eval)(x), globalThis.eval(x)).
      - patterns:
          - pattern: $EVAL($CODE, ...)
          - metavariable-regex:
              metavariable: $EVAL
              regex: ^(?:eval|(?:globalThis|global|window)\.eval|\(\s*\d+\s*,\s*eval\s*\))$
          - focus-metavariable: $CODE
      # The Function constructor, with or without new: every argument is code (parameter names and
      # the body).
      - patterns:
          - pattern-either:
              - pattern: new $FUNC(..., $CODE, ...)
              - pattern: $FUNC(..., $CODE, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: ^(?:(?:globalThis|global|window)\.)?Function$
          - focus-metavariable: $CODE
      # node:vm, imported as a module: the code argument of runInNewContext, runInContext,
      # runInThisContext, compileFunction, new Script and new SourceTextModule.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $VM = require($M)
                  ...
              - pattern-inside: |
                  import $VM from $M;
                  ...
              - pattern-inside: |
                  import * as $VM from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:node:)?vm["'`]?$
          - pattern-either:
              - patterns:
                  - pattern: $VM.$FN($CODE, ...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:runInNewContext|runInContext|runInThisContext|compileFunction)$
              - patterns:
                  - pattern: new $VM.$FN($CODE, ...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:Script|SourceTextModule)$
          - focus-metavariable: $CODE
      # node:vm, functions and classes imported by name (also renamed).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {..., $FN, ...} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:node:)?vm["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:runInNewContext|runInContext|runInThisContext|compileFunction|Script|SourceTextModule)$
          - pattern-either:
              - pattern: $FN($CODE, ...)
              - pattern: new $FN($CODE, ...)
          - focus-metavariable: $CODE
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $ORIG: $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {$ORIG as $FN} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:node:)?vm["'`]?$
          - metavariable-regex:
              metavariable: $ORIG
              regex: ^(?:runInNewContext|runInContext|runInThisContext|compileFunction|Script|SourceTextModule)$
          - pattern-either:
              - pattern: $FN($CODE, ...)
              - pattern: new $FN($CODE, ...)
          - focus-metavariable: $CODE
