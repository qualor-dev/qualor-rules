rules:
  - id: js.template-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Data from the HTTP request is used as a template (EJS, Pug, Handlebars, Nunjucks or lodash
      template), or, for EJS, as the whole data object of a render, which also sets render options.
      Template engines run code from templates, so the client can run code on the server or read
      its data. Keep templates fixed (files or constants) and pass request data as values in a
      data object (`res.render('view', { q: req.query.q })`), or pick the template from an
      allow-list.
    metadata:
      title: Template built from HTTP request data (Node.js)
      cwe: ['CWE-1336', 'CWE-94']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [express, nextjs, fastify, ejs, pug, handlebars, nunjucks, lodash]
      sources:
        - https://cwe.mitre.org/data/definitions/1336.html
        - https://cwe.mitre.org/data/definitions/94.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://ejs.co/
        - https://github.com/mde/ejs/blob/main/SECURITY.md
        - https://pugjs.org/api/reference.html
        - https://handlebarsjs.com/api-reference/compilation.html
        - https://mozilla.github.io/nunjucks/api.html
        - https://lodash.com/docs/4.17.15#template
        - https://expressjs.com/en/4x/api.html#res.render
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A request object passed whole as the data of res.render() is a sink only for a view name
    #   that ends in .ejs or in a file that sets EJS as the view engine (`app.set('view engine',
    #   'ejs')`) or registers it (`app.engine('html', ejs.renderFile)`), so a routes file whose
    #   engine is set in another file is missed; and only when it is passed or spread in place
    #   (`res.render('index', req.query)`), not through a variable first.
    # - The app.engine() gate ignores the extension EJS is registered for: with
    #   `app.engine('html', ejs.renderFile)` next to another default engine (Pug), views that the
    #   other engine renders are reported too (rare; recorded from review, no test line).
    # - An allow-list lookup yields constants only in a table declared const in the file with
    #   literal keys and values (comments allowed, optionally in Object.freeze) that the file never
    #   writes to; tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments.
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: $CTX.params
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {params}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {params}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}: $T, ...) { ... }'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: params
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s+as\s+const)?$
          - pattern-either:
              - pattern: $TABLE[$KEY]
              - pattern: $TABLE.get($KEY)
          # A table the file writes to after its declaration, in any function, is no allow-list.
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE[$K2] = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.$PROP = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.set(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.push(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.unshift(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.splice(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              Object.assign($TABLE, ...);
              ...
    pattern-sinks:
      # The template source: the first argument of EJS render/compile, Pug render/compile/
      # compileClient, Handlebars compile/precompile, Nunjucks renderString/compile/
      # precompileString and lodash template, on the imported module.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?ejs["'`]?$
          - pattern: $MOD.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:render|compile)$
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?pug["'`]?$
          - pattern: $MOD.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:render|compile|compileClient|compileClientWithDependenciesTracked)$
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?handlebars["'`]?$
          - pattern: $MOD.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:compile|precompile)$
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?nunjucks["'`]?$
          - pattern: $MOD.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:renderString|compile|precompileString)$
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?lodash["'`]?$
          - pattern: $MOD.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:template)$
          - focus-metavariable: $TPL
      # The same functions imported by name (also renamed), and lodash.template's own package.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {..., $FN, ...} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:ejs|pug|handlebars|nunjucks|lodash)["'`]?$
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:render|compile|compileClient|compileClientWithDependenciesTracked|precompile|renderString|precompileString|template)$
          - pattern: $FN($TPL, ...)
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $ORIG: $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {$ORIG as $FN} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:ejs|pug|handlebars|nunjucks|lodash)["'`]?$
          - metavariable-regex:
              metavariable: $ORIG
              regex: ^(?:render|compile|compileClient|compileClientWithDependenciesTracked|precompile|renderString|precompileString|template)$
          - pattern: $FN($TPL, ...)
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:lodash\.template|lodash/template)["'`]?$
          - pattern: $MOD($TPL, ...)
          - focus-metavariable: $TPL
      # Nunjucks: new Template(source), and renderString() of an Environment made in the file.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?nunjucks["'`]?$
          - pattern: new $MOD.Template($TPL, ...)
          - focus-metavariable: $TPL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?nunjucks["'`]?$
          - pattern-either:
              - pattern-inside: |
                  $ENV = new $MOD.Environment(...);
                  ...
              - pattern-inside: |
                  $ENV = $MOD.configure(...);
                  ...
          - pattern: $ENV.renderString($TPL, ...)
          - focus-metavariable: $TPL
      # Handlebars: compile() and precompile() of an instance made with create().
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?handlebars["'`]?$
          - pattern-inside: |
              $HB = $MOD.create();
              ...
          - pattern: $HB.$FN($TPL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:compile|precompile)$
          - focus-metavariable: $TPL
      # EJS options from the request (delimiter, outputFunctionName, escape, localsName and the
      # like change how the template is compiled): the options argument of render, compile and
      # renderFile.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?ejs["'`]?$
          - pattern-either:
              - pattern: $MOD.render($TPL, $DATA, $OPTS, ...)
              - pattern: $MOD.compile($TPL, $OPTS, ...)
              - pattern: $MOD.renderFile($FILE, $DATA, $OPTS, ...)
          - pattern-not: $MOD.renderFile($FILE, $DATA, function (...) { ... })
          - pattern-not: $MOD.renderFile($FILE, $DATA, (...) => { ... })
          - pattern-not: $MOD.renderFile($FILE, $DATA, (...) => $BODY)
          - focus-metavariable: $OPTS
      # EJS: a request object passed whole (or spread) as the data of a render (the EJS docs name
      # `res.render('index', req.query)`): EJS reads render options from it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?ejs["'`]?$
          - pattern-either:
              - pattern: $MOD.render($TPL, $DATA, ...)
              - pattern: $MOD.renderFile($FILE, $DATA, ...)
              - pattern: '$MOD.render($TPL, {..., ...$DATA, ...}, ...)'
              - pattern: '$MOD.renderFile($FILE, {..., ...$DATA, ...}, ...)'
          - metavariable-regex:
              metavariable: $DATA
              regex: ^[A-Za-z_$][\w$]*\.(?:query|body|params|cookies|signedCookies|headers)$
          - focus-metavariable: $DATA
      - patterns:
          - pattern-inside: |
              $APP.set($KEY, $ENGINE);
              ...
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'`]view engine["'`]$
          - metavariable-regex:
              metavariable: $ENGINE
              regex: ^["'`]ejs["'`]$
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
