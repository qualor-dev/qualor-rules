rules:
  - id: js.template-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Data from the HTTP request is used as a template (EJS, Pug, Handlebars, Nunjucks or lodash
      template), or, for EJS, as the whole data object of a render, which also sets render options.
      Template engines run code from templates, so the client can run code on the server or read
      its data. Keep templates fixed (files or constants) and pass request data as values in a
      data object (`res.render('view', { q: req.query.q })`), or pick the template from an
      allow-list.
    metadata:
      title: Template built from HTTP request data (Node.js)
      cwe: ['CWE-1336', 'CWE-94']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [express, nextjs, fastify, ejs, pug, handlebars, nunjucks, lodash]
      sources:
        - https://cwe.mitre.org/data/definitions/1336.html
        - https://cwe.mitre.org/data/definitions/94.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://ejs.co/
        - https://github.com/mde/ejs/blob/main/SECURITY.md
        - https://pugjs.org/api/reference.html
        - https://handlebarsjs.com/api-reference/compilation.html
        - https://mozilla.github.io/nunjucks/api.html
        - https://lodash.com/docs/4.17.15#template
        - https://expressjs.com/en/4x/api.html#res.render
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A request object passed whole as the data of res.render() is a sink only for a view name
    #   that ends in .ejs or in a file that sets EJS as the view engine (`app.set('view engine',
    #   'ejs')`) or registers it (`app.engine('html', ejs.renderFile)`), so a routes file whose
    #   engine is set in another file is missed; and only when it is passed or spread in place
    #   (`res.render('index', req.query)`), not through a variable first.
    # - The app.engine() gate ignores the extension EJS is registered for: with
    #   `app.engine('html', ejs.renderFile)` next to another default engine (Pug), views that the
    #   other engine renders are reported too (rare; recorded from review, no test line).
    # - An allow-list lookup yields constants only in a table declared const in the file with
    #   literal keys and values (comments allowed, optionally in Object.freeze) that the file never
    #   writes to; tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    # - A request field with a default value in a destructured parameter (`({ query = {} }, res)`)
    #   is not a source (OpenGrep's object patterns do not match it); one with a default in a
    #   declaration is.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions. A field
      # destructured from the request in a declaration (`const { query: { q } } = req;`, also
      # renamed or nested) is the same request data.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request, and may destructure it.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # The handlers above when they destructure the request in the parameter list
      # (`({ query, params: { id } }, res) => ...`, `async ({ body }) => ...` for Fastify, also
      # typed); each field binds its value. One branch with a generic field, whose handler and
      # field tests are exclusions, and a text condition that the file names a field (over the
      # whole file, intersected with the handler): OpenGrep keeps the rule's prefilter (its
      # 50,000-clause limit) and the scan stays fast.
      - patterns:
          - pattern-either:
              - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                - metavariable-regex:
                    metavariable: $RES
                    regex: ^(?!(res|resp|response|reply|rep|h|ctx|next|_res|_response)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $ROUTE
                    regex: ^(?!(get|head|post|put|delete|options|patch|all)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $PATH
                    regex: ^(?!["'`]/)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
                - metavariable-regex:
                    metavariable: $F
                    regex: ^(?!(query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)$)
          - pattern-regex: (?s)\A.*\b(?:query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)\b.*\z
          - focus-metavariable: $V
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments. Both
      # may be destructured, in a declaration or in the parameter list (`GET({ nextUrl })`,
      # `POST(request, { params: { slug } })`).
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - pattern: 'var {..., $F: $V, ...} = $CTX;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s+as\s+const)?$
          - pattern-either:
              - pattern: $TABLE[$KEY]
              - pattern: $TABLE.get($KEY)
          # A table the file writes to after its declaration, in any function, is no allow-list.
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE[$K2] = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.$PROP = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.set(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.push(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.unshift(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.splice(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              Object.assign($TABLE, ...);
              ...
    # Performance: OpenGrep's prefilter (skip a file that lacks the rule's words) multiplies the
    # positive conditions of the sinks, one factor per sink and per branch, and gives up (None:
    # every JS file is matched in full) past about 50,000 clauses. So the module import is bound
    # once for all module functions, and the conditions that give no word (which engine a function
    # belongs to, the request-object test, the response name, the EJS view gates) are exclusions
    # of the same shape with the condition reversed. After a change,
    # `opengrep-core -prefilter_of_rules <this file>` must print a small Some, and a large
    # minified file with the rule's words in it must scan in seconds with `--timeout 0`.
    pattern-sinks:
      # The engines' functions on the module imported whole (require, a default or namespace
      # import). Which function belongs to which engine is checked by exclusions; the file names
      # the engine in quotes, a word for OpenGrep's prefilter.
      - patterns:
          - pattern-regex: (?s)\A.*["'`](?:ejs|pug|handlebars|nunjucks|lodash|lodash\.template|lodash/template)["'`].*\z
          - pattern-either:
              - pattern-inside: |
                  $MOD = require($M)
                  ...
              - pattern-inside: |
                  import $MOD from $M;
                  ...
              - pattern-inside: |
                  import * as $MOD from $M;
                  ...
          # (the module, as an exclusion of the imports of other modules)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $MOD = require($M)
                        ...
                    - pattern-inside: |
                        import $MOD from $M;
                        ...
                    - pattern-inside: |
                        import * as $MOD from $M;
                        ...
                - metavariable-regex:
                    metavariable: $M
                    regex: ^(?!["'`]?(?:ejs|pug|handlebars|nunjucks|lodash|lodash\.template|lodash/template)["'`]?$)
          - pattern-either:
              # The template source: the first argument of EJS render/compile, Pug render/compile/
              # compileClient, Handlebars compile/precompile, Nunjucks renderString/compile/
              # precompileString and new Template(), and lodash template.
              - patterns:
                  - pattern-either:
                      - pattern: $MOD.render($SINK, ...)
                      - pattern: $MOD.compile($SINK, ...)
                      - pattern: $MOD.compileClient($SINK, ...)
                      - pattern: $MOD.compileClientWithDependenciesTracked($SINK, ...)
                      - pattern: $MOD.precompile($SINK, ...)
                      - pattern: $MOD.renderString($SINK, ...)
                      - pattern: $MOD.precompileString($SINK, ...)
                      - pattern: $MOD.template($SINK, ...)
                      - pattern: new $MOD.Template($SINK, ...)
                  # render: EJS and Pug
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?(?:ejs|pug)["'`]?$)
                        - pattern: $MOD.render($SINK, ...)
                  # (compile and compileClient are not paired: no engine of the list has a function of
                  # these names that does not compile a template)
                  # precompile: Handlebars
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?handlebars["'`]?$)
                        - pattern: $MOD.precompile($SINK, ...)
                  # renderString, precompileString and new Template(): Nunjucks
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?nunjucks["'`]?$)
                        - pattern-either:
                            - pattern: $MOD.renderString($SINK, ...)
                            - pattern: $MOD.precompileString($SINK, ...)
                            - pattern: new $MOD.Template($SINK, ...)
                  # template: lodash
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?lodash["'`]?$)
                        - pattern: $MOD.template($SINK, ...)
              # lodash.template's own package, called directly. (The module as an exclusion, and
              # its name over the whole file, a word for OpenGrep's prefilter.)
              - patterns:
                  - pattern-regex: (?s)\A.*lodash[./]template.*\z
                  - pattern: $MOD($SINK, ...)
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?(?:lodash\.template|lodash/template)["'`]?$)
                        - pattern: $MOD($SINK, ...)
              # Nunjucks: renderString() of an Environment made in the file; Handlebars: compile()
              # and precompile() of an instance made with create().
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $INST = new $MOD.Environment(...);
                          ...
                      - pattern-inside: |
                          $INST = $MOD.configure(...);
                          ...
                      - pattern-inside: |
                          $INST = $MOD.create();
                          ...
                  - pattern-either:
                      - pattern: $INST.renderString($SINK, ...)
                      - pattern: $INST.compile($SINK, ...)
                      - pattern: $INST.precompile($SINK, ...)
                  # (create, from Handlebars: lodash has a create() too; the engines have no other
                  # pairs of these names, so they are not excluded)
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?handlebars["'`]?$)
                        - pattern-inside: |
                            $INST = $MOD.create();
                            ...
                        - pattern-either:
                            - pattern: $INST.renderString($SINK, ...)
                            - pattern: $INST.compile($SINK, ...)
                            - pattern: $INST.precompile($SINK, ...)
              # EJS options from the request (delimiter, outputFunctionName, escape, localsName and
              # the like change how the template is compiled): the options argument of render,
              # compile and renderFile.
              - patterns:
                  - pattern-either:
                      - pattern: $MOD.render($TPL, $DATA, $SINK, ...)
                      - pattern: $MOD.compile($TPL, $SINK, ...)
                      - pattern: $MOD.renderFile($FILE, $DATA, $SINK, ...)
                  - pattern-not: $MOD.renderFile($FILE, $DATA, function (...) { ... })
                  - pattern-not: $MOD.renderFile($FILE, $DATA, (...) => { ... })
                  - pattern-not: $MOD.renderFile($FILE, $DATA, (...) => $BODY)
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?ejs["'`]?$)
                        - pattern-either:
                            - pattern: $MOD.render($TPL, $DATA, $SINK, ...)
                            - pattern: $MOD.compile($TPL, $SINK, ...)
                            - pattern: $MOD.renderFile($FILE, $DATA, $SINK, ...)
              # EJS: a request object passed whole (or spread) as the data of a render (the EJS
              # docs name `res.render('index', req.query)`): EJS reads render options from it.
              - patterns:
                  - pattern-either:
                      - pattern: $MOD.render($TPL, $SINK, ...)
                      - pattern: $MOD.renderFile($FILE, $SINK, ...)
                      - pattern: '$MOD.render($TPL, {..., ...$SINK, ...}, ...)'
                      - pattern: '$MOD.renderFile($FILE, {..., ...$SINK, ...}, ...)'
                  # (the request-object test, as an exclusion)
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern: $MOD.render($TPL, $SINK, ...)
                            - pattern: $MOD.renderFile($FILE, $SINK, ...)
                            - pattern: '$MOD.render($TPL, {..., ...$SINK, ...}, ...)'
                            - pattern: '$MOD.renderFile($FILE, {..., ...$SINK, ...}, ...)'
                        - metavariable-regex:
                            metavariable: $SINK
                            regex: ^(?![A-Za-z_$][\w$]*\.(?:query|body|params|cookies|signedCookies|headers)$)
                  - pattern-not:
                      patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $MOD = require($M)
                                ...
                            - pattern-inside: |
                                import $MOD from $M;
                                ...
                            - pattern-inside: |
                                import * as $MOD from $M;
                                ...
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(?!["'`]?ejs["'`]?$)
                        - pattern-either:
                            - pattern: $MOD.render($TPL, $SINK, ...)
                            - pattern: $MOD.renderFile($FILE, $SINK, ...)
                            - pattern: '$MOD.render($TPL, {..., ...$SINK, ...}, ...)'
                            - pattern: '$MOD.renderFile($FILE, {..., ...$SINK, ...}, ...)'
          - focus-metavariable: $SINK
      # The same functions imported by name (also renamed; the require form also matches
      # `const { compile } = require('pug')`). The name is checked by exclusions.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., $ORIG: $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {$ORIG as $FN} from $M;
                  ...
              - pattern-inside: |
                  import {..., $FN, ...} from $M;
                  ...
          # (the module: its quoted name in the file, a word for OpenGrep's prefilter, and the
          # import of another module as an exclusion)
          - pattern-regex: (?s)\A.*["'`](?:ejs|pug|handlebars|nunjucks|lodash)["'`].*\z
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        const {..., $ORIG: $FN, ...} = require($M);
                        ...
                    - pattern-inside: |
                        import {$ORIG as $FN} from $M;
                        ...
                    - pattern-inside: |
                        import {..., $FN, ...} from $M;
                        ...
                - metavariable-regex:
                    metavariable: $M
                    regex: ^(?!["'`]?(?:ejs|pug|handlebars|nunjucks|lodash)["'`]?$)
          - pattern: $FN($TPL, ...)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        const {..., $ORIG: $FN, ...} = require($M);
                        ...
                    - pattern-inside: |
                        import {$ORIG as $FN} from $M;
                        ...
                - metavariable-regex:
                    metavariable: $ORIG
                    regex: ^(?!(?:render|compile|compileClient|compileClientWithDependenciesTracked|precompile|renderString|precompileString|template)$)
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    import {..., $FN, ...} from $M;
                    ...
                - metavariable-regex:
                    metavariable: $FN
                    regex: ^(?!(?:render|compile|compileClient|compileClientWithDependenciesTracked|precompile|renderString|precompileString|template)$)
          - focus-metavariable: $TPL
      # EJS as the view engine: a request object passed whole (or spread) as the data of
      # res.render() in a file that sets EJS as the view engine (`app.set('view engine', 'ejs')`)
      # or registers it for another extension (`app.engine('html', ejs.renderFile)`), or with a
      # view name that ends in .ejs, which Express renders with EJS. The response name, the
      # request-object test and these conditions are exclusions; each condition names ejs, a word
      # for OpenGrep's prefilter.
      - patterns:
          - pattern-regex: (?s)\A.*ejs.*\z
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - pattern-either:
              - pattern: $RES.render($VIEW, $DATA, ...)
              - pattern: '$RES.render($VIEW, {..., ...$DATA, ...}, ...)'
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern-inside: function ($REQ, $RES, ...) { ... }
                    - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
                - metavariable-regex:
                    metavariable: $RES
                    regex: ^(?!(res|resp|response|_res|_response)$)
                - pattern-either:
                    - pattern: $RES.render($VIEW, $DATA, ...)
                    - pattern: '$RES.render($VIEW, {..., ...$DATA, ...}, ...)'
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: $RES.render($VIEW, $DATA, ...)
                    - pattern: '$RES.render($VIEW, {..., ...$DATA, ...}, ...)'
                - metavariable-regex:
                    metavariable: $DATA
                    regex: ^(?![A-Za-z_$][\w$]*\.(?:query|body|params|cookies|signedCookies|headers)$)
          # (not outside one of the three EJS conditions)
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: $RES.render($VIEW, $DATA, ...)
                    - pattern: '$RES.render($VIEW, {..., ...$DATA, ...}, ...)'
                - pattern-not-inside:
                    patterns:
                      - pattern-inside: |
                          $APP.set($KEY, $ENGINE);
                          ...
                      - metavariable-regex:
                          metavariable: $KEY
                          regex: ^["'`]view engine["'`]$
                      - metavariable-regex:
                          metavariable: $ENGINE
                          regex: ^["'`]ejs["'`]$
                - pattern-not-inside:
                    patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $MOD = require($M)
                              ...
                          - pattern-inside: |
                              import $MOD from $M;
                              ...
                          - pattern-inside: |
                              import * as $MOD from $M;
                              ...
                      - metavariable-regex:
                          metavariable: $M
                          regex: ^["'`]?ejs["'`]?$
                      - pattern-inside: |
                          $APP.engine($EXT, $MOD.$RENDER);
                          ...
                      - metavariable-regex:
                          metavariable: $RENDER
                          regex: ^(?:renderFile|__express)$
                - pattern-not:
                    patterns:
                      - pattern-either:
                          - pattern: $RES.render($VIEW, $DATA, ...)
                          - pattern: '$RES.render($VIEW, {..., ...$DATA, ...}, ...)'
                      - metavariable-regex:
                          metavariable: $VIEW
                          regex: ^["'`][^"'`]*\.ejs["'`]$
          - focus-metavariable: $DATA
