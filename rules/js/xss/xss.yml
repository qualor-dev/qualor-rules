rules:
  - id: js.xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without escaping: markup or
      script in it runs in the browser of whoever opens the page. Escape it for HTML
      (`escapeHtml(x)` from escape-html, `he.escape(x)`), sanitize HTML that users may author
      (sanitize-html, DOMPurify), render it through an autoescaping template engine
      (`res.render(view, data)`), or answer with JSON (`res.json(data)`) or another content type.
    metadata:
      title: HTML response built from HTTP request data (Node.js)
      cwe: ['CWE-79']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [express, nextjs, fastify, node-http]
      sources:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://expressjs.com/en/5x/api/response/
        - https://expressjs.com/en/4x/api.html#res.send
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nodejs.org/api/http.html
        - https://fastify.dev/docs/latest/Reference/Reply/
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://nextjs.org/docs/pages/building-your-application/routing/api-routes
        - https://github.com/component/escape-html
        - https://github.com/mathiasbynens/he
        - https://github.com/validatorjs/validator.js
        - https://github.com/apostrophecms/sanitize-html
        - https://github.com/cure53/DOMPurify
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A content type set through an object of headers (`res.set({ 'Content-Type': ... })`) is
    #   not seen: a later res.send() of a string is taken for HTML.
    # - res.write()/res.end() without an HTML content type are sinks only when the text is visibly
    #   HTML (a string with a tag in it); a bare request value written without a content type is
    #   missed although browsers may sniff it as HTML.
    # - The results of awaited methods of other objects are not request data (data loaded with a
    #   request value as its key, `await User.findById(req.params.id)`), except renderers,
    #   parsers, formatters, translators, promise helpers, request.json()/formData()/text(),
    #   methods of the response, functions imported by name, and axios/got/superagent/undici
    #   requests to a URL that visibly starts with request data (see the results of other sinks
    #   below); another method that returns the request value it is given is missed, and so is a function called through a module object
    #   (`import * as widgets`, then `await widgets.drawWidget(req.params.id)`). An awaited helper
    #   that is given the response object (`await renderCard(id, res)`) is clean, also when it
    #   returns the request value. A method named like a function the file imports by name stays
    #   request data. When a function is passed to such a call (`await cache.wrap(key, async ()
    #   => ...)`, `await db.transaction(async (t) => { ... })`), only the value of the call is
    #   clean: what is written inside the callback is checked as usual.
    # - res.send() of a variable first assigned an object or array literal is taken for JSON, also
    #   when the variable is later given a string.
    # - A Fastify handler whose reply parameter is named res is taken for an Express handler, so a
    #   string it sends (text/plain in Fastify) is reported.
    # - An allow-list lookup yields constants only in a table declared const in the file with
    #   literal keys and values (comments allowed, optionally in Object.freeze) that the file never
    #   writes to; tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - The results of other rules' sinks (a decision, as in go.xss and java.xss): what exec(),
    #   execSync() or util.promisify(exec) print and what readFileSync() reads are not request
    #   data (request data in the command or the file name is js.command-injection's or
    #   js.path-traversal's finding, not reported again); a page fetched from a URL that the
    #   request visibly chooses stays request data (ruling J2): its URL starts with a request value,
    #   also after a lone scheme or `//`. One fetched from a fixed origin, a path of this site, a
    #   URL in a variable or a template on a constant base is that service's data. Limits of that:
    #   the output of execFileSync()/spawnSync() with a request-chosen program is reported again
    #   (`todook:`); output given to a callback (`execFile('echo', [x], (err, out) => ...)`) is
    #   not followed (`todoruleid:`); a request-chosen URL held in a variable first (`const
    #   target = req.query.url; await axios.get(target)`) is taken for stored data, and so is a
    #   URL whose request value has another name than req, request or a destructured field name
    #   (`(r, res)`, `({ query: q }, res)`, `({ query: { url } }, res)`) (`todoruleid:`); fetch() itself given an origin held in a constant (`fetch(API_BASE +
    #   '/pages/' + id)`) counts as request data (`todook:`).
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    # - A request field with a default value in a destructured parameter (`({ query = {} }, res)`)
    #   is not a source (OpenGrep's object patterns do not match it); one with a default in a
    #   declaration is.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions. A field
      # destructured from the request in a declaration (`const { query: { q } } = req;`, also
      # renamed or nested) is the same request data.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request, and may destructure it.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., query: $V, ...} = $REQ;'
                      - pattern: 'var {..., params: $V, ...} = $REQ;'
                      - pattern: 'var {..., body: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., signedCookies: $V, ...} = $REQ;'
                      - pattern: 'var {..., originalUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., path: $V, ...} = $REQ;'
                      - pattern: 'var {..., raw: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      # The handlers above when they destructure the request in the parameter list
      # (`({ query, params: { id } }, res) => ...`, `async ({ body }) => ...` for Fastify, also
      # typed); each field binds its value. One branch with a generic field, whose handler and
      # field tests are exclusions, and a text condition that the file names a field (over the
      # whole file, intersected with the handler): OpenGrep keeps the rule's prefilter (its
      # 50,000-clause limit) and the scan stays fast.
      - patterns:
          - pattern-either:
              - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
              - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
              - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
              - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                - metavariable-regex:
                    metavariable: $RES
                    regex: ^(?!(res|resp|response|reply|rep|h|ctx|next|_res|_response)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $ROUTE
                    regex: ^(?!(get|head|post|put|delete|options|patch|all)$)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                - metavariable-regex:
                    metavariable: $PATH
                    regex: ^(?!["'`]/)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: 'function ({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function ({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}, $RES, ...) { ... }'
                    - pattern: 'function $HANDLER({..., $F: $V, ...}: $T, $RES, ...) { ... }'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}) { ... })'
                    - pattern: '$APP.$ROUTE($PATH, ..., function ({..., $F: $V, ...}: $T) { ... })'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}) { ... }, ...})'
                    - pattern: '$APP.route({..., handler: function ({..., $F: $V, ...}: $T) { ... }, ...})'
                - metavariable-regex:
                    metavariable: $F
                    regex: ^(?!(query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)$)
          - pattern-regex: (?s)\A.*\b(?:query|params|body|headers|cookies|signedCookies|originalUrl|url|path|raw)\b.*\z
          - focus-metavariable: $V
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments. Both
      # may be destructured, in a declaration or in the parameter list (`GET({ nextUrl })`,
      # `POST(request, { params: { slug } })`).
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., nextUrl: $V, ...} = $REQ;'
                      - pattern: 'var {..., url: $V, ...} = $REQ;'
                      - pattern: 'var {..., headers: $V, ...} = $REQ;'
                      - pattern: 'var {..., cookies: $V, ...} = $REQ;'
                  - pattern: 'var {..., $F: $V, ...} = $REQ;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: 'function $METHOD({..., cookies: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., nextUrl: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., url: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., headers: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ({..., cookies: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - focus-metavariable: $V
              - patterns:
                  - pattern-either:
                      - pattern: 'var {..., params: $V, ...} = $CTX;'
                  - pattern: 'var {..., $F: $V, ...} = $CTX;'
                  - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {..., params: $V, ...}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {..., params: $V, ...}: $T, ...) { ... }'
          - pattern-not-inside:
              patterns:
                - pattern: 'function $METHOD(...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - pattern-not-inside:
              patterns:
                - pattern: '$METHOD = function (...) { ... }'
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?!(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$)
          - focus-metavariable: $V
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\