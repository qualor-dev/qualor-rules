              regex: (?i)^.*(html|xml|svg)
          - pattern-either:
              - pattern: $RES.send($BODY)
              - pattern: $RES.status($CODE2).send($BODY)
              - pattern: $RES.code($CODE2).send($BODY)
              - pattern: $RES.write($BODY, ...)
              - pattern: $RES.end($BODY, ...)
              - patterns:
                  - pattern: return $BODY;
                  - pattern-not: return $RES.$METHOD(...);
          - focus-metavariable: $BODY
      # res.write()/res.end() (Node http, Express) without a content type: text that is visibly
      # HTML.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|_res|_response)$
          - pattern-either:
              - pattern: $RES.write($BODY, ...)
              - pattern: $RES.end($BODY, ...)
          - metavariable-regex:
              metavariable: $BODY
              regex: '(?s)^.*["''`][^"''`]*<[A-Za-z!/]'
          - pattern-not-inside: |
              $RES.setHeader(...);
              ...
          - pattern-not-inside: |
              $RES.writeHead(...);
              ...
          - pattern-not-inside: |
              $RES.type(...);
              ...
          - pattern-not-inside: |
              $RES.set(...);
              ...
          - focus-metavariable: $BODY
      # A Web Response (Next.js App Router route handlers) with an HTML content type.
      - patterns:
          - pattern-either:
              - pattern: 'new Response($BODY, {..., headers: {..., $HEADER: $TYPE, ...}, ...})'
              - pattern: 'new NextResponse($BODY, {..., headers: {..., $HEADER: $TYPE, ...}, ...})'
          - metavariable-regex:
              metavariable: $HEADER
              regex: (?i)^["'`]?content-type["'`]?$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^.*(html|xml|svg)
          - focus-metavariable: $BODY
