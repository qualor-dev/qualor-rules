rules:
  - id: js.regex-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Data from the HTTP request is used as a regular expression pattern (new RegExp() or
      RegExp()). A crafted pattern such as `(a+)+$` can make matching take exponential time and
      tie up the server's single event loop (ReDoS), or match more than intended. Escape request
      text with RegExp.escape() (or lodash escapeRegExp(), escape-string-regexp) before building a
      pattern, pick the pattern from a fixed allow-list, or match request data against a constant
      pattern (`/^[a-z]+$/.test(value)`, `value.includes(term)`).
    metadata:
      title: Regular expression built from HTTP request data (Node.js)
      cwe: ['CWE-1333', 'CWE-400']
      owasp: []
      kind: issue
      severity: medium
      confidence: high
      frameworks: [express, nextjs, fastify, node-http, lodash, escape-string-regexp]
      sources:
        - https://cwe.mitre.org/data/definitions/1333.html
        - https://cwe.mitre.org/data/definitions/400.html
        - https://community.owasp.org/attacks/Regular_expression_Denial_of_Service_-_ReDoS
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/RegExp
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/escape
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Character_escape
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/replace
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/match
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/includes
        - https://lodash.com/docs/4.17.15#escapeRegExp
        - https://github.com/sindresorhus/escape-string-regexp
        - https://expressjs.com/en/4x/api.html#req
        - https://expressjs.com/en/5x/api.html#req
        - https://nodejs.org/api/http.html
        - https://nextjs.org/docs/app/api-reference/file-conventions/route
        - https://fastify.dev/docs/latest/Reference/Routes/
        - https://fastify.dev/docs/latest/Reference/Request/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - String methods that turn a string argument into a pattern (`text.match(x)`,
    #   `text.matchAll(x)`, `text.search(x)`) are not sinks: their receivers have no type, and
    #   match/search are common method names of other libraries. A MongoDB `$regex` query operator
    #   is not a sink either.
    # - A pattern first validated by a constant pattern (`if (!/^[\w ]+$/.test(word)) return`) and
    #   a value stripped of everything but letters and digits (`q.replace(/[^a-z0-9]/gi, '')`) are
    #   still reported. Hand-written escaping is recognised only in its common form (a global
    #   replace() or replaceAll() with one character class that holds every syntax character, and
    #   the "\\$&" replacement), inline or in a local helper whose body only returns it, declared
    #   before the call; a helper declared after the call, a replacement function, a pattern held
    #   in a constant and helpers of other modules are still reported (MDN advises
    #   RegExp.escape() over hand-written escaping).
    # - A check against a literal allow-list is followed only with an early return or throw
    #   (`if (!LIST.includes(x)) return ...;`, also has() on a Set) on a const array or Set of
    #   string literals (also in Object.freeze) that the file never changes; the check as the
    #   condition of an if around the use (todook), other checks and lists whose strings hold
    #   escaped quotes are not followed.
    #   The check covers the value up to its next assignment in the same block; an assignment
    #   inside a nested block after the check (`if (x) { q = req.query.other; }`) or by
    #   destructuring (`[q] = [req.query.other]`) is not seen, so the value stays clean.
    # - An element of a request array reached through a callback parameter
    #   (`req.body.filters.map((f) => new RegExp(f.pattern))`) is missed.
    # - An allow-list lookup yields constants only in a table declared const in the file with
    #   literal keys and values (comments allowed, optionally in Object.freeze) that the file never
    #   writes to; tables with escaped quotes in their strings, nested tables and tables of other
    #   modules are not recognised, so their lookups are reported.
    # - The results of awaited methods of other objects are not request data (data loaded with a
    #   request value as its key, `await Filter.findById(req.params.id)`), except promise helpers,
    #   parsers, formatters, request.json()/formData()/text(), methods of the response and
    #   functions imported by name; another method that returns the request value it is given is
    #   missed. When a function is passed to such a call (`await cache.wrap(key, async () =>
    #   ...)`, `await db.transaction(async (t) => { ... })`), only the value of the call is clean:
    #   what is written inside the callback is checked as usual.
    # - Sources are the JS SQL rule's block: a handler whose second parameter has another name than
    #   res, resp, response, reply, rep, h, ctx, next, _res or _response (`(request, out)`) is not a
    #   source, and a one-parameter callback given to get/post/... after a path literal (also on
    #   an HTTP client) is taken for a Fastify route handler.
    pattern-sources:
      # Express: the request object, the first parameter of a handler `(req, res, ...)`, carries
      # the query string, route parameters (`/users/:id`), body, headers, cookies and the URL.
      # The second parameter's name tells a handler from other two-parameter functions.
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|rep|h|ctx|next|_res|_response)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Fastify: a handler registered with a route shorthand (`fastify.get('/path', [options],
      # handler)`) or with `route({ handler })` may take only the request.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$ROUTE($PATH, ..., function ($REQ) { ... })
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|head|post|put|delete|options|patch|all)$
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^["'`]/
              - pattern-inside: '$APP.route({..., handler: function ($REQ) { ... }, ...})'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.originalUrl
              - pattern: $REQ.url
              - pattern: $REQ.path
              - pattern: $REQ.raw
      # Next.js App Router: route handlers are functions named after an HTTP method; the request is
      # a Web Request (NextRequest) and the context's params hold the dynamic route segments.
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern-either:
              - pattern: $REQ.nextUrl
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.formData()
              - pattern: $REQ.text()
      - patterns:
          - pattern-either:
              - pattern-inside: function $METHOD($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  $METHOD = function ($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: $CTX.params
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $METHOD($REQ, {params}, ...) { ... }'
              - pattern-inside: 'function $METHOD($REQ, {params}: $T, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}, ...) { ... }'
              - pattern-inside: '$METHOD = function ($REQ, {params}: $T, ...) { ... }'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$
          - pattern: params
    # Values added to an array or a Map make the container carry them.
    pattern-propagators:
      - pattern: $LIST.push(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $LIST.unshift(..., $X, ...)
        from: $X
        to: $LIST
      - pattern: $MAP.set($K, $X)
        from: $X
        to: $MAP
    pattern-sanitizers:
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # An allow-list lookup: an index into a const object or array, or get() on a const Map,
      # declared in the file with literal keys and values only (comments allowed, optionally
      # wrapped in Object.freeze), and not changed after it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $TABLE = $INIT;
                  ...
              - pattern-inside: |
                  const $TABLE: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: >-
                ^(?:(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))|Object\.freeze\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:\{(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:[A-Za-z_$][\w$]*|"[^"]*"|'[^']*'|\d+)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\}|\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null))*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\]|new\s+Map(?:<[^>]*>)?\((?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\](?:(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\[(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:"[^"]*"|'[^']*'|`[^`$]*`|-?\d+(?:\.\d+)?|true|false|null)(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\])*(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*(?:,(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*)?\](?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/)*\))(?:\s+as\s+const)?$
          - pattern-either:
              - pattern: $TABLE[$KEY]
              - pattern: $TABLE.get($KEY)
          # A table the file writes to after its declaration, in any function, is no allow-list.
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE[$K2] = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.$PROP = $V2;
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.set(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.push(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.unshift(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              $TABLE.splice(...);
              ...
          - pattern-not-inside: |
              const $TABLE = $DECL;
              ...
              Object.assign($TABLE, ...);
              ...
      # Results of awaited methods of other objects (services, models, clients: data loaded or
      # made with a request value as its key) are not request data. Promise helpers, parsers and
      # formatters return what they are given; the body readers of a Web Request stay sources.
      # Not sanitizers: methods of the response (an awaited sink stays a sink) and functions
      # imported by name (OpenGrep matches their calls as methods).
      - patterns:
          - pattern: await $OBJ.$M(...)
          - pattern-not: await $R.json()
          - pattern-not: await $R.formData()
          - pattern-not: await $R.text()
          # Not when a function is passed to it (`await db.transaction(async (t) => { ... })`):
          # a sink written inside that callback is still a sink, and the sanitizer would clean
          # everything inside the call. The function pattern also matches arrow functions.
          - pattern-not: 'await $OBJ.$M(..., <... function (...) { ... } ...>, ...)'
          - pattern-not: 'await $OBJ.$M(..., {..., $K(...) { ... }, ...}, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(?!(?:resolve|all|any|race|allSettled|parse|format\w*)$)
          - metavariable-regex:
              metavariable: $OBJ
              regex: ^(?!(?:res|resp|response|reply|rep|_res|_response)\b)
          - pattern-not-inside: |
              import {..., $M, ...} from $FROM;
              ...
          - pattern-not-inside: |
              import {$M as $ALIAS} from $FROM;
              ...
          - pattern-not-inside: |
              const {..., $M, ...} = require($FROM);
              ...
          - pattern-not-inside: |
              const {..., $M: $ALIAS, ...} = require($FROM);
              ...
      # The same results when a function is passed to the call (`await cache.wrap(key, async () =>
      # build())`, `await Item.find({...}).sort((a, b) => a.n - b.n)`): only the value of the call
      # itself is clean (exact), so a sink written inside the callback is still reported.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: 'await $OBJ.$M(..., <... function (...) { ... } ...>, ...)'
              - pattern: 'await $OBJ.$M(..., {..., $K(...) { ... }, ...}, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(?!(?:resolve|all|any|race|allSettled|parse|format\w*)$)
          - metavariable-regex:
              metavariable: $OBJ
              regex: ^(?!(?:res|resp|response|reply|rep|_res|_response)\b)
          - pattern-not-inside: |
              import {..., $M, ...} from $FROM;
              ...
          - pattern-not-inside: |
              import {$M as $ALIAS} from $FROM;
              ...
          - pattern-not-inside: |
              const {..., $M, ...} = require($FROM);
              ...
          - pattern-not-inside: |
              const {..., $M: $ALIAS, ...} = require($FROM);
              ...
      # A value checked against a literal allow-list (a const array or Set of string literals that
      # the file never changes) with an early return or throw: `if (!LIST.includes(x)) return ...;`
      # (also has() on a Set). The check as the condition of an if around the use is not followed.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $LIST = $INIT;
                  ...
              - pattern-inside: |
                  const $LIST: $TYPE = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(?:\[\s*(?:'[^'\\]*'|"[^"\\]*")(?:\s*,\s*(?:'[^'\\]*'|"[^"\\]*"))*\s*,?\s*\]|Object\.freeze\(\s*\[\s*(?:'[^'\\]*'|"[^"\\]*")(?:\s*,\s*(?:'[^'\\]*'|"[^"\\]*"))*\s*,?\s*\]\s*\)|new\s+Set(?:<[^>]*>)?\(\s*\[\s*(?:'[^'\\]*'|"[^"\\]*")(?:\s*,\s*(?:'[^'\\]*'|"[^"\\]*"))*\s*,?\s*\]\s*\))(?:\s+as\s+const)?$
          - pattern-either:
              - pattern-inside: |
                  if (!$LIST.$CHECK($VALUE)) return ...;
                  ...
              - pattern-inside: |
                  if (!$LIST.$CHECK($VALUE)) { return ...; }
                  ...
              - pattern-inside: |
                  if (!$LIST.$CHECK($VALUE)) throw $ERR;
                  ...
              - pattern-inside: |
                  if (!$LIST.$CHECK($VALUE)) { throw $ERR; }
                  ...
          - metavariable-regex:
              metavariable: $CHECK
              regex: ^(?:includes|has)$
          - pattern: $VALUE
          # Not after the value is assigned again following the check.
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        if (!$LIST.$CHECK($VALUE)) return ...;
                        ...
                    - pattern-inside: |
                        if (!$LIST.$CHECK($VALUE)) { return ...; }
                        ...
                    - pattern-inside: |
                        if (!$LIST.$CHECK($VALUE)) throw $ERR;
                        ...
                    - pattern-inside: |
                        if (!$LIST.$CHECK($VALUE)) { throw $ERR; }
                        ...
                - pattern: |
                    $VALUE = $NEW;
                    ...
          - pattern-not-inside: |
              const $LIST = $DECL;
              ...
              $LIST.push(...);
              ...
          - pattern-not-inside: |
              const $LIST = $DECL;
              ...
              $LIST.unshift(...);
              ...
          - pattern-not-inside: |
              const $LIST = $DECL;
              ...
              $LIST.splice(...);
              ...
          - pattern-not-inside: |
              const $LIST = $DECL;
              ...
              $LIST.add(...);
              ...
          - pattern-not-inside: |
              const $LIST = $DECL;
              ...
              $LIST[$I] = $V;
              ...
      # Escaping: RegExp.escape() (ES2025), lodash escapeRegExp (the lodash and lodash-es packages,
      # lodash/escapeRegExp, lodash.escaperegexp) and escape-string-regexp, bound to their imports.
      - pattern: RegExp.escape(...)
      # The common hand-written escape, `s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')` (also
      # replaceAll): a global regular expression that is one character class, not negated, holding
      # each syntax character (^ $ \ . * + ? ( ) [ ] { } |) as itself or escaped, and the
      # replacement "\\$&" (a backslash before the whole match). The class is read token by
      # token (`\` and the next character, or one character other than `]`), so a character
      # counts only where the class really holds it; range ends count too, since a range
      # holds its ends.
      - patterns:
          - pattern: $TEXT.$REPLACE($SPECIAL, $INSERT)
          - metavariable-regex:
              metavariable: $REPLACE
              regex: ^(?:replace|replaceAll)$
          - metavariable-regex:
              metavariable: $SPECIAL
              regex: >-
                ^/\[(?!\^)(?=(?:[^\]\\]|\\.)*?\\?\^)(?=(?:[^\]\\]|\\.)*?\\?\$)(?=(?:[^\]\\]|\\.)*?\\\\)(?=(?:[^\]\\]|\\.)*?\\?\.)(?=(?:[^\]\\]|\\.)*?\\?\*)(?=(?:[^\]\\]|\\.)*?\\?\+)(?=(?:[^\]\\]|\\.)*?\\?\?)(?=(?:[^\]\\]|\\.)*?\\?\()(?=(?:[^\]\\]|\\.)*?\\?\))(?=(?:[^\]\\]|\\.)*?\\?\[)(?=(?:[^\]\\]|\\.)*?\\\])(?=(?:[^\]\\]|\\.)*?\\?\{)(?=(?:[^\]\\]|\\.)*?\\?\})(?=(?:[^\]\\]|\\.)*?\\?\|)(?:[^\]\\]|\\.)+\]/(?=[a-z]*g)[a-z]*$
          - metavariable-regex:
              metavariable: $INSERT
              regex: ^(["'`])\\\\\$&\1$
      # The same escape in a local helper that only returns it: a function declaration, a const
      # arrow function or a function expression, declared before the call. (A declaration after
      # the call, `...` then the function, made the rule about four times slower on large files:
      # the leading `...` is tried from every statement.)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  function $HELPER(...) { return $TEXT.$REPLACE($SPECIAL, $INSERT); }
                  ...
              - pattern-inside: |
                  const $HELPER = (...) => $TEXT.$REPLACE($SPECIAL, $INSERT);
                  ...
              - pattern-inside: |
                  const $HELPER = (...) => { return $TEXT.$REPLACE($SPECIAL, $INSERT); };
                  ...
              - pattern-inside: |
                  const $HELPER = function (...) { return $TEXT.$REPLACE($SPECIAL, $INSERT); };
                  ...
          - pattern: $HELPER(...)
          - metavariable-regex:
              metavariable: $REPLACE
              regex: ^(?:replace|replaceAll)$
          - metavariable-regex:
              metavariable: $SPECIAL
              regex: >-
                ^/\[(?!\^)(?=(?:[^\]\\]|\\.)*?\\?\^)(?=(?:[^\]\\]|\\.)*?\\?\$)(?=(?:[^\]\\]|\\.)*?\\\\)(?=(?:[^\]\\]|\\.)*?\\?\.)(?=(?:[^\]\\]|\\.)*?\\?\*)(?=(?:[^\]\\]|\\.)*?\\?\+)(?=(?:[^\]\\]|\\.)*?\\?\?)(?=(?:[^\]\\]|\\.)*?\\?\()(?=(?:[^\]\\]|\\.)*?\\?\))(?=(?:[^\]\\]|\\.)*?\\?\[)(?=(?:[^\]\\]|\\.)*?\\\])(?=(?:[^\]\\]|\\.)*?\\?\{)(?=(?:[^\]\\]|\\.)*?\\?\})(?=(?:[^\]\\]|\\.)*?\\?\|)(?:[^\]\\]|\\.)+\]/(?=[a-z]*g)[a-z]*$
          - metavariable-regex:
              metavariable: $INSERT
              regex: ^(["'`])\\\\\$&\1$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $LIB = require($M)
                  ...
              - pattern-inside: |
                  import $LIB from $M;
                  ...
              - pattern-inside: |
                  import * as $LIB from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?lodash(?:-es)?["'`]?$
          - pattern: $LIB.escapeRegExp(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., escapeRegExp: $FN, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {escapeRegExp as $FN} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?lodash(?:-es)?["'`]?$
          - pattern: $FN(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., escapeRegExp, ...} = require($M);
                  ...
              - pattern-inside: |
                  import {..., escapeRegExp, ...} from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?lodash(?:-es)?["'`]?$
          - pattern: escapeRegExp(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $FN = require($M)
                  ...
              - pattern-inside: |
                  import $FN from $M;
                  ...
          - metavariable-regex:
              metavariable: $M
              regex: ^["'`]?(?:lodash(?:-es)?/escapeRegExp|lodash\.escaperegexp|escape-string-regexp)["'`]?$
          - pattern: $FN(...)
    # The flags argument is not a sink: it only selects documented flag letters (a SyntaxError
    # otherwise). Request data as the subject of a constant pattern (`re.test(value)`) is fine.
    pattern-sinks:
      # The RegExp constructor, with or without new (also through globalThis): its pattern.
      - patterns:
          - pattern-either:
              - pattern: new RegExp($PATTERN, ...)
              - pattern: RegExp($PATTERN, ...)
              - pattern: new globalThis.RegExp($PATTERN, ...)
              - pattern: globalThis.RegExp($PATTERN, ...)
          - focus-metavariable: $PATTERN
