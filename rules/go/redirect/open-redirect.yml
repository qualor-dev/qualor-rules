rules:
  - id: go.open-redirect
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      Data from the HTTP request decides where the response redirects the browser (the whole
      target, or its scheme and host), so a link to this site can send users to another site.
      Redirect to a path that starts with a fixed segment (`"/items/" + id`) or to a fixed origin
      followed by a path separator (or a `url.URL` with a fixed Host), or map the request value to
      a target from an allow-list.
    metadata:
      title: Redirect to a URL from HTTP request data (Go)
      cwe: ['CWE-601']
      owasp: ['A01:2025', 'A01:2021']
      kind: issue
      severity: medium
      confidence: high
      frameworks: [net/http, net/url, encoding/json, gin, echo, chi, gorilla/mux, golang.org/x/oauth2, github.com/minio/minio-go/v7, github.com/aws/aws-sdk-go-v2/service/s3]
      sources:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A01_2025-Broken_Access_Control
        - https://top10.owasp.org/2021/A01_2021-Broken_Access_Control
        - https://pkg.go.dev/net/http#Redirect
        - https://pkg.go.dev/net/http#Header.Set
        - https://pkg.go.dev/net/url#URL
        - https://pkg.go.dev/net/url#Parse
        - https://pkg.go.dev/net/url#URL.IsAbs
        - https://pkg.go.dev/net/url#URL.Hostname
        - https://pkg.go.dev/net/url#URL.String
        - https://pkg.go.dev/net/url#JoinPath
        - https://pkg.go.dev/net/url#URL.JoinPath
        - https://pkg.go.dev/net/url#URL.ResolveReference
        - https://pkg.go.dev/golang.org/x/oauth2#Config.AuthCodeURL
        - https://pkg.go.dev/golang.org/x/oauth2#Endpoint
        - https://pkg.go.dev/github.com/minio/minio-go/v7#Client.PresignedGetObject
        - https://pkg.go.dev/github.com/minio/minio-go/v7#Options
        - https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/s3#PresignClient.PresignGetObject
        - https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/s3#GetObjectInput
        - https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/s3#Options
        - https://pkg.go.dev/strings#HasPrefix
        - https://url.spec.whatwg.org/
        - https://pkg.go.dev/fmt
        - https://pkg.go.dev/net/http#Request
        - https://pkg.go.dev/encoding/json
        - https://pkg.go.dev/encoding/json#Unmarshal
        - https://pkg.go.dev/github.com/gin-gonic/gin
        - https://pkg.go.dev/github.com/gin-gonic/gin#Context.Redirect
        - https://gin-gonic.com/en/docs/routing/redirects/
        - https://gin-gonic.com/en/docs/routing/querystring-param/
        - https://gin-gonic.com/en/docs/binding/binding-and-validation/
        - https://pkg.go.dev/github.com/labstack/echo/v4
        - https://pkg.go.dev/github.com/labstack/echo/v4#DefaultBinder
        - https://echo.labstack.com/guide/request/
        - https://echo.labstack.com/guide/response/
        - https://echo.labstack.com/guide/binding/
        - https://pkg.go.dev/github.com/go-chi/chi/v5
        - https://pkg.go.dev/github.com/gorilla/mux
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - Validators are followed when they are written out: a local path ("/" first, then neither
    #   "/" nor "\", which browsers read as "/") checked with strings.HasPrefix or Contains
    #   (quoted or raw strings), or the host of url.Parse's result compared with a non-empty
    #   literal or a constant, variable or field. They count in the `&&` condition of the
    #   redirecting branch (not its else), or in the `||` condition of earlier ifs whose body
    #   returns directly (after at most two statements) or assigns a literal, as long as the
    #   value is not assigned again. Checks with the wrong polarity, joined the other way, with
    #   a return only in a nested branch, compared with request data, or that still let "/\host",
    #   "//host" or a relative target through (only "//", only `IsAbs`, `Host != ""`) are
    #   reported, and so are checks joined with `&&` to another condition (`strict && (...)`).
    #   Not followed: a helper that checks it (`isOwnSite(x)`), a check held in a variable or
    #   written as a switch case list, a check whose `if` also has an else branch, an exit body
    #   with more than two statements before its return, the checks negated as one group
    #   (`!(a && !b && !c)`), and a host compared with the result of a call
    #   (`os.Getenv(...)`) (`todook:`); a string parsed for a host check and assigned again
    #   afterwards still counts as checked, and a host held in a variable counts as fixed
    #   wherever the variable comes from (`todoruleid:`).
    # - Request data passed to a function counts as reaching its result, whatever the function
    #   does (a signed URL of a storage service, say) (`todook:`). Documented URL producers with a
    #   fixed host are followed: a url.URL literal with a non-empty Host (its Path, RawPath,
    #   RawQuery, Fragment, RawFragment and User), the same fields assigned to a url.URL built
    #   with such a host or parsed from a fixed origin or a configuration variable or field,
    #   JoinPath elements, the arguments of an oauth2 Config's AuthCodeURL, the object name and
    #   parameters of minio's PresignedGetObject/HeadObject, and every field but Bucket of an s3
    #   GetObjectInput/HeadObjectInput. A host, scheme, opaque part, bucket, JoinPath base or
    #   Config from the request is still reported. Not followed: a url.URL declared empty and
    #   given its host field by field, and an oauth2 Config field whose name a local variable
    #   also has (OpenGrep 1.30.0 gives the field the local's type) (`todook:`).
    # - The request's own path (`r.URL.Path`, `RequestURI()`) after a base, and anything after a
    #   literal "?" or "#", are clean; `r.URL.Path` at the start of the target is not, since it
    #   can start with "//".
    # - A fixed target is a literal or a constant that starts with a path ("/items/", not "/" or
    #   "//"), a query ("?") or a relative segment ("items/"), or with a scheme, host and
    #   separator; or a base without request data followed by a literal that starts with "/"
    #   (`base + "/items/" + id`, `fmt.Sprintf("%s/items/%s", base, id)`). A base that is itself
    #   a concatenation is checked as a whole.
    # Inherited from the request source block (go.sql-injection):
    # - The Echo instance's binder (`c.Echo().Binder.Bind(&x, c)`) is not a source (`todoruleid:`).
    # - Numeric fields count as clean only when their type is known in the file: a struct declared
    #   in another package stays tainted as a whole (`todook:`), and OpenGrep 1.30.0 gives its
    #   fields the type of same-named fields of structs declared in the file (`todoruleid:`).
    # - A named numeric type (`type Status int`) stays tainted (`todook:`).
    options:
      # A map lookup keyed by request data (an allow-list of targets) yields the map's values.
      taint_assume_safe_indexes: true
    pattern-sources:
      # The request: net/http's *http.Request, and the same request through Gin and Echo.
      - patterns:
          - pattern-either:
              - pattern: '($R : *http.Request).$F'
              - pattern: '($C : *gin.Context).Request.$F'
              - pattern: '($C : echo.Context).Request().$F'
              - pattern: '($C : *echo.Context).Request().$F'
          - metavariable-regex:
              metavariable: $F
              regex: ^(URL|Form|PostForm|MultipartForm|Header|Body|RequestURI)$
      - patterns:
          - pattern-either:
              - pattern: '($R : *http.Request).$F(...)'
              - pattern: '($C : *gin.Context).Request.$F(...)'
              - pattern: '($C : echo.Context).Request().$F(...)'
              - pattern: '($C : *echo.Context).Request().$F(...)'
          - metavariable-regex:
              metavariable: $F
              regex: ^(FormValue|PostFormValue|PathValue|Cookie|Cookies|Referer|UserAgent)$
      - pattern-either:
          # Route variables of routers built on net/http.
          - pattern: chi.URLParam(...)
          - pattern: mux.Vars(...)
      # Gin: path parameters, query strings, forms, headers and cookies.
      - patterns:
          - pattern: '($C : *gin.Context).$M(...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(Param|Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData)$
      # Echo: path parameters, query parameters, form values and cookies.
      - patterns:
          - pattern-either:
              - pattern: '($C : echo.Context).$M(...)'
              - pattern: '($C : *echo.Context).$M(...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(Param|ParamValues|QueryParam|QueryParams|QueryString|FormValue|FormParams|Cookie|Cookies)$
      # Gin and Echo binding: the struct the request is bound into.
      - by-side-effect: true
        patterns:
          - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Bind|BindJSON|BindXML|BindQuery|BindYAML|BindTOML|BindHeader|BindUri|BindWith|MustBindWith|ShouldBind|ShouldBindJSON|ShouldBindXML|ShouldBindQuery|ShouldBindYAML|ShouldBindTOML|ShouldBindHeader|ShouldBindUri|ShouldBindWith|ShouldBindBodyWith)$
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *echo.Context).Bind(&$X)'
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: echo.$BIND($C, &$X)
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
          - focus-metavariable: $X
      # Echo's DefaultBinder used directly: a *echo.DefaultBinder value, `new(echo.DefaultBinder)`
      # or `&echo.DefaultBinder{}`, made in the same function or typed.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($B : *echo.DefaultBinder).$BIND($C, &$X)'
              - pattern: '($B : echo.DefaultBinder).$BIND($C, &$X)'
              - pattern: (&echo.DefaultBinder{}).$BIND($C, &$X)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $B := new(echo.DefaultBinder)
                          ...
                      - pattern-inside: |
                          $B := &echo.DefaultBinder{}
                          ...
                  - pattern: $B.$BIND($C, &$X)
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
          - focus-metavariable: $X
      # DefaultBinder.Bind takes the target first in Echo v4 (`Bind(i, c)`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($B : *echo.DefaultBinder).Bind(&$X, $C)'
              - pattern: '($B : echo.DefaultBinder).Bind(&$X, $C)'
              - pattern: (&echo.DefaultBinder{}).Bind(&$X, $C)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $B := new(echo.DefaultBinder)
                          ...
                      - pattern-inside: |
                          $B := &echo.DefaultBinder{}
                          ...
                  - pattern: $B.Bind(&$X, $C)
          - focus-metavariable: $X
      # The same binders given a pointer made with new(T) or &T{} in the same function, passed
      # without `&` (Echo's request guide: `u := new(User); c.Bind(u)`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $X := new($T)
                  ...
              - pattern-inside: |
                  $X := &$T{...}
                  ...
          - pattern-either:
              - patterns:
                  - pattern: '($C : *gin.Context).$BIND($X, ...)'
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindXML|BindQuery|BindYAML|BindTOML|BindHeader|BindUri|BindWith|MustBindWith|ShouldBind|ShouldBindJSON|ShouldBindXML|ShouldBindQuery|ShouldBindYAML|ShouldBindTOML|ShouldBindHeader|ShouldBindUri|ShouldBindWith|ShouldBindBodyWith)$
              - pattern: '($C : echo.Context).Bind($X)'
              - pattern: '($C : *echo.Context).Bind($X)'
              - patterns:
                  - pattern-either:
                      - pattern: echo.$BIND($C, $X)
                      - pattern: '($B : *echo.DefaultBinder).$BIND($C, $X)'
                      - pattern: '($B : echo.DefaultBinder).$BIND($C, $X)'
                      - pattern: (&echo.DefaultBinder{}).$BIND($C, $X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
              - pattern: '($B : *echo.DefaultBinder).Bind($X, $C)'
              - pattern: '($B : echo.DefaultBinder).Bind($X, $C)'
              - pattern: (&echo.DefaultBinder{}).Bind($X, $C)
          - focus-metavariable: $X
    pattern-propagators:
      # encoding/json: decoding a tainted body taints the value it fills.
      - pattern: json.NewDecoder($R).Decode(&$X)
        from: $R
        to: $X
      - pattern: json.Unmarshal($R, &$X)
        from: $R
        to: $X
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      # A number or boolean (a numeric field of a bound struct, say) cannot name a host. The type
      # must be known in the file: a struct of another package stays tainted as a whole.
      - patterns:
          - pattern: $E
          - metavariable-type:
              metavariable: $E
              types: [int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64, bool]
      # The request's own path or request URI (net/http: it starts with "/") after a base: the
      # base decides the scheme and host. A lone "" or "/" in front is not a base.
      - patterns:
          - pattern-either:
              - pattern-inside: '$LEFT + ($R : *http.Request).URL.$PATH'
              - pattern-inside: '$LEFT + ($R : *http.Request).URL.$PATHFN()'
              - pattern-inside: '$LEFT + ($R : *http.Request).RequestURI'
          - pattern-either:
              - patterns:
                  - pattern: $R.URL.$PATH
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^(Path|RawPath)$
              - patterns:
                  - pattern: $R.URL.$PATHFN()
                  - metavariable-regex:
                      metavariable: $PATHFN
                      regex: ^(EscapedPath|RequestURI)$
              - pattern: $R.RequestURI
          - metavariable-regex:
              metavariable: $LEFT
              regex: ^(?!"/?"$)
      # A query or fragment: what follows a literal "?" or "#" cannot change the scheme or host.
      - patterns:
          - pattern-inside: '"=~/^[?#]/" + $X'
          - pattern: $X
      # URL producers with a fixed host. A url.URL literal with a non-empty Host: net/url writes
      # the path, query, fragment and user info after the host, escaped (or leaves them out for
      # an opaque URL).
      - patterns:
          - pattern-inside: 'url.URL{..., Host: $H, ...}'
          - pattern-not-inside: 'url.URL{..., Host: "", ...}'
          - pattern-inside: 'url.URL{..., $FIELD: $V, ...}'
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(Path|RawPath|RawQuery|Fragment|RawFragment|User)$
          - focus-metavariable: $V
      # The same parts set on a url.URL built with such a host, or parsed from a fixed origin (a
      # literal or a constant with a scheme and a host) or from the server's configuration (a
      # variable or field, not a constant without a host).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $U := url.URL{..., Host: $H, ...}
                          ...
                      - pattern-inside: |
                          $U := &url.URL{..., Host: $H, ...}
                          ...
                      - pattern-inside: |
                          $U = url.URL{..., Host: $H, ...}
                          ...
                      - pattern-inside: |
                          $U = &url.URL{..., Host: $H, ...}
                          ...
                  - metavariable-pattern:
                      metavariable: $H
                      patterns:
                        - pattern: $HOST
                        - pattern-not: '""'
              - pattern-inside: |
                  $U, $E := url.Parse("=~/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#\\]+/")
                  ...
              - pattern-inside: |
                  $U, $E = url.Parse("=~/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#\\]+/")
                  ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $U, $E := url.Parse($BASE)
                          ...
                      - pattern-inside: |
                          $U, $E = url.Parse($BASE)
                          ...
                  - metavariable-regex:
                      metavariable: $BASE
                      regex: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
                  - metavariable-pattern:
                      metavariable: $BASE
                      patterns:
                        - pattern-not: '"..."'
          - pattern-inside: $U.$FIELD = $X
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(Path|RawPath|RawQuery|Fragment|RawFragment|User)$
          - pattern: $X
      # Path elements given to JoinPath (net/url: joined, cleaned of ../ and repeated "/", and
      # escaped), but not the base of url.JoinPath.
      - patterns:
          - pattern-not-inside: url.JoinPath(...)
          - pattern-inside: $U.JoinPath(..., $ELEM, ...)
          - pattern: $ELEM
      - patterns:
          - pattern-inside: url.JoinPath($BASE, ..., $ELEM, ...)
          - pattern: $ELEM
      # The OAuth 2.0 provider's consent page (golang.org/x/oauth2): the state and the options only
      # go into its query; the provider's address comes from the Config.
      - patterns:
          - pattern-either:
              - pattern-inside: '($CONF : *oauth2.Config).AuthCodeURL(..., $A, ...)'
              - pattern-inside: '($CONF : oauth2.Config).AuthCodeURL(..., $A, ...)'
          - focus-metavariable: $A
      # Presigned storage URLs for an object named by the request. The bucket stays request data:
      # in virtual-host style it is part of the host, and anyone can create a bucket.
      - patterns:
          - pattern-either:
              - pattern-inside: '($S : *minio.Client).$PRESIGN(...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S, $ERR := minio.New(...)
                          ...
                      - pattern-inside: |
                          $S, $ERR = minio.New(...)
                          ...
                  - pattern-inside: $S.$PRESIGN(...)
          - pattern-either:
              - pattern-inside: $S.$PRESIGN($CTX, $B, $A, $EXP, ...)
              - pattern-inside: $S.$PRESIGN($CTX, $B, $OBJ, $EXP, $A)
          - metavariable-regex:
              metavariable: $PRESIGN
              regex: ^Presigned(Get|Head)Object$
          - focus-metavariable: $A
      - patterns:
          - pattern-inside: 's3.$INPUT{..., $FIELD: $V, ...}'
          - metavariable-regex:
              metavariable: $INPUT
              regex: ^(GetObjectInput|HeadObjectInput)$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(?!Bucket$)
          - focus-metavariable: $V
      # A target checked to be a local path before the redirect: it starts with "/" but not with
      # "//" or "/\" (browsers read a backslash in a URL as a slash). Each check sits in the `||`
      # condition of an `if` (one or several ifs) whose body returns directly or replaces the value
      # with a literal; no check is negated the other way or joined with `&&`, and the value is not
      # assigned again after the first check.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, "/") ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, "/") ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, "/") ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, "/") ...> {
                    $X = "..."
                  }
                  ...
          - pattern-either:
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "//") ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "//") ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "//") ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "//") ...> {
                    $X = "..."
                  }
                  ...
          - pattern-either:
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "/\\") ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "/\\") ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "/\\") ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, "/\\") ...> {
                    $X = "..."
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, `/\`) ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, `/\`) ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, `/\`) ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.HasPrefix($X, `/\`) ...> {
                    $X = "..."
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, "\\") ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, "\\") ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, "\\") ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, "\\") ...> {
                    $X = "..."
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, `\`) ...> {
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, `\`) ...> {
                    $A1
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, `\`) ...> {
                    $A1
                    $A2
                    return ...
                  }
                  ...
              - pattern-inside: |
                  if <... strings.Contains($X, `\`) ...> {
                    $X = "..."
                  }
                  ...
          - pattern-not-inside: |
              if <... $P && <... !strings.HasPrefix($X, "/") ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... !strings.HasPrefix($X, "/") ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... $P && <... strings.HasPrefix($X, "//") ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... strings.HasPrefix($X, "//") ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... $P && <... strings.HasPrefix($X, "/\\") ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... strings.HasPrefix($X, "/\\") ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... $P && <... strings.HasPrefix($X, `/\`) ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... strings.HasPrefix($X, `/\`) ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... $P && <... strings.Contains($X, "\\") ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... strings.Contains($X, "\\") ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... $P && <... strings.Contains($X, `\`) ...> ...> { ... }
              ...
          - pattern-not-inside: |
              if <... <... strings.Contains($X, `\`) ...> && $Q ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "//") ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "/\\") ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, `/\`) ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.Contains($X, "\\") ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.Contains($X, `\`) ...> { ... }
              ...
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "/") ...> { ... }
              ...
              $X = $V
              ...
          - pattern: $X
      # The same checks as the `&&` condition of the branch that redirects (not its else branch).
      - patterns:
          - pattern-inside: |
              if <... strings.HasPrefix($X, "/") ...> { ... }
          - pattern-inside: |
              if <... !strings.HasPrefix($X, "//") ...> { ... }
          - pattern-either:
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, "/\\") ...> { ... }
              - pattern-inside: |
                  if <... !strings.HasPrefix($X, `/\`) ...> { ... }
              - pattern-inside: |
                  if <... !strings.Contains($X, "\\") ...> { ... }
              - pattern-inside: |
                  if <... !strings.Contains($X, `\`) ...> { ... }
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "/") ...> { ... }
          - pattern-not-inside: |
              if <... $P || strings.HasPrefix($X, "/") ...> { ... }
          - pattern-not-inside: |
              if <... strings.HasPrefix($X, "/") || $Q ...> { ... }
          - pattern-not-inside: |
              if <... $P || !strings.HasPrefix($X, "//") ...> { ... }
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "//") || $Q ...> { ... }
          - pattern-not-inside: |
              if <... $P || !strings.HasPrefix($X, "/\\") ...> { ... }
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, "/\\") || $Q ...> { ... }
          - pattern-not-inside: |
              if <... $P || !strings.HasPrefix($X, `/\`) ...> { ... }
          - pattern-not-inside: |
              if <... !strings.HasPrefix($X, `/\`) || $Q ...> { ... }
          - pattern-not-inside: |
              if <... $P || !strings.Contains($X, "\\") ...> { ... }
          - pattern-not-inside: |
              if <... !strings.Contains($X, "\\") || $Q ...> { ... }
          - pattern-not-inside: |
              if <... $P || !strings.Contains($X, `\`) ...> { ... }
          - pattern-not-inside: |
              if <... !strings.Contains($X, `\`) || $Q ...> { ... }
          - pattern-not-inside: |
              if <... strings.HasPrefix($X, "/") ...> { ... } else { ... }
          - pattern: $X
      # A parsed target whose host is compared with a non-empty literal or a constant, variable or
      # field (not a call), in the condition of an `if` that returns (no `&&`) or as the `&&`
      # condition of the branch that redirects: the parsed URL and the string it was parsed from.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $U, $E := url.Parse($S)
                  ...
              - pattern-inside: |
                  $U, $E = url.Parse($S)
                  ...
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          if <... $U.Host != $H ...> {
                            return ...
                          }
                          ...
                      - pattern-inside: |
                          if <... $U.Host != $H ...> {
                            $A1
                            return ...
                          }
                          ...
                      - pattern-inside: |
                          if <... $U.Host != $H ...> {
                            $A1
                            $A2
                            return ...
                          }
                          ...
                      - pattern-inside: |
                          if <... $U.Hostname() != $H ...> {
                            return ...
                          }
                          ...
                      - pattern-inside: |
                          if <... $U.Hostname() != $H ...> {
                            $A1
                            return ...
                          }
                          ...
                      - pattern-inside: |
                          if <... $U.Hostname() != $H ...> {
                            $A1
                            $A2
                            return ...
                          }
                          ...
                  - pattern-not-inside: |
                      if <... $P && $U.Host != $H ...> { ... }
                      ...
                  - pattern-not-inside: |
                      if <... $U.Host != $H && $Q ...> { ... }
                      ...
                  - pattern-not-inside: |
                      if <... $P && $U.Hostname() != $H ...> { ... }
                      ...
                  - pattern-not-inside: |
                      if <... $U.Hostname() != $H && $Q ...> { ... }
                      ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          if <... $U.Host == $H ...> { ... }
                      - pattern-inside: |
                          if <... $U.Hostname() == $H ...> { ... }
                  - pattern-not-inside: |
                      if <... $P || $U.Host == $H ...> { ... }
                  - pattern-not-inside: |
                      if <... $U.Host == $H || $Q ...> { ... }
                  - pattern-not-inside: |
                      if <... $P || $U.Hostname() == $H ...> { ... }
                  - pattern-not-inside: |
                      if <... $U.Hostname() == $H || $Q ...> { ... }
                  - pattern-not-inside: |
                      if <... $U.Host == $H ...> { ... } else { ... }
                  - pattern-not-inside: |
                      if <... $U.Hostname() == $H ...> { ... } else { ... }
          - metavariable-regex:
              metavariable: $H
              regex: ^("[^"]+"|[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*)$
          - pattern-either:
              - pattern: $U
              - pattern: $S
    pattern-sinks:
      - patterns:
          # The redirect target: net/http's Redirect, Gin's and Echo's c.Redirect, and the
          # Location header of the response.
          - pattern-either:
              - pattern-inside: http.Redirect($W, $REQ, $URL, $CODE)
              - pattern-inside: '($C : *gin.Context).Redirect($CODE, $URL)'
              - pattern-inside: '($C : echo.Context).Redirect($CODE, $URL)'
              - pattern-inside: '($C : *echo.Context).Redirect($CODE, $URL)'
              - pattern-inside: '($C : *gin.Context).Header("=~/(?i)^location$/", $URL)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: $X.Header().$SET("=~/(?i)^location$/", $URL)
                      - pattern-inside: $X.Header().$SET(echo.HeaderLocation, $URL)
                  - metavariable-regex:
                      metavariable: $SET
                      regex: ^(Set|Add)$
              - pattern-inside: $X.Header()["=~/(?i)^location$/"] = []string{$URL}
          - pattern-either:
              # The whole target, unless it starts with a fixed path, query, relative segment or
              # origin, or with a base followed by a literal that starts with "/" (next branch).
              - patterns:
                  - pattern: $URL
                  - metavariable-regex:
                      metavariable: $URL
                      regex: ^(?!"([a-zA-Z][a-zA-Z0-9+.-]*://[^/?#\\"]+[/?#]|/[^/\\"]|[?#]|[^:/?#\\"]+[/?#]))(?![^+]*\+\s*"(/(?!/)|[?#]))
                  - pattern-not: '"=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#]+[\/?#]|\/[^\/\x5c]|[?#]|[^:\/?#]+[\/?#])/"'
                  - pattern-not: '"=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#]+[\/?#]|\/[^\/\x5c]|[?#]|[^:\/?#]+[\/?#])/" + $A'
                  - pattern-not: '"=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#]+[\/?#]|\/[^\/\x5c]|[?#]|[^:\/?#]+[\/?#])/" + $A + $B'
                  - pattern-not: '"=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#]+[\/?#]|\/[^\/\x5c]|[?#]|[^:\/?#]+[\/?#])/" + $A + $B + $C'
                  - pattern-not: 'fmt.Sprintf("=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#%]+[\/?#]|\/[^\/\x5c%]|[?#]|[^:\/?#%]+[\/?#])/", ...)'
                  - pattern-not: 'fmt.Sprintf("=~/^%[sv]\/(?!\/)/", ...)'
                  # A fixed path or origin given to the format as its first argument.
                  - pattern-not: 'fmt.Sprintf("=~/^%[sv]/", "=~/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\/?#]+[\/?#]|\/[^\/\x5c]|[?#]|[^:\/?#]+[\/?#])/", ...)'
              # The base before the first "/" literal: it sets the scheme and host.
              - patterns:
                  - pattern-either:
                      - pattern: $BASE + "=~/^(\/(?!\/)|[?#])/"
                      - pattern: 'fmt.Sprintf("=~/^%[sv]\/(?!\/)/", $BASE, ...)'
                  - metavariable-regex:
                      metavariable: $BASE
                      regex: ^[^+]*$
                  - focus-metavariable: $BASE
