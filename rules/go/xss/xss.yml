rules:
  - id: go.xss
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches an HTML response without escaping: it is written to the
      response, executed by a text/template (which does not escape), or marked as safe content
      with an html/template conversion (`template.HTML(x)`). Render it with html/template, which
      escapes the data it is given, or escape it with `html.EscapeString`; send data as JSON or
      plain text where no HTML is meant.
    metadata:
      title: HTML response built from HTTP request data (Go)
      cwe: ['CWE-79']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [net/http, html/template, text/template, encoding/json, os/exec, gin, echo, chi, gorilla/mux, bluemonday]
      sources:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://top10.owasp.org/2021/A03_2021-Injection
        - https://pkg.go.dev/html/template
        - https://pkg.go.dev/html/template#HTML
        - https://pkg.go.dev/html/template#HTMLEscapeString
        - https://pkg.go.dev/html/template#JSEscapeString
        - https://pkg.go.dev/text/template
        - https://pkg.go.dev/text/template#Template.Execute
        - https://pkg.go.dev/bytes#Buffer
        - https://pkg.go.dev/bytes#Buffer.WriteTo
        - https://pkg.go.dev/bytes#NewBuffer
        - https://pkg.go.dev/strings#Builder
        - https://pkg.go.dev/io#Copy
        - https://pkg.go.dev/io#ReadAll
        - https://pkg.go.dev/io#CopyBuffer
        - https://pkg.go.dev/io#CopyN
        - https://pkg.go.dev/io#LimitReader
        - https://pkg.go.dev/net/http#MaxBytesReader
        - https://pkg.go.dev/os#Open
        - https://pkg.go.dev/os#OpenFile
        - https://pkg.go.dev/os#ReadFile
        - https://pkg.go.dev/os#File.Name
        - https://pkg.go.dev/os#File.Stat
        - https://pkg.go.dev/bufio#NewReader
        - https://pkg.go.dev/bufio#NewReaderSize
        - https://pkg.go.dev/bufio#NewScanner
        - https://pkg.go.dev/bytes#Buffer.Grow
        - https://pkg.go.dev/bytes#Buffer.Truncate
        - https://pkg.go.dev/io/fs#PathError
        - https://pkg.go.dev/html#EscapeString
        - https://pkg.go.dev/os/exec
        - https://pkg.go.dev/os/exec#Command
        - https://pkg.go.dev/os/exec#CommandContext
        - https://pkg.go.dev/os/exec#Cmd.Output
        - https://pkg.go.dev/os/exec#Cmd.CombinedOutput
        - https://pkg.go.dev/net/http#ResponseWriter
        - https://pkg.go.dev/net/http#DetectContentType
        - https://pkg.go.dev/net/http#Error
        - https://pkg.go.dev/fmt#Fprintf
        - https://pkg.go.dev/io#WriteString
        - https://pkg.go.dev/encoding/json#Marshal
        - https://pkg.go.dev/encoding/json#Encoder.SetEscapeHTML
        - https://pkg.go.dev/github.com/microcosm-cc/bluemonday
        - https://pkg.go.dev/net/http#Request
        - https://pkg.go.dev/encoding/json
        - https://pkg.go.dev/encoding/json#Unmarshal
        - https://pkg.go.dev/github.com/gin-gonic/gin
        - https://gin-gonic.com/en/docs/rendering/html-rendering/
        - https://gin-gonic.com/en/docs/routing/querystring-param/
        - https://gin-gonic.com/en/docs/binding/binding-and-validation/
        - https://pkg.go.dev/github.com/labstack/echo/v4
        - https://pkg.go.dev/github.com/labstack/echo/v4#DefaultBinder
        - https://echo.labstack.com/guide/request/
        - https://echo.labstack.com/guide/response/
        - https://echo.labstack.com/guide/binding/
        - https://pkg.go.dev/github.com/go-chi/chi/v5
        - https://pkg.go.dev/github.com/gorilla/mux
        - https://pkg.go.dev/testing
        - https://pkg.go.dev/net/http/httptest
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A write to an http.ResponseWriter counts as HTML unless the same function first sets a
    #   Content-Type that browsers do not render as HTML: a literal type (text/plain, JSON, CSV,
    #   JavaScript, binary) or Echo's JSON, JavaScript, plain-text and octet-stream constants.
    #   Other constants (Gin's binding.MIME*, Echo's protobuf or msgpack types) are not listed
    #   (`todook:`). net/http sniffs the type from the first bytes written, so a response whose
    #   first write is plain text is text/plain, but the order of writes is not followed
    #   (`todook:`).
    # - A template is a text/template when its spelling says so: in a file that imports
    #   text/template without an alias (and html/template, if at all, under another name), the
    #   name "template"; otherwise the alias of text/template. It must be assigned to a variable
    #   in the same function or package, be a parameter, or be a field of that type reached
    #   through the receiver of a method of its struct. Not followed: a field reached through
    #   another variable (`todoruleid:`), a field whose name is also used by a struct declared
    #   later in the file (OpenGrep 1.30.0 then misses it) (`todoruleid:`), a dot import
    #   (`todoruleid:`), a template built and executed in one expression
    #   (`template.Must(...).Execute(...)`) (`todoruleid:`), a template built in another file of
    #   the package, and a local variable named "template".
    # - Such a template executed into a bytes.Buffer or strings.Builder (typed in the file, made
    #   with bytes.NewBuffer(String), or asserted from an interface such as a sync.Pool's Get, in
    #   the function) taints it, and so does request data written into one directly (its own
    #   Write methods, fmt.Fprint*, io.WriteString, io.Copy): the buffer is reported
    #   where it reaches the response (Write of its Bytes or String, WriteTo, io.Copy of the
    #   buffer, Gin's c.Data, Echo's c.HTML). WriteTo and io.Copy count only for such a
    #   bytes.Buffer: a file, a bufio.Reader or an io.LimitedReader is not a sink.
    # - The request body copied to the response (io.Copy, CopyBuffer, CopyN) is reported when the
    #   body is written in place (`r.Body`, Gin's `c.Request.Body`, Echo's `c.Request().Body`),
    #   wrapped in io.LimitReader or http.MaxBytesReader in place, or a MaxBytesReader is held in
    #   a variable. A variable that holds the body itself (`body := r.Body`) is not followed
    #   (`todoruleid:`). A file copied to the response is not a sink, even when the request
    #   names it.
    # - What a command prints (os/exec Cmd.Output, CombinedOutput) is request data only through
    #   the arguments go.command-injection does not report: the output of a command whose program,
    #   or whose shell, cmd.exe or PowerShell script, carries request data is that rule's finding
    #   and is not reported again here (`ok:`, a decision, not a limit). A fixed program given
    #   request data as an argument (echo, ping, a shell's positional parameters) may print it
    #   back, so its output is still reported.
    # - Those command arguments are written as copies of go.command-injection's sink patterns
    #   (sanitizers below): a change to that rule's sinks must be made here as well, or the two
    #   rules drift apart (a command the other rule stops reporting stays silent here, a new sink
    #   there is reported twice).
    # - The content of a file is not request data, even when the request names the file: the
    #   result of os.ReadFile or ioutil.ReadFile, and what io.ReadAll, ioutil.ReadAll, bufio's
    #   NewReader, NewReaderSize and NewScanner, or io.Copy (as the source) read from a file opened
    #   with os.Open or os.OpenFile. The file itself stays request data: its Name(), its Stat()
    #   and the error of os.Open name the file the request chose. Other readers of the file (a
    #   JSON decoder, io.CopyN, io.LimitReader) and a file opened in a `var` declaration are not
    #   recognised (`todook:`); the error of os.ReadFile is cleared with the call
    #   (`todoruleid:`).
    # Inherited from the request source block (go.sql-injection):
    # - The Echo instance's binder (`c.Echo().Binder.Bind(&x, c)`) is not a source (`todoruleid:`).
    # - Numeric fields count as clean only when their type is known in the file: a struct declared
    #   in another package stays tainted as a whole (`todook:`), and OpenGrep 1.30.0 gives its
    #   fields the type of same-named fields of structs declared in the file (`todoruleid:`).
    # - A named numeric type (`type Status int`) stays tainted (`todook:`).
    # - Test support is skipped only inside a function that takes a testing parameter: a handler
    #   declared at the top level of a test file and only served by a test is reported (`todook:`).
    options:
      # A map lookup keyed by request data (an allow-list of snippets) yields the map's values.
      taint_assume_safe_indexes: true
    pattern-sources:
      # The request: net/http's *http.Request, and the same request through Gin and Echo.
      - patterns:
          - pattern-either:
              - pattern: '($R : *http.Request).$F'
              - pattern: '($C : *gin.Context).Request.$F'
              - pattern: '($C : echo.Context).Request().$F'
              - pattern: '($C : *echo.Context).Request().$F'
          - metavariable-regex:
              metavariable: $F
              regex: ^(URL|Form|PostForm|MultipartForm|Header|Body|RequestURI)$
      - patterns:
          - pattern-either:
              - pattern: '($R : *http.Request).$F(...)'
              - pattern: '($C : *gin.Context).Request.$F(...)'
              - pattern: '($C : echo.Context).Request().$F(...)'
              - pattern: '($C : *echo.Context).Request().$F(...)'
          - metavariable-regex:
              metavariable: $F
              regex: ^(FormValue|PostFormValue|PathValue|Cookie|Cookies|Referer|UserAgent)$
      - pattern-either:
          # Route variables of routers built on net/http.
          - pattern: chi.URLParam(...)
          - pattern: mux.Vars(...)
      # Gin: path parameters, query strings, forms, headers and cookies.
      - patterns:
          - pattern: '($C : *gin.Context).$M(...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(Param|Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData)$
      # Echo: path parameters, query parameters, form values and cookies.
      - patterns:
          - pattern-either:
              - pattern: '($C : echo.Context).$M(...)'
              - pattern: '($C : *echo.Context).$M(...)'
          - metavariable-regex:
              metavariable: $M
              regex: ^(Param|ParamValues|QueryParam|QueryParams|QueryString|FormValue|FormParams|Cookie|Cookies)$
      # Gin and Echo binding: the struct the request is bound into.
      - by-side-effect: true
        patterns:
          - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Bind|BindJSON|BindXML|BindQuery|BindYAML|BindTOML|BindHeader|BindUri|BindWith|MustBindWith|ShouldBind|ShouldBindJSON|ShouldBindXML|ShouldBindQuery|ShouldBindYAML|ShouldBindTOML|ShouldBindHeader|ShouldBindUri|ShouldBindWith|ShouldBindBodyWith)$
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *echo.Context).Bind(&$X)'
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: echo.$BIND($C, &$X)
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
          - focus-metavariable: $X
      # Echo's DefaultBinder used directly: a *echo.DefaultBinder value, `new(echo.DefaultBinder)`
      # or `&echo.DefaultBinder{}`, made in the same function or typed.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($B : *echo.DefaultBinder).$BIND($C, &$X)'
              - pattern: '($B : echo.DefaultBinder).$BIND($C, &$X)'
              - pattern: (&echo.DefaultBinder{}).$BIND($C, &$X)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $B := new(echo.DefaultBinder)
                          ...
                      - pattern-inside: |
                          $B := &echo.DefaultBinder{}
                          ...
                  - pattern: $B.$BIND($C, &$X)
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
          - focus-metavariable: $X
      # DefaultBinder.Bind takes the target first in Echo v4 (`Bind(i, c)`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($B : *echo.DefaultBinder).Bind(&$X, $C)'
              - pattern: '($B : echo.DefaultBinder).Bind(&$X, $C)'
              - pattern: (&echo.DefaultBinder{}).Bind(&$X, $C)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $B := new(echo.DefaultBinder)
                          ...
                      - pattern-inside: |
                          $B := &echo.DefaultBinder{}
                          ...
                  - pattern: $B.Bind(&$X, $C)
          - focus-metavariable: $X
      # The same binders given a pointer made with new(T) or &T{} in the same function, passed
      # without `&` (Echo's request guide: `u := new(User); c.Bind(u)`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $X := new($T)
                  ...
              - pattern-inside: |
                  $X := &$T{...}
                  ...
          - pattern-either:
              - patterns:
                  - pattern: '($C : *gin.Context).$BIND($X, ...)'
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(Bind|BindJSON|BindXML|BindQuery|BindYAML|BindTOML|BindHeader|BindUri|BindWith|MustBindWith|ShouldBind|ShouldBindJSON|ShouldBindXML|ShouldBindQuery|ShouldBindYAML|ShouldBindTOML|ShouldBindHeader|ShouldBindUri|ShouldBindWith|ShouldBindBodyWith)$
              - pattern: '($C : echo.Context).Bind($X)'
              - pattern: '($C : *echo.Context).Bind($X)'
              - patterns:
                  - pattern-either:
                      - pattern: echo.$BIND($C, $X)
                      - pattern: '($B : *echo.DefaultBinder).$BIND($C, $X)'
                      - pattern: '($B : echo.DefaultBinder).$BIND($C, $X)'
                      - pattern: (&echo.DefaultBinder{}).$BIND($C, $X)
                  - metavariable-regex:
                      metavariable: $BIND
                      regex: ^(BindBody|BindQueryParams|BindPathParams|BindPathValues|BindHeaders)$
              - pattern: '($B : *echo.DefaultBinder).Bind($X, $C)'
              - pattern: '($B : echo.DefaultBinder).Bind($X, $C)'
              - pattern: (&echo.DefaultBinder{}).Bind($X, $C)
          - focus-metavariable: $X
    pattern-propagators:
      # encoding/json: decoding a tainted body taints the value it fills.
      - pattern: json.NewDecoder($R).Decode(&$X)
        from: $R
        to: $X
      - pattern: json.Unmarshal($R, &$X)
        from: $R
        to: $X
      # A text/template (recognised as in the sinks below) executed into a buffer, or request data
      # written into one directly: the buffer holds the data, so it is reported where it reaches
      # the response. html/template escapes, so its output stays clean. (One propagator: separate
      # ones for the direct writes cost more time on large files.)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              import "text/template"
                              ...
                          - pattern-not-inside: |
                              import "html/template"
                              ...
                      - patterns:
                          - pattern-inside: |
                              import "text/template"
                              ...
                          - pattern-inside: |
                              import $HTML "html/template"
                              ...
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $T := $INIT
                                  ...
                              - pattern-inside: |
                                  $T, $ERR := $INIT
                                  ...
                              - pattern-inside: |
                                  $T = $INIT
                                  ...
                              - pattern-inside: |
                                  var $T = $INIT
                                  ...
                          - metavariable-pattern:
                              metavariable: $INIT
                              patterns:
                                - pattern: $PKG.$CTOR(...)
                                - metavariable-regex:
                                    metavariable: $CTOR
                                    regex: ^(New|Must|ParseFiles|ParseGlob|ParseFS)$
                                - metavariable-pattern:
                                    metavariable: $PKG
                                    language: generic
                                    pattern-regex: ^template$
                          - pattern-either:
                              - pattern: $T.Execute(&$OUT, $DATA)
                              - pattern: $T.Execute($OUT, $DATA)
                              - pattern: $T.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $T.ExecuteTemplate($OUT, $NAME, $DATA)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  func $F(..., $T *$PKG.Template, ...) $RET { ... }
                              - pattern-inside: |
                                  func $F(..., $T *$PKG.Template, ...) { ... }
                              - pattern-inside: |
                                  func ($RECV $RT) $F(..., $T *$PKG.Template, ...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV $RT) $F(..., $T *$PKG.Template, ...) { ... }
                          - metavariable-pattern:
                              metavariable: $PKG
                              language: generic
                              pattern-regex: ^template$
                          - pattern-either:
                              - pattern: $T.Execute(&$OUT, $DATA)
                              - pattern: $T.Execute($OUT, $DATA)
                              - pattern: $T.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $T.ExecuteTemplate($OUT, $NAME, $DATA)
                      - patterns:
                          - pattern-inside: |
                              type $S struct {
                                ...
                                $FLD *$PKG.Template
                                ...
                              }
                              ...
                          - pattern-either:
                              - pattern-inside: |
                                  func ($RECV *$S) $F(...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV *$S) $F(...) { ... }
                              - pattern-inside: |
                                  func ($RECV $S) $F(...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV $S) $F(...) { ... }
                          - metavariable-pattern:
                              metavariable: $PKG
                              language: generic
                              pattern-regex: ^template$
                          - pattern-either:
                              - pattern: $RECV.$FLD.Execute(&$OUT, $DATA)
                              - pattern: $RECV.$FLD.Execute($OUT, $DATA)
                              - pattern: $RECV.$FLD.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $RECV.$FLD.ExecuteTemplate($OUT, $NAME, $DATA)
              - patterns:
                  - pattern-inside: |
                      import $ALIAS "text/template"
                      ...
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $T := $ALIAS.$CTOR(...)
                                  ...
                              - pattern-inside: |
                                  $T := $ALIAS.$CTOR(...).$M(...)
                                  ...
                              - pattern-inside: |
                                  $T, $ERR := $ALIAS.$CTOR(...)
                                  ...
                              - pattern-inside: |
                                  $T, $ERR := $ALIAS.$CTOR(...).$M(...)
                                  ...
                              - pattern-inside: |
                                  $T, $ERR := $ALIAS.$CTOR(...).$M(...).$M2(...)
                                  ...
                              - pattern-inside: |
                                  var $T = $ALIAS.$CTOR(...)
                                  ...
                              - pattern-inside: |
                                  $T = $ALIAS.$CTOR(...)
                                  ...
                          - metavariable-regex:
                              metavariable: $CTOR
                              regex: ^(New|Must|ParseFiles|ParseGlob|ParseFS)$
                          - pattern-either:
                              - pattern: $T.Execute(&$OUT, $DATA)
                              - pattern: $T.Execute($OUT, $DATA)
                              - pattern: $T.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $T.ExecuteTemplate($OUT, $NAME, $DATA)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  func $F(..., $T *$ALIAS.Template, ...) $RET { ... }
                              - pattern-inside: |
                                  func $F(..., $T *$ALIAS.Template, ...) { ... }
                              - pattern-inside: |
                                  func ($RECV $RT) $F(..., $T *$ALIAS.Template, ...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV $RT) $F(..., $T *$ALIAS.Template, ...) { ... }
                          - pattern-either:
                              - pattern: $T.Execute(&$OUT, $DATA)
                              - pattern: $T.Execute($OUT, $DATA)
                              - pattern: $T.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $T.ExecuteTemplate($OUT, $NAME, $DATA)
                      - patterns:
                          - pattern-inside: |
                              type $S struct {
                                ...
                                $FLD *$ALIAS.Template
                                ...
                              }
                              ...
                          - pattern-either:
                              - pattern-inside: |
                                  func ($RECV *$S) $F(...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV *$S) $F(...) { ... }
                              - pattern-inside: |
                                  func ($RECV $S) $F(...) $RET { ... }
                              - pattern-inside: |
                                  func ($RECV $S) $F(...) { ... }
                          - pattern-either:
                              - pattern: $RECV.$FLD.Execute(&$OUT, $DATA)
                              - pattern: $RECV.$FLD.Execute($OUT, $DATA)
                              - pattern: $RECV.$FLD.ExecuteTemplate(&$OUT, $NAME, $DATA)
                              - pattern: $RECV.$FLD.ExecuteTemplate($OUT, $NAME, $DATA)
              # Request data written into the buffer directly: its own Write methods and ReadFrom (not
              # Grow or Truncate, which take a length), fmt.Fprint*, io.WriteString or io.Copy.
              - pattern-either:
                  - pattern: $OUT.Write($DATA)
                  - pattern: $OUT.WriteString($DATA)
                  - pattern: $OUT.WriteByte($DATA)
                  - pattern: $OUT.WriteRune($DATA)
                  - pattern: $OUT.ReadFrom($DATA)
                  - pattern: fmt.Fprint(&$OUT, ..., $DATA, ...)
                  - pattern: fmt.Fprint($OUT, ..., $DATA, ...)
                  - pattern: fmt.Fprintf(&$OUT, ..., $DATA, ...)
                  - pattern: fmt.Fprintf($OUT, ..., $DATA, ...)
                  - pattern: fmt.Fprintln(&$OUT, ..., $DATA, ...)
                  - pattern: fmt.Fprintln($OUT, ..., $DATA, ...)
                  - pattern: io.WriteString(&$OUT, $DATA)
                  - pattern: io.WriteString($OUT, $DATA)
                  - pattern: io.Copy(&$OUT, $DATA)
                  - pattern: io.Copy($OUT, $DATA)
          # The writer is a bytes.Buffer or strings.Builder: typed (also as the receiver of its own
          # method), made with bytes.NewBuffer(String), or asserted from an interface (a
          # sync.Pool's Get) in the same function.
          - pattern-either:
              - pattern-inside: '($OUT : bytes.Buffer).$BM(...)'
              - pattern-inside: '($OUT : strings.Builder).$BM(...)'
              - pattern-inside: '($OUT : *bytes.Buffer).$BM(...)'
              - pattern-inside: '($OUT : *strings.Builder).$BM(...)'
              - pattern-inside: '$X.$M(..., &($OUT : bytes.Buffer), ...)'
              - pattern-inside: '$X.$M(..., &($OUT : strings.Builder), ...)'
              - pattern-inside: '$X.$M(..., ($OUT : *bytes.Buffer), ...)'
              - pattern-inside: '$X.$M(..., ($OUT : *strings.Builder), ...)'
              # (`$OUT = ...` also matches `:=`.)
              - pattern-inside: |
                  $OUT = bytes.NewBuffer(...)
                  ...
              - pattern-inside: |
                  $OUT = bytes.NewBufferString(...)
                  ...
              - pattern-inside: |
                  $OUT = $POOLED.(*bytes.Buffer)
                  ...
              - pattern-inside: |
                  $OUT = $POOLED.(*strings.Builder)
                  ...
        from: $DATA
        to: $OUT
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      # A number or boolean (a numeric field of a bound struct, say) cannot carry markup. The type
      # must be known in the file: a struct of another package stays tainted as a whole.
      - exact: true
        # Exact: the value of the number or boolean is clean, not what it is computed from, so a
        # sink called in a comparison (`if run(x) != nil`), nested in a compared call or inside a
        # callback given to one is still reported, and the struct a bind or decode call in a
        # comparison fills (`ok := c.ShouldBindJSON(&x) == nil`) stays request data.
        patterns:
          - pattern: $E
          - metavariable-type:
              metavariable: $E
              types: [int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64, bool]
      # Escaping: html.EscapeString and html/template's escapers turn <, >, &, ' and " into
      # entities or escapes (URLQueryEscaper into %XX).
      - pattern: html.EscapeString(...)
      - patterns:
          - pattern: template.$ESC(...)
          - metavariable-regex:
              metavariable: $ESC
              regex: ^(HTMLEscapeString|HTMLEscaper|JSEscapeString|JSEscaper|URLQueryEscaper)$
      # The content of a file is not request data, even when the request names the file.
      - pattern: os.ReadFile(...)
      - pattern: ioutil.ReadFile(...)
      # The same for what is read from a file opened by name: the file given to io.ReadAll, to
      # bufio's readers and scanner, or as the source of io.Copy. The file itself
      # stays request data: its Name() and its Stat() name the file the request chose, and so does
      # the error (*os.PathError). (`$F, $ERR = ...` also matches `:=`, not a `var` declaration.)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F, $ERR = os.Open(...)
                  ...
              - pattern-inside: |
                  $F, $ERR = os.OpenFile(...)
                  ...
          - pattern-either:
              - pattern: io.ReadAll($F)
              - pattern: ioutil.ReadAll($F)
              - pattern: bufio.NewReader($F)
              - pattern: bufio.NewReaderSize($F, $SIZE)
              - pattern: bufio.NewScanner($F)
              - pattern: io.Copy($DST, $F)
      # The command arguments that go.command-injection reports (the same shapes as its sinks):
      # the program, the script after a POSIX shell's -c, everything after cmd.exe's /C or /K,
      # and PowerShell's command, script or first positional argument. Request data there is that
      # rule's finding; what the command then prints (os/exec Cmd.Output: its standard output) is
      # not reported a second time. Other arguments of a fixed program, a shell's positional parameters among
      # them, still reach the output: the program may print them back.
      - patterns:
          - pattern-either:
              - pattern: exec.Command($PROG, ...)
              - pattern: exec.CommandContext($CTX, $PROG, ...)
              - pattern: 'exec.Cmd{..., Path: $PROG, ...}'
          - focus-metavariable: $PROG
      - patterns:
          - pattern-either:
              - pattern: exec.Command("=~/^(/usr)?(/local)?(/bin/)?(sh|bash|dash|zsh|ksh|mksh|ash)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/^(/usr)?(/local)?(/bin/)?(sh|bash|dash|zsh|ksh|mksh|ash)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $SCRIPT, ...)
              - pattern: exec.Command("=~/^(/usr)?(/bin/)?env$/", "=~/^(/usr)?(/local)?(/bin/)?(sh|bash|dash|zsh|ksh|mksh|ash)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/^(/usr)?(/bin/)?env$/", "=~/^(/usr)?(/local)?(/bin/)?(sh|bash|dash|zsh|ksh|mksh|ash)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $SCRIPT, ...)
          - focus-metavariable: $SCRIPT
      - patterns:
          - pattern-either:
              - pattern: exec.Command("=~/^(.*[^a-zA-Z0-9])?[cC][mM][dD]([.][eE][xX][eE])?$/", ..., "=~/^/[cCkK]$/", ..., $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/^(.*[^a-zA-Z0-9])?[cC][mM][dD]([.][eE][xX][eE])?$/", ..., "=~/^/[cCkK]$/", ..., $SCRIPT, ...)
          - focus-metavariable: $SCRIPT
      # PowerShell: the arguments of its command parameters and its first positional argument, as
      # in go.command-injection's two PowerShell sinks (see there).
      - patterns:
          - pattern-either:
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(c|command)$/", ..., $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(c|command)$/", ..., $SCRIPT, ...)
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", $SCRIPT, ...)
          - pattern-not: exec.Command($PS, ..., "=~/(?i)^-(f|file|cwa|commandwithargs)$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, $PS, ..., "=~/(?i)^-(f|file|cwa|commandwithargs)$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.Command("=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", ..., "=~/(?i)\.ps1$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", ..., "=~/(?i)\.ps1$/", ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.Command("=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
          # A slice spread after -cwa or -File holds the command or script and its arguments, which
          # are not followed (Known limits); after -Command or -EncodedCommand it is the command.
          - pattern-not: exec.Command($PS, ..., "=~/(?i)^-(cwa|commandwithargs|f|file)$/", $REST...)
          - pattern-not: exec.CommandContext($CTX, $PS, ..., "=~/(?i)^-(cwa|commandwithargs|f|file)$/", $REST...)
          - focus-metavariable: $SCRIPT
      - patterns:
          - pattern-either:
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", $SCRIPT, ...)
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(login|l|interactive|i|mta|sta|noexit|noe|nologo|nol|noninteractive|noni|noprofile|nop|noprofileloadtime|sshservermode|sshs)$/", $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(login|l|interactive|i|mta|sta|noexit|noe|nologo|nol|noninteractive|noni|noprofile|nop|noprofileloadtime|sshservermode|sshs)$/", $SCRIPT, ...)
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(configurationfile|configurationname|config|custompipename|executionpolicy|ex|ep|inputformat|inp|if|outputformat|o|of|settingsfile|settings|windowstyle|w|workingdirectory|wd|wo|psconsolefile)$/", $VALUE, $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?(pwsh|powershell)(\.exe)?$/", ..., "=~/(?i)^-(configurationfile|configurationname|config|custompipename|executionpolicy|ex|ep|inputformat|inp|if|outputformat|o|of|settingsfile|settings|windowstyle|w|workingdirectory|wd|wo|psconsolefile)$/", $VALUE, $SCRIPT, ...)
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?powershell(\.exe)?$/", ..., "=~/(?i)^-version$/", $VALUE, $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?powershell(\.exe)?$/", ..., "=~/(?i)^-version$/", $VALUE, $SCRIPT, ...)
              - pattern: exec.Command("=~/(?i)^(.*[^a-z0-9])?powershell(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
              - pattern: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?powershell(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
          - pattern-not: exec.Command($PS, ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, $PS, ..., "=~/(?i)^-(c|command|cwa|commandwithargs|e|ec|encodedcommand|f|file)$/", ..., $SCRIPT, ...)
          - pattern-not: exec.Command("=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", ..., "=~/(?i)\.ps1$/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", ..., "=~/(?i)\.ps1$/", ..., $SCRIPT, ...)
          - pattern-not: exec.Command("=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
          - pattern-not: exec.CommandContext($CTX, "=~/(?i)^(.*[^a-z0-9])?pwsh(\.exe)?$/", "=~/^[^-]/", ..., $SCRIPT, ...)
          # A spread argument slice (`args...`) is not followed (Known limits).
          - pattern-not: exec.Command($PS, ..., $REST...)
          - pattern-not: exec.CommandContext($CTX, $PS, ..., $REST...)
          - focus-metavariable: $SCRIPT
      # URL escaping: the output holds only letters, digits, "-_.~", "%" and "+".
      - pattern: url.QueryEscape(...)
      - pattern: url.PathEscape(...)
      # encoding/json escapes <, > and & inside strings.
      - pattern: json.Marshal(...)
      - pattern: json.MarshalIndent(...)
      # bluemonday: the HTML a policy lets through.
      - patterns:
          - pattern-either:
              - pattern: bluemonday.$POLICY(...).$SANITIZE(...)
              - pattern: '($P : *bluemonday.Policy).$SANITIZE(...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P := bluemonday.$POLICY(...)
                          ...
                      - pattern-inside: |
                          $P = bluemonday.$POLICY(...)
                          ...
                      - pattern-inside: |
                          var $P = bluemonday.$POLICY(...)
                          ...
                  - pattern: $P.$SANITIZE(...)
          - metavariable-regex:
              metavariable: $SANITIZE
              regex: ^(Sanitize|SanitizeBytes)$
      # Test support (shared by the Go request taint rules): request data inside a function or
      # method that takes a *testing.T, *testing.B, *testing.F, *testing.M or testing.TB (a test,
      # a subtest, TestMain, a test helper in any file) comes from the test's own requests, such
      # as those of an httptest server it starts.
      - patterns:
          - pattern-inside: |
              func $FN(..., $TP $TY, ...) { ... }
          - metavariable-regex:
              metavariable: $TY
              regex: ^(\*testing\.(T|B|F|M)|testing\.TB)$
          - pattern: $X
    pattern-sinks:
      # html/template's typed strings: the content is inserted verbatim, so it must come from a
      # trusted source. The names are written out (one prefilter clause, not two).
      - patterns:
          - pattern-either:
              - pattern: template.HTML($X)
              - pattern: template.HTMLAttr($X)
              - pattern: template.JS($X)
              - pattern: template.JSStr($X)
              - pattern: template.URL($X)
              - pattern: template.CSS($X)
              - pattern: template.Srcset($X)
          - focus-metavariable: $X
      # Writes to the response: fmt.Fprint*, io.WriteString and Write on an http.ResponseWriter,
      # Gin's c.Writer and Echo's c.Response(). net/http sniffs the Content-Type from the first
      # bytes when none is set; a function that first sets a non-HTML type is skipped.
      - patterns:
          - pattern-either:
              # fmt.Fprint, Fprintf and Fprintln, written out (one prefilter clause).
              - pattern-inside: 'fmt.Fprint(($W : http.ResponseWriter), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprint(($C : *gin.Context).Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprint(($C : echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprint(($C : *echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprint(($C : echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprint(($C : *echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($W : http.ResponseWriter), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($C : *gin.Context).Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($C : echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($C : *echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($C : echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintf(($C : *echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($W : http.ResponseWriter), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($C : *gin.Context).Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($C : echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($C : *echo.Context).Response(), ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($C : echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'fmt.Fprintln(($C : *echo.Context).Response().Writer, ..., $DATA, ...)'
              - pattern-inside: 'io.WriteString(($W : http.ResponseWriter), $DATA)'
              - pattern-inside: 'io.WriteString(($C : *gin.Context).Writer, $DATA)'
              - pattern-inside: 'io.WriteString(($C : echo.Context).Response(), $DATA)'
              - pattern-inside: 'io.WriteString(($C : *echo.Context).Response(), $DATA)'
              - pattern-inside: '($W : http.ResponseWriter).Write($DATA)'
              - pattern-inside: '($C : *gin.Context).Writer.$WRITE($DATA)'
              - pattern-inside: '($C : echo.Context).Response().$WRITE($DATA)'
              - pattern-inside: '($C : *echo.Context).Response().$WRITE($DATA)'
              - pattern-inside: '($C : echo.Context).Response().Writer.$WRITE($DATA)'
              - pattern-inside: '($C : *echo.Context).Response().Writer.$WRITE($DATA)'
              # A bytes.Buffer that writes itself to the response, or is copied to it: typed in the
              # file, or made with new, a literal or bytes.NewBuffer(String), or asserted from an
              # interface (a sync.Pool's Get), in the same function. The request body copied to the
              # response (io.Copy, CopyBuffer, CopyN), also through http.MaxBytesReader or
              # io.LimitReader. Other readers (a file, even one the request names, a bufio.Reader,
              # an io.LimitedReader) are not sinks.
              - patterns:
                  - pattern-either:
                      - pattern-inside: '$DATA.WriteTo(($W : http.ResponseWriter))'
                      - pattern-inside: '$DATA.WriteTo(($C : *gin.Context).Writer)'
                      - pattern-inside: '$DATA.WriteTo(($C : echo.Context).Response())'
                      - pattern-inside: '$DATA.WriteTo(($C : *echo.Context).Response())'
                      - pattern-inside: 'io.Copy(($W : http.ResponseWriter), &$DATA)'
                      - pattern-inside: 'io.Copy(($C : *gin.Context).Writer, &$DATA)'
                      - pattern-inside: 'io.Copy(($C : echo.Context).Response(), &$DATA)'
                      - pattern-inside: 'io.Copy(($C : *echo.Context).Response(), &$DATA)'
                      - pattern-inside: 'io.Copy(($W : http.ResponseWriter), $DATA)'
                      - pattern-inside: 'io.Copy(($C : *gin.Context).Writer, $DATA)'
                      - pattern-inside: 'io.Copy(($C : echo.Context).Response(), $DATA)'
                      - pattern-inside: 'io.Copy(($C : *echo.Context).Response(), $DATA)'
                      - pattern-inside: 'io.CopyBuffer(($W : http.ResponseWriter), $DATA, $BUF)'
                      - pattern-inside: 'io.CopyBuffer(($C : *gin.Context).Writer, $DATA, $BUF)'
                      - pattern-inside: 'io.CopyBuffer(($C : echo.Context).Response(), $DATA, $BUF)'
                      - pattern-inside: 'io.CopyBuffer(($C : *echo.Context).Response(), $DATA, $BUF)'
                      - pattern-inside: 'io.CopyN(($W : http.ResponseWriter), $DATA, $N)'
                      - pattern-inside: 'io.CopyN(($C : *gin.Context).Writer, $DATA, $N)'
                      - pattern-inside: 'io.CopyN(($C : echo.Context).Response(), $DATA, $N)'
                      - pattern-inside: 'io.CopyN(($C : *echo.Context).Response(), $DATA, $N)'
                  - pattern-either:
                      - pattern-inside: '($RQ : *http.Request).Body'
                      - pattern-inside: '($RC : *gin.Context).Request.Body'
                      - pattern-inside: '($RC : echo.Context).Request().Body'
                      - pattern-inside: '($RC : *echo.Context).Request().Body'
                      - pattern-inside: 'io.LimitReader(($RQ : *http.Request).Body, $LIMIT)'
                      - pattern-inside: 'io.LimitReader(($RC : *gin.Context).Request.Body, $LIMIT)'
                      - pattern-inside: 'io.LimitReader(($RC : echo.Context).Request().Body, $LIMIT)'
                      - pattern-inside: 'io.LimitReader(($RC : *echo.Context).Request().Body, $LIMIT)'
                      # MaxBytesReader is meant for request bodies (net/http docs).
                      - pattern-inside: 'http.MaxBytesReader($MW, $BODY, $LIMIT)'
                      - pattern-inside: |
                          $DATA = http.MaxBytesReader($MW, $BODY, $LIMIT)
                          ...
                      - pattern-inside: '($DATA : bytes.Buffer)'
                      - pattern-inside: '($DATA : *bytes.Buffer)'
                      - pattern-inside: |
                          $DATA := new(bytes.Buffer)
                          ...
                      - pattern-inside: |
                          $DATA := &bytes.Buffer{...}
                          ...
                      - pattern-inside: |
                          $DATA := bytes.NewBuffer(...)
                          ...
                      - pattern-inside: |
                          $DATA := bytes.NewBufferString(...)
                          ...
                      - pattern-inside: |
                          $DATA = bytes.NewBuffer(...)
                          ...
                      - pattern-inside: |
                          $DATA = bytes.NewBufferString(...)
                          ...
                      - pattern-inside: |
                          $DATA := $POOLED.(*bytes.Buffer)
                          ...
                      - pattern-inside: |
                          $DATA = $POOLED.(*bytes.Buffer)
                          ...
              # A text/template (no escaping) executed into the response. Go names an unaliased
              # import after its package, so in a file that imports text/template without an alias
              # (and html/template, if at all, under another name) the spelling "template" is
              # text/template; with an alias, the alias is. The template is built in the same
              # function or as a package variable, is a parameter, or is a field of that type reached
              # through the receiver of a method of its struct.
              # For the prefilter, the Execute call is the only positive term (its word is rare), and
              # the template forms are an exclusion: an Execute call into the response that is none of
              # them is left out. Six positive branches of four conditions each multiplied the CNF
              # past OpenGrep's limit, and the rule had no prefilter.
              - patterns:
                  - pattern-either:
                      - pattern-inside: '$T.Execute(($W : http.ResponseWriter), $DATA)'
                      - pattern-inside: '$T.Execute(($C : *gin.Context).Writer, $DATA)'
                      - pattern-inside: '$T.Execute(($C : echo.Context).Response(), $DATA)'
                      - pattern-inside: '$T.Execute(($C : *echo.Context).Response(), $DATA)'
                      - pattern-inside: '$T.ExecuteTemplate(($W : http.ResponseWriter), $NAME, $DATA)'
                      - pattern-inside: '$T.ExecuteTemplate(($C : *gin.Context).Writer, $NAME, $DATA)'
                      - pattern-inside: '$T.ExecuteTemplate(($C : echo.Context).Response(), $NAME, $DATA)'
                      - pattern-inside: '$T.ExecuteTemplate(($C : *echo.Context).Response(), $NAME, $DATA)'
                  - pattern-not-inside:
                      patterns:
                        - pattern-either:
                            - pattern: '$T.Execute(($W : http.ResponseWriter), $DATA)'
                            - pattern: '$T.Execute(($C : *gin.Context).Writer, $DATA)'
                            - pattern: '$T.Execute(($C : echo.Context).Response(), $DATA)'
                            - pattern: '$T.Execute(($C : *echo.Context).Response(), $DATA)'
                            - pattern: '$T.ExecuteTemplate(($W : http.ResponseWriter), $NAME, $DATA)'
                            - pattern: '$T.ExecuteTemplate(($C : *gin.Context).Writer, $NAME, $DATA)'
                            - pattern: '$T.ExecuteTemplate(($C : echo.Context).Response(), $NAME, $DATA)'
                            - pattern: '$T.ExecuteTemplate(($C : *echo.Context).Response(), $NAME, $DATA)'
                        # ... unless it is a text/template: how the template is spelled and where it is
                        # made. (`$T = $X` also matches `:=` and `var` declarations, and a function
                        # pattern without results or receiver also matches methods and functions with
                        # results.)
                        - pattern-not-inside:
                            pattern-either:
                              # Unaliased: the spelling "template" is text/template.
                              - patterns:
                                  - pattern-either:
                                      - patterns:
                                          - pattern-inside: |
                                              import "text/template"
                                              ...
                                          - pattern-not-inside: |
                                              import "html/template"
                                              ...
                                      - patterns:
                                          - pattern-inside: |
                                              import "text/template"
                                              ...
                                          - pattern-inside: |
                                              import $HTML "html/template"
                                              ...
                                  - pattern-either:
                                      # Built in the same function or as a package variable.
                                      - patterns:
                                          - pattern-either:
                                              - pattern-inside: |
                                                  $T = $INIT
                                                  ...
                                              - pattern-inside: |
                                                  $T, $ERR := $INIT
                                                  ...
                                          - metavariable-pattern:
                                              metavariable: $INIT
                                              patterns:
                                                - pattern: $PKG.$CTOR(...)
                                                - metavariable-regex:
                                                    metavariable: $CTOR
                                                    regex: ^(New|Must|ParseFiles|ParseGlob|ParseFS)$
                                                - metavariable-pattern:
                                                    metavariable: $PKG
                                                    language: generic
                                                    pattern-regex: ^template$
                                      # A parameter.
                                      - patterns:
                                          - pattern-inside: |
                                              func $F(..., $T *$PKG.Template, ...) { ... }
                                          - metavariable-pattern:
                                              metavariable: $PKG
                                              language: generic
                                              pattern-regex: ^template$
                                      # A field of that type reached through the receiver.
                                      - patterns:
                                          - pattern-inside: |
                                              type $S struct {
                                                ...
                                                $FLD *$PKG.Template
                                                ...
                                              }
                                              ...
                                          - pattern-either:
                                              - pattern-inside: |
                                                  func ($RECV *$S) $F(...) { ... }
                                              - pattern-inside: |
                                                  func ($RECV $S) $F(...) { ... }
                                          - metavariable-pattern:
                                              metavariable: $PKG
                                              language: generic
                                              pattern-regex: ^template$
                                          - pattern-inside: $RECV.$FLD.$EXEC(...)
                              # With an alias, the alias is text/template.
                              - patterns:
                                  - pattern-inside: |
                                      import $ALIAS "text/template"
                                      ...
                                  - pattern-either:
                                      - patterns:
                                          - pattern-either:
                                              - pattern-inside: |
                                                  $T = $ALIAS.$CTOR(...)
                                                  ...
                                              - pattern-inside: |
                                                  $T := $ALIAS.$CTOR(...).$M(...)
                                                  ...
                                              - pattern-inside: |
                                                  $T, $ERR := $ALIAS.$CTOR(...)
                                                  ...
                                              - pattern-inside: |
                                                  $T, $ERR := $ALIAS.$CTOR(...).$M(...)
                                                  ...
                                              - pattern-inside: |
                                                  $T, $ERR := $ALIAS.$CTOR(...).$M(...).$M2(...)
                                                  ...
                                          - metavariable-regex:
                                              metavariable: $CTOR
                                              regex: ^(New|Must|ParseFiles|ParseGlob|ParseFS)$
                                      - pattern-inside: |
                                          func $F(..., $T *$ALIAS.Template, ...) { ... }
                                      - patterns:
                                          - pattern-inside: |
                                              type $S struct {
                                                ...
                                                $FLD *$ALIAS.Template
                                                ...
                                              }
                                              ...
                                          - pattern-either:
                                              - pattern-inside: |
                                                  func ($RECV *$S) $F(...) { ... }
                                              - pattern-inside: |
                                                  func ($RECV $S) $F(...) { ... }
                                          - pattern-inside: $RECV.$FLD.$EXEC(...)
          - pattern: $DATA
          # A Content-Type that browsers do not render as HTML, set (Set or Add) earlier in the
          # function: a literal type, or one of Echo's MIME constants for JSON, JavaScript, plain
          # text and binary data.
          - pattern-not-inside: |
              $X.Header().$SET("=~/^[cC]ontent-[tT]ype$/", "=~/^\s*([tT][eE][xX][tT]\/(plain|csv|event-stream)|application\/(json|x-ndjson|octet-stream|pdf|zip|javascript|[a-z.+-]*\+json)|image\/(png|jpeg|gif|webp))/")
              ...
          - pattern-not-inside: |
              $X.Header().$SET("=~/^[cC]ontent-[tT]ype$/", echo.MIMEApplicationJSON)
