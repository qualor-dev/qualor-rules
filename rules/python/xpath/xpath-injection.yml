rules:
  - id: python.xpath-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is built into an XPath expression (lxml xpath(), XPath(),
      XPathEvaluator, or an ElementTree find()/findall() path). The sender can change what the
      query selects, for example to match every user instead of one. Keep the expression constant
      and pass request values as XPath variables (`tree.xpath("//user[@name=$name]", name=value)`),
      or pick the expression from a fixed allow-list.
    metadata:
      title: XPath expression built from HTTP request data (Python)
      cwe: ['CWE-643']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [flask, django, fastapi, lxml, xml.etree.elementtree, defusedxml]
      sources:
        - https://cwe.mitre.org/data/definitions/643.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://top10.owasp.org/2021/A03_2021-Injection
        - https://lxml.de/xpathxslt.html
        - https://lxml.de/FAQ.html#how-do-i-use-lxml-safely-as-a-web-service-endpoint
        - https://lxml.de/apidoc/lxml.etree.html
        - https://lxml.de/lxmlhtml.html
        - https://lxml.de/objectify.html
        - https://docs.python.org/3/library/xml.etree.elementtree.html#xpath-support
        - https://docs.python.org/3/library/xml.etree.elementtree.html#xml.etree.ElementTree.Element.find
        - https://github.com/tiran/defusedxml
        - https://peps.python.org/pep-0008/#constants
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - OpenGrep does not carry taint through a slice (`request.args["q"][:50]`).
    # - xpath() is a sink on any receiver in a module that imports lxml. find(), findall(),
    #   findtext() and iterfind() are sinks only on a tree or element the rule can see: the result
    #   of an lxml, ElementTree or defusedxml parse()/fromstring()/XML()/Element()/... call, in
    #   place or assigned in the module or function, its getroot() (in place, chained on an
    #   assigned tree, or kept in a variable), or a find() of an assigned tree kept in a variable.
    #   For these methods a tree returned by a helper, received as a parameter or held on an
    #   attribute, an element reached by iteration and an element taken from a result list are
    #   missed (todoruleid).
    # - "Imports lxml" means a top-level import: a module that imports lxml only inside
    #   `try: ... except ImportError:` or under `if TYPE_CHECKING:` gets no xpath() findings. The
    #   test file imports lxml at the top, so this one has no todo line.
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items)
    #   assigned to an upper-case (constant) name that the module never changes or assigns
    #   again, with no default or a literal/constant default for get() (an upper-case name
    #   assigned in the function is not a constant); or as a ternary of constants. A membership
    #   check (`if x not in ALLOWED: return`) is not, nor is a nested table (todook).
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - patterns:
                          - pattern-inside: |
                              class $CLS(...):
                                ...
                          - pattern-either:
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., $PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., *$PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., **$PARAM):
                                    ...
                          - metavariable-regex:
                              metavariable: $VIEW
                              regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
                  - focus-metavariable: $PARAM
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      # An allow-list: a lookup in a dict literal of literal keys and values (strings, numbers,
      # True/False/None) assigned to an upper-case (constant) name, which the module never
      # changes (item assignment, update(), setdefault(), |=, assigning the name again). A get()
      # default must be a literal or a constant too.
      - patterns:
          - pattern-inside: |
              $ALLOWED = $LITERAL
              ...
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $LITERAL
              regex: ^\{(\s*("[^"\\\n]*"|'[^'\\\n]*'|-?\d+(\.\d+)?|True|False|None)\s*:\s*("[^"\\\n]*"|'[^'\\\n]*'|-?\d+(\.\d+)?|True|False|None)\s*,)*(\s*("[^"\\\n]*"|'[^'\\\n]*'|-?\d+(\.\d+)?|True|False|None)\s*:\s*("[^"\\\n]*"|'[^'\\\n]*'|-?\d+(\.\d+)?|True|False|None)\s*)?\s*\}$
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED[$KEY] = $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED.update(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED.setdefault(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED |= $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED = $OTHER
              ...
          - pattern-either:
              - pattern: $ALLOWED.get($LOOKUP)
              - pattern: $ALLOWED[$LOOKUP]
              - patterns:
                  - pattern: $ALLOWED.get($LOOKUP, $DEFAULT)
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^("[^"\\\n]*"|'[^'\\\n]*'|-?\d+(\.\d+)?|True|False|None|[A-Z][A-Z0-9_]*(\[("[^"\\\n]*"|'[^'\\\n]*')\])?)$
      # An allow-list written as a module table (rule-specific, beside the shared one above): a
      # dict literal whose keys are literals and whose values are literals or lists/tuples of
      # literals, with comments allowed between the items, assigned to an upper-case name that
      # the module never changes or assigns again; a get() default is a literal, a list/tuple of
      # literals or a module constant; strings may hold backslash escapes.
      - patterns:
          - pattern-inside: |
              $TABLE = $ITEMS
              ...
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $ITEMS
              regex: ^\{(\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*)?\}$
          - pattern-not-inside: |
              $TABLE = $ITEMS
              ...
              $TABLE[$KEY] = $VALUE
              ...
          - pattern-not-inside: |
              $TABLE = $ITEMS
              ...
              $TABLE.update(...)
              ...
          - pattern-not-inside: |
              $TABLE = $ITEMS
              ...
              $TABLE.setdefault(...)
              ...
          - pattern-not-inside: |
              $TABLE = $ITEMS
              ...
              $TABLE |= $VALUE
              ...
          - pattern-not-inside: |
              $TABLE = $ITEMS
              ...
              $TABLE = $OTHER
              ...
          - pattern-either:
              - pattern: $TABLE.get($LOOKUP)
              - pattern: $TABLE[$LOOKUP]
              - patterns:
                  - pattern: $TABLE.get($LOOKUP, $DEFAULT)
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(("(\\.|[^"\\\n])*"|'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\)|[A-Z][A-Z0-9_]*(\[("[^"\\\n]*"|'[^'\\\n]*')\])?)$
                  # An upper-case name assigned in the function is a local, not a constant.
                  - pattern-not-inside: |
                      def $FUNCTION(...):
                        ...
                        $DEFAULT = $ANY
                        ...
    pattern-sinks:
      # lxml: the expression of xpath() in a module that imports lxml (no standard-library or
      # in-scope framework API has an xpath() method). Keyword arguments are XPath variables.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $LXML import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $LXML
                      regex: ^lxml(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $LXML
                      ...
                  - metavariable-regex:
                      metavariable: $LXML
                      regex: ^lxml(\.|$)
          - pattern: $RECV.xpath($QUERY, ...)
          - focus-metavariable: $QUERY
      # ElementTree's XPath subset: the path of find(), findall(), findtext() and iterfind() on a
      # tree or element of xml.etree.ElementTree, defusedxml or lxml the rule can see: made by a
      # parse/fromstring/XML/Element... call in place or assigned in the module or function, its
      # getroot() (in place, chained on an assigned tree, or kept in a variable), or a find() of
      # an assigned tree kept in a variable. (str.find, BeautifulSoup and document stores have
      # methods of the same names.)
      - patterns:
          - pattern-either:
              - pattern: $RECV.$METHOD($QUERY, ...)
              - pattern: $RECV.$METHOD(..., match=$QUERY, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(find|findall|findtext|iterfind)$
          - pattern-either:
              - pattern: $FACTORY(...).$METHOD(...)
              - pattern: $FACTORY(...).getroot().$METHOD(...)
              - pattern-inside: |
                  $RECV = $FACTORY(...)
                  ...
              - pattern-inside: |
                  $RECV = $FACTORY(...).getroot()
                  ...
              - patterns:
                  - pattern-inside: |
                      $TREE = $FACTORY(...)
                      ...
                  - pattern: $TREE.getroot().$METHOD(...)
              - pattern-inside: |
                  $TREE = $FACTORY(...)
                  ...
                  $RECV = $TREE.getroot()
                  ...
              - pattern-inside: |
                  $TREE = $FACTORY(...)
                  ...
                  $RECV = $TREE.find(...)
                  ...
          - metavariable-pattern:
              metavariable: $FACTORY
              pattern-either:
                - pattern: lxml.etree.parse
                - pattern: lxml.etree.fromstring
                - pattern: lxml.etree.fromstringlist
                - pattern: lxml.etree.XML
                - pattern: lxml.etree.HTML
                - pattern: lxml.etree.ElementTree
                - pattern: lxml.etree.Element
                - pattern: lxml.etree.SubElement
                - pattern: lxml.html.parse
                - pattern: lxml.html.fromstring
                - pattern: lxml.html.document_fromstring
                - pattern: lxml.html.fragment_fromstring
                - pattern: lxml.objectify.parse
                - pattern: lxml.objectify.fromstring
                - pattern: lxml.objectify.XML
                - pattern: xml.etree.ElementTree.parse
                - pattern: xml.etree.ElementTree.fromstring
                - pattern: xml.etree.ElementTree.fromstringlist
                - pattern: xml.etree.ElementTree.XML
                - pattern: xml.etree.ElementTree.ElementTree
                - pattern: xml.etree.ElementTree.Element
                - pattern: xml.etree.ElementTree.SubElement
                - pattern: defusedxml.ElementTree.parse
                - pattern: defusedxml.ElementTree.fromstring
                - pattern: defusedxml.ElementTree.XML
          - focus-metavariable: $QUERY
      # lxml's compiled expressions and evaluators.
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.XPath($QUERY, ...)
              - pattern: lxml.etree.XPath(..., path=$QUERY, ...)
              - pattern: lxml.etree.ETXPath($QUERY, ...)
              - pattern: lxml.etree.ETXPath(..., path=$QUERY, ...)
              - pattern: lxml.etree.XPathEvaluator(...)($QUERY, ...)
              - pattern: lxml.etree.XPathDocumentEvaluator(...)($QUERY, ...)
              - pattern: lxml.etree.XPathElementEvaluator(...)($QUERY, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $EVALUATOR = lxml.etree.XPathEvaluator(...)
                          ...
                      - pattern-inside: |
                          $EVALUATOR = lxml.etree.XPathDocumentEvaluator(...)
                          ...
                      - pattern-inside: |
                          $EVALUATOR = lxml.etree.XPathElementEvaluator(...)
                          ...
                  - pattern: $EVALUATOR($QUERY, ...)
          - focus-metavariable: $QUERY
