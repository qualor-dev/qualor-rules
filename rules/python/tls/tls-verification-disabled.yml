rules:
  - id: python.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate or host name verification is turned off here (requests or httpx
      `verify=False`, an unverified ssl context, `check_hostname = False`, urllib3
      `cert_reqs='CERT_NONE'` or `assert_hostname=False`, or the legacy `ssl.wrap_socket()`,
      which never checks the host name and by default not the certificate either). The client
      then accepts any certificate, or a valid certificate issued for another host, so anyone on
      the network path who holds one can pose as the server and read and change the traffic.
      Keep the default verification; to trust a private CA, pass its bundle
      (`verify='/path/to/ca.pem'`, `ca_certs=...`) or a context from
      `ssl.create_default_context(cafile=...)`, and wrap sockets with that context's
      `wrap_socket(sock, server_hostname=host)`; to reach a server by another name, give the name
      its certificate holds (`server_hostname=`, urllib3 `assert_hostname='name'`).
    metadata:
      title: TLS certificate or host name verification disabled (Python)
      cwe: ['CWE-295']
      owasp: ['A07:2025', 'A07:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [requests, httpx, ssl, urllib3]
      sources:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://cwe.mitre.org/data/definitions/297.html
        - https://top10.owasp.org/2025/A07_2025-Authentication_Failures/
        - https://top10.owasp.org/2021/A07_2021-Identification_and_Authentication_Failures/
        - https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification
        - https://requests.readthedocs.io/en/latest/api/#requests.request
        - https://requests.readthedocs.io/en/latest/api/#requests.Session.send
        - https://requests.readthedocs.io/en/latest/api/#requests.Session.verify
        - https://www.python-httpx.org/advanced/ssl/
        - https://www.python-httpx.org/api/
        - https://docs.python.org/3/library/ssl.html#ssl.SSLContext.check_hostname
        - https://docs.python.org/3/library/ssl.html#ssl.SSLContext.verify_mode
        - https://docs.python.org/3/library/ssl.html#ssl.CERT_NONE
        - https://docs.python.org/3/library/ssl.html#ssl.VerifyMode
        - https://docs.python.org/3/library/ssl.html#ssl.CERT_REQUIRED
        - https://docs.python.org/3/library/ssl.html#ssl.PROTOCOL_TLS_CLIENT
        - https://docs.python.org/3/library/ssl.html#ssl.SSLSocket.getpeercert
        - https://docs.python.org/3.11/library/ssl.html#ssl.match_hostname
        - https://docs.python.org/3/library/ssl.html#ssl.create_default_context
        - https://docs.python.org/3/library/ssl.html#ssl.Purpose.CLIENT_AUTH
        - https://docs.python.org/3/library/ssl.html#ssl.PROTOCOL_TLS_SERVER
        - https://docs.python.org/3/library/ssl.html#verifying-certificates
        - https://docs.python.org/3.11/library/ssl.html#ssl.wrap_socket
        - https://docs.python.org/3.11/library/ssl.html#ssl.CERT_OPTIONAL
        - https://peps.python.org/pep-0476/
        - https://urllib3.readthedocs.io/en/stable/user-guide.html#certificate-verification
        - https://urllib3.readthedocs.io/en/stable/reference/urllib3.poolmanager.html
        - https://urllib3.readthedocs.io/en/stable/reference/urllib3.connectionpool.html
        - https://urllib3.readthedocs.io/en/stable/reference/urllib3.util.html#urllib3.util.resolve_cert_reqs
        - https://urllib3.readthedocs.io/en/stable/reference/urllib3.util.html#urllib3.util.create_urllib3_context
        - https://urllib3.readthedocs.io/en/stable/reference/urllib3.util.html#urllib3.util.ssl_wrap_socket
        - https://docs.pytest.org/en/stable/explanation/goodpractices.html#conventions-for-python-test-discovery
        - https://docs.pytest.org/en/stable/reference/fixtures.html#conftest-py-sharing-fixtures-across-multiple-files
      since: 2026.10.1
    # Test code is out of scope (as for go.tls-verification-disabled, ruling F10): requests
    # documents verify=False as "useful during local development or testing", and test servers
    # use self-signed certificates. Files pytest collects (test_*.py, *_test.py), conftest.py,
    # Django's per-app tests.py, and everything under a tests/ or test/ directory are excluded.
    # Accepted trade-off: test_*.py also hides a non-test module with such a name
    # (test_utils.py); tests_*.py and integration_tests/ are still scanned.
    # The value: the literal False, or a name that can only hold False (a module constant, a
    # local set once); OpenGrep's constant propagation follows those. verify taken from settings,
    # the environment, app config, a parameter, or a variable set differently on two branches is
    # not reported: the deployment decides, and the code lets it keep verification on. A literal
    # False inside a configuration branch (`if insecure: requests.get(url, verify=False)`) is
    # reported: the program carries the off switch itself (as the Go rule does).
    # check_hostname = False with CERT_NONE is reported on the CERT_NONE line, in either order,
    # on the same context in one function, except for server contexts (PROTOCOL_TLS_SERVER,
    # Purpose.CLIENT_AUTH, or a context the code then wraps with server_side=True), where
    # CERT_NONE means "request no client certificate".
    # Host name checking off while the chain is still verified (CWE-297, a child of CWE-295) is
    # reported as this rule's issue, not as a hotspot: the ssl docs say CERT_REQUIRED "is not
    # sufficient to verify a certificate in client mode as it does not match hostnames.
    # check_hostname must be enabled as well to verify the authenticity of a cert", urllib3's
    # docs say "If assert_hostname is False, no verification is done", and
    # java.tls-verification-disabled reports a HostnameVerifier that accepts every host the same
    # way. Reported: `check_hostname = False` on a client context (ssl.create_default_context()
    # for servers' certificates, SSLContext(PROTOCOL_TLS_CLIENT)) made in the same function or
    # __init__, on the line that turns it off, unless the same context is also given CERT_NONE
    # (then the CERT_NONE line is the finding); urllib3 assert_hostname=False unless
    # assert_fingerprint pins the certificate (urllib3 checks it first); ssl.wrap_socket() with
    # cert_reqs CERT_REQUIRED or CERT_OPTIONAL on the client side. Not reported when the
    # function then checks the host name itself (ssl.match_hostname) or reads the server's
    # certificate as DER bytes to compare it with a pinned one (getpeercert(binary_form=True)).
    # Known limits (each has a `todo` line in the test file):
    # - A Session that comes from a factory function, another module or an unannotated
    #   parameter has no type to bind to (`todoruleid:`). Followed: Sessions made
    #   (requests.Session(), requests.session(), requests.sessions.Session()) earlier in the same
    #   function or module (a module-level Session is followed into functions defined after its
    #   assignment), in a with block, annotated parameters, and a self attribute set by __init__.
    #   Not followed: a function defined above the module-level assignment, a Session set on
    #   self in a method other than __init__ (followed only within that method), and a class
    #   attribute annotated `session: requests.Session`.
    # - Options passed as a dict (`requests.get(url, **{"verify": False})`) are not seen.
    # - httpx.HTTPTransport(verify=False): the httpx documentation does not describe the
    #   transports' verify option, so it is not in the rule.
    # - check_hostname = False on a context made by SSLContext() without PROTOCOL_TLS_CLIENT or
    #   by urllib3's create_urllib3_context(), or made in another method or function, is not
    #   reported: whether a client relies on it is not known where it is made.
    # - A function that reads the server's certificate with getpeercert(binary_form=True) counts
    #   as pinning it, whatever it does with the bytes (`todoruleid:`).
    # - check_hostname = False set only when no host name is known (`if not server_hostname:`,
    #   a library helper whose callers decide) is still reported (`todook:`; seen in CPython's
    #   asyncio/sslproto.py).
    # - ssl.wrap_socket()'s cert_reqs is read only as written in the call: a variable holding
    #   CERT_NONE and the number 0 are not seen (`todoruleid:`), and options passed as a dict
    #   (`wrap_socket(sock, **opts)`) are taken for a missing cert_reqs, so reported (`todook:`).
    # - ssl.SSLContext(PROTOCOL_TLS) (or no protocol) verifies nothing by default; whether it
    #   serves a client is not known where it is made, so its use by a client is not reported.
    # - The unverified context looked up with getattr(ssl, "_create_unverified_context").
    # - Other libraries' TLS switches (boto3 verify=False, aiohttp ssl=False, ...).
    # - A function parameter whose default is False (`def f(url, verify=False)`).
    # - A generic context (PROTOCOL_TLS) with check_hostname = False and CERT_NONE that the code
    #   hands to a server API instead of wrapping it (`asyncio.start_server(..., ssl=ctx)`,
    #   `loop.create_server(ssl=ctx)`) is still reported (no test line: recorded from review).
    # - A name reused for two contexts: an insecure client context rebound later in the function
    #   to a context wrapped with server_side=True is no longer reported (no test line).
    paths:
      exclude: ['test_*.py', '*_test.py', 'conftest.py', 'tests.py', 'tests/', 'test/']
    pattern-either:
      # requests and httpx: the module functions, httpx's clients, and an inline Session.
      - patterns:
          - pattern-either:
              - pattern: requests.$FN(...)
              - pattern: requests.Session(...).$FN(...)
              - pattern: requests.session(...).$FN(...)
              - pattern: requests.sessions.Session(...).$FN(...)
              - pattern: httpx.$FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(get|post|put|patch|delete|head|options|request|send|stream|Client|AsyncClient)$
          - pattern: $CALL(..., verify=False, ...)
      # A requests Session (requests.Session, the lowercase requests.session factory, or
      # requests.sessions.Session): assigned earlier, a with block, or a typed parameter; its
      # request methods with verify=False, or its `verify` attribute set to False.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $S = requests.Session(...)
                  ...
              - pattern-inside: |
                  $S = requests.session(...)
                  ...
              - pattern-inside: |
                  $S = requests.sessions.Session(...)
                  ...
              - pattern-inside: |
                  with requests.Session(...) as $S:
                      ...
              - pattern-inside: |
                  with requests.session(...) as $S:
                      ...
              - pattern-inside: |
                  with requests.sessions.Session(...) as $S:
                      ...
              - pattern-inside: |
                  def $F(..., $S: requests.Session, ...):
                      ...
          - pattern-either:
              - patterns:
                  - pattern: $S.$M(..., verify=False, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|patch|delete|head|options|request|send)$
              - pattern: $S.verify = False
      # A Session kept in an attribute of self by __init__, used in the other methods.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(...):
                      ...
                      def __init__(self, ...):
                          ...
                          self.$A = requests.Session(...)
                      ...
              - pattern-inside: |
                  class $C(...):
                      ...
                      def __init__(self, ...):
                          ...
                          self.$A = requests.session(...)
                      ...
              - pattern-inside: |
                  class $C(...):
                      ...
                      def __init__(self, ...):
                          ...
                          self.$A = requests.sessions.Session(...)
                      ...
          - pattern-either:
              - patterns:
                  - pattern: self.$A.$M(..., verify=False, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|patch|delete|head|options|request|send)$
              - pattern: self.$A.verify = False
      # ssl: the unverified context (PEP 476) and its old name.
      - pattern: ssl._create_unverified_context
      - pattern: ssl._create_stdlib_context
      # ssl.wrap_socket() (deprecated since Python 3.7): its cert_reqs defaults to CERT_NONE, so
      # the client socket it makes accepts any certificate unless cert_reqs (keyword, or the
      # fifth argument) asks for one. A socket wrapped with a server_side argument other than
      # False is left alone: CERT_NONE on a server only means "no client certificate".
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: ssl.wrap_socket(...)
                  - pattern-not: ssl.wrap_socket(..., cert_reqs=$REQS, ...)
                  - pattern-not: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, $REQS, ...)
              - pattern: ssl.wrap_socket(..., cert_reqs=ssl.CERT_NONE, ...)
              - pattern: ssl.wrap_socket(..., cert_reqs=ssl.VerifyMode.CERT_NONE, ...)
              - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.CERT_NONE, ...)
              - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.VerifyMode.CERT_NONE, ...)
              # CERT_REQUIRED or CERT_OPTIONAL: the chain is checked, the host name never is,
              # unless the function matches it itself afterwards.
              - patterns:
                  - pattern-either:
                      - pattern: ssl.wrap_socket(..., cert_reqs=ssl.CERT_REQUIRED, ...)
                      - pattern: ssl.wrap_socket(..., cert_reqs=ssl.CERT_OPTIONAL, ...)
                      - pattern: ssl.wrap_socket(..., cert_reqs=ssl.VerifyMode.CERT_REQUIRED, ...)
                      - pattern: ssl.wrap_socket(..., cert_reqs=ssl.VerifyMode.CERT_OPTIONAL, ...)
                      - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.CERT_REQUIRED, ...)
                      - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.CERT_OPTIONAL, ...)
                      - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.VerifyMode.CERT_REQUIRED, ...)
                      - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SERVER, ssl.VerifyMode.CERT_OPTIONAL, ...)
                  - pattern-not-inside: |
                      $TLS = ssl.wrap_socket(...)
                      ...
                      ssl.match_hostname(...)
          - pattern-either:
              - patterns:
                  - pattern: ssl.wrap_socket(...)
                  - pattern-not: ssl.wrap_socket(..., server_side=$SIDE, ...)
                  - pattern-not: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, $SIDE, ...)
              - pattern: ssl.wrap_socket(..., server_side=False, ...)
              - pattern: ssl.wrap_socket($SOCK, $KEYFILE, $CERTFILE, False, ...)
      # ssl: hostname checking off and CERT_NONE on the same context (either order), unless the
      # context is made for a server, where CERT_NONE only means "no client certificate".
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CTX.check_hostname = False
                  ...
              - pattern-inside: |
                  $CTX.verify_mode = $ANY
                  ...
                  $CTX.check_hostname = False
          - pattern-either:
              - pattern: $CTX.verify_mode = ssl.CERT_NONE
              - pattern: $CTX.verify_mode = ssl.VerifyMode.CERT_NONE
          - pattern-not-inside: |
              $CTX = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              ...
          - pattern-not-inside: |
              $CTX = ssl.SSLContext(protocol=ssl.PROTOCOL_TLS_SERVER)
              ...
          - pattern-not-inside: |
              $CTX = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH, ...)
              ...
          - pattern-not-inside: |
              $CTX = ssl.create_default_context(..., purpose=ssl.Purpose.CLIENT_AUTH, ...)
              ...
          # A context the code then uses on the server side of a connection.
          - pattern-not-inside: |
              $CTX.verify_mode = $ANY
              ...
              $CTX.wrap_socket(..., server_side=True, ...)
          - pattern-not-inside: |
              $CTX.verify_mode = $ANY
              ...
              with $CTX.wrap_socket(..., server_side=True, ...) as $TLS:
                  ...
          - pattern-not-inside: |
              $CTX.verify_mode = $ANY
              ...
              $CTX.wrap_bio(..., server_side=True, ...)
      # ssl: hostname checking off on a client context (made for servers' certificates, or with
      # PROTOCOL_TLS_CLIENT) that keeps the chain check; a context also given CERT_NONE is
      # reported by the branch above, on its CERT_NONE line.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CTX = ssl.create_default_context(...)
                  ...
              - pattern-inside: |
                  $CTX = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT, ...)
                  ...
              - pattern-inside: |
                  $CTX = ssl.SSLContext(..., protocol=ssl.PROTOCOL_TLS_CLIENT, ...)
                  ...
          - pattern: $CTX.check_hostname = False
          - pattern-not-inside: |
              $CTX = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH, ...)
              ...
          - pattern-not-inside: |
              $CTX = ssl.create_default_context(..., purpose=ssl.Purpose.CLIENT_AUTH, ...)
              ...
          - pattern-not-inside: |
              $CTX.check_hostname = False
              ...
              $CTX.verify_mode = ssl.CERT_NONE
          - pattern-not-inside: |
              $CTX.check_hostname = False
              ...
              $CTX.verify_mode = ssl.VerifyMode.CERT_NONE
          # The function matches the host name itself, or compares the certificate with a
          # pinned one.
          - pattern-not-inside: |
              $CTX.check_hostname = False
              ...
              ssl.match_hostname(...)
          - pattern-not-inside: |
              $CTX.check_hostname = False
              ...
              $PEER.getpeercert(binary_form=True)
          - pattern-not-inside: |
              $CTX.check_hostname = False
              ...
              $PEER.getpeercert(True)
      # urllib3: assert_hostname=False turns the host name check off, unless assert_fingerprint
      # pins the certificate (urllib3 uses it before assert_hostname).
      - patterns:
          - pattern-either:
              - pattern: urllib3.PoolManager(..., assert_hostname=False, ...)
              - pattern: urllib3.poolmanager.PoolManager(..., assert_hostname=False, ...)
              - pattern: urllib3.ProxyManager(..., assert_hostname=False, ...)
              - pattern: urllib3.poolmanager.ProxyManager(..., assert_hostname=False, ...)
              - pattern: urllib3.HTTPSConnectionPool(..., assert_hostname=False, ...)
              - pattern: urllib3.connectionpool.HTTPSConnectionPool(..., assert_hostname=False, ...)
              - pattern: urllib3.connection_from_url(..., assert_hostname=False, ...)
              - pattern: urllib3.connectionpool.connection_from_url(..., assert_hostname=False, ...)
          - pattern-not: $CALL(..., assert_fingerprint=$FP, ...)
      # urllib3: cert_reqs CERT_NONE, by name, abbreviation or ssl constant.
      - patterns:
          - pattern-either:
              - pattern: urllib3.PoolManager(...)
              - pattern: urllib3.poolmanager.PoolManager(...)
              - pattern: urllib3.ProxyManager(...)
              - pattern: urllib3.poolmanager.ProxyManager(...)
              - pattern: urllib3.HTTPSConnectionPool(...)
              - pattern: urllib3.connectionpool.HTTPSConnectionPool(...)
              - pattern: urllib3.connection_from_url(...)
              - pattern: urllib3.connectionpool.connection_from_url(...)
              - pattern: urllib3.util.create_urllib3_context(...)
              - pattern: urllib3.util.ssl_.create_urllib3_context(...)
              - pattern: urllib3.util.ssl_wrap_socket(...)
              - pattern: urllib3.util.ssl_.ssl_wrap_socket(...)
          - pattern-either:
              - pattern: $CALL(..., cert_reqs="CERT_NONE", ...)
              - pattern: $CALL(..., cert_reqs="NONE", ...)
              - pattern: $CALL(..., cert_reqs=ssl.CERT_NONE, ...)
              - pattern: $CALL(..., cert_reqs=ssl.VerifyMode.CERT_NONE, ...)
