rules:
  - id: python.path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches a file-system path that the server opens, writes,
      deletes, lists or sends. Keep only the file name (`werkzeug.utils.secure_filename()`,
      `os.path.basename()`), join it to a fixed directory with `werkzeug.security.safe_join()` or
      Flask's `send_from_directory()`, or pick the file from an allow-list.
    metadata:
      title: File path built from HTTP request data (Python)
      cwe: ['CWE-22']
      owasp: ['A01:2025', 'A01:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [flask, django, fastapi, starlette, werkzeug, pathlib]
      sources:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://top10.owasp.org/2025/A01_2025-Broken_Access_Control
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://docs.python.org/3/library/functions.html#open
        - https://docs.python.org/3/library/os.html#files-and-directories
        - https://docs.python.org/3/library/os.path.html#os.path.basename
        - https://docs.python.org/3/library/shutil.html
        - https://docs.python.org/3/library/pathlib.html
        - https://docs.python.org/3/library/shelve.html
        - https://docs.python.org/3/library/dbm.html
        - https://docs.python.org/3/library/uuid.html
        - https://peps.python.org/pep-0008/#constants
        - https://docs.djangoproject.com/en/stable/ref/settings/
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://flask.palletsprojects.com/en/stable/patterns/fileuploads/
        - https://flask.palletsprojects.com/en/stable/api/#flask.send_file
        - https://flask.palletsprojects.com/en/stable/api/#flask.send_from_directory
        - https://github.com/pallets/flask/blob/main/src/flask/helpers.py
        - https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.utils.secure_filename
        - https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.security.safe_join
        - https://werkzeug.palletsprojects.com/en/stable/datastructures/#werkzeug.datastructures.FileStorage
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/ref/request-response/#fileresponse-objects
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
        - https://fastapi.tiangolo.com/advanced/custom-response/#fileresponse
        - https://starlette.dev/responses/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A pathlib.Path is followed only when the receiver of the file method is built in the
    #   function (`Path(...)`, `base / name`, `base.joinpath(name)`), in place or in a variable
    #   assigned from such an expression: a Path returned whole by a helper is not. A
    #   zipfile.Path built in place is left out (it reads an archive member); one kept in a
    #   variable is taken for a file-system Path.
    # - A check of the resolved path against the base directory (`resolve()` and
    #   `is_relative_to()`, or `realpath()` and `startswith()`) is not recognised.
    # - OpenGrep does not carry taint through a slice, so a slice of request data is a source
    #   itself: of a request access chain (`request.args["f"][:100]`), of a variable assigned one in
    #   the function, or of a view parameter. A slice of a value built from request data
    #   (`(request.args["q"] + "x")[:50]`), or of a variable assigned again in the function after
    #   the request value (`q = q.strip()`, also with more request data: `q = q +
    #   request.args["b"]`, `if not q: q = request.form["q"]`), is missed. Django request
    #   chains count in a view (first parameter `request`) and `self.request`/`self.kwargs` in a
    #   class.
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items, and
    #   strings with r/b/u prefixes) assigned to an upper-case (constant) name that the module never
    #   changes or assigns again, with no default or a literal/constant default for get() (an
    #   upper-case name assigned in the function is not a constant); or as a ternary of constants. A
    #   membership check (`if x not in ALLOWED: return`) is not.
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Django-module function named get, post, put, patch, delete, head, options, trace or
    #   dispatch that takes `(self, request, ...)` is taken for a class-based view's handler also
    #   outside a class: its parameters after request count as URL arguments.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      # (Each route decorator, and each Django handler method name below, is written out: a
      # metavariable-regex on the name, like every condition of a source item, multiplies the
      # formula OpenGrep builds its prefilter from, and past a size it gives up and matches
      # every file. So the shared block binds each source shape with as few conditions as it
      # can, and the Django shapes share one `import django` item.)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.get(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.post(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.put(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.patch(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.delete(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Slices: OpenGrep does not carry taint through a slice (`request.args["q"][:50]`), so a
      # slice of request data is a source itself: of a request access chain (Flask's request;
      # in a Django view, its request or json.loads(request.body), and in a class, self.request,
      # self.args, self.kwargs; with their subscripts, attributes and method calls), in place
      # ($INIT[...]) or through a variable assigned one in the function and not assigned again
      # (`q = escape(q)`), or of a view parameter (and its attributes). The chain is checked by
      # its text ($INIT) and, for Flask, by flask.request resolution.
      - patterns:
          - pattern-either: &chain-slices
              - pattern: $INIT[$LOWER:]
              - pattern: $INIT[:$UPPER]
              - pattern: $INIT[$LOWER:$UPPER]
              - pattern: $INIT[::$STEP]
              - pattern: $INIT[$LOWER::$STEP]
              - pattern: $INIT[:$UPPER:$STEP]
              - pattern: $INIT[$LOWER:$UPPER:$STEP]
              - pattern: $INIT[:]
              - patterns:
                  - pattern-inside: |
                      $VALUE = $INIT
                      ...
                  - pattern-not-inside: |
                      $VALUE = $INIT
                      ...
                      $VALUE = $OTHER
                      ...
                  - pattern-either:
                      - pattern: $VALUE[$LOWER:]
                      - pattern: $VALUE[:$UPPER]
                      - pattern: $VALUE[$LOWER:$UPPER]
                      - pattern: $VALUE[::$STEP]
                      - pattern: $VALUE[$LOWER::$STEP]
                      - pattern: $VALUE[:$UPPER:$STEP]
                      - pattern: $VALUE[$LOWER:$UPPER:$STEP]
                      - pattern: $VALUE[:]
                      - pattern: $VALUE[$KEY][$LOWER:]
                      - pattern: $VALUE[$KEY][:$UPPER]
                      - pattern: $VALUE[$KEY][$LOWER:$UPPER]
                      - pattern: $VALUE.$METHOD(...)[$LOWER:]
                      - pattern: $VALUE.$METHOD(...)[:$UPPER]
                      - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
                      - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
                      - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
                      - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: ^((flask\.)?request\.(args|form|values|headers|cookies|json|data|files|view_args|path|full_path|url|query_string|get_json\([^()]*\)|get_data\([^()]*\))|json\.loads\((flask\.)?request\.(data|get_data\([^()]*\))\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
          - metavariable-pattern:
              metavariable: $INIT
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      # A view parameter: of a route-decorated view (Flask, FastAPI; not a dependency).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.get(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.post(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.put(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.patch(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.delete(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:]
              - pattern: $PARAM.$FIELD[:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:$UPPER]
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view, with
      # their slices. Only an import at the module's top level counts; one nested in
      # `if TYPE_CHECKING:` or `try:` does not (no test line: a fixture is one module, and it
      # imports Django at the top level).
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request (the parameter itself, not a lambda, loop or
              # comprehension variable of that name). Slices of its chains count in a function
              # whose first parameter (after self) is named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, request, ...):
                            ...
                  - pattern-either: *chain-slices
                  - metavariable-regex:
                      metavariable: $INIT
                      regex: ^(request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|json\.loads\(request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
                      - patterns:
                          - pattern-either: *chain-slices
                          - metavariable-regex:
                              metavariable: $INIT
                              regex: ^(self\.request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|self\.(args|kwargs)|json\.loads\(self\.request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...): a
              # function get(self, request, ...), post(...), ... (inside a class or not: a class
              # condition, or the method written inside its class, would be one more condition
              # to multiply, or would miss a method defined under an `if`).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., **$PARAM):
                            ...
                  - focus-metavariable: $PARAM
              # ... and their slices.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., $PARAM, ...):
                            ...
                  - pattern-either:
                      - pattern: $PARAM[$LOWER:]
                      - pattern: $PARAM[:$UPPER]
                      - pattern: $PARAM[$LOWER:$UPPER]
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      # An allow-list: a lookup in a dict literal whose keys are literals and whose values are
      # literals or lists/tuples of literals (strings with r/b/u prefixes and backslash escapes,
      # numbers, True/False/None; comments allowed between the items), assigned to an upper-case
      # (constant) name that the module never changes (item assignment, update(), setdefault(),
      # |=) or assigns again. A get() default must be a literal, a list/tuple of literals or a
      # module constant.
      - patterns:
          - pattern-inside: |
              $ALLOWED = $LITERAL
              ...
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $LITERAL
              regex: ^\{(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*)?\}$
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED[$KEY] = $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED.update(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED.setdefault(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED |= $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = $LITERAL
              ...
              $ALLOWED = $OTHER
              ...
          - pattern-either:
              - pattern: $ALLOWED.get($LOOKUP)
              - pattern: $ALLOWED[$LOOKUP]
              - patterns:
                  - pattern: $ALLOWED.get($LOOKUP, $DEFAULT)
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\)|[A-Z][A-Z0-9_]*(\[("[^"\\\n]*"|'[^'\\\n]*')\])?)$
                  # An upper-case name assigned in the function is a local, not a constant.
                  - pattern-not-inside: |
                      def $FUNCTION(...):
                        ...
                        $DEFAULT = $ANY
                        ...
      # Only the final component, or a name reduced to safe characters, or a path that
      # safe_join() kept inside the base directory (it returns None otherwise).
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: werkzeug.security.safe_join(...)
      - pattern: pathlib.Path(...).name
      - pattern: pathlib.PurePath(...).name
      # A UUID has a fixed form; in-memory file objects are not paths.
      - pattern: uuid.UUID(...)
      - pattern: io.BytesIO(...)
      - pattern: io.StringIO(...)
    pattern-sinks:
      # open() and the os and shutil functions that read, write, delete, move or list by path.
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: os.open($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: os.remove($PATH, ...)
              - pattern: os.unlink($PATH, ...)
              - pattern: os.rmdir($PATH, ...)
              - pattern: os.removedirs($PATH, ...)
              - pattern: os.rename($PATH, ...)
              - pattern: os.renames($PATH, ...)
              - pattern: os.replace($PATH, ...)
              - pattern: os.listdir($PATH, ...)
              - pattern: os.scandir($PATH, ...)
              - pattern: os.walk($PATH, ...)
              - pattern: os.mkdir($PATH, ...)
              - pattern: os.makedirs($PATH, ...)
              - pattern: os.chmod($PATH, ...)
              - pattern: os.chown($PATH, ...)
              - pattern: os.truncate($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: os.rename($SRC, $PATH, ...)
              - pattern: os.renames($SRC, $PATH, ...)
              - pattern: os.replace($SRC, $PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: shutil.copy($PATH, ...)
              - pattern: shutil.copy2($PATH, ...)
              - pattern: shutil.copyfile($PATH, ...)
              - pattern: shutil.copytree($PATH, ...)
              - pattern: shutil.move($PATH, ...)
              - pattern: shutil.rmtree($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: shutil.copy($SRC, $PATH, ...)
              - pattern: shutil.copy2($SRC, $PATH, ...)
              - pattern: shutil.copyfile($SRC, $PATH, ...)
              - pattern: shutil.copytree($SRC, $PATH, ...)
              - pattern: shutil.move($SRC, $PATH, ...)
          - focus-metavariable: $PATH
      # shelve and dbm open a database file by name (and create it with the "c" flag); the
      # name is the base name of one or more files.
      - patterns:
          - pattern-either:
              - pattern: shelve.open($PATH, ...)
              - pattern: shelve.open(..., filename=$PATH, ...)
              - pattern: shelve.DbfilenameShelf($PATH, ...)
              - pattern: shelve.DbfilenameShelf(..., filename=$PATH, ...)
              - pattern: dbm.open($PATH, ...)
              - pattern: dbm.open(..., file=$PATH, ...)
              - pattern: dbm.$MODULE.open($PATH, ...)
              - pattern: dbm.dumb.open(..., filename=$PATH, ...)
          - focus-metavariable: $PATH
      # pathlib: a file method on a Path built in the function (Path(...), a `/` join or
      # joinpath()), in place or through a variable assigned from such an expression.
      - patterns:
          - pattern: $P.$FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(read_text|read_bytes|write_text|write_bytes|open|unlink|rmdir|touch|mkdir|iterdir|glob|rglob|symlink_to|hardlink_to)$
          - metavariable-pattern:
              metavariable: $P
              patterns:
                - pattern-either:
                    - pattern: pathlib.Path(...)
                    - pattern: pathlib.PurePath(...)
                    # str has no `/` operator: a division whose result has these methods is a
                    # Path (a module constant, a Django setting such as BASE_DIR).
                    - pattern: $LEFT / $RIGHT
                    - pattern: $BASE.joinpath(...)
          # zipfile.Path reads an archive member, not the file system.
          - metavariable-regex:
              metavariable: $P
              regex: ^(?!\(*\s*zipfile\.Path\()
          - focus-metavariable: $P
      - patterns:
          - pattern-inside: |
              $P = $INIT
              ...
          - metavariable-pattern:
              metavariable: $INIT
              patterns:
                - pattern-either:
                    - pattern: pathlib.Path(...)
                    - pattern: pathlib.PurePath(...)
                    # str has no `/` operator: a division whose result has these methods is a
                    # Path (a module constant, a Django setting such as BASE_DIR).
                    - pattern: $LEFT / $RIGHT
                    - pattern: $BASE.joinpath(...)
          - pattern: $P.$FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(read_text|read_bytes|write_text|write_bytes|open|unlink|rmdir|touch|mkdir|iterdir|glob|rglob|symlink_to|hardlink_to)$
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(?!\(*\s*zipfile\.Path\()
          - focus-metavariable: $P
      # Flask send_file() takes a trusted path; send_from_directory() keeps the file name inside
      # its directory, which itself must not come from the client.
      - patterns:
          - pattern-either:
              - pattern: flask.send_file($PATH, ...)
              - pattern: flask.send_from_directory($PATH, ...)
              - pattern: flask.send_from_directory(directory=$PATH, ...)
          - focus-metavariable: $PATH
      # Werkzeug FileStorage.save(dst) on an upload from Flask's request.files.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = flask.request.files[...]
                  ...
              - pattern-inside: |
                  $F = flask.request.files.get(...)
                  ...
          - pattern: $F.save($PATH, ...)
          - focus-metavariable: $PATH
      # FastAPI / Starlette FileResponse(path).
      - patterns:
          - pattern-either:
              - pattern: starlette.responses.FileResponse($PATH, ...)
              - pattern: starlette.responses.FileResponse(..., path=$PATH, ...)
              - pattern: fastapi.responses.FileResponse($PATH, ...)
              - pattern: fastapi.responses.FileResponse(..., path=$PATH, ...)
          - focus-metavariable: $PATH
