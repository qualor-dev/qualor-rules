                  - pattern: f"{django.conf.settings.$SETTING}..."
                  - pattern: $FSTRING
                  - metavariable-regex:
                      metavariable: $FSTRING
                      regex: ^[fF]("|')\{settings\.[A-Za-z_][A-Za-z0-9_]*\}/
              - patterns:
                  - pattern: $FORMAT.format(django.conf.settings.$SETTING, ...)
                  - metavariable-regex:
                      metavariable: $FORMAT
                      regex: ^[rbuRBU]{0,2}("|')\{0?\}/
    pattern-sinks:
      # Flask and Werkzeug redirect(location).
      - patterns:
          - pattern-either:
              - pattern: flask.redirect($URL, ...)
              - pattern: flask.redirect(..., location=$URL, ...)
              - pattern: werkzeug.utils.redirect($URL, ...)
              - pattern: werkzeug.utils.redirect(..., location=$URL, ...)
          - focus-metavariable: $URL
      # Django: redirect(to) (a URL, a view name or a model) and the redirect responses.
      - patterns:
          - pattern-either:
              - pattern: django.shortcuts.redirect($URL, ...)
              - pattern: django.http.HttpResponseRedirect($URL, ...)
              - pattern: django.http.HttpResponseRedirect(..., redirect_to=$URL, ...)
              - pattern: django.http.HttpResponsePermanentRedirect($URL, ...)
              - pattern: django.http.HttpResponsePermanentRedirect(..., redirect_to=$URL, ...)
          - focus-metavariable: $URL
      # FastAPI and Starlette: RedirectResponse(url), and the return value of a path operation
      # declared with response_class=RedirectResponse.
      - patterns:
          - pattern-either:
              - pattern: fastapi.responses.RedirectResponse($URL, ...)
              - pattern: fastapi.responses.RedirectResponse(..., url=$URL, ...)
              - pattern: starlette.responses.RedirectResponse($URL, ...)
              - pattern: starlette.responses.RedirectResponse(..., url=$URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(..., response_class=fastapi.responses.RedirectResponse, ...)
                  def $VIEW(...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(..., response_class=starlette.responses.RedirectResponse, ...)
                  def $VIEW(...):
                    ...
          - pattern: return $URL
          - focus-metavariable: $URL
