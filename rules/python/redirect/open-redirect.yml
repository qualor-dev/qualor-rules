              - pattern: |
                  django.http.HttpResponseRedirect(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  django.http.HttpResponsePermanentRedirect(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  django.http.JsonResponse(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  flask.Response(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  werkzeug.wrappers.Response(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  flask.make_response(..., {..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  starlette.responses.$CLASS(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  fastapi.responses.$CLASS(..., headers={..., $HEADER: $URL, ...}, ...)
              - pattern: |
                  fastapi.Response(..., headers={..., $HEADER: $URL, ...}, ...)
              - patterns:
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $VIEW(...):
                        ...
                  - pattern-either:
                      - pattern: |
                          return $BODY, $STATUS, {..., $HEADER: $URL, ...}
                      - pattern: |
                          return $BODY, {..., $HEADER: $URL, ...}
          - metavariable-regex:
              metavariable: $HEADER
              regex: ^[rbuRBU]{0,2}("|')(?i:location)("|')$
          # The header name as a word of the file: this item's patterns have no other word that
          # OpenGrep's prefilter can use (string literals give none), and without one the rule
          # has no prefilter and matches every file.
          - pattern-regex: (?si)\A.*\blocation\b.*\z
          - focus-metavariable: $URL
      # Django's RedirectView: the URL its get_redirect_url() returns.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $CLS(..., django.views.generic.RedirectView, ...):
                    ...
              - pattern-inside: |
                  class $CLS(..., django.views.generic.base.RedirectView, ...):
                    ...
          - pattern-inside: |
              def get_redirect_url(self, ...):
                ...
          - pattern: return $URL
          - focus-metavariable: $URL
