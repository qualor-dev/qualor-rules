              metavariable: $FSTRING
              regex: ^[fF]("|')[A-Za-z][A-Za-z0-9+.-]*://([^/"'{}%\s\\]|\{(self\.)?request\.(get_host\(\)|host)\})+\{((flask\.)?request\.(path|full_path)|(self\.)?request\.(path|path_info|get_full_path\([^()]*\)|get_full_path_info\([^()]*\))|\w+\.url\.path|\w+\[("|')path("|')\])(?!\w)
      - patterns:
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
          - pattern-either:
              - pattern: $ORIGIN + $CURRENT
              - pattern: $ORIGIN + $CURRENT + $A
              - pattern: $ORIGIN + $CURRENT + $A + $B
              - pattern: $ORIGIN + $CURRENT + $A + $B + $C
          - metavariable-regex:
              metavariable: $CURRENT
              regex: *current-path
      # Starlette's URL.replace() with keywords that keep the host
      # (`request.url.replace(path=...)`, `replace(scheme="https")`).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(..., $REQ: fastapi.Request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(..., $REQ: starlette.requests.Request, ...):
                    ...
              - pattern-inside: |
                  class $MW(..., starlette.middleware.base.BaseHTTPMiddleware, ...):
                    ...
                    def dispatch(self, $REQ, $CALL_NEXT):
                      ...
              - pattern-inside: |
                  @$APP.middleware("http")
                  def $VIEW($REQ, $CALL_NEXT):
                    ...
          - pattern: $REQ.url.replace(...)
          - pattern-not: $REQ.url.replace($ARG, ...)
          - pattern-not: $REQ.url.replace(..., netloc=$VALUE, ...)
          - pattern-not: $REQ.url.replace(..., hostname=$VALUE, ...)
          - pattern-not: $REQ.url.replace(..., username=$VALUE, ...)
          - pattern-not: $REQ.url.replace(..., password=$VALUE, ...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(..., $REQ: fastapi.Request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(..., $REQ: starlette.requests.Request, ...):
                    ...
          - pattern-either:
              - pattern: $REQ.url
              - pattern: $REQ.base_url
              # The base URL ends with "/": text after it stays on this site.
              - pattern: str($REQ.base_url) + $A
              - pattern: str($REQ.base_url) + $A + $B
              - pattern: str($REQ.base_url) + $A + $B + $C
              - pattern: f"{$REQ.base_url}..."
      # A Django model looked up through its manager or get_object_or_404(): redirect() sends
      # the browser to its get_absolute_url().
      - pattern: $MODEL.objects.$QUERY(...)
      - pattern: $MODEL.objects.$QUERY(...).$MORE(...)
      - pattern: $MODEL.objects.$QUERY(...).$MORE(...).$LAST(...)
      - pattern: django.shortcuts.get_object_or_404(...)
      - pattern: django.shortcuts.get_list_or_404(...)
      # An attribute of an object that a call returned (a database row looked up by a request
      # id, a helper's result), read in place or through a variable assigned (also with :=) in
      # the function: stored or computed data, not the request's own text. Left out: request
      # accessors, the URL parsers of urllib.parse, json.loads(), pydantic validation, and calls
      # that receive request data whole (a form built from `request.POST`, `Model(**body)`).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $OBJ = $INIT
                      ...
                  - pattern: $OBJ.$ATTR
              - patterns:
                  - pattern-inside: |
                      if <... ($OBJ := $INIT) ...>:
                        ...
                      ...
                  - pattern: $OBJ.$ATTR
              - pattern: $INIT.$ATTR
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(?!(self\.)?request\b|([\w.]*\.)?(urlparse|urlsplit|urldefrag)\(|json\.loads\(|[\w.]*\.(model_validate|model_validate_json|parse_obj|parse_raw)\(|[\w.]*\.(FILES|POST|GET|COOKIES|META|args|form|files|values|headers|cookies|query_params)\.)[A-Za-z_][\w.]*\((?!(?s:.*)(\b\w+\.(POST|GET|FILES|form|args|values|json|data|query_params)\b(?!\s*[\[.(])|get_json\(|\*\*))
          - pattern-not-inside: $X.$ATTR(...)
      # A URL whose text starts with a fixed origin keeps request data out of the scheme and host
      # (the same check as python.ssrf, with a backslash also refused after a leading "/"):
      # - a literal scheme, host and "/" (or a literal path on this site: "/" and a character
      #   other than "/", "\", a quote, "{" or "%"), in concatenation, %-formatting,
      #   str.format() and f-strings; the host part holds no placeholder (%, {});
      # - a module constant (an upper-case name that the module assigns a literal
      #   "scheme://host..." once and the function does not assign; matched as the name itself)
      #   followed by a literal that starts with "/" (not "//" or "/\"), "?" or "#", then a
      #   concatenation chain of up to seven operands, an f-string or str.format(); a constant
      #   that itself ends with "host/", then up to five operands or an f-string;
      # - a Django setting followed by a literal that starts with "/".
      - patterns:
          - pattern-either:
              - pattern: $LEFT + $RIGHT
              - pattern: $LEFT % $RIGHT
              - pattern: $LEFT.format(...)
          - metavariable-regex:
              metavariable: $LEFT
              regex: ^[rbuRBU]{0,2}("|')([A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+/|/[^/\\"'{%\s])
      - patterns:
          - pattern: $FSTRING
          - metavariable-regex:
              metavariable: $FSTRING
              regex: ^([fF][rR]?|[rR][fF])("|')([A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+/|/[^/\\"'{%\s])
      - patterns:
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - pattern-either:
              - pattern: $ORIGIN + $SEP
              - pattern: $ORIGIN + $SEP + $A
              - pattern: $ORIGIN + $SEP + $A + $B
              - pattern: $ORIGIN + $SEP + $A + $B + $C
              - pattern: $ORIGIN + $SEP + $A + $B + $C + $D
              - pattern: $ORIGIN + $SEP + $A + $B + $C + $D + $E
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $SEP
              regex: ^[rbuRBU]{0,2}("|')(/(?![/\\])|[?#])
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
      - patterns:
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - pattern: f"{$ORIGIN}..."
          - pattern: $FSTRING
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $FSTRING
              regex: ^[fF]("|')\{[A-Z][A-Z0-9_]*\}(/(?![/\\])|[?#])
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
      - patterns:
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - pattern: $FORMAT.format($ORIGIN, ...)
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $FORMAT
              regex: ^[rbuRBU]{0,2}("|')\{0?\}(/(?![/\\])|[?#])
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
      - patterns:
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Z][A-Z0-9_]*$
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+/
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-either:
              - pattern: $ORIGIN + $RIGHT
              - pattern: $ORIGIN + $A + $B
              - pattern: $ORIGIN + $A + $B + $C
              - pattern: $ORIGIN + $A + $B + $C + $D
              - pattern: f"{$ORIGIN}..."
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $LEFT + $RIGHT
                  - metavariable-regex:
                      metavariable: $LEFT
                      regex: ^settings\.[A-Za-z_][A-Za-z0-9_]*\s*\+\s*[rbuRBU]{0,2}("|')/
                  - metavariable-pattern:
                      metavariable: $LEFT
