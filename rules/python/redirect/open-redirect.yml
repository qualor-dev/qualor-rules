rules:
  - id: python.open-redirect
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Data from the HTTP request decides where the response redirects the browser, so a link to
      this site can send users on to any other site (phishing, token theft). Redirect to a path
      built with `url_for()` / `reverse()`, keep the scheme and host fixed (`"/items/" + id`,
      `SITE + "/items/" + id`), or pick the target from an allow-list.
    metadata:
      title: Redirect to a URL from HTTP request data (Python)
      cwe: ['CWE-601']
      owasp: ['A01:2025', 'A01:2021']
      kind: issue
      severity: medium
      confidence: high
      frameworks: [flask, werkzeug, django, django-hosts, fastapi, starlette]
      sources:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A01_2025-Broken_Access_Control
        - https://top10.owasp.org/2021/A01_2021-Broken_Access_Control
        - https://flask.palletsprojects.com/en/stable/quickstart/#redirects-and-errors
        - https://flask.palletsprojects.com/en/stable/api/#flask.redirect
        - https://flask.palletsprojects.com/en/stable/api/#flask.url_for
        - https://werkzeug.palletsprojects.com/en/stable/utils/#werkzeug.utils.redirect
        - https://docs.djangoproject.com/en/stable/topics/http/shortcuts/#redirect
        - https://docs.djangoproject.com/en/stable/ref/request-response/#httpresponseredirect
        - https://docs.djangoproject.com/en/stable/ref/urlresolvers/#reverse
        - https://docs.djangoproject.com/en/stable/topics/db/queries/
        - https://django-hosts.readthedocs.io/en/latest/reference.html
        - https://docs.djangoproject.com/en/stable/releases/3.0/
        - https://docs.djangoproject.com/en/stable/topics/settings/
        - https://fastapi.tiangolo.com/advanced/custom-response/#redirectresponse
        - https://starlette.dev/responses/
        - https://starlette.dev/requests/
        - https://docs.python.org/3/library/urllib.parse.html
        - https://docs.pydantic.dev/latest/concepts/models/
        - https://peps.python.org/pep-0008/#constants
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
        - https://docs.djangoproject.com/en/stable/topics/http/middleware/
        - https://docs.djangoproject.com/en/stable/releases/2.0.8/
        - https://flask.palletsprojects.com/en/stable/api/#flask.Flask.before_request
        - https://werkzeug.palletsprojects.com/en/stable/wrappers/
        - https://starlette.dev/middleware/
        - https://fastapi.tiangolo.com/tutorial/middleware/
        - https://asgi.readthedocs.io/en/latest/specs/www.html
        - https://url.spec.whatwg.org/
        - https://docs.python.org/3/library/re.html#re.sub
        - https://docs.djangoproject.com/en/stable/topics/auth/default/#django.contrib.auth.views.LoginView
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A fixed origin is recognised as a literal, an upper-case module constant assigned a
    #   literal URL with a scheme and a host, or a Django setting, at the start of the URL text
    #   (concatenation, format(), f-string); %-formatting with a constant origin (`"%s/items/%s"
    #   % (SITE, id)`) is not, nor a chain of more than five operands after a constant ending in
    #   "host/", nor a constant imported from another module (its value is unknown) (todook).
    # - Middleware sees every path, so there the current path is request data: Django middleware
    #   methods (`__call__`, `process_request`, `process_view`, `process_response`, ...) and
    #   functions inside a `def ...(get_response)` factory, Flask before_request hooks, and
    #   Starlette's request.url.path or an ASGI scope's path. A host before it keeps it on that
    #   host (a literal, `"https://" + request.get_host()`, an f-string, a URL constant); with
    #   %-formatting it is not recognised (todook). `re.sub(r"/+", "/", path)` is taken for
    #   safe, although Werkzeug keeps a backslash ("/\evil.example") in a Flask path
    #   (todoruleid).
    # - A check of the parsed host (`urlparse(x).netloc`) is not recognised. Django's
    #   `url_has_allowed_host_and_scheme()` (`is_safe_url()` before 3.0) is: the checked value in
    #   the branch where it holds, after a failing branch that returns, raises or assigns a fixed
    #   value, and in a ternary; but `allowed_hosts` taken from the request is not checked
    #   (todoruleid), and another library's check of the same name is not trusted.
    # - OpenGrep does not carry taint through a slice, so a slice of request data is a source
    #   itself: of a request access chain (`request.args["next"][:200]`), of a variable assigned one in
    #   the function, or of a view parameter. A slice of a value built from request data
    #   (`(request.args["q"] + "x")[:50]`), or of a variable assigned again in the function after
    #   the request value (`q = q.strip()`, also with more request data: `q = q +
    #   request.args["b"]`, `if not q: q = request.form["q"]`), is missed. Django request
    #   chains count in a view (first parameter `request`) and `self.request`/`self.kwargs` in a
    #   class.
    # - In a view, the current request's own path or URL is taken for a path on this site; a
    #   path that begins with "//" (`https://site//evil.example/`, reaching a Django catch-all
    #   view or a Starlette `request.url.path`), or a Flask path "/\evil.example" reaching a
    #   catch-all rule, names another host (todoruleid). The
    #   current path changed by replace() with a request value as the old text is still taken
    #   for request data (todook).
    # - A value that a Django manager query or get_object_or_404() returns, and an attribute of
    #   an object a call returned, are taken for stored data, unless the call is a request
    #   accessor, a urllib.parse URL parser, json.loads(), pydantic validation, or receives
    #   request data whole (`Form(request.POST)`). A request value that reaches such a call
    #   through a variable, or as a subscripted value in place (`Form(next=request.GET["n"])`), is
    #   not seen (todoruleid).
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items, and
    #   strings with r/b/u prefixes) assigned to an upper-case (constant) name that the module never
    #   changes or assigns again, with no default or a literal/constant default for get() (an
    #   upper-case name assigned in the function is not a constant); or as a ternary of constants. A
    #   membership check (`if x not in ALLOWED: return`) is not, nor is a nested table or a value
    #   written as implicitly concatenated literals (todook).
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - patterns:
                          - pattern-inside: |
                              class $CLS(...):
                                ...
                          - pattern-either:
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., $PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., *$PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., **$PARAM):
                                    ...
                          - metavariable-regex:
                              metavariable: $VIEW
                              regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
                  - focus-metavariable: $PARAM
      # Slices: OpenGrep does not carry taint through a slice (`request.args["q"][:50]`), so a
      # slice of request data is a source itself: of a request access chain (Flask's request; in
      # a Django view, its request or json.loads(request.body), and in a class, self.request,
      # self.args, self.kwargs; with their subscripts, attributes and method calls), in place or
      # through a variable assigned one in the function and not assigned again (`q =
      # escape(q)`), or of a view parameter (and its attributes).
      - patterns:
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &flask-request-chain ^((flask\.)?request\.(args|form|values|headers|cookies|json|data|files|view_args|path|full_path|url|query_string|get_json\([^()]*\)|get_data\([^()]*\))|json\.loads\((flask\.)?request\.(data|get_data\([^()]*\))\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
          - metavariable-pattern:
              metavariable: $VALUE
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *flask-request-chain
          - metavariable-pattern:
              metavariable: $INIT
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-request-chain ^(request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|json\.loads\(request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-self-chain ^(self\.request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|self\.(args|kwargs)|json\.loads\(self\.request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-request-chain
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-self-chain
      # A view parameter: of a route-decorated view (Flask, FastAPI; not a dependency), and the
      # URL arguments of a Django view.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:]
              - pattern: $PARAM.$FIELD[:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:$UPPER]
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
