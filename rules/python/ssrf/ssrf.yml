              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - metavariable-regex:
              metavariable: $PATH
              regex: &relative-literal ^[rbuRBU]{0,2}("|')(/[^/\\"'{%\s]|[?#]|[A-Za-z0-9._~-]+(/|"$|'$))
