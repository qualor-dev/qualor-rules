                ...
                $ORIGIN = $LOCAL
                ...
          - pattern-not-inside: |
              $ORIGIN = $VALUE
              ...
              $ORIGIN = $OTHER
              ...
      - patterns:
          # ... or assigns it a literal that holds a scheme and a host (not "https:" or "/").
          - pattern-inside: |
              $ORIGIN = $VALUE
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^[rbuRBU]{0,2}("|')[A-Za-z][A-Za-z0-9+.-]*://[^/"'?#%{}\s]+
          - pattern-either:
              - pattern: $ORIGIN + $SEP
              - pattern: $ORIGIN + $SEP + $A
              - pattern: $ORIGIN + $SEP + $A + $B
              - pattern: $ORIGIN + $SEP + $A + $B + $C
              - pattern: $ORIGIN + $SEP + $A + $B + $C + $D
              - pattern: $ORIGIN + $SEP + $A + $B + $C + $D + $E
          - metavariable-regex:
