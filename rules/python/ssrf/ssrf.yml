      # A URL whose text starts with a fixed origin keeps request data out of the scheme and host:
      # - a literal scheme, host and "/", in concatenation (also a longer chain), %-formatting,
      #   str.format() and f-strings; the host part holds no placeholder (%, {});
      # - a relative literal, which keeps a client's fixed base_url (or urljoin()'s base): "/"
      #   and a character other than "/", "\", a quote, "{" or "%"; "?" or "#"; or a path
      #   segment and "/" (`"users/" + uid`), in the same forms;
      # - a module constant (an upper-case name assigned a literal "scheme://host..." that the
      #   module never assigns again; matched as the name itself) followed by a literal that
      #   starts with "/", "?" or "#", or a constant that has one of them after its host, then
      #   a concatenation chain of up to seven operands, an f-string or str.format();
      # - a Django setting followed by a literal that starts with "/";
      # - urljoin() of a fixed origin (a literal, a module constant or a Django setting) and a
      #   non-empty relative literal, alone or followed by a concatenation chain.
      - patterns:
          - pattern-either:
