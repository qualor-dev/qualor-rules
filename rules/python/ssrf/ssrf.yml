rules:
  - id: python.ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request decides which server this server sends a request to (the whole
      URL, or its scheme and host). Keep the scheme and host fixed (`"https://api.example.com/" +
      path`), or check the parsed host against an allow-list of servers before sending.
    metadata:
      title: Server-side request to a URL from HTTP request data (Python)
      cwe: ['CWE-918']
      owasp: ['A01:2025', 'A10:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [flask, django, fastapi, requests, httpx, aiohttp, urllib]
      sources:
        - https://cwe.mitre.org/data/definitions/918.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A01_2025-Broken_Access_Control
        - https://top10.owasp.org/2021/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
        - https://requests.readthedocs.io/en/latest/api/
        - https://www.python-httpx.org/api/
        - https://docs.aiohttp.org/en/stable/client_quickstart.html
        - https://docs.aiohttp.org/en/stable/client_reference.html
        - https://docs.djangoproject.com/en/stable/topics/settings/
        - https://peps.python.org/pep-0008/#constants
        - https://docs.python.org/3/library/urllib.request.html
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A requests Session, httpx Client or aiohttp ClientSession is a sink only when it is made
    #   in the function (assigned, in a with block, or called in place): a client from a helper,
    #   a parameter or a module global is not followed.
    # - A fixed origin is recognised at the start of the URL text: a literal URL with a host; a
    #   relative literal; an upper-case name (a module constant that holds a literal with a
    #   scheme and a host, or one imported or read from the environment) that the function does
    #   not assign and the module does not assign again, followed by a literal that starts with "/", "?" or "#" (or a module constant
    #   whose literal value has one after the host); a Django setting followed by "/"; and
    #   urljoin() of a fixed origin and a non-empty relative literal. Concatenation chains are
    #   followed up to seven operands, and format() and f-strings too. A longer chain,
    #   %-formatting with a constant origin (`"%s/users/%s" % (API, uid)`) and a literal scheme
    #   followed by a host constant (`"https://" + HOST + "/users/" + uid`) are not recognised.
    # - A relative URL literal must start with "/" and a character other than "/", "\", a
    #   quote, "{" or "%" (`"/" + x` can become a network-path reference `//host/...`), with
    #   "?" or "#", or with a path segment and "/" (`"users/" + uid`).
    # - A check of the parsed host against an allow-list is not recognised.
    # - OpenGrep does not carry taint through a slice, so a slice of request data is a source
    #   itself: of a request access chain (`request.args["url"][:200]`), of a variable assigned one in
    #   the function, or of a view parameter. A slice of a value built from request data
    #   (`(request.args["q"] + "x")[:50]`), or of a variable assigned again in the function after
    #   the request value (`q = q.strip()`, also with more request data: `q = q +
    #   request.args["b"]`, `if not q: q = request.form["q"]`), is missed. Django request
    #   chains count in a view (first parameter `request`) and `self.request`/`self.kwargs` in a
    #   class.
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items, and
    #   strings with r/b/u prefixes) assigned to an upper-case (constant) name that the module never
    #   changes or assigns again, with no default or a literal/constant default for get() (an
    #   upper-case name assigned in the function is not a constant); or as a ternary of constants. A
    #   membership check (`if x not in ALLOWED: return`) is not.
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view. Only an
      # import at the module's top level counts; one nested in `if TYPE_CHECKING:` or `try:` does
      # not (no test line: a fixture is one module, and it imports Django at the top level).
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - patterns:
                          - pattern-inside: |
                              class $CLS(...):
                                ...
                          - pattern-either:
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., $PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., *$PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., **$PARAM):
                                    ...
                          - metavariable-regex:
                              metavariable: $VIEW
                              regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
                  - focus-metavariable: $PARAM
      # Slices: OpenGrep does not carry taint through a slice (`request.args["q"][:50]`), so a
      # slice of request data is a source itself: of a request access chain (Flask's request; in
      # a Django view, its request or json.loads(request.body), and in a class, self.request,
      # self.args, self.kwargs; with their subscripts, attributes and method calls), in place or
      # through a variable assigned one in the function and not assigned again (`q =
      # escape(q)`), or of a view parameter (and its attributes).
      - patterns:
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &flask-request-chain ^((flask\.)?request\.(args|form|values|headers|cookies|json|data|files|view_args|path|full_path|url|query_string|get_json\([^()]*\)|get_data\([^()]*\))|json\.loads\((flask\.)?request\.(data|get_data\([^()]*\))\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
          - metavariable-pattern:
              metavariable: $VALUE
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *flask-request-chain
          - metavariable-pattern:
              metavariable: $INIT
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-request-chain ^(request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|json\.loads\(request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-self-chain ^(self\.request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|self\.(args|kwargs)|json\.loads\(self\.request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-request-chain
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-self-chain
      # A view parameter: of a route-decorated view (Flask, FastAPI; not a dependency), and the
      # URL arguments of a Django view.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:]
              - pattern: $PARAM.$FIELD[:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:$UPPER]
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ..., $PARAM, ...):
                    ...
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-inside: |
                      def $VIEW(self, request, ..., $PARAM, ...):
                        ...
                  - metavariable-regex:
                      metavariable: $VIEW
                      regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      # An allow-list: a lookup in a dict literal whose keys are literals and whose values are
      # literals or lists/tuples of literals (strings with r/b/u prefixes and backslash escapes,
      # numbers, True/False/None; comments allowed between the items), assigned to an upper-case
      # (constant) name that the module never changes (item assignment, update(), setdefault(),
      # |=) or assigns again. A get() default must be a literal, a list/tuple of literals or a
      # module constant.
      - patterns:
          - pattern-inside: |
              $ALLOWED = $LITERAL
              ...
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $LITERAL
