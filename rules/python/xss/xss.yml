      # Every response-body sink below takes only a value that is visibly text: an expression
      # that is not a call (a name, a lookup, +, %, an f-string), or str(...) or a string method
      # (`"...".format(x)`, `PAGE.replace("{b}", x)`, `request.args.get("q")`). Another call,
      # such as `user.to_dict()` or a helper's result, is not taken for HTML.
      #
      # Flask: the return value of a view (a str is sent as text/html; dicts and lists become
      # JSON), in a module that imports flask, unless the decorator's object is made by FastAPI.
      # A response kept in a variable is left to the make_response()/Response() sink.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $FL import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $FL
                      regex: ^flask(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $FL
                      ...
                  - metavariable-regex:
                      metavariable: $FL
                      regex: ^flask(\.|$)
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - pattern-not-inside: |
              $APP = fastapi.FastAPI(...)
              ...
          - pattern-not-inside: |
              $APP = fastapi.APIRouter(...)
