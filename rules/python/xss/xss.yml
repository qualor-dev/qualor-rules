                        - pattern: fastapi.responses.Response(..., content=$CALL(...), ..., media_type="=~/html/", ...)
                        - pattern-not: fastapi.responses.Response(..., content=str(...), ..., media_type="=~/html/", ...)
                        - pattern-not:
