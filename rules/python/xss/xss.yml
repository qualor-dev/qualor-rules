                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(..., response_class=starlette.responses.HTMLResponse, ...)
                  def $VIEW(...):
                    ...
          - pattern-either:
              - patterns:
                  - pattern: return $BODY
                  - pattern-not: return $CALL(...)
              - patterns:
                  - pattern: return $BODY
                  - pattern-either:
                      - pattern: return str(...)
                      - patterns:
                          - pattern: return $TEXT.$METHOD(...)
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
          - focus-metavariable: $BODY
      # FastAPI and Starlette responses: HTMLResponse, and Response with an HTML media type (the
