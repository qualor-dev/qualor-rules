rules:
  - id: python.xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without escaping, so a crafted
      value can run script in the user's browser. Render it through an autoescaping template
      (`render_template()`, Django `render()`), escape it (`markupsafe.escape()`, `html.escape()`,
      Django `escape()` or `format_html("...{}...", value)`), or send it as JSON or text/plain;
      never wrap request data in `Markup()`, `mark_safe()` or `SafeString()`.
    metadata:
      title: HTML response built from HTTP request data (Python)
      cwe: ['CWE-79']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [flask, django, fastapi, starlette, markupsafe, bleach, nh3]
      sources:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://top10.owasp.org/2021/A03_2021-Injection
        - https://flask.palletsprojects.com/en/stable/quickstart/#html-escaping
        - https://flask.palletsprojects.com/en/stable/quickstart/#about-responses
        - https://flask.palletsprojects.com/en/stable/templating/
        - https://flask.palletsprojects.com/en/stable/api/#flask.make_response
        - https://flask.palletsprojects.com/en/stable/api/#flask.Response
        - https://markupsafe.palletsprojects.com/en/stable/escaping/
        - https://docs.python.org/3/library/html.html#html.escape
        - https://peps.python.org/pep-0008/#constants
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.html.format_html
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.safestring.mark_safe
        - https://docs.djangoproject.com/en/stable/ref/request-response/#httpresponse-objects
        - https://docs.djangoproject.com/en/stable/topics/http/shortcuts/#render
        - https://fastapi.tiangolo.com/advanced/custom-response/#htmlresponse
        - https://starlette.dev/responses/
        - https://fastapi.tiangolo.com/advanced/templates/
        - https://docs.djangoproject.com/en/stable/topics/templates/
        - https://bleach.readthedocs.io/en/latest/clean.html
        - https://nh3.readthedocs.io/en/latest/
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A Flask view is a function decorated with route()/get()/post()/... in a module that
    #   imports flask and does not make that decorator's object with FastAPI() or APIRouter().
    #   Class-based Flask views (MethodView, View.dispatch_request) are not followed.
    # - A response body must be visibly text: an expression that is not a call (a name, a
    #   lookup, +, %, an f-string), or str() or a string method (`PAGE.format(body=x)`). A
    #   helper's return value is not followed, even when the helper builds HTML from request data
    #   (todoruleid); a call's result kept in a variable and returned whole is still taken for
    #   text (todook).
    # - An attribute of an object that a call returned (a row looked up by a request id) is
    #   taken for stored data, unless the call is a request accessor, a urllib.parse URL parser,
    #   json.loads(), pydantic validation, or receives request data whole (`Form(request.POST)`,
    #   `Model(**body)`). A request value that reaches such a call through a variable, or as a
    #   subscripted value in place (`Comment(text=request.args["t"]).text`), is not seen
    #   (todoruleid), a deliberate trade-off for ORM lookups by a request id.
    # - A Flask view returning the request's JSON value whole (`request.json`, `get_json()`, an
    #   `or {}` default, or a variable assigned from them and returned as it is) is taken for
    #   JSON; a request whose JSON body is a bare string is not followed.
    # - OpenGrep does not carry taint through a slice, so a slice of request data is a source
    #   itself: of a request access chain (`request.args["q"][:50]`), of a variable assigned one in
    #   the function, or of a view parameter. A slice of a value built from request data
    #   (`(request.args["q"] + "x")[:50]`), or of a variable assigned again in the function after
    #   the request value (`q = q.strip()`, also with more request data: `q = q +
    #   request.args["b"]`, `if not q: q = request.form["q"]`), is missed. Django request
    #   chains count in a view (first parameter `request`) and `self.request`/`self.kwargs` in a
    #   class.
    # - A response whose content type is changed after it is made (`resp.mimetype =
    #   "text/plain"`, `resp.headers["Content-Type"] = ...`) is still taken for HTML.
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items, and
    #   strings with r/b/u prefixes) assigned to an upper-case (constant) name that the module never
    #   changes or assigns again, with no default or a literal/constant default for get() (an
    #   upper-case name assigned in the function is not a constant); or as a ternary of constants. A
    #   membership check (`if x not in ALLOWED: return`) is not, nor is a nested table (todook).
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - patterns:
                          - pattern-inside: |
                              class $CLS(...):
                                ...
                          - pattern-either:
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., $PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., *$PARAM, ...):
                                    ...
                              - pattern-inside: |
                                  def $VIEW(self, request, ..., **$PARAM):
                                    ...
                          - metavariable-regex:
                              metavariable: $VIEW
                              regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
                  - focus-metavariable: $PARAM
      # Slices: OpenGrep does not carry taint through a slice (`request.args["q"][:50]`), so a
      # slice of request data is a source itself: of a request access chain (Flask's request; in
      # a Django view, its request or json.loads(request.body), and in a class, self.request,
      # self.args, self.kwargs; with their subscripts, attributes and method calls), in place or
      # through a variable assigned one in the function and not assigned again (`q =
      # escape(q)`), or of a view parameter (and its attributes).
      - patterns:
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &flask-request-chain ^((flask\.)?request\.(args|form|values|headers|cookies|json|data|files|view_args|path|full_path|url|query_string|get_json\([^()]*\)|get_data\([^()]*\))|json\.loads\((flask\.)?request\.(data|get_data\([^()]*\))\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
          - metavariable-pattern:
              metavariable: $VALUE
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *flask-request-chain
          - metavariable-pattern:
              metavariable: $INIT
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-request-chain ^(request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|json\.loads\(request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
          - metavariable-regex:
              metavariable: $VALUE
              regex: &django-self-chain ^(self\.request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|self\.(args|kwargs)|json\.loads\(self\.request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ...):
                    ...
              - pattern-inside: |
                  def $VIEW(self, request, ...):
                    ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-request-chain
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-inside: |
              $VALUE = $INIT
              ...
          - pattern-not-inside: |
              $VALUE = $INIT
              ...
              $VALUE = $OTHER
              ...
          - pattern-either:
              - pattern: $VALUE[$LOWER:]
              - pattern: $VALUE[:$UPPER]
              - pattern: $VALUE[$LOWER:$UPPER]
              - pattern: $VALUE[::$STEP]
              - pattern: $VALUE[$LOWER::$STEP]
              - pattern: $VALUE[:$UPPER:$STEP]
              - pattern: $VALUE[$LOWER:$UPPER:$STEP]
              - pattern: $VALUE[:]
              - pattern: $VALUE[$KEY][$LOWER:]
              - pattern: $VALUE[$KEY][:$UPPER]
              - pattern: $VALUE[$KEY][$LOWER:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:]
              - pattern: $VALUE.$METHOD(...)[:$UPPER]
              - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
              - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
              - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: *django-self-chain
      # A view parameter: of a route-decorated view (Flask, FastAPI; not a dependency), and the
      # URL arguments of a Django view.
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:]
              - pattern: $PARAM.$FIELD[:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:$UPPER]
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      from $DJ import $NAME
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
              - patterns:
                  - pattern-inside: |
                      import $DJ
                      ...
                  - metavariable-regex:
                      metavariable: $DJ
                      regex: ^django(\.|$)
          - pattern-either:
              - pattern-inside: |
                  def $VIEW(request, ..., $PARAM, ...):
                    ...
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-inside: |
                      def $VIEW(self, request, ..., $PARAM, ...):
                        ...
                  - metavariable-regex:
                      metavariable: $VIEW
                      regex: ^(get|post|put|patch|delete|head|options|trace|dispatch)$
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      # An allow-list: a lookup in a dict literal whose keys are literals and whose values are
      # literals or lists/tuples of literals (strings with r/b/u prefixes and backslash escapes,
      # numbers, True/False/None; comments allowed between the items), assigned to an upper-case
      # (constant) name that the module never changes (item assignment, update(), setdefault(),
      # |=) or assigns again. A get() default must be a literal, a list/tuple of literals or a
      # module constant.
      - patterns:
          - pattern-inside: |
              $ALLOWED = $LITERAL
              ...
          - metavariable-regex:
              metavariable: $ALLOWED
