      # Marking text as safe HTML: markupsafe Markup(), Django mark_safe() and SafeString(), and
      # the format string of format_html()/format_html_join() (their other arguments are escaped).
      - patterns:
          - pattern-either:
              - pattern: markupsafe.Markup($BODY, ...)
              - pattern: flask.Markup($BODY, ...)
              - pattern: django.utils.safestring.mark_safe($BODY)
              - pattern: django.utils.safestring.SafeString($BODY)
              - pattern: django.utils.html.format_html($BODY, ...)
              - pattern: django.utils.html.format_html_join($SEP, $BODY, ...)
          - focus-metavariable: $BODY
