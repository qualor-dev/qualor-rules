          - pattern-not: return $B, $STATUS
          - pattern-not: return $B, $STATUS, $HEADERS
          - pattern-not: return {...}
          - pattern-not: return [...]
          # The request's own JSON value returned whole (Flask sends a dict or list as JSON), in
          # place or with an `or` default (a variable holding it: see the sanitizers).
          - pattern-not: return flask.request.json
          - pattern-not: return flask.request.get_json(...)
          - pattern-not: return flask.request.json or $DEFAULT
          - pattern-not: return flask.request.get_json(...) or $DEFAULT
          - pattern-not: return flask.request.json, ...
          - pattern-not: return flask.request.get_json(...), ...
          - pattern-not-inside: |
              $RESPONSE = flask.make_response(...)
