                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
              - patterns:
                  - pattern: starlette.responses.Response(..., content=$BODY, ..., media_type="=~/html/", ...)
                  - pattern-not: starlette.responses.Response(..., content=$CALL(...), ..., media_type="=~/html/", ...)
              - patterns:
                  - pattern: starlette.responses.Response(..., content=$BODY, ..., media_type="=~/html/", ...)
                  - pattern-either:
                      - pattern: starlette.responses.Response(..., content=str(...), ..., media_type="=~/html/", ...)
                      - patterns:
                          - pattern: starlette.responses.Response(..., content=$TEXT.$METHOD(...), ..., media_type="=~/html/", ...)
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
          - focus-metavariable: $BODY
      # Django: HttpResponse and its error subclasses send text/html unless content_type says
      # otherwise; write() adds to such a response.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: django.http.$RESP($BODY, ...)
                  - pattern-not: django.http.$RESP($CALL(...), ...)
              - patterns:
                  - pattern: django.http.$RESP($BODY, ...)
                  - pattern-either:
                      - pattern: django.http.$RESP(str(...), ...)
                      - patterns:
                          - pattern: django.http.$RESP($TEXT.$METHOD(...), ...)
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
              - patterns:
                  - pattern: django.http.$RESP(..., content=$BODY, ...)
                  - pattern-not: django.http.$RESP(..., content=$CALL(...), ...)
              - patterns:
                  - pattern: django.http.$RESP(..., content=$BODY, ...)
                  - pattern-either:
                      - pattern: django.http.$RESP(..., content=str(...), ...)
                      - patterns:
                          - pattern: django.http.$RESP(..., content=$TEXT.$METHOD(...), ...)
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
          - metavariable-regex:
              metavariable: $RESP
              regex: ^HttpResponse(BadRequest|NotFound|Forbidden|Gone|ServerError)?$
          - pattern-not: django.http.$RESP(..., content_type="=~/^(?![^;]*html)/", ...)
          - pattern-not: django.http.$RESP($X, "=~/^(?![^;]*html)/", ...)
          - focus-metavariable: $BODY
      - patterns:
          - pattern-inside: |
              $RESPONSE = django.http.HttpResponse(...)
              ...
          - pattern-not-inside: |
              $RESPONSE = django.http.HttpResponse(..., content_type="=~/^(?![^;]*html)/", ...)
              ...
          - pattern-either:
              - patterns:
                  - pattern: $RESPONSE.write($BODY)
                  - pattern-not: $RESPONSE.write($CALL(...))
              - patterns:
                  - pattern: $RESPONSE.write($BODY)
                  - pattern-either:
                      - pattern: $RESPONSE.write(str(...))
                      - patterns:
                          - pattern: $RESPONSE.write($TEXT.$METHOD(...))
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
          - focus-metavariable: $BODY
      # Marking text as safe HTML: markupsafe Markup(), Django mark_safe() and SafeString(), and
      # the format string of format_html()/format_html_join() (their other arguments are escaped).
      - patterns:
          - pattern-either:
              - pattern: markupsafe.Markup($BODY, ...)
              - pattern: flask.Markup($BODY, ...)
              - pattern: django.utils.safestring.mark_safe($BODY)
              - pattern: django.utils.safestring.SafeString($BODY)
              - pattern: django.utils.html.format_html($BODY, ...)
              - pattern: django.utils.html.format_html_join($SEP, $BODY, ...)
          - focus-metavariable: $BODY
