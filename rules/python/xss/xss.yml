rules:
  - id: python.xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without escaping, so a crafted
      value can run script in the user's browser. Render it through an autoescaping template
      (`render_template()`, Django `render()`), escape it (`markupsafe.escape()`, `html.escape()`,
      Django `escape()` or `format_html("...{}...", value)`), or send it as JSON or text/plain;
      never wrap request data in `Markup()`, `mark_safe()` or `SafeString()`.
    metadata:
      title: HTML response built from HTTP request data (Python)
      cwe: ['CWE-79']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [flask, django, fastapi, starlette, markupsafe, bleach, nh3]
      sources:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A05_2025-Injection
        - https://top10.owasp.org/2021/A03_2021-Injection
        - https://flask.palletsprojects.com/en/stable/quickstart/#html-escaping
        - https://flask.palletsprojects.com/en/stable/quickstart/#about-responses
        - https://flask.palletsprojects.com/en/stable/templating/
        - https://flask.palletsprojects.com/en/stable/api/#flask.make_response
        - https://flask.palletsprojects.com/en/stable/api/#flask.Response
        - https://markupsafe.palletsprojects.com/en/stable/escaping/
        - https://docs.python.org/3/library/html.html#html.escape
        - https://peps.python.org/pep-0008/#constants
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.html.format_html
        - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.safestring.mark_safe
        - https://docs.djangoproject.com/en/stable/ref/request-response/#httpresponse-objects
        - https://docs.djangoproject.com/en/stable/topics/http/shortcuts/#render
        - https://fastapi.tiangolo.com/advanced/custom-response/#htmlresponse
        - https://starlette.dev/responses/
        - https://fastapi.tiangolo.com/advanced/templates/
        - https://docs.djangoproject.com/en/stable/topics/templates/
        - https://bleach.readthedocs.io/en/latest/clean.html
        - https://nh3.readthedocs.io/en/latest/
        - https://flask.palletsprojects.com/en/stable/api/#flask.Request
        - https://flask.palletsprojects.com/en/stable/quickstart/#variable-rules
        - https://docs.djangoproject.com/en/stable/ref/request-response/
        - https://docs.djangoproject.com/en/stable/topics/http/urls/
        - https://docs.djangoproject.com/en/stable/ref/class-based-views/base/
        - https://fastapi.tiangolo.com/tutorial/body/
        - https://fastapi.tiangolo.com/advanced/using-request-directly/
        - https://starlette.dev/middleware/
        - https://starlette.dev/requests/
        - https://fastapi.tiangolo.com/tutorial/middleware/
        - https://docs.python.org/3/library/subprocess.html
        - https://docs.python.org/3/library/os.html#os.popen
        - https://docs.python.org/3/library/os.html#process-management
        - https://docs.python.org/3/library/asyncio-subprocess.html
        - https://docs.python.org/3/library/asyncio-eventloop.html#running-subprocesses
        - https://pubs.opengroup.org/onlinepubs/9799919799/utilities/sh.html
        - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cmd
        - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pwsh
        - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe?view=powershell-5.1
        - https://docs.python.org/3/library/functions.html#open
        - https://docs.python.org/3/library/pathlib.html
        - https://requests.readthedocs.io/en/latest/api/
        - https://www.python-httpx.org/api/
        - https://docs.python.org/3/library/urllib.request.html
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A Flask view is a function decorated with route()/get()/post()/... in a module that
    #   imports flask and does not make that decorator's object with FastAPI() or APIRouter().
    #   Class-based Flask views (MethodView, View.dispatch_request) are not followed.
    # - A response body must be visibly text: an expression that is not a call (a name, a
    #   lookup, +, %, an f-string), or str() or a string method (`PAGE.format(body=x)`). A
    #   helper's return value is not followed, even when the helper builds HTML from request data
    #   (todoruleid); a call's result kept in a variable and returned whole is still taken for
    #   text when the function is not in this file and is given request data (todook; a
    #   function of this file is followed).
    # - An attribute of an object that a call returned (a row looked up by a request id) is
    #   taken for stored data, unless the call is a request accessor, a urllib.parse URL parser,
    #   json.loads(), pydantic validation, or receives request data whole (`Form(request.POST)`,
    #   `Model(**body)`). A request value that reaches such a call through a variable, or as a
    #   subscripted value in place (`Comment(text=request.args["t"]).text`), is not seen
    #   (todoruleid), a deliberate trade-off for ORM lookups by a request id.
    # - A Flask view returning the request's JSON value whole (`request.json`, `get_json()`, an
    #   `or {}` / `or []` default, or a variable assigned from them and returned as it is, also
    #   after `data = data or {}`, `if data is None: data = {}` or `if not data: data = []`) is
    #   taken for JSON; a request whose JSON body is a bare string is not followed. A default
    #   that is not a dict or list literal (`get_json() or request.args["t"]`) is reported.
    # - OpenGrep does not carry taint through a slice, so a slice of request data is a source
    #   itself: of a request access chain (`request.args["q"][:50]`), of a variable assigned one in
    #   the function, or of a view parameter. A slice of a value built from request data
    #   (`(request.args["q"] + "x")[:50]`), or of a variable assigned again in the function after
    #   the request value (`q = q.strip()`, also with more request data: `q = q +
    #   request.args["b"]`, `if not q: q = request.form["q"]`), is missed. Django request
    #   chains count in a view (first parameter `request`) and `self.request`/`self.kwargs` in a
    #   class.
    #   In Starlette/FastAPI middleware only a slice of the request's path written in place
    #   counts (`request.url.path[1:]`); another slice there, in place or through a variable,
    #   is missed.
    # - A response whose content type is changed after it is made (`resp.mimetype =
    #   "text/plain"`, `resp.headers["Content-Type"] = ...`) is still taken for HTML.
    # - An allow-list is recognised as a lookup (`.get()` or `[...]`) in a dict literal of literal
    #   keys and values (also lists or tuples of literals, with comments between the items, and
    #   strings with r/b/u prefixes) assigned to an upper-case (constant) name that the module never
    #   changes or assigns again, with no default or a literal/constant default for get() (an
    #   upper-case name assigned in the function is not a constant); or as a ternary of constants. A
    #   membership check (`if x not in ALLOWED: return`) is not, nor is a nested table (todook).
    # - After a get() whose key or default is request data, the dict counts as request data for
    #   the rest of the function: a later lookup of a constant entry in it is reported (todook).
    #   And a get() called on a call's result (`requests.Session().get(url)`) passes no request
    #   data on (todoruleid).
    # - The results of other rules' sinks (a decision, as in js.xss, java.xss and go.xss): the
    #   output of a command whose shell command, program, or shell, cmd.exe or PowerShell script
    #   carries request data (python.command-injection's finding), and the content of a file
    #   read with open() or pathlib (python.path-traversal's, when the request names the file),
    #   are not request data here (`ok:`, not a limit). The command positions are a copy of
    #   python.command-injection's sinks (see the sanitizers) and must change with them. A
    #   fixed program's output stays request data, and so does a page fetched from a URL the
    #   request chooses (ruling J2). Limits of that: a file read by iterating over it (`for line
    #   in f`) or through a helper is still request data (todook); a page fetched through a
    #   requests Session or httpx Client held in a variable is taken for stored data when an
    #   attribute of the response is used (`s.get(url).text`, todoruleid); a fixed origin is
    #   recognised only as a literal at the start of the URL given to the requests or httpx
    #   module functions or urlopen(), so one held in a module constant (`API_BASE + "/x/" +
    #   id`) is still request data (todook). These sanitizers match the call, so they also clean a
    #   sink inside a function passed to it (a requests response hook on a fixed-origin fetch,
    #   todoruleid).
    # Inherited from the request source block (python.sql-injection), each with a `todook` line:
    # - A Flask route parameter with a typed converter (`<int:n>`) is still a source.
    # - A Django URL argument is still a source when its converter (`<int:pk>`, in urls.py) or a
    #   default value makes it a number.
    # - A Django-module function whose first parameter is named request is taken for a view: its
    #   other parameters count as URL arguments, and the request attributes (`headers`, `body`,
    #   ...) of that parameter count even when it is another library's request object.
    # - A Django-module function named get, post, put, patch, delete, head, options, trace or
    #   dispatch that takes `(self, request, ...)` is taken for a class-based view's handler also
    #   outside a class: its parameters after request count as URL arguments.
    # - A Flask view parameter annotated int, float or bool is not a source (the FastAPI rule
    #   below), although Flask passes a str for a rule without a converter (todoruleid).
    # FastAPI parameters annotated int, float or bool (also `Annotated[int, ...]`), and
    # dependencies (`= Depends()`, `= Security()`, `Annotated[T, Depends()]` in place or through a
    # module-level alias) are not sources.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.get_data(...)
          - pattern: flask.request.files
          - pattern: flask.request.view_args
          - pattern: flask.request.path
          - pattern: flask.request.full_path
          - pattern: flask.request.url
          - pattern: flask.request.query_string
      # Flask "Variable Rules": the parameters of a view function registered with a URL rule.
      # FastAPI path operations match too; their parameters annotated int, float or bool are
      # converted by FastAPI, and those with a Depends()/Security() default are dependencies,
      # not request data.
      # (Each route decorator, and each Django handler method name below, is written out: a
      # metavariable-regex on the name, like every condition of a source item, multiplies the
      # formula OpenGrep builds its prefilter from, and past a size it gives up and matches
      # every file. So the shared block binds each source shape with as few conditions as it
      # can, and the Django shapes share one `import django` item.)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.get(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.post(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.put(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.patch(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.delete(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
          # (A parameter pattern without a type or default also matches a typed one, and one
          # without a default also matches one with a default.)
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: bool, ...):
                ...
          # The same in FastAPI's Annotated form, written in place or through a module-level
          # alias (`SettingsDep = Annotated[Settings, Depends(get_settings)]`).
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[int, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[float, ...], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[bool, ...], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - focus-metavariable: $PARAM
      # Slices: OpenGrep does not carry taint through a slice (`request.args["q"][:50]`), so a
      # slice of request data is a source itself: of a request access chain (Flask's request;
      # in a Django view, its request or json.loads(request.body), and in a class, self.request,
      # self.args, self.kwargs; with their subscripts, attributes and method calls), in place
      # ($INIT[...]) or through a variable assigned one in the function and not assigned again
      # (`q = escape(q)`), or of a view parameter (and its attributes). The chain is checked by
      # its text ($INIT) and, for Flask, by flask.request resolution.
      - patterns:
          - pattern-either: &chain-slices
              - pattern: $INIT[$LOWER:]
              - pattern: $INIT[:$UPPER]
              - pattern: $INIT[$LOWER:$UPPER]
              - pattern: $INIT[::$STEP]
              - pattern: $INIT[$LOWER::$STEP]
              - pattern: $INIT[:$UPPER:$STEP]
              - pattern: $INIT[$LOWER:$UPPER:$STEP]
              - pattern: $INIT[:]
              - patterns:
                  - pattern-inside: |
                      $VALUE = $INIT
                      ...
                  - pattern-not-inside: |
                      $VALUE = $INIT
                      ...
                      $VALUE = $OTHER
                      ...
                  - pattern-either:
                      - pattern: $VALUE[$LOWER:]
                      - pattern: $VALUE[:$UPPER]
                      - pattern: $VALUE[$LOWER:$UPPER]
                      - pattern: $VALUE[::$STEP]
                      - pattern: $VALUE[$LOWER::$STEP]
                      - pattern: $VALUE[:$UPPER:$STEP]
                      - pattern: $VALUE[$LOWER:$UPPER:$STEP]
                      - pattern: $VALUE[:]
                      - pattern: $VALUE[$KEY][$LOWER:]
                      - pattern: $VALUE[$KEY][:$UPPER]
                      - pattern: $VALUE[$KEY][$LOWER:$UPPER]
                      - pattern: $VALUE.$METHOD(...)[$LOWER:]
                      - pattern: $VALUE.$METHOD(...)[:$UPPER]
                      - pattern: $VALUE.$METHOD(...)[$LOWER:$UPPER]
                      - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:]
                      - pattern: $VALUE[$KEY].$METHOD(...)[:$UPPER]
                      - pattern: $VALUE[$KEY].$METHOD(...)[$LOWER:$UPPER]
          - metavariable-regex:
              metavariable: $INIT
              regex: ^((flask\.)?request\.(args|form|values|headers|cookies|json|data|files|view_args|path|full_path|url|query_string|get_json\([^()]*\)|get_data\([^()]*\))|json\.loads\((flask\.)?request\.(data|get_data\([^()]*\))\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
          - metavariable-pattern:
              metavariable: $INIT
              pattern: flask.request.$ATTR
          # Not a local named request (an outgoing urllib request in a helper).
          - pattern-not-inside: |
              request = $LOCAL
              ...
      # A view parameter: of a route-decorated view (Flask, FastAPI; not a dependency).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.get(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.post(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.put(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.patch(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.delete(...)
                  def $VIEW(..., $PARAM, ...):
                    ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM = fastapi.Security(...), ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $VIEW(..., $PARAM: typing.Annotated[$TYPE, fastapi.Security(...)], ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Depends(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-not-inside: |
              $ALIAS = typing.Annotated[$TYPE, fastapi.Security(...)]
              ...
              @$DECORATOR(...)
              def $VIEW(..., $PARAM: $ALIAS, ...):
                ...
          - pattern-either:
              - pattern: $PARAM[$LOWER:]
              - pattern: $PARAM[:$UPPER]
              - pattern: $PARAM[$LOWER:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:]
              - pattern: $PARAM.$FIELD[:$UPPER]
              - pattern: $PARAM.$FIELD[$LOWER:$UPPER]
      # Django, in a module that imports it: the HttpRequest a view receives, the URL arguments
      # passed to the view after it, and what View.setup() keeps on a class-based view, with
      # their slices. Only an import at the module's top level counts; one nested in
      # `if TYPE_CHECKING:` or `try:` does not (no test line: a fixture is one module, and it
      # imports Django at the top level).
      - patterns:
          # A module that imports Django. `import django` also matches `from django.x import y`
          # and `import django.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import django
              ...
          - pattern-either:
              # The request: the first parameter of a function, the one after self of a method.
              # The upper-case attributes exist only on Django's HttpRequest; the others count
              # only on a parameter named request (the parameter itself, not a lambda, loop or
              # comprehension variable of that name). Slices of its chains count in a function
              # whose first parameter (after self) is named request.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW($REQ, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, $REQ, ...):
                            ...
                  - pattern-either:
                      - pattern: $REQ.GET
                      - pattern: $REQ.POST
                      - pattern: $REQ.COOKIES
                      - pattern: $REQ.META
                      - pattern: $REQ.FILES
                      - patterns:
                          - pattern-either:
                              - pattern: $REQ.headers
                              - pattern: $REQ.body
                              - pattern: $REQ.path
                              - pattern: $REQ.path_info
                              - pattern: $REQ.get_full_path(...)
                              - pattern: $REQ.get_full_path_info(...)
                              - pattern: $REQ.build_absolute_uri(...)
                              - pattern: $REQ.read(...)
                              - pattern: $REQ.readline(...)
                              - pattern: $REQ.readlines(...)
                          - metavariable-regex:
                              metavariable: $REQ
                              regex: ^request$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(self, request, ...):
                            ...
                  - pattern-either: *chain-slices
                  - metavariable-regex:
                      metavariable: $INIT
                      regex: ^(request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|json\.loads\(request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
              # Class-based views: View.setup() keeps the request on self.request and the URL
              # arguments on self.args and self.kwargs.
              - patterns:
                  - pattern-inside: |
                      class $CLS(...):
                        ...
                  - pattern-either:
                      - pattern: self.request.GET
                      - pattern: self.request.POST
                      - pattern: self.request.COOKIES
                      - pattern: self.request.META
                      - pattern: self.request.FILES
                      - pattern: self.request.headers
                      - pattern: self.request.body
                      - pattern: self.request.path
                      - pattern: self.request.path_info
                      - pattern: self.request.get_full_path(...)
                      - pattern: self.request.get_full_path_info(...)
                      - pattern: self.request.build_absolute_uri(...)
                      - pattern: self.args
                      - pattern: self.kwargs
                      - patterns:
                          - pattern-either: *chain-slices
                          - metavariable-regex:
                              metavariable: $INIT
                              regex: ^(self\.request\.(GET|POST|COOKIES|META|FILES|headers|body|path|path_info|get_full_path\(\)|get_full_path_info\(\)|build_absolute_uri\([^()]*\))|self\.(args|kwargs)|json\.loads\(self\.request\.body\))(\[[^\[\]]*\]|\.\w+(\([^()]*\))?)*$
              # URL arguments: the parameters after the request of a function-based view, and of
              # a class-based view's handler method (dispatch() calls get(), post(), ...): a
              # function get(self, request, ...), post(...), ... (inside a class or not: a class
              # condition, or the method written inside its class, would be one more condition
              # to multiply, or would miss a method defined under an `if`).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def $VIEW(request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., **$PARAM):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., *$PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., **$PARAM):
                            ...
                  - focus-metavariable: $PARAM
              # ... and their slices.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $VIEW(request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def get(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def post(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def put(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def patch(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def delete(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def head(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def options(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def trace(self, request, ..., $PARAM, ...):
                            ...
                      - pattern-inside: |
                          def dispatch(self, request, ..., $PARAM, ...):
                            ...
                  - pattern-either:
                      - pattern: $PARAM[$LOWER:]
                      - pattern: $PARAM[:$UPPER]
                      - pattern: $PARAM[$LOWER:$UPPER]
      # Starlette and FastAPI middleware (a BaseHTTPMiddleware's dispatch(), an
      # @app.middleware("http") function) runs for every request and is not a view: the URL of
      # the request it receives (its path, query, host, the whole URL; not its scheme, port or
      # is_secure), its query parameters, path parameters, headers, cookies and body, and a
      # slice of the path in place. (Flask's before_request hooks read flask.request, a source
      # above.) The middleware is written as an exclusion, "not outside one", so that this item
      # adds a single condition to the formula OpenGrep builds its prefilter from.
      - patterns:
          - pattern-either:
              - pattern: $REQ.url
              - pattern: $REQ.query_params
              - pattern: $REQ.path_params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.json()
              - pattern: $REQ.body()
              - pattern: $REQ.form()
              - pattern: $REQ.stream()
              - pattern: $REQ.url.path[$LOWER:]
              - pattern: $REQ.url.path[:$UPPER]
              - pattern: $REQ.url.path[$LOWER:$UPPER]
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: $REQ.url
                    - pattern: $REQ.query_params
                    - pattern: $REQ.path_params
                    - pattern: $REQ.headers
                    - pattern: $REQ.cookies
                    - pattern: $REQ.json()
                    - pattern: $REQ.body()
                    - pattern: $REQ.form()
                    - pattern: $REQ.stream()
                    - pattern: $REQ.url.path[$LOWER:]
                    - pattern: $REQ.url.path[:$UPPER]
                    - pattern: $REQ.url.path[$LOWER:$UPPER]
                - pattern-not-inside: |
                    class $MW(..., starlette.middleware.base.BaseHTTPMiddleware, ...):
                      ...
                      def dispatch(self, $REQ, $CALL_NEXT):
                        ...
                - pattern-not-inside: |
                    @$APP.middleware("http")
                    def $MW($REQ, $CALL_NEXT):
                      ...
          - pattern-not-inside: $REQ.url.scheme
          - pattern-not-inside: $REQ.url.port
          - pattern-not-inside: $REQ.url.is_secure
    # dict.get(): the lookup carries the request data of its key and of its default. OpenGrep's
    # --taint-intrafile mode reads get() as a read of the dict and would drop both, so the dict
    # takes them on (a constant allow-list is still cleaned by the sanitizer below).
    pattern-propagators:
      - pattern: $DICT.get($FROM, ...)
        from: $FROM
        to: $DICT
      - pattern: $DICT.get($KEY, $FROM)
        from: $FROM
        to: $DICT
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      # An allow-list: a lookup in a dict literal whose keys are literals and whose values are
      # literals or lists/tuples of literals (strings with r/b/u prefixes and backslash escapes,
      # numbers, True/False/None; comments allowed between the items), assigned to an upper-case
      # (constant) name that the module never changes (item assignment, update(), setdefault(),
      # |=) or assigns again. A get() default must be a literal, a list/tuple of literals or a
      # module constant. (The exclusions start where the name is assigned any `{...}` value, a
      # dict, set or comprehension, rather than at every assignment, which made large modules
      # slow; so a set and then the dict literal also count as assigning the name again.)
      - patterns:
          - pattern-inside: |
              $ALLOWED = $LITERAL
              ...
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $LITERAL
              regex: ^\{(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*:(\s|#[^\n]*)*([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\))(\s|#[^\n]*)*)?\}$
          - pattern-not-inside: |
              $ALLOWED = {...}
              ...
              $ALLOWED[$KEY] = $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = {...}
              ...
              $ALLOWED.update(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = {...}
              ...
              $ALLOWED.setdefault(...)
              ...
          - pattern-not-inside: |
              $ALLOWED = {...}
              ...
              $ALLOWED |= $VALUE
              ...
          - pattern-not-inside: |
              $ALLOWED = {...}
              ...
              $ALLOWED = $OTHER
              ...
          - pattern-either:
              - pattern: $ALLOWED.get($LOOKUP)
              - pattern: $ALLOWED[$LOOKUP]
              - patterns:
                  - pattern: $ALLOWED.get($LOOKUP, $DEFAULT)
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None|\[(\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\]|\((\s|#[^\n]*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*,(\s|#[^\n]*)*)*(([rRbBuU]{0,2}"(\\.|[^"\\\n])*"|[rRbBuU]{0,2}'(\\.|[^'\\\n])*'|-?\d+(\.\d+)?|True|False|None)(\s|#[^\n]*)*)?\)|[A-Z][A-Z0-9_]*(\[("[^"\\\n]*"|'[^'\\\n]*')\])?)$
                  # An upper-case name assigned in the function is a local, not a constant.
                  - pattern-not-inside: |
                      def $FUNCTION(...):
                        ...
                        $DEFAULT = $ANY
                        ...
      - pattern: bool(...)
      - pattern: len(...)
      # Escaping, and HTML built by the escaping helpers from a literal format string.
      - pattern: markupsafe.escape(...)
      - pattern: markupsafe.escape_silent(...)
      - pattern: markupsafe.Markup.escape(...)
      - pattern: html.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: django.utils.html.conditional_escape(...)
      - pattern: django.utils.html.format_html("...", ...)
      - pattern: django.utils.html.format_html_join($SEP, "...", ...)
      - pattern: markupsafe.Markup("...") % $ARGS
      - pattern: markupsafe.Markup("...").format(...)
      # Autoescaping templates, JSON, redirects and files: not an HTML body built from the data.
      - pattern: flask.render_template(...)
      - pattern: flask.render_template_string(...)
      - pattern: flask.stream_template(...)
      - pattern: flask.stream_template_string(...)
      - pattern: flask.jsonify(...)
      - pattern: flask.json.jsonify(...)
      - pattern: flask.redirect(...)
      - pattern: werkzeug.utils.redirect(...)
      - pattern: flask.url_for(...)
      - pattern: flask.send_file(...)
      - pattern: flask.send_from_directory(...)
      - pattern: django.shortcuts.render(...)
      - pattern: django.template.loader.render_to_string(...)
      - pattern: django.template.loader.get_template(...).render(...)
      - pattern: django.template.loader.select_template(...).render(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $TEMPLATE = django.template.loader.get_template(...)
                  ...
              - pattern-inside: |
                  $TEMPLATE = django.template.loader.select_template(...)
                  ...
          - pattern: $TEMPLATE.render(...)
      # An attribute of an object that a call returned (a database row looked up by a request
      # id, a helper's result), read in place or through a variable assigned (also with :=) in
      # the function: stored or computed data, not the request's own text. Left out: request
      # accessors, the URL parsers of urllib.parse, json.loads(), pydantic validation, calls
      # that receive request data whole (a form built from `request.POST`, `Model(**body)`), and
      # the results of other rules' sinks, which the sanitizers below judge: the requests,
      # httpx and urllib.request fetches (a page from a URL the request chooses is request
      # data), subprocess (the output of a fixed program given request data), and a file from
      # open() or pathlib (its name is the path the request chose).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $OBJ = $INIT
                      ...
                  - pattern: $OBJ.$ATTR
              - patterns:
                  - pattern-inside: |
                      if <... ($OBJ := $INIT) ...>:
                        ...
                      ...
                  - pattern: $OBJ.$ATTR
              - pattern: $INIT.$ATTR
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(?!(self\.)?request\b|(requests|httpx|subprocess|pathlib)\.|(urllib\.request\.)?urlopen\(|open\(|([\w.]*\.)?(urlparse|urlsplit|urldefrag)\(|json\.loads\(|[\w.]*\.(model_validate|model_validate_json|parse_obj|parse_raw)\(|[\w.]*\.(FILES|POST|GET|COOKIES|META|args|form|files|values|headers|cookies|query_params)\.)[A-Za-z_][\w.]*\((?!(?s:.*)(\b\w+\.(POST|GET|FILES|form|args|values|json|data|query_params)\b(?!\s*[\[.(])|get_json\(|\*\*))
          - pattern-not-inside: $X.$ATTR(...)
      # Flask: the request's own JSON value returned whole through a variable, `return data`,
      # `return data, 201` or `return data or {}` after `data = request.get_json()` (also
      # `request.json`, either with an `or {}` / `or []` default; Flask sends a dict or list as
      # JSON). Only that returned name is cleared, and not after the variable is assigned again.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $DATA = flask.request.json
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...)
                  ...
              - pattern-inside: |
                  $DATA = flask.request.json or {...}
                  ...
              - pattern-inside: |
                  $DATA = flask.request.json or [...]
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...) or {...}
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...) or [...]
                  ...
          - pattern-not-inside: |
              $DATA = $JSON
              ...
              $DATA = $OTHER
              ...
          - pattern-either:
              - pattern-inside: return $DATA
              - pattern-inside: return $DATA, ...
              - pattern-inside: return $DATA or {...}
              - pattern-inside: return $DATA or [...]
              - pattern-inside: return $DATA or {...}, ...
              - pattern-inside: return $DATA or [...], ...
          - pattern: $DATA
      # The same variable given a JSON default after it is read, and assigned nothing else
      # before or after that: `data = data or {}`, `if data is None: data = {}` or
      # `if not data: data = []`.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $DATA = flask.request.json
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...)
                  ...
              - pattern-inside: |
                  $DATA = flask.request.json or {...}
                  ...
              - pattern-inside: |
                  $DATA = flask.request.json or [...]
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...) or {...}
                  ...
              - pattern-inside: |
                  $DATA = flask.request.get_json(...) or [...]
                  ...
          - pattern-either:
              - pattern-inside: |
                  $DATA = $DATA or {...}
                  ...
              - pattern-inside: |
                  $DATA = $DATA or [...]
                  ...
              - pattern-inside: |
                  if $DATA is None:
                      $DATA = {...}
                  ...
              - pattern-inside: |
                  if $DATA is None:
                      $DATA = [...]
                  ...
              - pattern-inside: |
                  if not $DATA:
                      $DATA = {...}
                  ...
              - pattern-inside: |
                  if not $DATA:
                      $DATA = [...]
                  ...
          # Assigned something else between the request value and the default, or after it.
          - pattern-not-inside: |
              $DATA = $JSON
              ...
              $DATA = $OTHER
              ...
              $DATA = $DATA or $DEFAULT
              ...
          - pattern-not-inside: |
              $DATA = $JSON
              ...
              $DATA = $OTHER
              ...
              if $DATA is None:
                  $DATA = $DEFAULT
              ...
          - pattern-not-inside: |
              $DATA = $JSON
              ...
              $DATA = $OTHER
              ...
              if not $DATA:
                  $DATA = $DEFAULT
              ...
          - pattern-not-inside: |
              $DATA = $DATA or $DEFAULT
              ...
              $DATA = $OTHER
              ...
          - pattern-not-inside: |
              if $DATA is None:
                  $DATA = $DEFAULT
              ...
              $DATA = $OTHER
              ...
          - pattern-not-inside: |
              if not $DATA:
                  $DATA = $DEFAULT
              ...
              $DATA = $OTHER
              ...
          - pattern-either:
              - pattern-inside: return $DATA
              - pattern-inside: return $DATA, ...
              - pattern-inside: return $DATA or {...}
              - pattern-inside: return $DATA or [...]
              - pattern-inside: return $DATA or {...}, ...
              - pattern-inside: return $DATA or [...], ...
          - pattern: $DATA
      # HTML sanitisers that keep an allow-list of tags and attributes.
      - pattern: bleach.clean(...)
      - pattern: nh3.clean(...)
      # The results of other rules' sinks (a decision, as in js.xss, java.xss and go.xss). What
      # a command prints is request data only through the arguments python.command-injection
      # does not report: request data in a command a shell runs, in the program, or in the
      # command or script of a shell, cmd.exe or PowerShell is that rule's finding, and the
      # output of such a command is not reported a second time. A fixed program given request
      # data as an argument (echo, a shell's positional parameters) may print it back, so its
      # output stays request data. The items from here to the file sanitizers are a verbatim
      # copy of python.command-injection's sinks (its anchors too), as sanitizers of the same
      # arguments: a change to that rule's sinks must be copied here, or the two rules drift
      # apart (a command the other rule stops reporting stays silent here, a new sink there is
      # reported twice).
      # A command string that a shell runs.
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: subprocess.getoutput($CMD, ...)
              - pattern: subprocess.getstatusoutput($CMD, ...)
              - pattern: asyncio.create_subprocess_shell($CMD, ...)
              - pattern: asyncio.get_running_loop().subprocess_shell($FACTORY, $CMD, ...)
              - pattern: asyncio.get_event_loop().subprocess_shell($FACTORY, $CMD, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $LOOP = asyncio.get_running_loop()
                          ...
                      - pattern-inside: |
                          $LOOP = asyncio.get_event_loop()
                          ...
                  - pattern: $LOOP.subprocess_shell($FACTORY, $CMD, ...)
          - focus-metavariable: $CMD
      # subprocess with a shell (shell= anything but False, 0 or None): a command string is shell
      # code. Of an argument list only the first element is (the program sink below).
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ..., shell=$SHELL, ...)
              - pattern: subprocess.$FUNC(..., args=$CMD, ..., shell=$SHELL, ...)
              - pattern: subprocess.$FUNC(..., shell=$SHELL, ..., args=$CMD, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: &subprocess-functions ^(run|call|check_call|check_output|Popen)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^(?!(False|0|None)$)
          - pattern-not: subprocess.$FUNC([...], ...)
          - pattern-not: subprocess.$FUNC(($ITEM, ...), ...)
          - pattern-not: subprocess.$FUNC(..., args=[...], ...)
          - pattern-not: subprocess.$FUNC(..., args=($ITEM, ...), ...)
          - pattern-not-inside: |
              $CMD = [...]
              ...
          - pattern-not-inside: |
              $CMD = ($ITEM, ...)
              ...
          - focus-metavariable: $CMD
      # The program: the first element of an argument list (with a shell, the command string),
      # the executable= replacement, and the program of asyncio's exec functions.
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC([$PROGRAM, ...], ...)
              - pattern: subprocess.$FUNC(($PROGRAM, ...), ...)
              - pattern: subprocess.$FUNC([$PROGRAM, ...] + $REST, ...)
              - pattern: subprocess.$FUNC(..., args=[$PROGRAM, ...], ...)
              - pattern: subprocess.$FUNC(..., args=($PROGRAM, ...), ...)
              - pattern: subprocess.$FUNC(..., executable=$PROGRAM, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: *subprocess-functions
          - focus-metavariable: $PROGRAM
      - patterns:
          - pattern-either:
              - pattern: asyncio.create_subprocess_exec($PROGRAM, ...)
              - pattern: asyncio.get_running_loop().subprocess_exec($FACTORY, $PROGRAM, ...)
              - pattern: asyncio.get_event_loop().subprocess_exec($FACTORY, $PROGRAM, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $LOOP = asyncio.get_running_loop()
                          ...
                      - pattern-inside: |
                          $LOOP = asyncio.get_event_loop()
                          ...
                  - pattern: $LOOP.subprocess_exec($FACTORY, $PROGRAM, ...)
          - pattern-not: asyncio.create_subprocess_exec(*$ARGS, ...)
          - pattern-not: $ANY.subprocess_exec($FACTORY, *$ARGS, ...)
          - focus-metavariable: $PROGRAM
      # os.exec*(), os.spawn*() and os.posix_spawn*(): the program is the path or file argument,
      # the first of exec* and posix_spawn*, the second of spawn* (after the mode). The arguments
      # after it are the program's own (the first is the name it sees as argv[0]).
      - patterns:
          - pattern-either:
              - pattern: os.execl($PROGRAM, ...)
              - pattern: os.execle($PROGRAM, ...)
              - pattern: os.execlp($PROGRAM, ...)
              - pattern: os.execlpe($PROGRAM, ...)
              - pattern: os.execv($PROGRAM, ...)
              - pattern: os.execve($PROGRAM, ...)
              - pattern: os.execvp($PROGRAM, ...)
              - pattern: os.execvpe($PROGRAM, ...)
              - pattern: os.spawnl($MODE, $PROGRAM, ...)
              - pattern: os.spawnle($MODE, $PROGRAM, ...)
              - pattern: os.spawnlp($MODE, $PROGRAM, ...)
              - pattern: os.spawnlpe($MODE, $PROGRAM, ...)
              - pattern: os.spawnv($MODE, $PROGRAM, ...)
              - pattern: os.spawnve($MODE, $PROGRAM, ...)
              - pattern: os.spawnvp($MODE, $PROGRAM, ...)
              - pattern: os.spawnvpe($MODE, $PROGRAM, ...)
              - pattern: os.posix_spawn($PROGRAM, ...)
              - pattern: os.posix_spawnp($PROGRAM, ...)
          - focus-metavariable: $PROGRAM
      # ... and the program of a list or tuple assigned to a variable in the function and passed
      # whole (reported where the list is written).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $VAR = [$PROGRAM, ...]
                      ...
                      subprocess.$FUNC($VAR, ...)
                  - pattern: $VAR = [$PROGRAM, ...]
              - patterns:
                  - pattern-inside: |
                      $VAR = ($PROGRAM, ...)
                      ...
                      subprocess.$FUNC($VAR, ...)
                  - pattern: $VAR = ($PROGRAM, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: *subprocess-functions
          - focus-metavariable: $PROGRAM
      # A POSIX shell program in an argument list (also after sudo or env), followed by up to
      # three option words and its -c flag: the element after the flag is shell code; the later
      # ones are the shell's $0, $1, ... A word after a script operand is the script's argument.
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC([..., $SH, $FLAG, $CMD, ...], ...)
              - pattern: subprocess.$FUNC((..., $SH, $FLAG, $CMD, ...), ...)
              - pattern: subprocess.$FUNC(..., args=[..., $SH, $FLAG, $CMD, ...], ...)
              - pattern: asyncio.$FUNC(..., $SH, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: &shell-functions ^(run|call|check_call|check_output|Popen|create_subprocess_exec)$
          - metavariable-regex:
              metavariable: $SH
              regex: &posix-shell ^[rRbBuU]{0,2}["']((/usr)?/bin/)?(sh|bash|zsh|dash|ksh|mksh|ash)["']$
          - metavariable-regex:
              metavariable: $FLAG
              regex: &posix-flag ^[rRbBuU]{0,2}["']-[a-zA-Z]*c[a-zA-Z]*["']$
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC([..., $SH, $OPT1, $FLAG, $CMD, ...], ...)
