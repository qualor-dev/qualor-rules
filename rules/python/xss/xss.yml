          - pattern-not-inside: |
              $RESPONSE = django.http.HttpResponse(..., content_type="=~/^(?![^;]*html)/", ...)
              ...
          - pattern-either:
              - patterns:
                  - pattern: $RESPONSE.write($BODY)
                  - pattern-not:
                      patterns:
                        - pattern: $RESPONSE.write($CALL(...))
                        - pattern-not: $RESPONSE.write(str(...))
                        - pattern-not:
                            patterns:
                              - pattern: $RESPONSE.write($TEXT.$METHOD(...))
