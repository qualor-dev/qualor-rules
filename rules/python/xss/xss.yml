              $VAR = $VALUE
              ...
          - metavariable-regex:
              metavariable: $VALUE
              regex: *request-value
          - pattern-either:
              - pattern: asyncio.create_subprocess_exec(*$VAR[$KEY], ...)
              - pattern: asyncio.create_subprocess_exec(*$VAR.$METHOD(...), ...)
              - pattern: asyncio.create_subprocess_exec(*shlex.split($VAR), ...)
              - pattern: asyncio.create_subprocess_exec(*shlex.split($VAR[$KEY]), ...)
          - focus-metavariable: $VAR
      - patterns:
          - pattern-inside: |
              def $VIEW(..., $PARAM, ...):
                ...
          - pattern-either:
              - pattern: asyncio.create_subprocess_exec(*$PARAM, ...)
              - pattern: asyncio.create_subprocess_exec(*$PARAM.$ATTR, ...)
              - pattern: asyncio.create_subprocess_exec(*$PARAM.$METHOD(...), ...)
              - pattern: asyncio.create_subprocess_exec(*shlex.split($PARAM), ...)
              - pattern: asyncio.create_subprocess_exec(*shlex.split($PARAM.$ATTR), ...)
          - focus-metavariable: $PARAM
      # The content of a file is not request data, even when the request names the file (that is
      # python.path-traversal's finding): what read(), readline() and readlines() return for a
      # file opened with open() (in place, assigned, or in a with statement), and read_text() and
      # read_bytes() of a pathlib.Path (made in place, joined with `/`, or assigned). The file
      # object itself stays request data: its name is the path the request chose.
      - pattern: open(...).read(...)
      - pattern: open(...).readline(...)
      - pattern: open(...).readlines(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = open(...)
                  ...
              - pattern-inside: |
                  with open(...) as $F:
                    ...
          - pattern-either:
              - pattern: $F.read(...)
              - pattern: $F.readline(...)
              - pattern: $F.readlines(...)
      - pattern: pathlib.Path(...).read_text(...)
      - pattern: pathlib.Path(...).read_bytes(...)
      - pattern: (pathlib.Path(...) / $NAME).read_text(...)
      - pattern: (pathlib.Path(...) / $NAME).read_bytes(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = pathlib.Path(...)
                  ...
              - pattern-inside: |
                  $P = pathlib.Path(...) / $NAME
                  ...
          - pattern-either:
              - pattern: $P.read_text(...)
              - pattern: $P.read_bytes(...)
      # A page fetched from a fixed origin is that service's data (ruling J2): a URL whose
      # literal start holds the scheme, the host and a separator after the host
      # ("https://api.example.com/", or "?" or "#" after the host; also in an f-string), given to
      # the requests or httpx module functions or to urllib.request.urlopen(). A lone scheme
      # (`"https://" + host`) or a host without the separator (`"https://api.example.com" +
      # path`, where "@evil.example" sets the host) fixes no origin, nor does a host with a
      # placeholder (`{` of an f-string or format(), `%` of %-formatting). A page fetched from a URL
      # the request chooses stays request data (the attribute sanitizer above leaves these calls
      # out).
      - patterns:
          - pattern-either:
              - pattern: requests.$FN($URL, ...)
              - pattern: requests.$FN(..., url=$URL, ...)
              - pattern: httpx.$FN($URL, ...)
              - pattern: httpx.$FN(..., url=$URL, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(get|post|put|patch|delete|head|options)$
          - metavariable-regex:
              metavariable: $URL
              regex: &fixed-origin ^[rRbBuUfF]{0,2}["'][A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"'\\@{}%]+(/(?![/\\])|[?#])
      - patterns:
          - pattern-either:
              - pattern: requests.request($METHOD, $URL, ...)
              - pattern: requests.request(..., url=$URL, ...)
              - pattern: httpx.request($METHOD, $URL, ...)
              - pattern: httpx.request(..., url=$URL, ...)
              - pattern: httpx.stream($METHOD, $URL, ...)
              - pattern: httpx.stream(..., url=$URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.urlopen(..., url=$URL, ...)
          - metavariable-regex:
              metavariable: $URL
              regex: *fixed-origin
    pattern-sinks:
      # Every response-body sink below takes only a value that is visibly text: an expression
      # that is not a call (a name, a lookup, +, %, an f-string), or str(...) or a string method
      # (`"...".format(x)`, `PAGE.replace("{b}", x)`, `request.args.get("q")`). Another call,
      # such as `user.to_dict()` or a helper's result, is not taken for HTML.
      #
      # Flask: the return value of a view (a str is sent as text/html; dicts and lists become
      # JSON), in a module that imports flask, unless the decorator's object is made by FastAPI.
      # A response kept in a variable is left to the make_response()/Response() sink. (One item
      # for the body alone and the tuple forms, so that OpenGrep's prefilter counts the context's
      # conditions once.)
      - patterns:
          # A module that imports Flask. `import flask` also matches `from flask.x import y`
          # and `import flask.x as z`, and binds no metavariable: a finding counts
          # once toward OpenGrep's match limit per file, however many names the
          # module imports.
          - pattern-inside: |
              import flask
              ...
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $VIEW(...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - pattern-not-inside: |
              $APP = fastapi.FastAPI(...)
              ...
          - pattern-not-inside: |
              $APP = fastapi.APIRouter(...)
              ...
          - pattern-either:
              # The body returned alone.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: return $BODY
                          - pattern-not: return $CALL(...)
                      - patterns:
                          - pattern: return $BODY
                          - pattern-either:
                              - pattern: return str(...)
                              - patterns:
                                  - pattern: return $TEXT.$METHOD(...)
                                  - metavariable-regex:
                                      metavariable: $METHOD
                                      regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
                  - pattern-not: return $B, $STATUS
                  - pattern-not: return $B, $STATUS, $HEADERS
                  - pattern-not: return {...}
                  - pattern-not: return [...]
                  # The request's own JSON value returned whole (Flask sends a dict or list as
                  # JSON), in place or with an `or {}` / `or []` default (a variable holding it:
                  # see the sanitizers; `get_json()` alone is a call, so not visibly text).
                  - pattern-not: return flask.request.json
                  - pattern-not: return flask.request.json or {...}
                  - pattern-not: return flask.request.json or [...]
                  - pattern-not: return flask.request.get_json(...) or {...}
                  - pattern-not: return flask.request.get_json(...) or [...]
                  - pattern-not-inside: |
                      $RESPONSE = flask.make_response(...)
                      ...
                      return $RESPONSE
                  - pattern-not-inside: |
                      $RESPONSE = flask.Response(...)
                      ...
                      return $RESPONSE
              # The tuple forms (body, status), (body, headers) and (body, status, headers),
              # unless the headers give a Content-Type other than HTML.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: return $BODY, $STATUS
                          - pattern-not: return $CALL(...), $STATUS
                      - patterns:
                          - pattern: return $BODY, $STATUS
                          - pattern-either:
                              - pattern: return str(...), $STATUS
                              - patterns:
                                  - pattern: return $TEXT.$METHOD(...), $STATUS
                                  - metavariable-regex:
                                      metavariable: $METHOD
                                      regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
                      - patterns:
                          - pattern: return $BODY, $STATUS, $HEADERS
                          - pattern-not: return $CALL(...), $STATUS, $HEADERS
                      - patterns:
                          - pattern: return $BODY, $STATUS, $HEADERS
                          - pattern-either:
                              - pattern: return str(...), $STATUS, $HEADERS
                              - patterns:
                                  - pattern: return $TEXT.$METHOD(...), $STATUS, $HEADERS
                                  - metavariable-regex:
                                      metavariable: $METHOD
                                      regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
                  - pattern-not: return {...}, ...
                  - pattern-not: return [...], ...
                  # The request's own JSON value returned whole (Flask sends a dict or list as
                  # JSON), in place or with an `or {}` / `or []` default (a variable holding it:
                  # see the sanitizers; `get_json()` alone is a call, so not visibly text).
                  - pattern-not: return flask.request.json, ...
                  - pattern-not: return flask.request.json or {...}, ...
                  - pattern-not: return flask.request.json or [...], ...
                  - pattern-not: return flask.request.get_json(...) or {...}, ...
                  - pattern-not: return flask.request.get_json(...) or [...], ...
                  - pattern-not: |
                      return $B, {..., "Content-Type": "=~/^(?![^;]*html)/", ...}
                  - pattern-not: |
                      return $B, $STATUS, {..., "Content-Type": "=~/^(?![^;]*html)/", ...}
          - focus-metavariable: $BODY
      # Flask: the body of make_response() and Response() (text/html by default). Each call form
      # is one pattern; the visible-text test is an exclusion: not a call other than str() or a
      # string method (an exclusion gives OpenGrep's prefilter no condition to multiply).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: flask.make_response($BODY, ...)
                  - pattern-not:
                      patterns:
                        - pattern: flask.make_response($CALL(...), ...)
                        - pattern-not: flask.make_response(str(...), ...)
                        - pattern-not:
                            patterns:
                              - pattern: flask.make_response($TEXT.$METHOD(...), ...)
                              - metavariable-regex:
                                  metavariable: $METHOD
                                  regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
              - patterns:
                  - pattern: flask.Response($BODY, ...)
                  - pattern-not:
                      patterns:
                        - pattern: flask.Response($CALL(...), ...)
                        - pattern-not: flask.Response(str(...), ...)
                        - pattern-not:
                            patterns:
                              - pattern: flask.Response($TEXT.$METHOD(...), ...)
                              - metavariable-regex:
                                  metavariable: $METHOD
                                  regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
              - patterns:
                  - pattern: flask.Response(..., response=$BODY, ...)
                  - pattern-not:
                      patterns:
                        - pattern: flask.Response(..., response=$CALL(...), ...)
                        - pattern-not: flask.Response(..., response=str(...), ...)
                        - pattern-not:
                            patterns:
                              - pattern: flask.Response(..., response=$TEXT.$METHOD(...), ...)
                              - metavariable-regex:
                                  metavariable: $METHOD
                                  regex: ^(format|format_map|join|replace|strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|center|ljust|rjust|zfill|expandtabs|removeprefix|removesuffix|encode|decode|get)$
          - pattern-not: flask.Response(..., mimetype="=~/^(?![^;]*html)/", ...)
          - pattern-not: flask.Response(..., content_type="=~/^(?![^;]*html)/", ...)
          - focus-metavariable: $BODY
      # FastAPI: a path operation declared with response_class=HTMLResponse returns HTML.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(..., response_class=fastapi.responses.HTMLResponse, ...)
