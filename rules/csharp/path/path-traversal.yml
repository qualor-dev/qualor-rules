rules:
  - id: csharp.path-traversal
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      Data from the HTTP request is used in a file system path (System.IO File, FileStream,
      Directory, FileInfo, or PhysicalFile). A value with `..` or a rooted path (which makes
      Path.Combine drop the base folder) reaches files outside the intended folder. Keep only the
      file name (Path.GetFileName), map the value to a fixed name, or resolve the full path with
      Path.GetFullPath and refuse it unless it starts with the base folder.
    metadata:
      title: File path built from HTTP request data (C#)
      cwe: ['CWE-22']
      owasp: ['A01:2025', 'A01:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [aspnetcore-mvc, minimal-apis, razor-pages, system-io]
      sources:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        - https://learn.microsoft.com/en-us/aspnet/core/mvc/controllers/actions
        - https://learn.microsoft.com/en-us/aspnet/core/mvc/models/model-binding
        - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/parameter-binding
        - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/route-handlers
        - https://learn.microsoft.com/en-us/aspnet/core/razor-pages/
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.httprequest
        - https://learn.microsoft.com/en-us/aspnet/core/mvc/models/file-uploads
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.combine
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.join
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.getfilename
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.getfullpath
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.file
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.directory
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.filestream.-ctor
        - https://learn.microsoft.com/en-us/dotnet/api/system.io.fileinfo
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.mvc.controllerbase.physicalfile
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.results.file
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.results.physicalfile
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.extensions.fileproviders.physicalfileprovider
      since: 2026.10.5
    # Known limits (each has a `todo` line in the test file, unless it says otherwise):
    # - Taint is followed through the methods of one file (OpenGrep's --taint-intrafile), not into
    #   other files: request data handed to a service of another file is missed. Request data read
    #   by an expression-bodied method (`=> expr`) or by any property getter (block body too), such
    #   as `string Section => Request.Headers[...]`, is missed.
    # - Minimal APIs: a complex-type parameter bound from the JSON body without [FromBody] is not a
    #   source; a handler given as a method group of another class (Handlers.Read) is missed.
    # - A class named *Controller whose base class is named otherwise (a base two steps away from
    #   ControllerBase) is missed.
    # - An enum declared after its use (or in another file) is still a source; an equality guard,
    #   Enumerable.Contains called as a static method or a table in another file is no allow-list; a
    #   variable assigned again after a Contains guard still counts as checked.
    # - StreamReader and StreamWriter given a path are not sinks: their Stream overloads take
    #   request bodies, which the rule cannot tell apart without types.
    # - Results.File given request bytes or a request stream (not a path) is reported.
    # - The value a method of another class returns for request data (a stored document found by an
    #   id, a file an image processor made from request options) is taken for request data: OpenGrep
    #   passes taint through calls it cannot see into.
    # - The containment check is recognised as `if (!full.StartsWith(...))` leaving the method, on a
    #   variable assigned Path.GetFullPath(...) in the method; a check written in the condition of
    #   an `if` that guards the use (`if (Path.GetFullPath(p).StartsWith(root)) { ... }`) is not,
    #   and the path stays reported there.
    # - Not sinks: ControllerBase.File(virtualPath) and IFileProvider.GetFileInfo, which resolve
    #   below the web root and refuse paths outside it; File.Exists and Directory.Exists, which only
    #   test for existence (`ok:` lines).
    # - OpenGrep 1.30 does not parse some C# 11/12 syntax: a raw string literal with two or more
    #   dollar signs ($$"""..."""), a type declared without a body (`class X : Y;`), some multi-line
    #   collection expressions with a trailing comma. That part of the file is skipped. No test
    #   line: the test file must parse.
    pattern-sources:
      # MVC and Web API controllers: the parameters of public methods (actions) of a class whose
      # base class's name ends in Controller (ControllerBase too; generic bases as well), of a class without a base list
      # whose own name ends in Controller, and of a class marked [ApiController] or [Controller]
      # ([NonController] excepted). Numbers, booleans, GUIDs, dates and times (also nullable,
      # arrays and lists of them), enums declared earlier in the file, CancellationToken and
      # interfaces (DI services; the IForm* types and collection interfaces excepted) cannot carry
      # SQL text or are not bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $CTRL : $CTRLBASE { ... }
              - patterns:
                  - pattern-inside: |
                      class $CTRLBASE { ... }
                  - pattern-not-inside: |
                      class $CTRLBASE : $OTHERBASE { ... }
              - pattern-inside: |
                  [$CTRLBASE]
                  class $CTRL { ... }
          - metavariable-regex:
              metavariable: $CTRLBASE
              regex: ^(\w+\.)*\w*(Controller|ControllerBase)(<.*>)?$
          - pattern-not-inside: |
              [NonController]
              class $NOTCTRL { ... }
          - pattern-inside: |
              public $RET $ACTION(..., $T $P, ...) { ... }
          - pattern-not-inside: |
              $RET $ACTION(..., [FromServices(...)] $T $P, ...) { ... }
          - pattern-not-inside: |
              $RET $ACTION(..., [FromKeyedServices(...)] $T $P, ...) { ... }
          - pattern-not-inside: |
              [NonAction]
              $RET $ACTION(...) { ... }
          - pattern-not-inside: |
              enum $T { ... }
              ...
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!((s?byte|u?short|u?int|u?long|decimal|double|float|bool|char|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan|(System\.)?(S?Byte|U?Int16|U?Int32|U?Int64|Decimal|Double|Single|Boolean|Char))\??(\[\])?|(I?List|IEnumerable|ICollection|IReadOnlyList|IReadOnlyCollection|HashSet|ISet)<(s?byte|u?short|u?int|u?long|decimal|double|float|bool|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan)\??>|CancellationToken|I(?!Form|Enumerable<|List<|Collection<|ReadOnly|Dictionary<|Set<)[A-Z]\w*(<.*>)?)$)
          - pattern: $P
      # Razor Pages: the parameters of handler methods (On<Verb>...) of a class whose base class's
      # name ends in PageModel (the same types excepted).
      - patterns:
          - pattern-inside: |
              class $PAGE : $PAGEBASE { ... }
          - metavariable-regex:
              metavariable: $PAGEBASE
              regex: ^(\w+\.)*\w*PageModel$
          - pattern-inside: |
              public $RET $HANDLER(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $HANDLER
              regex: ^On(Get|Post|Put|Delete|Patch|Head|Options)\w*$
          - pattern-not-inside: |
              $RET $HANDLER(..., [FromServices(...)] $T $P, ...) { ... }
          - pattern-not-inside: |
              enum $T { ... }
              ...
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!((s?byte|u?short|u?int|u?long|decimal|double|float|bool|char|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan|(System\.)?(S?Byte|U?Int16|U?Int32|U?Int64|Decimal|Double|Single|Boolean|Char))\??(\[\])?|(I?List|IEnumerable|ICollection|IReadOnlyList|IReadOnlyCollection|HashSet|ISet)<(s?byte|u?short|u?int|u?long|decimal|double|float|bool|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan)\??>|CancellationToken|I(?!Form|Enumerable<|List<|Collection<|ReadOnly|Dictionary<|Set<)[A-Z]\w*(<.*>)?)$)
          - pattern: $P
      # Razor Pages (and controllers): [BindProperty] properties, and every public property of a
      # [BindProperties] class.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $BOUND {
                    ...
                    [BindProperty(...)] public $T $P { get; set; }
                    ...
                  }
              - pattern-inside: |
                  class $BOUND {
                    ...
                    [BindProperty(...)] public $T $P { get; set; } = $INIT;
                    ...
                  }
              - pattern-inside: |
                  [BindProperties]
                  class $BOUND {
                    ...
                    public $T $P { get; set; }
                    ...
                  }
              - pattern-inside: |
                  [BindProperties]
                  class $BOUND {
                    ...
                    public $T $P { get; set; } = $INIT;
                    ...
                  }
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!((s?byte|u?short|u?int|u?long|decimal|double|float|bool|char|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan|(System\.)?(S?Byte|U?Int16|U?Int32|U?Int64|Decimal|Double|Single|Boolean|Char))\??(\[\])?|(I?List|IEnumerable|ICollection|IReadOnlyList|IReadOnlyCollection|HashSet|ISet)<(s?byte|u?short|u?int|u?long|decimal|double|float|bool|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan)\??>|CancellationToken|I(?!Form|Enumerable<|List<|Collection<|ReadOnly|Dictionary<|Set<)[A-Z]\w*(<.*>)?)$)
          - pattern-either:
              - pattern: $P
              - pattern: this.$P
      # Minimal APIs: the string-like parameters (route values, query strings, headers, forms,
      # uploaded files, the body stream) of a handler given to MapGet/MapPost/... as a lambda, or as
      # a method group declared in this file (top level, or in the class that maps it).
      - patterns:
          - pattern-either:
              # A lambda with an expression body or a block body (async too).
              - pattern-inside: $APP.$MAPVERB($ROUTE, ..., (..., $T $P, ...) => $BODY)
              - pattern-inside: $APP.$MAPVERB($ROUTE, ..., (..., $T $P, ...) => { ... })
              - patterns:
                  - pattern-inside: |
                      $RET $HANDLER(..., $T $P, ...) { ... }
                  - pattern-either:
                      - pattern-inside: |
                          <... $APP.$MAPVERB($ROUTE, ..., $HANDLER) ...>;
                          ...
                      # ... or mapped in an extension method of its class (MapXxxApi(this
                      # IEndpointRouteBuilder app)).
                      - pattern-inside: |
                          class $ENDPOINTS { ... $R2 $MAPPER(this $BUILDERTYPE $BUILDER, ...) { ... <... $APP.$MAPVERB($ROUTE, ..., $HANDLER) ...>; ... } ... }
          - metavariable-regex:
              metavariable: $MAPVERB
              regex: ^Map(Get|Post|Put|Delete|Patch|Methods)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(string\??|string\[\]\??|StringValues\??|IFormFile\??|IFormFileCollection\??|IFormCollection\??|Stream\??|PipeReader\??)$
          - pattern: $P
      # Parameters bound from the request by an attribute, in any method or lambda (Minimal API
      # handlers, method-group handlers, Razor Pages handlers); the same types excepted.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $BOUNDM(..., [$FROM(...)] $T $P, ...) { ... }
              - pattern-inside: (..., [$FROM(...)] $T $P, ...) => $BODY
              - pattern-inside: (..., [$FROM(...)] $T $P, ...) => { ... }
          - metavariable-regex:
              metavariable: $FROM
              regex: ^(\w+\.)*(FromQuery|FromRoute|FromForm|FromHeader|FromBody|AsParameters)(Attribute)?$
          - pattern-not-inside: |
              enum $T { ... }
              ...
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!((s?byte|u?short|u?int|u?long|decimal|double|float|bool|char|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan|(System\.)?(S?Byte|U?Int16|U?Int32|U?Int64|Decimal|Double|Single|Boolean|Char))\??(\[\])?|(I?List|IEnumerable|ICollection|IReadOnlyList|IReadOnlyCollection|HashSet|ISet)<(s?byte|u?short|u?int|u?long|decimal|double|float|bool|Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan)\??>|CancellationToken|I(?!Form|Enumerable<|List<|Collection<|ReadOnly|Dictionary<|Set<)[A-Z]\w*(<.*>)?)$)
          - pattern: $P
      # The request: Request (a controller's or page's property), HttpContext.Request and
      # context.Request, a parameter or variable of type HttpRequest, or a variable assigned one
      # of them with var. Its query, form, headers, cookies, route values, path, raw query string
      # and body, and what ReadFormAsync and ReadFromJsonAsync read from it.
      - patterns:
          - pattern-either:
              - pattern: Request.$REQPART
              - pattern: $CTX.Request.$REQPART
              - pattern: (HttpRequest $REQ).$REQPART
              - patterns:
                  - pattern-inside: |
                      var $REQ = $CTX.Request;
                      ...
                  - pattern: $REQ.$REQPART
              - patterns:
                  - pattern-inside: |
                      var $REQ = Request;
                      ...
                  - pattern: $REQ.$REQPART
          - metavariable-regex:
              metavariable: $REQPART
              regex: ^(Query|Form|Headers|Cookies|RouteValues|Path|PathBase|QueryString|Body|BodyReader|ReadFormAsync|ReadFromJsonAsync(<.*>)?)$
      # (End of the shared C# source block; the items below are this rule's own.)
    pattern-propagators:
      # Shared C# propagators (up to the end comment): text added to a StringBuilder (also later
      # in an Append chain), and
      # the value TryGetValue hands out of a request collection. (OpenGrep's --taint-intrafile
      # mode already carries StringBuilder.Insert(index, text) into the builder.)
      - pattern: $SB.Append($X)
        from: $X
        to: $SB
      - pattern: $SB.Append(...). ... .Append($X)
        from: $X
        to: $SB
      - pattern: $SB.AppendLine($X)
        from: $X
        to: $SB
      - pattern: $SB.AppendFormat(..., $X, ...)
        from: $X
        to: $SB
      - pattern: $COLL.TryGetValue($KEY, out $V)
        from: $COLL
        to: $V
      # (End of the shared C# propagators; the items below are this rule's own.)
    pattern-sanitizers:
      # Shared C# sanitizers: conversions to numbers, GUIDs, dates and enums, and allow-lists.
      # (TryParse's out value, a ternary or a switch expression of constants needs no sanitizer.)
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: long.Parse(...)
          - pattern: Guid.Parse(...)
          - pattern: DateTime.Parse(...)
          - pattern: Convert.ToInt32(...)
          - pattern: Convert.ToInt64(...)
          - pattern: Enum.Parse<$ENUM>(...)
          - pattern: Enum.Parse(...)
      # An allow-list: a static readonly Dictionary, HashSet, list or array of literals that no
      # method after it in its class changes (indexer write, Add, TryAdd, AddRange, Insert,
      # InsertRange, UnionWith, SymmetricExceptWith). Its lookups (an indexer, or
      # GetValueOrDefault with a literal default) are clean, and so is the checked value in
      # `T.Contains(x) ? x : <literal>` and after a guard that always leaves the method when the
      # value is not in the table (`if (!T.Contains(x)) return/throw ...;`, ContainsKey too).
      - patterns:
          - pattern-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... }
          - metavariable-regex:
              metavariable: $TABLEINIT
              regex: ^(new\s*((\w+\.)*(Dictionary|SortedDictionary)\s*<[^>]*>)?\s*(\(\s*(StringComparer\.\w+)?\s*\))?\s*\{\s*(\[\s*("([^"\\]|\\.)*"|-?\d+)\s*\]\s*=\s*("([^"\\]|\\.)*"|-?\d+)|\{\s*("([^"\\]|\\.)*"|-?\d+)\s*,\s*("([^"\\]|\\.)*"|-?\d+)\s*\})(\s*,\s*(\[\s*("([^"\\]|\\.)*"|-?\d+)\s*\]\s*=\s*("([^"\\]|\\.)*"|-?\d+)|\{\s*("([^"\\]|\\.)*"|-?\d+)\s*,\s*("([^"\\]|\\.)*"|-?\d+)\s*\}))*\s*,?\s*\}|(new\s*((\w+\.)*(HashSet|SortedSet)\s*<[^>]*>|(\w+\.)*\w*\s*\[\s*\])?\s*(\(\s*(StringComparer\.\w+)?\s*\))?\s*)?\{\s*("([^"\\]|\\.)*"|-?\d+)(\s*,\s*("([^"\\]|\\.)*"|-?\d+))*\s*,?\s*\})$
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE[$A] = $B; ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.Add(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.TryAdd(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.AddRange(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.Insert(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.InsertRange(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.UnionWith(...); ... } ... }
          - pattern-not-inside: |
              class $HOLDER { ... static readonly $DT $TABLE = $TABLEINIT; ... $R $M(...) { ... $TABLE.SymmetricExceptWith(...); ... } ... }
          - pattern-either:
              - pattern: $TABLE[$K]
              - patterns:
                  - pattern: $TABLE.GetValueOrDefault($K, $DEFAULT)
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^("([^"\\]|\\.)*"|-?\d+|null)$
              - patterns:
                  - pattern: '$TABLE.$CONTAINS($X) ? $X : $FALLBACK'
                  - metavariable-regex:
                      metavariable: $CONTAINS
                      regex: ^Contains(Key)?$
                  - metavariable-regex:
                      metavariable: $FALLBACK
                      regex: ^("([^"\\]|\\.)*"|-?\d+|null)$
              - patterns:
                  - pattern-either:
                      # The body leaves the method: its last top-level statement (after at most
                      # two others) is a return or a throw (a single one also in braces).
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) return ...;
                          ...
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) throw $EX;
                          ...
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) { $S1; return ...; }
                          ...
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) { $S1; throw $EX; }
                          ...
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) { $S1; $S2; return ...; }
                          ...
                      - pattern-inside: |
                          if (!$TABLE.$CONTAINS($X)) { $S1; $S2; throw $EX; }
                          ...
                  - metavariable-regex:
                      metavariable: $CONTAINS
                      regex: ^Contains(Key)?$
                  # Not inside the guard itself, where the value failed the check (its block,
                  # or its single return or throw statement).
                  - pattern-not-inside: |
                      if (!$TABLE.$CONTAINS($X)) { ... }
                  - pattern: $X
      # (End of the shared C# sanitizers; the items below are this rule's own.)
      # Path.GetFileName keeps only the last segment (no folder, no root); so does
      # GetFileNameWithoutExtension, and GetExtension returns only the extension.
      - pattern-either:
          - pattern: Path.GetFileName(...)
          - pattern: Path.GetFileNameWithoutExtension(...)
          - pattern: Path.GetExtension(...)
          - pattern: System.IO.Path.GetFileName(...)
          - pattern: System.IO.Path.GetFileNameWithoutExtension(...)
          - pattern: System.IO.Path.GetExtension(...)
      # A full path checked against the base folder: after `var full = Path.GetFullPath(...);` and a
      # guard `if (!full.StartsWith(...))` that always leaves the method (a single return or throw,
      # also in braces, or a block ending in one after one other statement), `full` is clean; never
      # inside the guard itself.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $FULL = Path.GetFullPath(...);
                  ...
              - pattern-inside: |
                  var $FULL = Path.GetFullPath(...);
                  ...
          - pattern-either:
              - pattern-inside: |
                  if (!$FULL.StartsWith(...)) return ...;
                  ...
              - pattern-inside: |
                  if (!$FULL.StartsWith(...)) throw $EX;
                  ...
              - pattern-inside: |
                  if (!$FULL.StartsWith(...)) { $S1; return ...; }
                  ...
              - pattern-inside: |
                  if (!$FULL.StartsWith(...)) { $S1; throw $EX; }
                  ...
          - pattern-not-inside: |
              if (!$FULL.StartsWith(...)) { ... }
          - pattern: $FULL
    pattern-sinks:
      # A file that names a System.IO type or PhysicalFile as a word: a whole-file anchor that gives
      # OpenGrep's prefilter a regex, since short sink words also occur inside other identifiers.
      - patterns:
          - pattern-regex: (?s)\A.*\b(File|Directory|FileStream|FileInfo|DirectoryInfo|PhysicalFile|PhysicalFileResult)\b.*\z
          - pattern-either:
              # System.IO.File: the path it reads, writes, opens, creates or deletes (Copy, Move and
              # Replace: both paths).
              - patterns:
                  - pattern-either:
                      - pattern: File.$FILEOP($PATH, ...)
                      - pattern: System.IO.File.$FILEOP($PATH, ...)
                  - metavariable-regex:
                      metavariable: $FILEOP
                      regex: ^(ReadAllText|ReadAllTextAsync|ReadAllBytes|ReadAllBytesAsync|ReadAllLines|ReadAllLinesAsync|ReadLines|ReadLinesAsync|WriteAllText|WriteAllTextAsync|WriteAllBytes|WriteAllBytesAsync|WriteAllLines|WriteAllLinesAsync|AppendAllText|AppendAllTextAsync|AppendAllLines|AppendAllLinesAsync|AppendText|Open|OpenRead|OpenWrite|OpenText|OpenHandle|Create|CreateText|Delete|Copy|Move|Replace|SetAttributes|SetLastWriteTime|CreateSymbolicLink)$
                  - focus-metavariable: $PATH
              - patterns:
                  - pattern-either:
                      - pattern: File.$FILEOP2($SRC, $PATH, ...)
                      - pattern: System.IO.File.$FILEOP2($SRC, $PATH, ...)
                  - metavariable-regex:
                      metavariable: $FILEOP2
                      regex: ^(Copy|Move|Replace|CreateSymbolicLink)$
                  - focus-metavariable: $PATH
              # System.IO.Directory: the folder it creates, lists, moves or deletes.
              - patterns:
                  - pattern-either:
                      - pattern: Directory.$DIROP($PATH, ...)
                      - pattern: System.IO.Directory.$DIROP($PATH, ...)
                  - metavariable-regex:
                      metavariable: $DIROP
                      regex: ^(CreateDirectory|Delete|GetFiles|GetDirectories|GetFileSystemEntries|EnumerateFiles|EnumerateDirectories|EnumerateFileSystemEntries|Move|CreateSymbolicLink|SetCurrentDirectory)$
                  - focus-metavariable: $PATH
              # FileStream, FileInfo and DirectoryInfo constructors, and the target of
              # Directory.Move.
              - patterns:
                  - pattern-either:
                      - pattern: Directory.Move($SRC, $PATH)
                      - pattern: System.IO.Directory.Move($SRC, $PATH)
                      - pattern: new FileStream($PATH, ...)
                      - pattern: new System.IO.FileStream($PATH, ...)
                      - pattern: new FileInfo($PATH)
                      - pattern: new System.IO.FileInfo($PATH)
                      - pattern: new DirectoryInfo($PATH)
                      - pattern: new System.IO.DirectoryInfo($PATH)
                  - focus-metavariable: $PATH
              # ASP.NET Core results that send a file from disk: ControllerBase and PageModel
              # PhysicalFile, Results/TypedResults.PhysicalFile, PhysicalFileResult, and
              # Results.File with a path (a rooted path is read from disk).
              - patterns:
                  - pattern-either:
                      - pattern: PhysicalFile($PATH, ...)
                      - pattern: $RESULTS.PhysicalFile($PATH, ...)
                      - pattern: new PhysicalFileResult($PATH, ...)
                      - pattern: Results.File($PATH, ...)
                  - focus-metavariable: $PATH
