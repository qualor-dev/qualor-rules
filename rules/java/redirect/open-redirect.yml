rules:
  - id: java.open-redirect
    mode: taint
    languages: [java]
    severity: WARNING
    message: >-
      Data from the HTTP request decides where the response redirects the browser, so a link to
      this site can send a user on to any other site (open redirect, often used for phishing).
      Redirect only to local paths or URLs you build from a fixed origin, or map the request
      value to an allow-list of targets; a path must not start with "//" or "/\".
    metadata:
      title: Redirect to a URL from HTTP request data (Java)
      cwe: ['CWE-601']
      owasp: ['A01:2025', 'A01:2021']
      kind: issue
      severity: medium
      confidence: high
      frameworks: [servlet, spring-mvc, jax-rs]
      sources:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/http/httpservletresponse
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/servletrequest
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/http/httpservletrequest
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/return-types.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/viewresolver.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/servlet/view/RedirectView.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/ResponseEntity.HeadersBuilder.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/HttpHeaders.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-uri-building.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestparam.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/core/response
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/queryparam
        - https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1
        - https://url.spec.whatwg.org/
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/httpentity.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/RequestEntity.html
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/StringBuilder.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/multipart-forms.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/bind/annotation/RequestPart.html
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A handler parameter without an annotation is not a source (the Jakarta REST entity
    #   parameter, a Spring MVC simple-type parameter), except a Spring MVC HttpEntity or
    #   RequestEntity (the request body and headers); and only the scalar types of the source
    #   block count as safe: an enum, a `List<Long>` or an `Optional<Long>` parameter is still a
    #   source, as in java.sql-injection.
    # - Conditions are not evaluated: a check that the target is a local path
    #   (startsWith("/") and not "//" or "/\") and a switch over a value computed from constants
    #   do not stop the request data.
    # - A fixed target is recognised when its text starts with a literal origin and a "/", "?"
    #   or "#" after the host, a local path "/x" (not "//" or "/\"), a relative path with a
    #   separator ("orders/", "page?x="), a "?" or "#", also after "redirect:"; a static final
    #   String origin followed by such a literal (or a static final origin that ends with one),
    #   or a Spring @Value base followed by a local path or "?" / "#" (a configured value may
    #   have no host); a format string that starts the same way or puts such a base
    #   first; and the UriComponentsBuilder and URL forms of java.ssrf. A host constant in the
    #   middle of the string, a static final local path ("/app") as the base, a
    #   UriComponentsBuilder.fromPath(...) target and a Location set in a ResponseEntity headers
    #   lambda are not recognised.
    # - Allow-list lookups are recognised only as Map.of(...) of literals and constants (in a
    #   static final field or in place) read with get(key) or getOrDefault(key, a constant), and as
    #   valueOf of an enum declared in this file (or Enum.valueOf): a literal Map.ofEntries table
    #   and valueOf of an enum from another file still pass the request data on.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.ServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.ServletRequest $R).$GET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $R).$GET(...)
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getRequestURI|getRequestURL|getPathInfo|getReader|getInputStream|getPart|getParts)$
      # Spring MVC and Jakarta REST: the controller-method parameters bound from the request
      # (query, path, matrix, header, cookie, form, body, multipart part, model attribute).
      # Numbers, booleans, UUIDs and dates are converted by the framework and cannot carry
      # injected text.
      - patterns:
          # @$ANN(...) also matches an annotation written without parentheses.
          - pattern-inside: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(\w+\.)*(RequestParam|PathVariable|MatrixVariable|RequestHeader|CookieValue|RequestBody|RequestPart|ModelAttribute|PathParam|QueryParam|MatrixParam|HeaderParam|CookieParam|FormParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(\w+\.)*(byte|short|int|long|float|double|boolean|char|Byte|Short|Integer|Long|Float|Double|Boolean|Character|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant)$)
          - pattern: $P
      # Spring MVC: an HttpEntity or RequestEntity parameter holds the request body.
      - patterns:
          # @$MAP(...) also matches a mapping annotation written without parentheses.
          - pattern-inside: |
              @$MAP(...)
              $RET $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
          - metavariable-regex:
              metavariable: $T
              regex: ^(org\.springframework\.http\.)?(HttpEntity|RequestEntity)\s*<
          - pattern: $P
    pattern-propagators:
      # Redirect targets assembled with a StringBuilder or StringBuffer.
      - pattern: $SB.append($X)
        from: $X
        to: $SB
      # ... also later in an append chain.
      - pattern: $SB.append(...). ... .append($X)
        from: $X
        to: $SB
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: Integer.valueOf(...)
      - pattern: Long.valueOf(...)
      # A target whose text starts with a fixed origin ("https://host/..."), a local path ("/path",
      # but not "//" or "/\", which a browser reads as another host), a relative path with a
      # separator ("orders/", "page?x=") or a query or fragment, also after Spring's "redirect:"
      # prefix: the request data only reaches the path or the query.
      - patterns:
          - pattern: $A + $B
          - metavariable-regex:
              metavariable: $A
              regex: ^"(redirect:)?([A-Za-z][A-Za-z0-9+.-]*://[^/?#"\s\\]+[/?#]|/[^/\\"]|[?#]|[^/:?#\\"\s]+[/?#])
      - patterns:
          - pattern: String.format("$FMT", ...)
          - metavariable-regex:
              metavariable: $FMT
              regex: ^(redirect:)?([A-Za-z][A-Za-z0-9+.-]*://[^/?#%\s\\]+[/?#]|/[^/%\\]|[?#]|[^/:?#%\\\s]+[/?#])
      # A base URL held in a static final String field (a literal origin) or set from Spring
      # configuration (@Value), followed by a literal that starts with "/", "?" or "#": the
      # request data only reaches the path or the query. A base that is followed directly by
      # request data could still have its host extended ("@evil.example"). A configured base may
      # have no host at all (an empty context path), so after it the literal must be a local path
      # ("/x", not "/" alone, "//" or "/\") or start with "?" or "#".
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+
          - pattern-either:
              - pattern: $BASE + "$S" + $X
              - pattern: $BASE + "$S" + $X + $Y
              - pattern: $BASE + "$S" + $X + $Y + $Z
              - pattern: $BASE + "$S" + $X + $Y + $Z + $W
          - metavariable-regex:
              metavariable: $S
              regex: ^[/?#]
      - patterns:
          - pattern-inside: |
              class $C { ... @Value(...) $T $BASE; ... }
          - pattern-either:
              - pattern: $BASE + "$S" + $X
              - pattern: $BASE + "$S" + $X + $Y
              - pattern: $BASE + "$S" + $X + $Y + $Z
              - pattern: $BASE + "$S" + $X + $Y + $Z + $W
          - metavariable-regex:
              metavariable: $S
              regex: ^(/[^/\\]|[?#])
      # The application's context path followed by a local path literal ("/orders/", not "/" alone).
      - patterns:
          - pattern-either:
              - pattern: $REQ.getContextPath() + "$S" + $X
              - pattern: $REQ.getContextPath() + "$S" + $X + $Y
              - pattern: $REQ.getContextPath() + "$S" + $X + $Y + $Z
          - metavariable-regex:
              metavariable: $S
              regex: ^(/[^/\\]|[?#])
      # The same bases after Spring's "redirect:" prefix.
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+
          - pattern-either:
              - pattern: '"redirect:" + $BASE + "$S" + $X'
              - pattern: '"redirect:" + $BASE + "$S" + $X + $Y'
              - pattern: '"redirect:" + $BASE + "$S" + $X + $Y + $Z'
          - metavariable-regex:
              metavariable: $S
              regex: ^[/?#]
      - patterns:
          - pattern-inside: |
              class $C { ... @Value(...) $T $BASE; ... }
          - pattern-either:
              - pattern: '"redirect:" + $BASE + "$S" + $X'
              - pattern: '"redirect:" + $BASE + "$S" + $X + $Y'
              - pattern: '"redirect:" + $BASE + "$S" + $X + $Y + $Z'
          - metavariable-regex:
              metavariable: $S
              regex: ^(/[^/\\]|[?#])
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+[/?#]
          - pattern-either:
              - pattern: '"redirect:" + $BASE + $X'
              - pattern: '"redirect:" + $BASE + $X + $Y'
              - pattern: '"redirect:" + $BASE + $X + $Y + $Z'
      # A static final origin that already ends with "/", "?" or "#" after the host.
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+[/?#]
          - pattern-either:
              - pattern: $BASE + $X
              - pattern: $BASE + $X + $Y
              - pattern: $BASE + $X + $Y + $Z
              - pattern: $BASE + $X + $Y + $Z + $W
      # A format string that puts such a base first and a separator right after it (for a
      # configured base, a local path or "?" / "#").
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+
          - pattern: String.format("$FMT", $BASE, ...)
          - metavariable-regex:
              metavariable: $FMT
              regex: ^%s[/?#]
      - patterns:
          - pattern-inside: |
              class $C { ... @Value(...) $T $BASE; ... }
          - pattern: String.format("$FMT", $BASE, ...)
          - metavariable-regex:
              metavariable: $FMT
              regex: ^%s(/[^/\\%]|[?#])
      # A UriComponentsBuilder started from such a base, unless a later call sets the scheme,
      # host, port, user info or the whole URI.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $C { ... static final String $BASE = "$ORIGIN"; ... }
                  - metavariable-regex:
                      metavariable: $ORIGIN
                      regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+
              - pattern-inside: |
                  class $C { ... @Value(...) $T $BASE; ... }
          # Up to eight calls between the factory and the end of the chain, none of which sets the
          # scheme, host, port, user info or the whole URI.
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$END(...)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M4
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M4
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M5
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M4
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M5
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M6
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$M7(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$M7(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M4
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M5
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M6
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M7
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
              - patterns:
                  - pattern-either:
                      - pattern: UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$M7(...).$M8(...).$END(...)
                      - pattern: org.springframework.web.util.UriComponentsBuilder.$FROM($BASE).$M1(...).$M2(...).$M3(...).$M4(...).$M5(...).$M6(...).$M7(...).$M8(...).$END(...)
                  - metavariable-regex:
                      metavariable: $M1
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M2
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M3
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M4
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M5
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M6
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M7
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
                  - metavariable-regex:
                      metavariable: $M8
                      regex: ^(?!(host|scheme|uri|port|userInfo|uriComponents)$)
          - metavariable-regex:
              metavariable: $FROM
              regex: ^(fromHttpUrl|fromUriString)$
          - metavariable-regex:
              metavariable: $END
              regex: ^(toUriString|toUri|build|buildAndExpand)$
      # URL(protocol, host, file) with a literal protocol and host, and a relative URL resolved
      # against a literal base URL.
      - pattern: new URL("...", "...", ...)
      - pattern: new java.net.URL("...", "...", ...)
      # An absolute spec ("https://other/") or a network-path spec ("//other/") would replace the
      # base's host, so the spec must start with a literal relative path ("items/", "/items").
      - patterns:
          - pattern-either:
              - pattern: new URL(new URL("$ORIGIN"), "$REL" + $X)
              - pattern: new URL(new URL("$ORIGIN"), "$REL" + $X + $Y)
              - pattern: new URL(new URL("$ORIGIN"), "$REL" + $X + $Y + $Z)
              - pattern: new java.net.URL(new java.net.URL("$ORIGIN"), "$REL" + $X)
              - pattern: new java.net.URL(new java.net.URL("$ORIGIN"), "$REL" + $X + $Y)
              - pattern: new java.net.URL(new java.net.URL("$ORIGIN"), "$REL" + $X + $Y + $Z)
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"]+[/?#]
          - metavariable-regex:
              metavariable: $REL
              regex: ^(/[^/\\]|[?#]|[^/:?#\\]+[/?#])
      # A UriComponentsBuilder started from a literal URL, or given a literal scheme and host,
      # unless a later call sets the scheme, host, port, user info or the whole URI.
      - patterns:
          - pattern-either:
              - pattern: $UB.toUriString()
              - pattern: $UB.toUri()
              - pattern: $UB.build(...)
              - pattern: $UB.buildAndExpand(...)
          - metavariable-regex:
              metavariable: $UB
              regex: (?s)^(?!.*\.\s*(host|scheme|uri|port|userInfo|uriComponents)\s*\((?!\s*"[^"]*"\s*\)))(org\.springframework\.web\.util\.)?UriComponentsBuilder\s*\.\s*((fromHttpUrl|fromUriString)\(\s*"[A-Za-z][A-Za-z0-9+.-]*://[^/?#"{\s]+([/?#][^"]*)?"\s*\)|newInstance\(\)\s*\.\s*scheme\(\s*"[A-Za-z]+"\s*\)\s*\.\s*host\(\s*"[^"{]+"\s*\))
      # Allow-list lookups yield only values the code holds: Map.of(...) of literals and constants,
      # in a static final field or in place, looked up with get(key) or getOrDefault(key, a
      # literal or constant), and constants of an enum declared in this file. A map filled from
      # request data, or a lookup whose fallback is request data, stays tainted.
      - patterns:
          - pattern-inside: |
              class $C { ... static final $MT $MAP = $INIT; ... }
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
          - pattern-either:
              - pattern: $MAP.get($K)
              - patterns:
                  - pattern: $MAP.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
      - patterns:
          - pattern-either:
              - pattern: $INIT.get($K)
              - patterns:
                  - pattern: $INIT.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
      - pattern: Enum.valueOf(...)
      - pattern: java.lang.Enum.valueOf(...)
      - patterns:
          # An enum nested in a class is matched by the class-then-enum form too.
          - pattern-either:
              - pattern-inside: |
                  class $X { ... }
                  ...
                  enum $E { ... }
              - pattern-inside: |
                  enum $E { ... }
                  ...
                  class $X { ... }
          - pattern: $E.valueOf(...)
    pattern-sinks:
      # Servlet: sendRedirect and the Location header.
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.http.HttpServletResponse $R).sendRedirect($U, ...)
              - pattern: (jakarta.servlet.http.HttpServletResponse $R).sendRedirect($U, ...)
              - pattern: (javax.servlet.http.HttpServletResponse $R).setHeader("=~/(?i)^location$/", $U)
              - pattern: (jakarta.servlet.http.HttpServletResponse $R).setHeader("=~/(?i)^location$/", $U)
              - pattern: (javax.servlet.http.HttpServletResponse $R).addHeader("=~/(?i)^location$/", $U)
              - pattern: (jakarta.servlet.http.HttpServletResponse $R).addHeader("=~/(?i)^location$/", $U)
          - focus-metavariable: $U
      # Spring MVC: a view name with the "redirect:" prefix (returned, or given to a ModelAndView),
      # in place or built with String.format.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $A + $B
                  - metavariable-regex:
                      metavariable: $A
                      regex: '^"redirect:'
              - patterns:
                  - pattern: String.format("$FMT", ...)
                  - metavariable-regex:
                      metavariable: $FMT
                      regex: '^redirect:'
      # Spring MVC: RedirectView, and a Location set on a ResponseEntity or HttpHeaders.
      - patterns:
          - pattern-either:
              - pattern: new org.springframework.web.servlet.view.RedirectView($U, ...)
              - pattern: (org.springframework.web.servlet.view.RedirectView $V).setUrl($U)
              - pattern: (org.springframework.http.HttpHeaders $H).setLocation($U)
              - pattern: (org.springframework.http.HttpHeaders $H).set(org.springframework.http.HttpHeaders.LOCATION, $U)
              - pattern: (org.springframework.http.HttpHeaders $H).add(org.springframework.http.HttpHeaders.LOCATION, $U)
              - pattern: (org.springframework.http.HttpHeaders $H).set("=~/(?i)^location$/", $U)
              - pattern: (org.springframework.http.HttpHeaders $H).add("=~/(?i)^location$/", $U)
              - patterns:
                  - pattern: $B.location($U)
                  - metavariable-regex:
                      metavariable: $B
                      regex: (?s)^(org\.springframework\.http\.)?ResponseEntity\s*\.
              - patterns:
                  - pattern-either:
                      - pattern: $B.header(org.springframework.http.HttpHeaders.LOCATION, $U)
                      - pattern: $B.header("=~/(?i)^location$/", $U)
                  - metavariable-regex:
                      metavariable: $B
                      regex: (?s)^(org\.springframework\.http\.)?ResponseEntity\s*\.
          - focus-metavariable: $U
      # Jakarta REST: seeOther, temporaryRedirect, and a Location set on a response builder.
      - patterns:
          - pattern-either:
              - pattern: javax.ws.rs.core.Response.seeOther($U)
              - pattern: jakarta.ws.rs.core.Response.seeOther($U)
              - pattern: javax.ws.rs.core.Response.temporaryRedirect($U)
              - pattern: jakarta.ws.rs.core.Response.temporaryRedirect($U)
              - pattern: javax.ws.rs.core.Response.$F(...). ... .location($U)
              - pattern: jakarta.ws.rs.core.Response.$F(...). ... .location($U)
              - pattern: javax.ws.rs.core.Response.$F(...). ... .header("=~/(?i)^location$/", $U)
              - pattern: jakarta.ws.rs.core.Response.$F(...). ... .header("=~/(?i)^location$/", $U)
              - pattern: javax.ws.rs.core.Response.$F(...). ... .header(javax.ws.rs.core.HttpHeaders.LOCATION, $U)
              - pattern: jakarta.ws.rs.core.Response.$F(...). ... .header(jakarta.ws.rs.core.HttpHeaders.LOCATION, $U)
          - focus-metavariable: $U
