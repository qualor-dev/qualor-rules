              ...
          - pattern-not-inside: |
              try {
                ...
                $F.setProperty(javax.xml.stream.XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.setProperty(javax.xml.stream.XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, Boolean.FALSE);
                ...
              } catch ($EX $E) {
                ...
