rules:
  - id: java.xxe
    languages: [java]
    severity: ERROR
    message: >-
      This XML parser is created and used without disabling DTDs or external entities, so a
      document can make it read local files, call internal URLs (XML external entities) or expand
      entities without bound. Before using the factory, reader or builder, set the feature
      "http://apache.org/xml/features/disallow-doctype-decl" to true (StAX: XMLInputFactory.SUPPORT_DTD
      to false), or deny external access with XMLConstants.ACCESS_EXTERNAL_DTD set to "" (for a
      SchemaFactory or a Validator, ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA both set to "").
    metadata:
      title: XML parser that resolves external entities (Java)
      cwe: ['CWE-611', 'CWE-776']
      owasp: ['A02:2025', 'A05:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [jaxp, dom4j, jdom]
      sources:
        - https://cwe.mitre.org/data/definitions/611.html
        - https://cwe.mitre.org/data/definitions/776.html
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
        - https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration
        - https://top10.owasp.org/2021/A05_2021-Security_Misconfiguration/
        - https://docs.oracle.com/en/java/javase/25/security/java-api-xml-processing-jaxp-security-guide.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/module-summary.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/XMLConstants.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/parsers/DocumentBuilderFactory.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/parsers/SAXParserFactory.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/stream/XMLInputFactory.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/transform/TransformerFactory.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/validation/SchemaFactory.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/validation/Schema.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/validation/Validator.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/org/xml/sax/helpers/XMLReaderFactory.html
        - https://dom4j.github.io/javadoc/2.1.3/org/dom4j/io/SAXReader.html
        - https://github.com/dom4j/dom4j/releases
        - https://www.jdom.org/docs/apidocs/org/jdom2/input/SAXBuilder.html
      since: 2026.10.1
    # The JDK's parsers process DTDs and resolve external entities by default (JDK 25: the
    # jdk.xml.dtd.support default is "allow"; secure processing is on by default but does not
    # restrict external access unless it is set explicitly through the API).
    # Known limits (each has a `todo` line in the test file):
    # - Only a factory, reader or builder created in the same method, or in a field initialised
    #   where it is declared, is checked: one created by a helper, set up by a helper, or assigned
    #   to a field in a constructor is not seen, nor is a system-wide setting
    #   (javax.xml.accessExternalDTD, jdk.xml.dtd.support, a JAXP configuration file).
    # - A DocumentBuilder is reported where it is created, and only when the same method parses
    #   with it; a builder returned or stored and used elsewhere is not followed.
    # - A rejecting EntityResolver or XMLResolver is not recognised as a safe form, nor is a
    #   feature or property name held in a constant of a class in another file.
    # - A setting is recognised before the use in the same block, or in a try block (with catch
    #   clauses, a finally clause or both) or a try-with-resources block of one resource that ends
    #   before it (one of two or more resources is not recognised); for a field initialised at its
    #   declaration, anywhere in a static block, constructor or method. A setting made only under
    #   a condition is not hardening and is reported, except inside such a try block, or for
    #   secure processing anywhere after its built-in factory is created, or on a SAXParser or
    #   its XMLReader anywhere after it was created, where it is taken as unconditional; a use
    #   inside the try block that holds a setting is taken as made after it. Each of the three
    #   entity features and each SchemaFactory or Validator property is checked on its own.
    # - A SchemaFactory counts as safe only with ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA
    #   both "" (or secure processing set on newDefaultInstance); so does a Validator, unless its
    #   Schema is made in sight from a SchemaFactory also created in sight (in the same method or
    #   fields, in place, or in a static block or constructor of the class), whose newSchema the
    #   SchemaFactory branch checks instead: the Schema.newValidator javadoc says implementations
    #   should give the Validator the factory's properties. A Schema made by a helper method,
    #   assigned in another method, or named with `this.` only where it is used is not traced
    #   back, so a Validator of a hardened factory's Schema is reported there; a Validator that
    #   sets a property back to "all" on such a Schema is missed; a Validator assigned to a field
    #   in a constructor is not checked; a Validator is reported only when it validates a
    #   StreamSource or SAXSource, not a Source handed in.
    # - A TransformerFactory is reported only when its transformer parses a StreamSource or
    #   SAXSource (an identity transform of a DOM tree parses nothing); a stylesheet parsed by
    #   newTransformer(Source) or newTemplates(Source) is not reported, and a Templates object is
    #   not followed.
    # - A dom4j SAXReader or JDOM SAXBuilder given its own XMLReader (or reader factory) is not
    #   reported: the reader's settings are not followed.
    # The safe-setting exclusions of each branch are generated by tools/xxe-exclusions.mjs from its
    # SETTINGS table (parsers, builders, readers, transformers; one branch per unmet entity
    # feature) and its SCHEMA_REQUIREMENTS table (SchemaFactory and Validator: one branch per unmet
    # property); a test fails when they drift.
    pattern-either:
      # Parsers, document builders, readers and transformers.
      - patterns:
          - pattern-either:
              # JAXP: a SAXParser or StAX reader made from a factory that was created in the same
              # method or in a field, or in place ($F is then the factory call).
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $F = javax.xml.parsers.SAXParserFactory.$NEW(...);
                                  ...
                              - pattern-inside: |
                                  $F = javax.xml.stream.XMLInputFactory.$NEW(...);
                                  ...
                          - pattern: $F.$USE(...)
                          - metavariable-regex:
                              metavariable: $NEW
                              regex: ^new(Default)?(NS)?(Instance|Factory)$
                      - patterns:
                          - pattern: $F.$USE(...)
                          - pattern-either:
                              - pattern: javax.xml.parsers.SAXParserFactory.$NEW(...).$USE(...)
                              - pattern: javax.xml.stream.XMLInputFactory.$NEW(...).$USE(...)
                          - metavariable-regex:
                              metavariable: $NEW
                              regex: ^new(Default)?(NS)?(Instance|Factory)$
                  - metavariable-regex:
                      metavariable: $USE
                      regex: ^(newSAXParser|createXMLStreamReader|createXMLEventReader)$
              # JAXP DocumentBuilderFactory: the builder, where it is created, when the same method
              # parses with it (newDocument() and getDOMImplementation() parse nothing).
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              $F = javax.xml.parsers.DocumentBuilderFactory.$NEW(...);
                              ...
                          - pattern: $F.newDocumentBuilder()
                      - patterns:
                          - pattern: $F.newDocumentBuilder()
                          - pattern: javax.xml.parsers.DocumentBuilderFactory.$NEW(...).newDocumentBuilder()
                  - metavariable-regex:
                      metavariable: $NEW
                      regex: ^new(Default)?(NS)?Instance$
                  - pattern-either:
                      - pattern-inside: $F.newDocumentBuilder().parse(...)
                      - pattern-inside: |
                          $B = $F.newDocumentBuilder();
                          ...
                          $B.parse(...);
                      - pattern-inside: |
                          $B = $F.newDocumentBuilder();
                          ...
                          return <... $B.parse(...) ...>;
                      - pattern-inside: |
                          $B = $F.newDocumentBuilder();
                          ...
                          $X = <... $B.parse(...) ...>;
                      - pattern-inside: |
                          $B = $F.newDocumentBuilder();
                          ...
                          $FN(..., <... $B.parse(...) ...>, ...);
                      - pattern-inside: |
                          $B = $F.newDocumentBuilder();
                          ...
                          $O.$FN(..., <... $B.parse(...) ...>, ...);
              # JAXP TransformerFactory: a transformer that parses a StreamSource or SAXSource.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $F = javax.xml.transform.TransformerFactory.$NEW(...);
                                  ...
                              - pattern-inside: |
                                  $F = ($CAST) javax.xml.transform.TransformerFactory.$NEW(...);
                                  ...
                          - pattern-either:
                              - patterns:
                                  - pattern-inside: |
                                      $TR = $F.newTransformer(...);
                                      ...
                                  - pattern: $TR.transform($SRC, ...)
                              - pattern: $F.newTransformer(...).transform($SRC, ...)
                      # A transformer from a factory made in place, kept in a variable.
                      - patterns:
                          - pattern-inside: |
                              $TR = $F.newTransformer(...);
                              ...
                          - pattern-inside: |
                              $TR = javax.xml.transform.TransformerFactory.$NEW(...).newTransformer(...);
                              ...
                          - pattern: $TR.transform($SRC, ...)
                      - patterns:
                          - pattern: $F.newTransformer(...).transform($SRC, ...)
                          - pattern: javax.xml.transform.TransformerFactory.$NEW(...).newTransformer(...).transform($SRC, ...)
                  # The source is parsed: a StreamSource or SAXSource, in place or in a variable.
                  - pattern-either:
                      - pattern-inside: |
                          $SRC = new javax.xml.transform.stream.StreamSource(...);
                          ...
                      - pattern-inside: |
                          $SRC = new javax.xml.transform.sax.SAXSource(...);
                          ...
                      - pattern: $X.transform(new javax.xml.transform.stream.StreamSource(...), ...)
                      - pattern: $X.transform(new javax.xml.transform.sax.SAXSource(...), ...)
              # SAX XMLReaderFactory, dom4j SAXReader and JDOM SAXBuilder with their own defaults.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              $F = org.xml.sax.helpers.XMLReaderFactory.createXMLReader(...);
                              ...
                          - pattern: $F.parse(...)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $F = new org.dom4j.io.SAXReader();
                                  ...
                              - pattern-inside: |
                                  $F = new org.dom4j.io.SAXReader(true);
                                  ...
                              - pattern-inside: |
                                  $F = new org.dom4j.io.SAXReader(false);
                                  ...
                          - pattern: $F.read(...)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $F = new org.jdom2.input.SAXBuilder();
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom2.input.SAXBuilder(true);
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom2.input.SAXBuilder(false);
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom2.input.SAXBuilder(org.jdom2.input.sax.XMLReaders.$KIND);
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom.input.SAXBuilder();
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom.input.SAXBuilder(true);
                                  ...
                              - pattern-inside: |
                                  $F = new org.jdom.input.SAXBuilder(false);
                                  ...
                          - pattern: $F.build(...)
                      # In place: $F is the constructor or factory call itself.
                      - patterns:
                          - pattern-either:
                              - pattern: $F.parse(...)
                              - pattern: $F.read(...)
                              - pattern: $F.build(...)
                          - pattern-either:
                              - pattern: org.xml.sax.helpers.XMLReaderFactory.createXMLReader(...).parse(...)
                              - pattern: new org.dom4j.io.SAXReader().read(...)
                              - pattern: new org.jdom2.input.SAXBuilder().build(...)
                              - pattern: new org.jdom.input.SAXBuilder().build(...)
          # BEGIN generated by tools/xxe-exclusions.mjs from its SETTINGS table; do not edit by hand.
          # Set on the factory, reader or builder: before.
          - pattern-not-inside: |
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
              ...
          - pattern-not-inside: |
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", Boolean.TRUE);
              ...
          - pattern-not-inside: |
              $F.$SET(javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD, "");
              ...
          - pattern-not-inside: |
              $F.$SET("http://javax.xml.XMLConstants/property/accessExternalDTD", "");
              ...
          - pattern-not-inside: |
              $F.setProperty(javax.xml.stream.XMLInputFactory.SUPPORT_DTD, false);
              ...
          - pattern-not-inside: |
              $F.setProperty(javax.xml.stream.XMLInputFactory.SUPPORT_DTD, Boolean.FALSE);
              ...
          - pattern-not-inside: |
              $F.setProperty("javax.xml.stream.supportDTD", false);
              ...
          - pattern-not-inside: |
              $F.setProperty("javax.xml.stream.supportDTD", Boolean.FALSE);
              ...
          - pattern-not-inside: |
              $F.setProperty(javax.xml.stream.XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
              ...
          - pattern-not-inside: |
              $F.setProperty(javax.xml.stream.XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, Boolean.FALSE);
              ...
          - pattern-not-inside: |
              $F.setProperty("javax.xml.stream.isSupportingExternalEntities", false);
              ...
          - pattern-not-inside: |
              $F.setProperty("javax.xml.stream.isSupportingExternalEntities", Boolean.FALSE);
              ...
          # Set on the factory, reader or builder: try block before.
          - pattern-not-inside: |
              try {
                ...
                $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", Boolean.TRUE);
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.$SET(javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD, "");
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.$SET("http://javax.xml.XMLConstants/property/accessExternalDTD", "");
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.setProperty(javax.xml.stream.XMLInputFactory.SUPPORT_DTD, false);
                ...
              } catch ($EX $E) {
                ...
              }
              ...
          - pattern-not-inside: |
              try {
                ...
                $F.setProperty(javax.xml.stream.XMLInputFactory.SUPPORT_DTD, Boolean.FALSE);
                ...
              } catch ($EX $E) {
                ...
