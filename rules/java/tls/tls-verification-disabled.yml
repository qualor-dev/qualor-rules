rules:
  - id: java.tls-verification-disabled
    languages: [java]
    severity: ERROR
    message: >-
      This TLS client check accepts anything: a trust manager whose checkServerTrusted returns
      without checking the certificate chain, or an Apache HttpClient TrustStrategy that returns
      true (TrustAllStrategy), trusts every server certificate, and a HostnameVerifier that returns
      true (NoopHostnameVerifier) accepts a certificate issued for another host. Anyone on the
      network path can then pose as the server and read or change the traffic. Use the default
      trust managers (TrustManagerFactory over a key store that holds your private CA), delegate to
      them, or throw CertificateException when your own check fails; keep the default host name
      verification.
    metadata:
      title: TLS certificate or host name verification disabled (Java)
      cwe: ['CWE-295']
      owasp: ['A07:2025', 'A07:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [javax.net.ssl, okhttp, jax-rs, apache-httpclient]
      sources:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://top10.owasp.org/2025/A07_2025-Authentication_Failures/
        - https://top10.owasp.org/2021/A07_2021-Identification_and_Authentication_Failures/
        - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/X509TrustManager.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/X509ExtendedTrustManager.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/HostnameVerifier.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/HttpsURLConnection.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/SSLContext.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/TrustManagerFactory.html
        - https://docs.oracle.com/en/java/javase/25/security/java-secure-socket-extension-jsse-reference-guide.html
        - https://javadoc.io/static/com.squareup.okhttp3/okhttp/3.14.9/okhttp3/OkHttpClient.Builder.html
        - https://jakarta.ee/specifications/platform/10/apidocs/jakarta/ws/rs/client/ClientBuilder.html
        - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/conn/ssl/NoopHostnameVerifier.html
        - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/conn/ssl/AllowAllHostnameVerifier.html
        - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/conn/ssl/TrustAllStrategy.html
        - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/conn/ssl/SSLConnectionSocketFactory.html
        - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/impl/client/HttpClientBuilder.html
        - https://hc.apache.org/httpcomponents-core-4.4.x/current/httpcore/apidocs/org/apache/http/ssl/SSLContextBuilder.html
        - https://hc.apache.org/httpcomponents-core-4.4.x/current/httpcore/apidocs/org/apache/http/ssl/TrustStrategy.html
        - https://hc.apache.org/httpcomponents-client-5.4.x/current/httpclient5/apidocs/org/apache/hc/client5/http/ssl/NoopHostnameVerifier.html
        - https://hc.apache.org/httpcomponents-client-5.4.x/current/httpclient5/apidocs/org/apache/hc/client5/http/ssl/TrustAllStrategy.html
        - https://hc.apache.org/httpcomponents-client-5.4.x/current/httpclient5/apidocs/org/apache/hc/client5/http/ssl/ClientTlsStrategyBuilder.html
        - https://hc.apache.org/httpcomponents-core-5.3.x/current/httpcore5/apidocs/org/apache/hc/core5/ssl/SSLContextBuilder.html
        - https://hc.apache.org/httpcomponents-core-5.3.x/current/httpcore5/apidocs/org/apache/hc/core5/ssl/TrustStrategy.html
        - https://maven.apache.org/guides/introduction/introduction-to-the-standard-directory-layout.html
        - https://maven.apache.org/surefire/maven-surefire-plugin/test-mojo.html#includes
        - https://maven.apache.org/surefire/maven-failsafe-plugin/integration-test-mojo.html#includes
        - https://docs.gradle.org/current/userguide/java_testing.html
        - https://docs.gradle.org/current/userguide/jvm_test_suite_plugin.html
      since: 2026.10.2
    # Test code is out of scope (ruling F10 of 2026-10-04, as the Go, Python and JS rules): tests
    # often talk to a local server with a self-signed certificate. Excluded are the Maven and
    # Gradle test source trees (src/test/, also Gradle's src/testFixtures/, src/integrationTest/
    # and src/intTest/, at any depth) and the class files the Surefire and Failsafe plugins run by
    # default whose names end in Test, Tests, TestCase, IT or ITCase. Their Test*.java and
    # IT*.java defaults are left out: they would also skip production classes such as
    # TestimonialService or ITunesClient.
    # Accepted trade-off: a production class whose name ends in Test or IT is skipped too.
    # Only client checks are reported: checkClientTrusted is what a server calls, and an empty one
    # means "clients need no certificate", so it is never reported.
    # Known limits (each has a `todo` line in the test file):
    # - A checkServerTrusted that hands the whole chain to any call counts as checking it, also a
    #   log message (`Arrays.toString(chain)`) and a delegation to another trust manager whose
    #   CertificateException is caught and only logged. One certificate of the chain, a copy of
    #   it or the variable of a loop over it counts only when given to another trust manager's
    #   checkServerTrusted or to a method of the same class, whatever that method does (an empty
    #   or log-only method of the class hides a trust-all manager). One that throws anywhere
    #   counts too, also when its only throw is the IllegalArgumentException for a null or empty
    #   chain.
    # - A trust-all manager given only to a server context (whose checkServerTrusted is never
    #   called) is still reported.
    # - A lambda is a HostnameVerifier only when it is given to setHostnameVerifier,
    #   setDefaultHostnameVerifier, setSSLHostnameVerifier, hostnameVerifier (OkHttp, Jakarta
    #   REST) or Apache HttpClient 4's SSLConnectionSocketFactory, assigned to a HostnameVerifier
    #   variable or cast to one; and a TrustStrategy only when it is given to loadTrustMaterial or
    #   assigned to a TrustStrategy variable. One returned by a helper method is missed.
    # - A TrustStrategy (like a HostnameVerifier or trust manager) that throws anywhere counts as
    #   a check, also when it trusts every other chain without the trust manager.
    # - Apache HttpClient's TrustSelfSignedStrategy, which trusts any self-signed certificate, is
    #   not checked.
    paths:
      exclude:
        - 'src/test/'
        - 'src/testFixtures/'
        - 'src/integrationTest/'
        - 'src/intTest/'
        - '*Test.java'
        - '*Tests.java'
        - '*TestCase.java'
        - '*IT.java'
        - '*ITCase.java'
    pattern-either:
      # X509TrustManager / X509ExtendedTrustManager: a checkServerTrusted that returns normally
      # whatever the chain ("returns normally" means "trusted", javadoc). It checks something when
      # it throws (CertificateException) or hands the chain, a copy of it or one of its
      # certificates to a call (another trust manager's checkServerTrusted, a pin check, a helper). A certificate's own checkValidity() or verify()
      # whose failure is caught and not thrown again checks nothing.
      - patterns:
          - pattern: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, String $AUTH, ...) { ... }
          - pattern-not: |
              void checkServerTrusted(...) { ... throw $E; ... }
          - pattern-not: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $F(..., $CHAIN, ...); ... }
          # ... also one certificate of it (directly, in a new array or through a variable), a
          # copy of it, or each certificate in a loop, but only when the call can check it:
          # another trust manager's checkServerTrusted, or a method of the same class (a pin
          # check, say). A log line, a print, requireNonNull or valueOf checks nothing.
          - pattern-not: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $D.checkServerTrusted(..., new $T[] {..., $CHAIN[$I], ...}, ...); ... }
          - pattern-not: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN[$I]; ... $D.checkServerTrusted(..., new $T[] {..., $X, ...}, ...); ... }
          - pattern-not: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN.clone(); ... $D.checkServerTrusted(..., $X, ...); ... }
          # (The method of the class is matched by its declaration, after or before the trust
          # check; an empty overload between the two is still reported.)
          - pattern-not-inside: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $H(..., $CHAIN[$I], ...); ... }
              ...
              $R $H(...) { ... }
          - pattern-not-inside: |
              $R $H(...) { ... }
              ...
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $H(..., $CHAIN[$I], ...); ... }
          - pattern-not-inside: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN[$I]; ... $H(..., $X, ...); ... }
              ...
              $R $H(...) { ... }
          - pattern-not-inside: |
              $R $H(...) { ... }
              ...
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN[$I]; ... $H(..., $X, ...); ... }
          - pattern-not-inside: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN.clone(); ... $H(..., $X, ...); ... }
              ...
              $R $H(...) { ... }
          - pattern-not-inside: |
              $R $H(...) { ... }
              ...
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... $X = $CHAIN.clone(); ... $H(..., $X, ...); ... }
          - pattern-not-inside: |
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... for ($CT $C : $CHAIN) { ... $H(..., $C, ...); ... } ... }
              ...
              $R $H(...) { ... }
          - pattern-not-inside: |
              $R $H(...) { ... }
              ...
              void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, ...) { ... for ($CT $C : $CHAIN) { ... $H(..., $C, ...); ... } ... }
      # HostnameVerifier: `return true` that is not under a condition, in a verify method or in a
      # lambda given where a HostnameVerifier is expected, whose body never returns false or
      # throws. Apache HttpClient's TrustStrategy is the same for certificates: true means
      # "trusted without the trust manager" (isTrusted, or a lambda given to loadTrustMaterial).
      - patterns:
          - pattern: return $TRUE;
          - metavariable-regex:
              metavariable: $TRUE
              regex: ^true$
          - pattern-either:
              - pattern-inside: |
                  boolean verify(String $H, javax.net.ssl.SSLSession $S) { ... }
              - pattern-inside: |
                  boolean isTrusted(java.security.cert.X509Certificate[] $H, String $S) { ... }
              - patterns:
                  - pattern-inside: |
                      ($H, $S) -> { ... }
                  - pattern-either:
                      # The setters of HttpsURLConnection, OkHttp and Jakarta REST builders
                      # (hostnameVerifier) and Apache HttpClient 4 and 5 (setSSLHostnameVerifier,
                      # setHostnameVerifier).
                      - patterns:
                          - pattern-inside: $X.$SET(($H, $S) -> { ... })
                          - metavariable-regex:
                              metavariable: $SET
                              regex: ^(setHostnameVerifier|setDefaultHostnameVerifier|setSSLHostnameVerifier|hostnameVerifier)$
                      - pattern-inside: new org.apache.http.conn.ssl.SSLConnectionSocketFactory(..., ($H, $S) -> { ... })
                      - pattern-inside: $X.loadTrustMaterial(..., ($H, $S) -> { ... })
                      - pattern-inside: javax.net.ssl.HostnameVerifier $V = ($H, $S) -> { ... };
                      - pattern-inside: org.apache.http.ssl.TrustStrategy $V = ($H, $S) -> { ... };
                      - pattern-inside: org.apache.hc.core5.ssl.TrustStrategy $V = ($H, $S) -> { ... };
                      - pattern-inside: (javax.net.ssl.HostnameVerifier) ($H, $S) -> { ... }
          # (Also an if with an else: a return true in either branch is under a condition.)
          - pattern-not-inside: |
              if ($C) $STMT;
          - pattern-not-inside: |
              boolean verify(...) { ... return false; ... }
          - pattern-not-inside: |
              boolean verify(...) { ... throw $E; ... }
          - pattern-not-inside: |
              boolean isTrusted(...) { ... return false; ... }
          - pattern-not-inside: |
              boolean isTrusted(...) { ... throw $E; ... }
          - pattern-not-inside: |
              ($H, $S) -> { ... return false; ... }
          - pattern-not-inside: |
              ($H, $S) -> { ... throw $E; ... }
          # (OpenGrep also matches `return true;` on a whole method or lambda whose body is only
          # that statement; the finding is put on the value.)
          - focus-metavariable: $TRUE
      # The same as an expression lambda: `(host, session) -> true`, `(chain, authType) -> true`.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $X.$SET(($H, $S) -> $TRUE)
                  - metavariable-regex:
                      metavariable: $SET
                      regex: ^(setHostnameVerifier|setDefaultHostnameVerifier|setSSLHostnameVerifier|hostnameVerifier)$
              - pattern: new org.apache.http.conn.ssl.SSLConnectionSocketFactory(..., ($H, $S) -> $TRUE)
              - pattern: $X.loadTrustMaterial(..., ($H, $S) -> $TRUE)
              - pattern: javax.net.ssl.HostnameVerifier $V = ($H, $S) -> $TRUE;
              - pattern: org.apache.http.ssl.TrustStrategy $V = ($H, $S) -> $TRUE;
              - pattern: org.apache.hc.core5.ssl.TrustStrategy $V = ($H, $S) -> $TRUE;
              - pattern: (javax.net.ssl.HostnameVerifier) ($H, $S) -> $TRUE
          - metavariable-regex:
              metavariable: $TRUE
              regex: ^true$
          - focus-metavariable: $TRUE
      # Apache HttpClient 4 and 5's own no-op host name verifiers and trust-all strategy, whose
      # only use is to switch the check off ("turns hostname verification off", "accepts all
      # certificates as trusted").
      - pattern-either:
          - pattern: org.apache.http.conn.ssl.NoopHostnameVerifier.INSTANCE
          - pattern: new org.apache.http.conn.ssl.NoopHostnameVerifier()
          - pattern: org.apache.http.conn.ssl.AllowAllHostnameVerifier.INSTANCE
          - pattern: new org.apache.http.conn.ssl.AllowAllHostnameVerifier()
          - pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
          - pattern: org.apache.http.conn.ssl.TrustAllStrategy.INSTANCE
          - pattern: new org.apache.http.conn.ssl.TrustAllStrategy()
          - pattern: org.apache.hc.client5.http.ssl.NoopHostnameVerifier.INSTANCE
          - pattern: new org.apache.hc.client5.http.ssl.NoopHostnameVerifier()
          - pattern: org.apache.hc.client5.http.ssl.TrustAllStrategy.INSTANCE
          - pattern: new org.apache.hc.client5.http.ssl.TrustAllStrategy()
