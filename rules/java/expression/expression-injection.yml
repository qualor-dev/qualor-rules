rules:
  - id: java.expression-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Data from the HTTP request is evaluated as an expression (Spring SpEL, Jakarta Expression
      Language, OGNL or MVEL). These languages can call methods, create objects and reach any class,
      so the request can run code on the server. Evaluate only expressions the application owns and
      pass request data as a variable or value (`ctx.setVariable(...)`, `defineBean(...)`, an OGNL
      context entry); for SpEL that must read user-written expressions, evaluate them with a
      `SimpleEvaluationContext`, never the default `StandardEvaluationContext`.
    metadata:
      title: Expression language evaluated from HTTP request data (Java)
      cwe: ['CWE-917']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [servlet, spring-mvc, jax-rs, spring-expression, jakarta-el, ognl, mvel]
      sources:
        - https://cwe.mitre.org/data/definitions/917.html
        - https://community.owasp.org/vulnerabilities/Expression_Language_Injection
        - https://docs.spring.io/spring-framework/reference/core/expressions/evaluation.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/Expression.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/ExpressionParser.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/spel/standard/SpelExpression.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/spel/support/SimpleEvaluationContext.html
        - https://jakarta.ee/specifications/expression-language/5.0/apidocs/jakarta.el/jakarta/el/elprocessor
        - https://jakarta.ee/specifications/expression-language/5.0/apidocs/jakarta.el/jakarta/el/expressionfactory
        - https://github.com/orphan-oss/ognl/blob/main/docs/DeveloperGuide.md
        - https://github.com/orphan-oss/ognl/blob/main/docs/LanguageGuide.md
        - https://javadoc.io/static/org.mvel/mvel2/2.5.2.Final/org/mvel2/MVEL.html
        - https://github.com/mvel/mvel/blob/main/SECURITY.md
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/servletrequest
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/http/httpservletrequest
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/arguments.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestparam.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/pathparam
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/queryparam
        - https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/multipart-forms.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/bind/annotation/RequestPart.html
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/StringBuilder.html
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/StringBuffer.html
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A handler parameter without an annotation is not a source (the Jakarta REST entity
    #   parameter, a Spring MVC simple-type parameter), except a Spring MVC HttpEntity or
    #   RequestEntity (the request body and headers); and only the scalar types of the source
    #   block count as safe: an enum, a `List<Long>` or an `Optional<Long>` parameter is still a
    #   source, as in java.sql-injection.
    # - Taint is followed through the methods of one file (OpenGrep's --taint-intrafile), not into
    #   other files, and conditions are not evaluated: a helper method of another file that
    #   returns a constant still passes the request data on, a wrapper class of another file that
    #   reads the request is not a source, and a switch over a constant still counts its
    #   request-data branch.
    # - Allow-list lookups are recognised only as Map.of(...) of literals and constants (in a
    #   static final field or in place) read with get(key) or getOrDefault(key, a constant), and as
    #   valueOf of an enum declared in this file (or Enum.valueOf): valueOf of an enum
    #   from another file still passes the request data on (a lookup in any other map, a literal
    #   Map.ofEntries table too, yields the map's values), and so may valueOf of an enum nested
    #   in a nested class and named from outside that class (Inner.Kind.valueOf). An enum of this
    #   file counts by its simple name or qualified by its class or interface, and only valueOf
    #   with one argument does (an overload the enum declares may hand the text back).
    # - SpEL and OGNL are reported where the parsed expression is evaluated (getValue, setValue,
    #   getValueType): an expression parsed from request data in one method and evaluated in
    #   another of this file is reported where it is evaluated; one evaluated in another file is
    #   missed. A SimpleEvaluationContext is recognised by its type, in place, or in a
    #   variable built from SimpleEvaluationContext.for...(...).build() in the same method; one
    #   returned by a helper method is not recognised, and the evaluation is reported.
    # - In OpenGrep's --taint-intrafile mode a two-argument insert on an object whose class has
    #   no body in this file (a MyBatis SqlSession's insert(statement, parameter)) counts as a
    #   write into a container: what the object returns afterwards (selectOne) is taken for
    #   request data.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.ServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.ServletRequest $R).$GET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $R).$GET(...)
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getRequestURI|getRequestURL|getPathInfo|getReader|getInputStream|getPart|getParts)$
      # Spring MVC and Jakarta REST: the controller-method parameters bound from the request
      # (query, path, matrix, header, cookie, form, body, multipart part, model attribute).
      # Numbers, booleans, UUIDs and dates are converted by the framework and cannot carry
      # injected text.
      - patterns:
          # @$ANN(...) also matches an annotation written without parentheses.
          - pattern-inside: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(\w+\.)*(RequestParam|PathVariable|MatrixVariable|RequestHeader|CookieValue|RequestBody|RequestPart|ModelAttribute|PathParam|QueryParam|MatrixParam|HeaderParam|CookieParam|FormParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(\w+\.)*(byte|short|int|long|float|double|boolean|char|Byte|Short|Integer|Long|Float|Double|Boolean|Character|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant)$)
          - pattern: $P
      # Spring MVC: an HttpEntity or RequestEntity parameter holds the request body.
      - patterns:
          # @$MAP(...) also matches a mapping annotation written without parentheses.
          - pattern-inside: |
              @$MAP(...)
              $RET $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
          - metavariable-regex:
              metavariable: $T
              regex: ^(org\.springframework\.http\.)?(HttpEntity|RequestEntity)\s*<
          - pattern: $P
    pattern-propagators:
      # Expression text assembled with a StringBuilder or StringBuffer.
      - pattern: $SB.append($X)
        from: $X
        to: $SB
      # ... also later in an append chain.
      - pattern: $SB.append(...). ... .append($X)
        from: $X
        to: $SB
      # ... and text put in with insert or replace (also later in an append chain), when the
      # receiver is a StringBuilder or StringBuffer (by its type, also for a builder declared
      # with var and created in place). Other classes' insert and replace (Map.replace) are not
      # followed by this item; OpenGrep's --taint-intrafile mode itself still takes a
      # two-argument insert on a class without a body in the file for a container write (a
      # Known limit).
      - patterns:
          - pattern-either:
              - pattern: $SB.insert($I, $X, ...)
              - pattern: $SB.append(...). ... .insert($I, $X, ...)
              - pattern: $SB.replace($S, $E, $X)
              - pattern: $SB.append(...). ... .replace($S, $E, $X)
          - metavariable-type:
              metavariable: $SB
              types: [StringBuilder, StringBuffer]
        from: $X
        to: $SB
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: Integer.valueOf(...)
      - pattern: Long.valueOf(...)
      # Allow-list lookups yield only values the code holds: Map.of(...) of literals and constants,
      # in a static final field or in place, looked up with get(key) or getOrDefault(key, a
      # literal or constant), and constants of an enum declared in this file. A map filled from
      # request data, or a lookup whose fallback is request data, stays tainted.
      - patterns:
          - pattern-inside: |
              class $C { ... static final $MT $MAP = $INIT; ... }
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
          - pattern-either:
              - pattern: $MAP.get($K)
              - patterns:
                  - pattern: $MAP.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
      - patterns:
          - pattern-either:
              - pattern: $INIT.get($K)
              - patterns:
                  - pattern: $INIT.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
      - pattern: Enum.valueOf(...)
      - pattern: java.lang.Enum.valueOf(...)
      # valueOf(String) of an enum declared in this file (one argument: an overload the enum
      # declares itself may hand the text back). An enum declared before or after a class of the
      # file (also nested in a later class), by its simple name.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $X { ... }
                  ...
                  enum $E { ... }
              - pattern-inside: |
                  enum $E { ... }
                  ...
                  class $X { ... }
          - pattern: $E.valueOf($K)
      # An enum nested in a class of the file: by its simple name or qualified by the class
      # inside it (also in a file's only class), and qualified by its class or interface in the
      # file's other classes.
      - patterns:
          - pattern-inside: |
              class $X { ... enum $E { ... } ... }
          - pattern-either:
              - pattern: $E.valueOf($K)
              - pattern: $X.$E.valueOf($K)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $X { ... enum $E { ... } ... }
                  ...
                  class $Y { ... }
              - pattern-inside: |
                  class $Y { ... }
                  ...
                  class $X { ... enum $E { ... } ... }
              - pattern-inside: |
                  interface $X { ... enum $E { ... } ... }
                  ...
                  class $Y { ... }
              - pattern-inside: |
                  class $Y { ... }
                  ...
                  interface $X { ... enum $E { ... } ... }
          - pattern: $X.$E.valueOf($K)
    pattern-sinks:
      # Spring SpEL: an expression parsed from request data and evaluated, unless the evaluation
      # context is a SimpleEvaluationContext (getValue() without a context, or with a root object,
      # uses the default context).
      - patterns:
          - pattern-either:
              # Parsed and evaluated in place (a parser created in place or declared with `var` has
              # its constructor's type).
              - patterns:
                  - pattern-either:
                      - pattern: (org.springframework.expression.ExpressionParser $P).parseExpression($X, ...).$M(...)
                      - pattern: (org.springframework.expression.spel.standard.SpelExpressionParser $P).parseExpression($X, ...).$M(...)
                      - pattern: (org.springframework.expression.spel.standard.SpelExpressionParser $P).parseRaw($X).$M(...)
                  - focus-metavariable: $X
              # An Expression variable (typed, or declared with `var` from a parser).
              - patterns:
                  - pattern-either:
                      - pattern: (org.springframework.expression.Expression $X).$M(...)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  $X = (org.springframework.expression.ExpressionParser $P).parseExpression(...);
                                  ...
                              - pattern-inside: |
                                  $X = (org.springframework.expression.spel.standard.SpelExpressionParser $P).parseExpression(...);
                                  ...
                          - pattern: $X.$M(...)
                  - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $M
              regex: ^(getValue|setValue|getValueType|getValueTypeDescriptor)$
          # Evaluated with a SimpleEvaluationContext.
          - pattern-not-inside: $R.$M((org.springframework.expression.spel.support.SimpleEvaluationContext $C), ...)
          - pattern-not-inside: $R.$M(org.springframework.expression.spel.support.SimpleEvaluationContext.$F(...). ... .build(), ...)
          - pattern-not-inside:
              patterns:
                - pattern: $R.$M($C, ...)
                - pattern-inside: |
                    $C = org.springframework.expression.spel.support.SimpleEvaluationContext.$F(...). ... .build();
                    ...
      # Jakarta (and Java EE) Expression Language: ELProcessor and ExpressionFactory.
      - patterns:
          - pattern-either:
              # Typed, created in place or declared with `var` (the constructor's type).
              - pattern: (jakarta.el.ELProcessor $P).$M($X, ...)
              - pattern: (javax.el.ELProcessor $P).$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(eval|getValue|setValue)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: (jakarta.el.ELProcessor $P).setVariable($V, $X)
              - pattern: (javax.el.ELProcessor $P).setVariable($V, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: (jakarta.el.ExpressionFactory $F).createValueExpression($CTX, $X, $T)
              - pattern: (javax.el.ExpressionFactory $F).createValueExpression($CTX, $X, $T)
              - pattern: jakarta.el.ExpressionFactory.newInstance(...).createValueExpression($CTX, $X, $T)
              - pattern: javax.el.ExpressionFactory.newInstance(...).createValueExpression($CTX, $X, $T)
              - pattern: (jakarta.el.ExpressionFactory $F).createMethodExpression($CTX, $X, ...)
              - pattern: (javax.el.ExpressionFactory $F).createMethodExpression($CTX, $X, ...)
              - pattern: jakarta.el.ExpressionFactory.newInstance(...).createMethodExpression($CTX, $X, ...)
              - pattern: javax.el.ExpressionFactory.newInstance(...).createMethodExpression($CTX, $X, ...)
          - focus-metavariable: $X
      # OGNL: the expression (text, or a tree parsed from it) that is evaluated.
      - patterns:
          - pattern-either:
              - pattern: ognl.Ognl.getValue($X, ...)
              - pattern: ognl.Ognl.setValue($X, ...)
          - focus-metavariable: $X
      # MVEL: the expression evaluated, or the compiled expression executed.
      - patterns:
          - pattern: org.mvel2.MVEL.$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(eval|evalToString|evalToBoolean|executeExpression|executeSetExpression)$
          - focus-metavariable: $X
