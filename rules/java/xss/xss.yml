rules:
  - id: java.xss
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Data from the HTTP request is written into an HTML response without encoding, so a client
      can make the page run a script in another user's browser (cross-site scripting). Encode it
      for its HTML context (OWASP Java Encoder `Encode.forHtml`, Spring `HtmlUtils.htmlEscape`),
      render it through an escaping template engine, or send it with a non-HTML content type
      (`application/json`, `text/plain`).
    metadata:
      title: HTML response built from HTTP request data (Java)
      cwe: ['CWE-79']
      owasp: ['A05:2025', 'A03:2021']
      kind: issue
      severity: high
      confidence: high
      frameworks: [servlet, spring-mvc, jax-rs]
      sources:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        - https://owasp.org/www-project-java-encoder/
        - https://github.com/OWASP/owasp-java-encoder
        - https://javadoc.io/static/org.owasp.esapi/esapi/2.5.0.0/org/owasp/esapi/Encoder.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/util/HtmlUtils.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/converter/StringHttpMessageConverter.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/ResponseEntity.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/responsebody.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestparam.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/servletrequest
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/servletresponse
        - https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/http/httpservletrequest
        - https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/produces
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/core/response
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/pathparam
        - https://jakarta.ee/specifications/restful-ws/3.1/apidocs/jakarta.ws.rs/jakarta/ws/rs/queryparam
        - https://commons.apache.org/proper/commons-text/apidocs/org/apache/commons/text/StringEscapeUtils.html
        - https://commons.apache.org/proper/commons-lang/apidocs/org/apache/commons/lang3/StringEscapeUtils.html
        - https://commons.apache.org/proper/commons-lang/javadocs/api-2.6/org/apache/commons/lang/StringEscapeUtils.html
        - https://quarkus.io/guides/rest
        - https://github.com/FasterXML/jackson-dataformat-xml
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/httpentity.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/http/RequestEntity.html
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/StringBuilder.html
        - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/StringBuffer.html
        - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/multipart-forms.html
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/bind/annotation/RequestPart.html
        - https://community.owasp.org/attacks/xss
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/ResultSet.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Process.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/Files.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpClient.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpRequest.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpResponse.html
        - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/net/URI.html
      since: 2026.10.1
    # Known limits (each has a `todo` line in the test file):
    # - A handler parameter without an annotation is not a source (the Jakarta REST entity
    #   parameter, a Spring MVC simple-type parameter), except a Spring MVC HttpEntity or
    #   RequestEntity (the request body and headers); and only the scalar types of the source
    #   block count as safe: an enum, a `List<Long>` or an `Optional<Long>` parameter is still a
    #   source, as in java.sql-injection.
    # - Results of calls that other rules check as sinks are not request data (see the sanitizers
    #   below): only the JDBC, Spring JDBC, JPA and Hibernate, Runtime.exec with a command string,
    #   java.nio.file.Files and java.io file stream, java.net.URL, RestTemplate and java.net.http
    #   HttpClient fetches from a fixed origin (a literal, or a static final base followed by one
    #   or two terms; for HttpClient a request built in the send call or in a variable, with
    #   newBuilder(uri) or uri(uri) from URI.create or new URI, sent by a client of the
    #   HttpClient type or created in the same method or in place), JNDI DirContext and Spring
    #   LdapTemplate, and JAXP XPath (built expression) forms listed there. Only the value of a
    #   RestTemplate or HttpClient call is clean: a sink in a callback passed to it is reported.
    #   The result of other data access (a Spring Data repository or a MyBatis mapper method of
    #   another file, a RestClient or WebClient call, an HttpClient fetch whose URI is held in a
    #   variable or comes from a builder passed around, a fetch from a base followed by three or
    #   more terms, a fetch through a request or URL variable that is assigned again, even to
    #   another fixed origin) is still taken for request data when a request value is its
    #   argument, and so is
    #   the output of a shell started by ProcessBuilder or an array and the evaluation of a compiled
    #   XPathExpression, which java.command-injection or java.xpath-injection may report as well. An
    #   XPath expression held in a field or a variable that is not a constant, evaluated over a
    #   document from the request, is missed. Stored XSS (data an earlier request saved, written out
    #   unencoded) is not found: such data is not request data.
    # - Conditions are not evaluated: a switch over a value computed from constants still counts
    #   its request-data branch.
    # - Taint is followed through the methods of one file (OpenGrep's --taint-intrafile), not into
    #   other files: a helper method of another file that encodes the value (or returns a
    #   constant) still passes the request data on.
    # - Allow-list lookups are recognised only as Map.of(...) of literals and constants (in a
    #   static final field or in place) read with get(key) or getOrDefault(key, a constant), and as
    #   valueOf of an enum declared in this file (or Enum.valueOf): valueOf of an enum
    #   from another file still passes the request data on (a lookup in any other map, a literal
    #   Map.ofEntries table too, yields the map's values), and so may valueOf of an enum nested
    #   in a nested class and named from outside that class (Inner.Kind.valueOf). An enum of this
    #   file counts by its simple name or qualified by its class or interface, and only valueOf
    #   with one argument does (an overload the enum declares may hand the text back).
    # - Under a Jakarta REST XML or SVG type, only markup the code builds is a sink (a String
    #   return, or a Response entity that is a concatenation or String.format in place, or a
    #   variable the method assigns one of them or a String.concat, or appends to with +=); a DTO
    #   entity is written escaped by JAXB or JSON-B, and a serialiser's output kept in a variable
    #   (`String xml = xmlMapper.writeValueAsString(dto)`) is not reported. Request text sent as
    #   an XML entity as it is (in place or through a variable) and a String from a call (a
    #   StringBuilder's toString) are not reported either, while a String return counts as
    #   markup even when it is a serialiser's output, and so does a concatenation of constant
    #   text with a serialiser's output (an XML declaration put in front of it).
    # - A Jakarta REST String or Response without @Produces (method or class) and without an
    #   explicit type is not reported: its media type is negotiated (the specification lets a
    #   browser's Accept header pick text/html; Quarkus REST picks text/plain for a String).
    # - A servlet response counts as non-HTML only when a literal JSON, plain-text, CSV, PDF or
    #   image content type (or a Spring MediaType constant) is set earlier in the same block; a
    #   content type set in a branch, a helper or a filter is not seen.
    # - Spring MVC: only a handler that returns String (in a @RestController or with @ResponseBody
    #   on the method) or ResponseEntity<String> is a sink, unless its produces (method, or class
    #   when the method has none) names JSON or plain text, or the ResponseEntity builder sets a
    #   non-HTML contentType or Content-Type header. XML and SVG types count as HTML (a browser
    #   runs scripts in them). @ResponseBody on a @Controller class, a ResponseEntity<Object> body
    #   and a content type set through an HttpHeaders object are not seen.
    # - In OpenGrep's --taint-intrafile mode a two-argument insert on an object whose class has
    #   no body in this file (a MyBatis SqlSession's insert(statement, parameter)) counts as a
    #   write into a container: what the object returns afterwards (selectOne) is taken for
    #   request data.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.ServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.ServletRequest $R).$GET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $R).$GET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $R).$GET(...)
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getRequestURI|getRequestURL|getPathInfo|getReader|getInputStream|getPart|getParts)$
      # Spring MVC and Jakarta REST: the controller-method parameters bound from the request
      # (query, path, matrix, header, cookie, form, body, multipart part, model attribute).
      # Numbers, booleans, UUIDs and dates are converted by the framework and cannot carry
      # injected text.
      - patterns:
          # @$ANN(...) also matches an annotation written without parentheses.
          - pattern-inside: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(\w+\.)*(RequestParam|PathVariable|MatrixVariable|RequestHeader|CookieValue|RequestBody|RequestPart|ModelAttribute|PathParam|QueryParam|MatrixParam|HeaderParam|CookieParam|FormParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(\w+\.)*(byte|short|int|long|float|double|boolean|char|Byte|Short|Integer|Long|Float|Double|Boolean|Character|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant)$)
          - pattern: $P
      # Spring MVC: an HttpEntity or RequestEntity parameter holds the request body.
      - patterns:
          # @$MAP(...) also matches a mapping annotation written without parentheses.
          - pattern-inside: |
              @$MAP(...)
              $RET $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
          - metavariable-regex:
              metavariable: $T
              regex: ^(org\.springframework\.http\.)?(HttpEntity|RequestEntity)\s*<
          - pattern: $P
    pattern-propagators:
      # HTML assembled with a StringBuilder or StringBuffer.
      - pattern: $SB.append($X)
        from: $X
        to: $SB
      # ... also later in an append chain.
      - pattern: $SB.append(...). ... .append($X)
        from: $X
        to: $SB
      # ... and text put in with insert or replace (also later in an append chain), when the
      # receiver is a StringBuilder or StringBuffer (by its type, also for a builder declared
      # with var and created in place). Other classes' insert and replace (Map.replace) are not
      # followed by this item; OpenGrep's --taint-intrafile mode itself still takes a
      # two-argument insert on a class without a body in the file for a container write (a
      # Known limit).
      - patterns:
          - pattern-either:
              - pattern: $SB.insert($I, $X, ...)
              - pattern: $SB.append(...). ... .insert($I, $X, ...)
              - pattern: $SB.replace($S, $E, $X)
              - pattern: $SB.append(...). ... .replace($S, $E, $X)
          - metavariable-type:
              metavariable: $SB
              types: [StringBuilder, StringBuffer]
        from: $X
        to: $SB
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: Integer.valueOf(...)
      - pattern: Long.valueOf(...)
      # Allow-list lookups yield only values the code holds: Map.of(...) of literals and constants,
      # in a static final field or in place, looked up with get(key) or getOrDefault(key, a
      # literal or constant), and constants of an enum declared in this file. A map filled from
      # request data, or a lookup whose fallback is request data, stays tainted.
      - patterns:
          - pattern-inside: |
              class $C { ... static final $MT $MAP = $INIT; ... }
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
          - pattern-either:
              - pattern: $MAP.get($K)
              - patterns:
                  - pattern: $MAP.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
      - patterns:
          - pattern-either:
              - pattern: $INIT.get($K)
              - patterns:
                  - pattern: $INIT.getOrDefault($K, $D)
                  - metavariable-regex:
                      metavariable: $D
                      regex: ^("([^"\\]|\\.)*"|-?\d+(\.\d+)?|true|false|null|[A-Z][A-Z0-9_]*|([A-Z]\w*\.)+[A-Z][A-Z0-9_]*)$
          - metavariable-regex:
              metavariable: $INIT
              regex: ^(java\.util\.)?Map\.of\(\s*(("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*)(\s*,\s*("([^"\\]|\\.)*"|-?\d+|[A-Z][A-Za-z0-9_]*\.[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*))*)?\s*\)$
      - pattern: Enum.valueOf(...)
      - pattern: java.lang.Enum.valueOf(...)
      # valueOf(String) of an enum declared in this file (one argument: an overload the enum
      # declares itself may hand the text back). An enum declared before or after a class of the
      # file (also nested in a later class), by its simple name.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $X { ... }
                  ...
                  enum $E { ... }
              - pattern-inside: |
                  enum $E { ... }
                  ...
                  class $X { ... }
          - pattern: $E.valueOf($K)
      # An enum nested in a class of the file: by its simple name or qualified by the class
      # inside it (also in a file's only class), and qualified by its class or interface in the
      # file's other classes.
      - patterns:
          - pattern-inside: |
              class $X { ... enum $E { ... } ... }
          - pattern-either:
              - pattern: $E.valueOf($K)
              - pattern: $X.$E.valueOf($K)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $X { ... enum $E { ... } ... }
                  ...
                  class $Y { ... }
              - pattern-inside: |
                  class $Y { ... }
                  ...
                  class $X { ... enum $E { ... } ... }
              - pattern-inside: |
                  interface $X { ... enum $E { ... } ... }
                  ...
                  class $Y { ... }
              - pattern-inside: |
                  class $Y { ... }
                  ...
                  interface $X { ... enum $E { ... } ... }
          - pattern: $X.$E.valueOf($K)
      # HTML encoding: the OWASP Java Encoder, Spring's HtmlUtils, Commons Text and Commons Lang.
      - patterns:
          - pattern: org.owasp.encoder.Encode.$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^for(Html|HtmlContent|HtmlAttribute|Xml|XmlContent|XmlAttribute|UriComponent)$
      - patterns:
          - pattern: org.springframework.web.util.HtmlUtils.$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^htmlEscape(Decimal|Hex)?$
      - patterns:
          - pattern: org.apache.commons.text.StringEscapeUtils.$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^escape(Html3|Html4|Xml10|Xml11)$
      - patterns:
          - pattern: org.apache.commons.lang3.StringEscapeUtils.$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^escape(Html3|Html4|Xml|Xml10|Xml11)$
      - patterns:
          - pattern: org.apache.commons.lang.StringEscapeUtils.$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^escape(Html|Xml)$
      - patterns:
          - pattern-either:
              - pattern: org.owasp.esapi.ESAPI.encoder().$ENC(...)
              - pattern: (org.owasp.esapi.Encoder $E).$ENC(...)
          - metavariable-regex:
              metavariable: $ENC
              regex: ^encodeFor(HTML|HTMLAttribute|XML|XMLAttribute|URL)$
      # Results of calls that other rules check as sinks are data from that store, not request
      # data: rows of a database query, the output of a command, the content of a file, the body
      # of a response the server fetched, directory entries, nodes an XPath expression selects.
      # When request data built the call, java.sql-injection, java.command-injection,
      # java.path-traversal, java.ssrf, java.ldap-injection or java.xpath-injection reports it.
      # (Each form is its own entry: a metavariable-regex inside a pattern-either branch stops a
      # sanitizer from working.)
      # JDBC: the ResultSet of a Statement, PreparedStatement or CallableStatement (a prepared
      # statement has request data only when the method prepares it, the second form).
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Statement $S).$M(...)
              - pattern: (java.sql.Connection $C).createStatement(...).$M(...)
              - pattern: (java.sql.Connection $C).prepareStatement(...).$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(executeQuery|getResultSet|getGeneratedKeys)$
      # ... a Statement declared with `var`, from a connection in the same method.
      - patterns:
          - pattern-inside: |
              $S = $C.$CREATE(...);
              ...
          - metavariable-regex:
              metavariable: $CREATE
              regex: ^(createStatement|prepareStatement|prepareCall)$
          - pattern: $S.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(executeQuery|getResultSet|getGeneratedKeys)$
      # Spring JDBC: the rows JdbcTemplate and NamedParameterJdbcTemplate return.
      - patterns:
          - pattern-either:
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $T).$M(...)
              - pattern: (org.springframework.jdbc.core.JdbcOperations $T).$M(...)
              - pattern: (org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate $T).$M(...)
              - pattern: (org.springframework.jdbc.core.namedparam.NamedParameterJdbcOperations $T).$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForStream)$
      # JPA and Hibernate: the results of a query made by an EntityManager or Session, in a chain
      # or from a Query or TypedQuery variable.
      - patterns:
          - pattern-either:
              - pattern: (javax.persistence.EntityManager $EM).$CQ(...). ... .$R(...)
              - pattern: (jakarta.persistence.EntityManager $EM).$CQ(...). ... .$R(...)
              - pattern: (org.hibernate.Session $EM).$CQ(...). ... .$R(...)
          - metavariable-regex:
              metavariable: $R
              regex: ^(getResultList|getSingleResult|getSingleResultOrNull|getResultStream|list|uniqueResult|getResultCount)$
      - patterns:
          - pattern-either:
              - pattern: (javax.persistence.Query $Q).$R(...)
              - pattern: (javax.persistence.TypedQuery<$T> $Q).$R(...)
              - pattern: (jakarta.persistence.Query $Q).$R(...)
              - pattern: (jakarta.persistence.TypedQuery<$T> $Q).$R(...)
          - metavariable-regex:
              metavariable: $R
              regex: ^(getResultList|getSingleResult|getSingleResultOrNull|getResultStream|list|uniqueResult)$
      # A process started by Runtime.exec with a command string, the form java.command-injection
      # reports when request data is in it (its output streams). A fixed program given request
      # data as arguments (an array, a list, ProcessBuilder) is not reported by that rule, and
      # its output can echo the request data back, so it stays request data here.
      - patterns:
          - pattern-either:
              - pattern: (Runtime $RT).exec($CMD, ...)
              - pattern: Runtime.getRuntime().exec($CMD, ...)
          # (An array, also a list turned into one, is the argument-vector form.)
          - pattern-not: $RT.exec((String[] $A), ...)
          - pattern-not: $RT.exec($L.toArray(...), ...)
      # The content of a file read through java.nio.file.Files or a java.io file stream.
      - patterns:
          - pattern: java.nio.file.Files.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(readString|readAllBytes|readAllLines|lines|newBufferedReader|newInputStream)$
      - patterns:
          - pattern: new $STREAM(...)
          - metavariable-regex:
              metavariable: $STREAM
              regex: ^(java\.io\.)?(FileInputStream|FileReader|RandomAccessFile)$
      # The body of a response the server fetched from a fixed origin: a URL written as a literal
      # that holds the scheme, the host and a separator after the host ("https://api.example.com/",
      # then anything; a "/" not followed by "/" or "\", or "?" or "#"), for java.net.URL
      # (openStream, getContent, openConnection().getInputStream...) and Spring RestTemplate. A
      # body fetched from a URL the request chooses is the requester's own content and stays
      # request data.
      - patterns:
          - pattern-either:
              - pattern: new java.net.URL($URL).$M(...)
              - pattern: new java.net.URL($URL).openConnection().$M(...)
              - patterns:
                  - pattern-inside: |
                      $U = new java.net.URL($URL);
                      ...
                  - pattern-either:
                      - pattern: $U.$M(...)
                      - pattern: $U.openConnection().$M(...)
                  # Not once the variable is assigned again (a URL the request chooses, say).
                  - pattern-not-inside: &url-reassigned |
                      $U = new java.net.URL(...);
                      ...
                      $U = $Z;
                      ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(openStream|getContent|getInputStream|getErrorStream)$
          - metavariable-regex:
              metavariable: $URL
              regex: ^"[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
      # (Exact here and below: only the value of the call is clean, not what is inside it, so a
      # sink written in a callback passed to the call, a response extractor or a body handler, is
      # still reported.)
      - exact: true
        patterns:
          - pattern-either:
              - pattern: (org.springframework.web.client.RestTemplate $T).$M($URL, ...)
              - pattern: (org.springframework.web.client.RestOperations $T).$M($URL, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(getForObject|getForEntity|postForObject|postForEntity|patchForObject|exchange|execute)$
          - metavariable-regex:
              metavariable: $URL
              regex: ^"[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
      # ... and from a base held in a static final String of the class that is such an origin
      # (ending with the separator), followed by one or two more terms.
      - exact: true
        patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
          - pattern-either:
              - pattern: (org.springframework.web.client.RestTemplate $T).$M($BASE + $X, ...)
              - pattern: (org.springframework.web.client.RestTemplate $T).$M($BASE + $X + $Y, ...)
              - pattern: (org.springframework.web.client.RestOperations $T).$M($BASE + $X, ...)
              - pattern: (org.springframework.web.client.RestOperations $T).$M($BASE + $X + $Y, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(getForObject|getForEntity|postForObject|postForEntity|patchForObject|exchange|execute)$
      # ... and a java.net.URL from such a base, in place or through a variable.
      - patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
          - pattern-either:
              - pattern: new java.net.URL($BASE + $X).$M(...)
              - pattern: new java.net.URL($BASE + $X + $Y).$M(...)
              - pattern: new java.net.URL($BASE + $X).openConnection().$M(...)
              - pattern: new java.net.URL($BASE + $X + $Y).openConnection().$M(...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $U = new java.net.URL($BASE + $X);
                          ...
                      - pattern-inside: |
                          $U = new java.net.URL($BASE + $X + $Y);
                          ...
                  - pattern-either:
                      - pattern: $U.$M(...)
                      - pattern: $U.openConnection().$M(...)
                  - pattern-not-inside: *url-reassigned
          - metavariable-regex:
              metavariable: $M
              regex: ^(openStream|getContent|getInputStream|getErrorStream)$
      # The java.net.http HttpClient: the response to a request whose URI (newBuilder(uri) or the
      # builder's uri(uri), from URI.create or new URI) is such a literal, built in the call or in
      # a variable. A builder whose URI is set again later in the chain, or a request variable
      # assigned again, is not counted. The client is bound by its type, or created in the same
      # method or in place (newHttpClient, or newBuilder()...build()): another class's send
      # method given such a request may return its other arguments.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(java.net.URI.create($URL)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(new java.net.URI($URL)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($URL)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($URL)). ... .build(), ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(java.net.URI.create($URL)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(new java.net.URI($URL)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($URL)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($URL)). ... .build();
                          ...
                  - pattern: $H.$SEND($REQ, ...)
                  # Not when the URI is set again in the chain, or the variable is assigned again.
                  - pattern-not-inside: &http-request-uri-replaced
                      pattern-either:
                        - pattern: |
                            $REQ = java.net.http.HttpRequest.newBuilder($FIRST). ... .uri(...). ... .build();
                            ...
                        - pattern: |
                            $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(...). ... .uri(...). ... .build();
                            ...
                        - pattern: |
                            $REQ = java.net.http.HttpRequest.newBuilder(...). ... .build();
                            ...
                            $REQ = $Z;
                            ...
          - metavariable-regex:
              metavariable: $SEND
              regex: ^(send|sendAsync)$
          - metavariable-regex:
              metavariable: $URL
              regex: ^"[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
          - pattern-not: &http-uri-replaced
              pattern-either:
                - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder($FIRST). ... .uri(...). ... .build(), ...)
                - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(...). ... .uri(...). ... .build(), ...)
          - pattern-not: &http-client-unbound
              patterns:
                - pattern: $H.$SEND(...)
                - pattern-not: (java.net.http.HttpClient $H).$SEND(...)
                - pattern-not: java.net.http.HttpClient.newHttpClient().$SEND(...)
                - pattern-not: java.net.http.HttpClient.newBuilder(). ... .build().$SEND(...)
                - pattern-not-inside: |
                    $H = java.net.http.HttpClient.newHttpClient();
                    ...
                - pattern-not-inside: |
                    $H = java.net.http.HttpClient.newBuilder(). ... .build();
                    ...
      # ... and from a base held in a static final String of the class that is such an origin.
      - exact: true
        patterns:
          - pattern-inside: |
              class $C { ... static final String $BASE = "$ORIGIN"; ... }
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^[A-Za-z][A-Za-z0-9+.-]*://[^/?#\s"\\@]+(/(?![/\\])|[?#])
          - pattern-either:
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(java.net.URI.create($BASE + $X)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(java.net.URI.create($BASE + $X + $Y)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(new java.net.URI($BASE + $X)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(new java.net.URI($BASE + $X + $Y)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($BASE + $X)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($BASE + $X + $Y)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($BASE + $X)). ... .build(), ...)
              - pattern: $H.$SEND(java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($BASE + $X + $Y)). ... .build(), ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(java.net.URI.create($BASE + $X)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(java.net.URI.create($BASE + $X + $Y)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(new java.net.URI($BASE + $X)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(new java.net.URI($BASE + $X + $Y)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($BASE + $X)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(java.net.URI.create($BASE + $X + $Y)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($BASE + $X)). ... .build();
                          ...
                      - pattern-inside: |
                          $REQ = java.net.http.HttpRequest.newBuilder(). ... .uri(new java.net.URI($BASE + $X + $Y)). ... .build();
                          ...
                  - pattern: $H.$SEND($REQ, ...)
                  - pattern-not-inside: *http-request-uri-replaced
          - metavariable-regex:
              metavariable: $SEND
              regex: ^(send|sendAsync)$
          - pattern-not: *http-uri-replaced
          - pattern-not: *http-client-unbound
      # Directory entries found by JNDI or Spring LDAP.
      - patterns:
          - pattern-either:
              - pattern: (javax.naming.directory.DirContext $C).search(...)
              - pattern: (javax.naming.directory.InitialDirContext $C).search(...)
              - pattern: (org.springframework.ldap.core.LdapTemplate $C).search(...)
              - pattern: (org.springframework.ldap.core.LdapTemplate $C).searchForObject(...)
      # What a JAXP XPath expression selects from a document, when the expression is built in
      # the call (java.xpath-injection checks it). A constant expression evaluated over a
      # document the request supplies selects request data, so it stays request data.
      - patterns:
          - pattern: (javax.xml.xpath.XPath $XP).$M($EXPR, ...)
          - pattern-not: (javax.xml.xpath.XPath $XP).$M("$S", ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(evaluate|evaluateExpression)$
    pattern-sinks:
      # Servlet: the response writer and output stream, unless a non-HTML content type was set
      # first. Only the arguments are sinks (the writer itself is not request data). The writer
      # getter, the print method and the wrapper type are checked by exclusions of the other
      # names, which cost OpenGrep's prefilter nothing (rule-procedure.md "Performance").
      - patterns:
          - pattern-either: &servlet-writes
              - pattern: (javax.servlet.ServletResponse $RESP).$GETW().$PRINT($...ARGS)
              - pattern: (jakarta.servlet.ServletResponse $RESP).$GETW().$PRINT($...ARGS)
              - pattern: (javax.servlet.http.HttpServletResponse $RESP).$GETW().$PRINT($...ARGS)
              - pattern: (jakarta.servlet.http.HttpServletResponse $RESP).$GETW().$PRINT($...ARGS)
              - pattern: (javax.servlet.ServletResponse $RESP).$GETW().append(...). ... .$PRINT($...ARGS)
              - pattern: (jakarta.servlet.ServletResponse $RESP).$GETW().append(...). ... .$PRINT($...ARGS)
              - pattern: (javax.servlet.http.HttpServletResponse $RESP).$GETW().append(...). ... .$PRINT($...ARGS)
              - pattern: (jakarta.servlet.http.HttpServletResponse $RESP).$GETW().append(...). ... .$PRINT($...ARGS)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $W = (javax.servlet.ServletResponse $RESP).$GETW();
                          ...
                      - pattern-inside: |
                          $W = (jakarta.servlet.ServletResponse $RESP).$GETW();
                          ...
                      - pattern-inside: |
                          $W = (javax.servlet.http.HttpServletResponse $RESP).$GETW();
                          ...
                      - pattern-inside: |
                          $W = (jakarta.servlet.http.HttpServletResponse $RESP).$GETW();
                          ...
                      - pattern-inside: |
                          try ($WT $W = (javax.servlet.ServletResponse $RESP).$GETW()) { ... }
                      - pattern-inside: |
                          try ($WT $W = (jakarta.servlet.ServletResponse $RESP).$GETW()) { ... }
                      - pattern-inside: |
                          try ($WT $W = (javax.servlet.http.HttpServletResponse $RESP).$GETW()) { ... }
                      - pattern-inside: |
                          try ($WT $W = (jakarta.servlet.http.HttpServletResponse $RESP).$GETW()) { ... }
                  - pattern-either:
                      - pattern: $W.$PRINT($...ARGS)
                      # PrintWriter.append returns the writer.
                      - pattern: $W.append(...). ... .$PRINT($...ARGS)
              # A writer or stream that wraps the response's own.
              - patterns:
                  - pattern-either: &servlet-wrappers
                      - pattern-inside: |
                          $W = new $WRAP(<... (javax.servlet.ServletResponse $RESP).$GETW() ...>, ...);
                          ...
                      - pattern-inside: |
                          $W = new $WRAP(<... (jakarta.servlet.ServletResponse $RESP).$GETW() ...>, ...);
                          ...
                      - pattern-inside: |
                          $W = new $WRAP(<... (javax.servlet.http.HttpServletResponse $RESP).$GETW() ...>, ...);
                          ...
                      - pattern-inside: |
                          $W = new $WRAP(<... (jakarta.servlet.http.HttpServletResponse $RESP).$GETW() ...>, ...);
                          ...
                  - pattern: $W.$PRINT($...ARGS)
                  - pattern-not:
                      patterns:
                        - pattern-either: *servlet-wrappers
                        - pattern: $W.$PRINT($...ARGS)
                        - metavariable-regex:
                            metavariable: $WRAP
                            regex: ^(?!(java\.io\.)?(PrintWriter|PrintStream|BufferedWriter|OutputStreamWriter|BufferedOutputStream)$)
          - pattern-not:
              patterns:
                - pattern-either: *servlet-writes
                - metavariable-regex:
                    metavariable: $GETW
                    regex: ^(?!(getWriter|getOutputStream)$)
          - pattern-not:
              patterns:
                - pattern-either: *servlet-writes
                - metavariable-regex:
                    metavariable: $PRINT
                    regex: ^(?!(print|println|write|append|format|printf)$)
          - pattern-not-inside: |
              $R.setContentType("=~/(?i)^\s*(application\/(json|[\w.+-]*\+json|octet-stream|pdf|zip)|text\/(plain|csv)|image\/(png|jpeg|gif|webp))\s*(;.*)?$/");
              ...
          - pattern-not-inside: |
              $R.setHeader("=~/(?i)^content-type$/", "=~/(?i)^\s*(application\/(json|[\w.+-]*\+json|octet-stream|pdf|zip)|text\/(plain|csv)|image\/(png|jpeg|gif|webp))\s*(;.*)?$/");
              ...
          - pattern-not-inside: |
              $R.addHeader("=~/(?i)^content-type$/", "=~/(?i)^\s*(application\/(json|[\w.+-]*\+json|octet-stream|pdf|zip)|text\/(plain|csv)|image\/(png|jpeg|gif|webp))\s*(;.*)?$/");
              ...
          - pattern-not-inside: |
              $R.setContentType(org.springframework.http.MediaType.APPLICATION_JSON_VALUE);
              ...
          - pattern-not-inside: |
              $R.setContentType(org.springframework.http.MediaType.TEXT_PLAIN_VALUE);
              ...
          - focus-metavariable: $...ARGS
      # Spring MVC: the String a @RestController or @ResponseBody handler returns, and the String
      # body of a ResponseEntity<String>. The String converter supports every media type, so a
      # browser that accepts text/html gets text/html. Here the method sets no produces; a class
      # whose produces names JSON or plain text is excluded. (The handler method is a context
      # the value must not be outside of, an exclusion: rule-procedure.md "Performance".)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either: &rest-handlers
                      - pattern-inside: |
                          @org.springframework.web.bind.annotation.RestController
                          class $C { ... }
                      - pattern-inside: |
                          @org.springframework.web.bind.annotation.ResponseBody
                          $RT $M(...) { ... }
                  - pattern: return $X;
                  - pattern-not:
                      patterns:
                        - pattern-either: *rest-handlers
                        - pattern: return $X;
                        - pattern-not-inside:
                            patterns:
                              - pattern-either:
                                  - pattern-inside: |
                                      @$MAP
                                      String $M(...) { ... }
                                  - patterns:
                                      - pattern-inside: |
                                          @$MAP($...MARGS)
                                          String $M(...) { ... }
                                      - metavariable-regex:
                                          metavariable: $...MARGS
                                          regex: ^(?![\s\S]*\bproduces\b)
                              - metavariable-regex:
                                  metavariable: $MAP
                                  regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
              - patterns:
                  - pattern-either: &string-entity-bodies
                      - pattern: org.springframework.http.ResponseEntity.ok($X)
                      - pattern: new org.springframework.http.ResponseEntity<$T>($X, ...)
                      - pattern: new org.springframework.http.ResponseEntity<>($X, ...)
                      - pattern: $B.body($X)
                  # A body() call only on a ResponseEntity builder that sets no other content
                  # type (or one that names HTML, XML or SVG).
                  - pattern-not: &untyped-entity-body
                      patterns:
                        - pattern: $B.body($X)
                        - metavariable-regex:
                            metavariable: $B
                            regex: (?s)^(?!(org\.springframework\.http\.)?ResponseEntity\s*\.(?!.*\.\s*(contentType\s*\(|header\s*\(\s*("(?i:content-type)"|(\w+\.)*CONTENT_TYPE)\s*,)(?![^)]*(?i:html|xml|svg))))
                  - pattern-not:
                      patterns:
                        - pattern-either: *string-entity-bodies
                        - pattern-not-inside:
                            patterns:
                              - pattern-either:
                                  - pattern-inside: |
                                      @$MAP
                                      ResponseEntity<String> $M(...) { ... }
                                  - patterns:
                                      - pattern-inside: |
                                          @$MAP($...MARGS)
                                          ResponseEntity<String> $M(...) { ... }
                                      - metavariable-regex:
                                          metavariable: $...MARGS
                                          regex: ^(?![\s\S]*\bproduces\b)
                              - metavariable-regex:
                                  metavariable: $MAP
                                  regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = "=~/(?i)^(application\/(json|[\w.+-]*\+json)|text\/plain)/", ...)
              class $C2 { ... }
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = org.springframework.http.MediaType.APPLICATION_JSON_VALUE, ...)
              class $C2 { ... }
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = org.springframework.http.MediaType.TEXT_PLAIN_VALUE, ...)
              class $C2 { ... }
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = {"=~/(?i)^(application\/(json|[\w.+-]*\+json)|text\/plain)/"}, ...)
              class $C2 { ... }
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = {org.springframework.http.MediaType.APPLICATION_JSON_VALUE}, ...)
              class $C2 { ... }
          - pattern-not-inside: |
              @org.springframework.web.bind.annotation.RequestMapping(..., produces = {org.springframework.http.MediaType.TEXT_PLAIN_VALUE}, ...)
              class $C2 { ... }
          - focus-metavariable: $X
      # The same when the method's own produces names HTML, XML or SVG (it overrides the class's;
      # a browser runs scripts in XHTML-namespaced XML and in SVG).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either: *rest-handlers
                  - pattern: return $X;
                  - pattern-not:
                      patterns:
                        - pattern-either: *rest-handlers
                        - pattern: return $X;
                        - pattern-not-inside:
                            patterns:
                              - pattern-inside: |
                                  @$MAP($...MARGS)
                                  String $M(...) { ... }
                              - metavariable-regex:
                                  metavariable: $MAP
                                  regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
                              - metavariable-regex:
                                  metavariable: $...MARGS
                                  regex: '[\s\S]*\bproduces\b[\s\S]*(?i:html|xml|svg)'
              - patterns:
                  - pattern-either: *string-entity-bodies
                  - pattern-not: *untyped-entity-body
                  - pattern-not:
                      patterns:
                        - pattern-either: *string-entity-bodies
                        - pattern-not-inside:
                            patterns:
                              - pattern-inside: |
                                  @$MAP($...MARGS)
                                  ResponseEntity<String> $M(...) { ... }
                              - metavariable-regex:
                                  metavariable: $MAP
                                  regex: ^(\w+\.)*(Get|Post|Put|Delete|Patch|Request)Mapping$
                              - metavariable-regex:
                                  metavariable: $...MARGS
                                  regex: '[\s\S]*\bproduces\b[\s\S]*(?i:html|xml|svg)'
          - focus-metavariable: $X
      # Spring MVC: a ResponseEntity body declared as HTML, XML or SVG, whatever the method returns.
      - patterns:
          - pattern: $B.body($X)
          - pattern-not:
              patterns:
                - pattern: $B.body($X)
                - metavariable-regex:
                    metavariable: $B
                    regex: (?s)^(?!(org\.springframework\.http\.)?ResponseEntity\s*\..*\.\s*(contentType\s*\(|header\s*\(\s*("(?i:content-type)"|(\w+\.)*CONTENT_TYPE)\s*,)[^)]*(?i:html|xml|svg))
          - focus-metavariable: $X
      # Jakarta REST: a String returned, or a Response entity, from a method that produces
      # text/html, or from a class that does and a method without its own @Produces; and, under
      # an XML or SVG type (a browser runs scripts in XHTML-namespaced XML and in SVG), only
      # markup the code builds itself: a String return, or an entity that is a concatenation or
      # String.format in place, or a variable the method assigns one (or String.concat, or
      # appends to with +=). A DTO entity is written escaped by JAXB or JSON-B. (One item under
      # the word "Produces"; the annotation's name and media type are exclusions of the other
      # values: rule-procedure.md "Performance".)
      - patterns:
          # The file names @Produces, as it does whenever one of the forms below matches: a word
          # OpenGrep's prefilter can use to skip files.
          - pattern-regex: (?s)\A.*\bProduces\b.*\z
          - pattern-either:
              # HTML, from the method's own @Produces.
              - patterns:
                  - pattern-inside: &annotated-method |
                      @$PRODUCES($...P)
                      $RT $M(...) { ... }
                  - pattern-either: &jaxrs-html-entities
                      # A String returned (not outside a method that returns String: an
                      # exclusion below).
                      - pattern: &jaxrs-string-return return $X;
                      - pattern: Response.ok($X, ...)
                      - pattern: Response.$F(...). ... .entity($X, ...)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern-either: *jaxrs-html-entities
                        - metavariable-regex:
                            metavariable: $PRODUCES
                            regex: ^(?!((javax|jakarta)\.ws\.rs\.)?Produces$)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern-either: *jaxrs-html-entities
                        - metavariable-regex:
                            metavariable: $...P
                            regex: ^(?![\s\S]*(?i:html))
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern: *jaxrs-string-return
                        - pattern-not-inside: |
                            String $M2(...) { ... }
              # HTML, from the class's @Produces, for a method without its own.
              - patterns:
                  - pattern-inside: &annotated-class |
                      @$PRODUCES($...P)
                      class $C { ... }
                  - pattern-either: *jaxrs-html-entities
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern-either: *jaxrs-html-entities
                        - metavariable-regex:
                            metavariable: $PRODUCES
                            regex: ^(?!((javax|jakarta)\.ws\.rs\.)?Produces$)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern-either: *jaxrs-html-entities
                        - metavariable-regex:
                            metavariable: $...P
                            regex: ^(?![\s\S]*(?i:html))
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern: *jaxrs-string-return
                        - pattern-not-inside: |
                            String $M2(...) { ... }
                  - pattern-not-inside: |
                      @jakarta.ws.rs.Produces(...)
                      $RT $M(...) { ... }
                  - pattern-not-inside: |
                      @javax.ws.rs.Produces(...)
                      $RT $M(...) { ... }
              # XML or SVG, from the method's own @Produces.
              - patterns:
                  - pattern-inside: *annotated-method
                  - pattern-either: &jaxrs-markup-entities
                      - pattern: *jaxrs-string-return
                      - patterns:
                          - pattern-either: &jaxrs-response-entities
                              - pattern: Response.ok($X, ...)
                              - pattern: Response.$F(...). ... .entity($X, ...)
                          # Built markup only: the entities that are none of these forms are
                          # excluded (a serialiser's output in a variable is written escaped).
                          - pattern-not:
                              patterns:
                                - pattern-either: *jaxrs-response-entities
                                # A variable the method assigns built markup (a concatenation,
                                # String.format or String.concat), or appends to with +=.
                                - pattern-not-inside: &markup-assigned |
                                    $X = <... $A + $B ...>;
                                    ...
                                - pattern-not-inside: &format-assigned |
                                    $X = <... String.format(...) ...>;
                                    ...
                                - pattern-not-inside: &concat-assigned |
                                    $X = <... $S.concat(...) ...>;
                                    ...
                                - pattern-not-inside: &markup-appended |
                                    $X += $INIT;
                                    ...
                                # A concatenation or String.format in place.
                                - pattern-not:
                                    patterns:
                                      - pattern: Response.$G(..., $X, ...)
                                      - metavariable-pattern:
                                          metavariable: $X
                                          pattern-either:
                                            - pattern: $A + $B
                                            - pattern: String.format(...)
                                - pattern-not:
                                    patterns:
                                      - pattern: Response.$G(...). ... .entity($X, ...)
                                      - metavariable-pattern:
                                          metavariable: $X
                                          pattern-either:
                                            - pattern: $A + $B
                                            - pattern: String.format(...)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern-either: *jaxrs-markup-entities
                        - metavariable-regex:
                            metavariable: $PRODUCES
                            regex: ^(?!((javax|jakarta)\.ws\.rs\.)?Produces$)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern-either: *jaxrs-markup-entities
                        - metavariable-regex:
                            metavariable: $...P
                            regex: ^(?![\s\S]*(?i:xml|svg))
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-method
                        - pattern: *jaxrs-string-return
                        - pattern-not-inside: |
                            String $M2(...) { ... }
              # XML or SVG, from the class's @Produces, for a method without its own.
              - patterns:
                  - pattern-inside: *annotated-class
                  - pattern-either: *jaxrs-markup-entities
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern-either: *jaxrs-markup-entities
                        - metavariable-regex:
                            metavariable: $PRODUCES
                            regex: ^(?!((javax|jakarta)\.ws\.rs\.)?Produces$)
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern-either: *jaxrs-markup-entities
                        - metavariable-regex:
                            metavariable: $...P
                            regex: ^(?![\s\S]*(?i:xml|svg))
                  - pattern-not:
                      patterns:
                        - pattern-inside: *annotated-class
                        - pattern: *jaxrs-string-return
                        - pattern-not-inside: |
                            String $M2(...) { ... }
                  - pattern-not-inside: |
                      @jakarta.ws.rs.Produces(...)
                      $RT $M(...) { ... }
                  - pattern-not-inside: |
                      @javax.ws.rs.Produces(...)
                      $RT $M(...) { ... }
          - focus-metavariable: $X
      # Jakarta REST: a Response entity given an HTML type (the other types are excluded).
      - patterns:
          - pattern-either: &jaxrs-typed-entities
              - pattern: Response.ok($X, $TYPE)
              - pattern: Response.ok($X). ... .type($TYPE)
              - pattern: Response.$F(...). ... .entity($X). ... .type($TYPE)
              - pattern: Response.$F(...). ... .type($TYPE). ... .entity($X)
          - pattern-not:
              patterns:
                - pattern-either: *jaxrs-typed-entities
                - metavariable-regex:
                    metavariable: $TYPE
                    regex: ^(?![\s\S]*(?i:html))
          - focus-metavariable: $X
      # ... or an XML or SVG type, for markup the code builds (as above).
      - patterns:
          - pattern-either: *jaxrs-typed-entities
          - pattern-not:
              patterns:
                - pattern-either: *jaxrs-typed-entities
                - metavariable-regex:
                    metavariable: $TYPE
                    regex: ^(?![\s\S]*(?i:xml|svg))
          - pattern-not:
              patterns:
                - pattern-either: *jaxrs-typed-entities
                - pattern-not-inside: *markup-assigned
                - pattern-not-inside: *format-assigned
                - pattern-not-inside: *concat-assigned
                - pattern-not-inside: *markup-appended
                - pattern-not:
                    patterns:
                      - pattern: Response.$G(..., $X, ...)
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: $A + $B
                            - pattern: String.format(...)
                - pattern-not:
                    patterns:
                      - pattern: Response.$G(...). ... .entity($X). ... .type($TYPE)
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: $A + $B
                            - pattern: String.format(...)
                - pattern-not:
                    patterns:
                      - pattern: Response.$G(...). ... .type($TYPE). ... .entity($X)
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: $A + $B
                            - pattern: String.format(...)
                - pattern-not:
                    patterns:
                      - pattern: Response.ok($X). ... .type($TYPE)
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: $A + $B
                            - pattern: String.format(...)
          - focus-metavariable: $X
