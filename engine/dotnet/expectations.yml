# Which todo lines of the OpenGrep fixtures the engine must turn into findings (todoruleid) or keep quiet (todook).
# The OpenGrep fixtures are never edited for the engine (spec §6.1).
# entries: { rule: csharp.sql-injection, line: 123, why: "expression-bodied member" }
must-find:
  # OpenGrep carries no taint out of an expression-bodied method or a property getter (Known limit); the engine's
  # summaries do (Task 8).
  - { rule: csharp.sql-injection, line: 867, why: "TagOf(Request): an expression-bodied helper that reads the request" }
  - { rule: csharp.sql-injection, line: 870, why: "BuildFilter(term): an expression-bodied helper that passes its argument on" }
  - { rule: csharp.sql-injection, line: 872, why: "Region: an expression-bodied property that reads the request" }
  - { rule: csharp.sql-injection, line: 874, why: "Channel: a property getter that reads the request" }
  - { rule: csharp.path-traversal, line: 375, why: "PathOf(Request): an expression-bodied helper that reads the request" }
  - { rule: csharp.path-traversal, line: 377, why: "Section: an expression-bodied property that reads the request" }
  - { rule: csharp.path-traversal, line: 379, why: "Channel: a property getter that reads the request" }
  # OpenGrep cannot tell a StreamReader's path overload from its Stream overload (Known limit); the engine goes by the
  # overload (`param-types` in models/csharp/path-traversal.yml).
  - { rule: csharp.path-traversal, line: 332, why: "new StreamReader(path): the path overload is a sink" }
  - { rule: csharp.command-injection, line: 465, why: "ToolOf(Request): an expression-bodied helper that reads the request" }
  - { rule: csharp.command-injection, line: 471, why: "Tool: an expression-bodied property that reads the request" }
  - { rule: csharp.command-injection, line: 473, why: "Channel: a property getter that reads the request" }
  # A shell chosen by a ternary given to Process.Start (OpenGrep Known limit): the conditional sink's `arg: 0` takes the
  # constants of both branches.
  - { rule: csharp.command-injection, line: 443, why: "Process.Start(windows ? \"cmd.exe\" : \"/bin/sh\", ...): both branches are shells" }
  - { rule: csharp.ssrf, line: 274, why: "UrlOf(Request): an expression-bodied helper that reads the request" }
  - { rule: csharp.ssrf, line: 276, why: "Endpoint: an expression-bodied property that reads the request" }
  - { rule: csharp.ssrf, line: 278, why: "Channel: a property getter that reads the request" }
  # OpenGrep takes every awaited Get/Find/Load*Async call on another object for a stored-data lookup (Known limit); the
  # engine's `lookup:` sanitizer applies only to methods without a body and follows a helper that has one.
  - { rule: csharp.ssrf, line: 255, why: "this.GetTargetAsync(id): a helper with a body that hands the request data back" }
  - { rule: csharp.ssrf, line: 259, why: "UrlTools.LoadNormalizedAsync(id): a helper of another class with a body that hands it back" }
  - { rule: csharp.xss, line: 326, why: "TextOf(Request): an expression-bodied helper that reads the request" }
  - { rule: csharp.xss, line: 328, why: "Referrer: an expression-bodied property that reads the request" }
  - { rule: csharp.xss, line: 330, why: "Channel: a property getter that reads the request" }
  # PathString is cleaned where it becomes text (ToString, ToUriComponent, its conversion to string), not where it is
  # read (the OpenGrep rule's Known limit): its .Value read from a variable stays request data.
  - { rule: csharp.xss, line: 197, why: "held.Value: a PathString held in a variable, its unescaped Value" }
  # The content type's constants are followed through a local (`when: arg: 1`): one of them is HTML.
  - { rule: csharp.xss, line: 318, why: "Content(html, type) with type = other == \"html\" ? \"text/html\" : \"text/plain\"" }
must-stay-quiet:
  # Results.File given a stream is no path: the engine goes by the overload (`param-types`), OpenGrep cannot (Known limit).
  - { rule: csharp.path-traversal, line: 367, why: "Results.File(Request.Body, ...): the Stream overload is no sink" }
