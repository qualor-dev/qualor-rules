# Names the models use that do not resolve against FixtureReferences.All (a test checks this list matches exactly).
# All are APIs of libraries older than the ones the fixtures compile against, modelled so a project that still uses
# them is covered.
unresolved-model-names:
  - { name: "System.Data.SqlClient.SqlCommand", reason: "System.Data.SqlClient package (legacy; Microsoft.Data.SqlClient replaced it) is not a fixture reference" }
  - { name: "System.Data.SqlClient.SqlDataAdapter", reason: "System.Data.SqlClient package (legacy) is not a fixture reference" }
  - { name: "MySql.Data.MySqlClient.MySqlCommand", reason: "MySql.Data (Oracle connector, GPL) is not a fixture reference; MySqlConnector is" }
  - { name: "Microsoft.EntityFrameworkCore.RawSqlString", reason: "EF Core 2.x type; removed in EF Core 3.0" }
  - { name: "Microsoft.EntityFrameworkCore.RelationalDatabaseFacadeExtensions.ExecuteSqlCommand [Method]", reason: "EF Core 2.x method; removed in EF Core 3.0" }
  - { name: "Microsoft.EntityFrameworkCore.RelationalDatabaseFacadeExtensions.ExecuteSqlCommandAsync [Method]", reason: "EF Core 2.x method; removed in EF Core 3.0" }
  - { name: "System.Runtime.Serialization.Formatters.Binary.BinaryFormatter.UnsafeDeserialize* [Method]", reason: ".NET Framework only (UnsafeDeserialize, UnsafeDeserializeMethodResponse); not in .NET 8" }
  - { name: "System.Runtime.Serialization.Formatters.Soap.SoapFormatter", reason: ".NET Framework only (System.Runtime.Serialization.Formatters.Soap); the unsafe-deserialization shim declares it" }
  - { name: "System.Runtime.Serialization.NetDataContractSerializer", reason: ".NET Framework only; the unsafe-deserialization shim declares it" }
  - { name: "System.Web.Script.Serialization.JavaScriptSerializer", reason: ".NET Framework only (System.Web.Extensions); the unsafe-deserialization shim declares it" }
  - { name: "System.Web.Script.Serialization.SimpleTypeResolver", reason: ".NET Framework only (System.Web.Extensions); the unsafe-deserialization shim declares it" }
  - { name: "System.Web.UI.LosFormatter", reason: ".NET Framework only (System.Web); the unsafe-deserialization shim declares it" }
  - { name: "System.Web.UI.ObjectStateFormatter", reason: ".NET Framework only (System.Web); the unsafe-deserialization shim declares it" }
  - { name: "Duende.IdentityServer.Services.IIdentityServerInteractionService", reason: "Duende IdentityServer (commercial licence) is not a fixture reference; the open-redirect shim declares the interface the fixture uses" }
  - { name: "System.Text.RegularExpressions.Regex.EnumerateSplits [Method]", reason: "added in .NET 9; the fixture references are .NET 8 (a project on .NET 9 or later has it)" }
  - { name: "Microsoft.AspNetCore.Http.HttpResults.RedirectHttpResult.IsLocalUrl [Method]", reason: "public from ASP.NET Core 10; the fixture references are ASP.NET Core 8 (Task 33's tests declare the type in the snippet)" }
