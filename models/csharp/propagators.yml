# How taint passes through code the engine does not analyse (format v1, models/README.md), shared by every
# taint model. `from`: this, args (every argument but out ones) or a parameter ordinal; `to`: return, this, out
# (the out and ref arguments) or a parameter ordinal. Defaults: a method from [this, args], a constructor from
# [args], a property read from [this]; to [return].
#
# The OpenGrep rules (rules/csharp/sql/sql-injection.yml, `pattern-propagators` up to "End of the shared C#
# propagators") list only what OpenGrep's own taint does not do: text added to a StringBuilder (Append, also
# later in an Append chain, AppendLine, AppendFormat) and the out value of TryGetValue on a request collection.
# OpenGrep itself carries taint through every call (arguments and receiver to the result), concatenation and
# interpolation. The engine carries concatenation and interpolation itself and models the rest here: the items
# below name the library members the OpenGrep behaviour relies on, and `unmodelled-external` is the default for
# every other external member (spec §5: only a string-like or collection result; such defaults are counted in
# the run report).
# Difference: OpenGrep's TryGetValue propagator applies to any receiver; the engine names the dictionaries
# (every implementation of the interfaces below: Dictionary, the request's query, form, headers, cookies, route
# values), since `from: [this]` only matters on a tainted collection.
#
# Sources (learn.microsoft.com): dotnet/api/system.string, system.text.stringbuilder, system.io.path,
# system.uri, system.uribuilder, system.linq.enumerable, system.collections.generic.idictionary-2,
# microsoft.extensions.primitives.stringvalues, microsoft.aspnetcore.http.iquerycollection,
# system.io.streamreader, system.collections.generic.collectionextensions.getvalueordefault,
# system.collections.generic.ienumerator-1, system.collections.generic.keyvaluepair-2,
# system.collections.concurrent.concurrentdictionary-2.
propagators:
  # Strings: the receiver and the arguments reach the result.
  - method: System.String..ctor
  - method: System.String.Concat
  - method: System.String.Format
  - method: System.String.Join
  - method: System.String.Trim*             # Trim, TrimStart, TrimEnd
  - method: System.String.Substring
  - method: System.String.Replace
  - method: System.String.Insert
  - method: System.String.Remove
  - method: System.String.Pad*              # PadLeft, PadRight
  - method: System.String.ToLower*          # ToLower, ToLowerInvariant
  - method: System.String.ToUpper*
  - method: System.String.Normalize
  - method: System.String.Split
  - method: System.String.ToCharArray
  - method: System.Object.ToString          # every override too (StringBuilder, Uri, StringValues, ...)
  - method: System.Convert.ToString
  # StringBuilder: text added reaches the builder and the call's value (an Append chain).
  - method: System.Text.StringBuilder..ctor
  - method: System.Text.StringBuilder.Append*   # Append, AppendLine, AppendFormat, AppendJoin
    from: [args]
    to: [this, return]
  - method: System.Text.StringBuilder.Insert
    from: [args]
    to: [this, return]
  - method: System.Text.StringBuilder.Replace
    from: [args]
    to: [this, return]
  # Paths and URIs.
  - method: System.IO.Path.Combine
  - method: System.IO.Path.Join
  - method: System.IO.Path.GetFullPath
  - method: System.Uri..ctor
  - method: System.Uri.TryCreate
    from: [args]
    to: [out]
  - property-get: System.Uri.*              # AbsoluteUri, AbsolutePath, PathAndQuery, Query, Host, ...
  - method: System.UriBuilder..ctor         # (scheme, host, ...), (uri)
  - property-get: System.UriBuilder.*       # Uri, Host, Path, Query, ...
  # Uri.MakeRelativeUri: a path relative to the receiver, or the argument itself when its host or scheme differs; the
  # receiver cannot choose the host of the result.
  - method: System.Uri.MakeRelativeUri
    from: [0]
  # ASP.NET Core's URL parts: a PathString or HostString made from a string (constructor, Add, FromUriComponent) holds
  # it; its Value and its text (ToString, which escapes) come from it. (The engine's default would drop them: neither
  # is string-like nor a collection.) UriHelper.BuildAbsolute writes the scheme and the host first and then the escaped
  # PathString, QueryString and FragmentString values, which cannot change them: only the scheme and the host reach
  # the URL's origin, and the result carries them (`from: [0, 1]`).
  - method: Microsoft.AspNetCore.Http.PathString..ctor
  - method: Microsoft.AspNetCore.Http.PathString.Add
  - method: Microsoft.AspNetCore.Http.PathString.FromUriComponent
  - method: Microsoft.AspNetCore.Http.HostString..ctor
  - method: Microsoft.AspNetCore.Http.HostString.FromUriComponent
  - method: Microsoft.AspNetCore.Http.Extensions.UriHelper.BuildAbsolute
    from: [0, 1]
  # QueryHelpers.AddQueryString writes the names and values given into the query of the URI, encoded: only the URI
  # (ordinal 0) reaches the result's scheme, host and path.
  - method: Microsoft.AspNetCore.WebUtilities.QueryHelpers.AddQueryString
    from: [0]
  # URLs generated from routes on this site (UrlHelperExtensions.Action, Page and RouteUrl): the action, controller, page
  # and route names and the route values are encoded into a path of this application. A protocol and a host given to
  # them make an absolute URL elsewhere, and the fragment is appended as it is (not encoded): those reach the result.
  # In every overload (learn.microsoft.com: microsoft.aspnetcore.mvc.urlhelperextensions; an extension's `this` is 0)
  # Action and Page take protocol, host and fragment at ordinals 4, 5 and 6, RouteUrl at 3, 4 and 5; the overloads
  # with fewer parameters stop before them (a test checks the names against the reference assemblies).
  - method: Microsoft.AspNetCore.Mvc.UrlHelperExtensions.Action
    from: [4, 5, 6]
  - method: Microsoft.AspNetCore.Mvc.UrlHelperExtensions.Page
    from: [4, 5, 6]
  - method: Microsoft.AspNetCore.Mvc.UrlHelperExtensions.RouteUrl
    from: [3, 4, 5]
  # Request collections and their values. Element reads (ruling R-E9, narrowed by R-E18): the element of a tainted
  # collection, and the element found by a tainted key when it can carry an injection by itself (`key:`: a string, a
  # number, a sequence or array of them; a settings object, an entity or a content item found by a request key is not
  # request data, nor are its members). OpenGrep's taint passes through a lookup by its key whatever the element; a
  # table of literals that no code changes is an allow-list: models/README.md "Allow-lists". So TryGetValue's out value
  # comes from the dictionary, and from the key for such an element.
  - method: System.Collections.Generic.IDictionary`2.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: System.Collections.Generic.IReadOnlyDictionary`2.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: Microsoft.AspNetCore.Http.IQueryCollection.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: Microsoft.AspNetCore.Http.IFormCollection.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: Microsoft.AspNetCore.Http.IRequestCookieCollection.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: Microsoft.Extensions.Primitives.StringValues.op_Implicit
  - method: Microsoft.Extensions.Primitives.StringValues.ToArray
  # Element reads: an indexer (metadata name Item) gives a tainted element when the collection is tainted, or the key
  # for an element that can carry an injection (R-E9, R-E18, as TryGetValue above; an int index is a scalar and never
  # tainted). The engine needs the indexers named, since an element of type object (RouteValues["slug"]) or
  # StringValues is neither string-like nor a collection for `unmodelled-external`. IHeaderDictionary's own indexer,
  # RouteValueDictionary's and Dictionary's match through the dictionary interfaces; array elements are no member (the
  # engine's own).
  - property-get: System.Collections.Generic.IDictionary`2.Item
    from: [this]
    key: [0]
  - property-get: System.Collections.Generic.IReadOnlyDictionary`2.Item
    from: [this]
    key: [0]
  - property-get: System.Collections.Generic.IList`1.Item
    from: [this, args]
  - property-get: System.Collections.Generic.IReadOnlyList`1.Item
    from: [this, args]
  - property-get: Microsoft.AspNetCore.Http.IQueryCollection.Item
    from: [this]
    key: [0]
  - property-get: Microsoft.AspNetCore.Http.IFormCollection.Item
    from: [this]
    key: [0]
  - property-get: Microsoft.AspNetCore.Http.IRequestCookieCollection.Item
    from: [this]
    key: [0]
  - property-get: Microsoft.AspNetCore.Http.IHeaderDictionary.Item
    from: [this]
    key: [0]
  - property-get: Microsoft.Extensions.Primitives.StringValues.Item
    from: [this, args]
  # GetValueOrDefault: the dictionary's element, found by the key, or the default value given (an extension
  # method: the dictionary is ordinal 0, the key 1, the default 2 in the three-parameter overload); R-E9, R-E18.
  - method: System.Collections.Generic.CollectionExtensions.GetValueOrDefault
    from: [0, 2]
    key: [1]
  # Caches (R-E18). A lookup by key gives the cached element, from the key only as above. A cache with a value factory
  # gives what is cached or what the factory makes, never the key: the factory's result (a lambda's or method group's
  # value) and, for ConcurrentDictionary, its elements and the value given (GetOrAdd(key, value), AddOrUpdate).
  # (learn.microsoft.com: dotnet/api/microsoft.extensions.caching.memory.cacheextensions,
  # microsoft.extensions.caching.memory.imemorycache, microsoft.extensions.caching.distributed.idistributedcache,
  # microsoft.extensions.caching.distributed.distributedcacheextensions,
  # system.collections.concurrent.concurrentdictionary-2.)
  - method: Microsoft.Extensions.Caching.Memory.CacheExtensions.GetOrCreate*   # GetOrCreate, GetOrCreateAsync
    from: [2]
  # The entry a GetOrCreate factory is given holds the key it was created for.
  - property-get: Microsoft.Extensions.Caching.Memory.ICacheEntry.Key
  - method: Microsoft.Extensions.Caching.Memory.CacheExtensions.Get
    from: [0]
    key: [1]
  - method: Microsoft.Extensions.Caching.Memory.CacheExtensions.TryGetValue
    from: [0]
    key: [1]
    to: [out]
  - method: Microsoft.Extensions.Caching.Memory.IMemoryCache.TryGetValue
    from: [this]
    key: [0]
    to: [out]
  - method: Microsoft.Extensions.Caching.Distributed.DistributedCacheExtensions.GetString*   # GetString, GetStringAsync
    from: [0]
    key: [1]
  - method: Microsoft.Extensions.Caching.Distributed.IDistributedCache.Get*   # Get, GetAsync
    from: [this]
    key: [0]
  - method: System.Collections.Concurrent.ConcurrentDictionary`2.GetOrAdd
    from: [this, 1, 2]
  - method: System.Collections.Concurrent.ConcurrentDictionary`2.AddOrUpdate
    from: [this, 1, 2, 3]
  # Enumeration (a foreach, lowered by the compiler to GetEnumerator, MoveNext and Current): the enumerator of a
  # tainted collection is a collection for `unmodelled-external`; its Current is an element read, whatever its type
  # (a KeyValuePair of a dictionary too, whose Key and Value are then element reads).
  - property-get: System.Collections.Generic.IEnumerator`1.Current
  - property-get: System.Collections.IEnumerator.Current
  - property-get: System.Collections.Generic.KeyValuePair`2.Key
  - property-get: System.Collections.Generic.KeyValuePair`2.Value
  # The request body read through its PipeReader (Request.BodyReader: ReadAsync, the result's Buffer, its
  # segments, decoded with Encoding.GetString). OpenGrep carries taint through every call; none of these
  # results is string-like or a collection, so `unmodelled-external` would drop it at the first step.
  # (learn.microsoft.com: dotnet/api/system.io.pipelines.pipereader, system.io.pipelines.readresult,
  # system.buffers.readonlysequence-1, system.buffers.buffersextensions, system.readonlymemory-1,
  # system.readonlyspan-1, system.text.encoding.getstring, system.text.encodingextensions.getstring.)
  - method: System.IO.Pipelines.PipeReader.ReadAsync         # ValueTask<ReadResult>
    from: [this]
  - method: System.IO.Pipelines.PipeReader.ReadAtLeastAsync
    from: [this]
  - method: System.IO.Pipelines.PipeReader.TryRead
    from: [this]
    to: [out]
  - method: System.IO.Pipelines.PipeReader.AsStream
    from: [this]
  - property-get: System.IO.Pipelines.ReadResult.Buffer       # ReadOnlySequence<byte>
  - property-get: System.Buffers.ReadOnlySequence`1.First     # ReadOnlyMemory<T>
  - property-get: System.Buffers.ReadOnlySequence`1.FirstSpan # ReadOnlySpan<T>
  - method: System.Buffers.ReadOnlySequence`1.Slice
    from: [this]
  - method: System.Buffers.BuffersExtensions.ToArray          # ReadOnlySequence<T> → T[]
  - property-get: System.ReadOnlyMemory`1.Span
  - method: System.ReadOnlyMemory`1.Slice
    from: [this]
  - method: System.ReadOnlyMemory`1.ToArray
  - method: System.ReadOnlySpan`1.Slice
    from: [this]
  - method: System.ReadOnlySpan`1.ToArray
  - method: System.Text.Encoding.GetString                    # byte[], ReadOnlySpan<byte>
    from: [args]
  - method: System.Text.EncodingExtensions.GetString          # (this Encoding, in ReadOnlySequence<byte>)
    from: [1]
  # The request body read as text.
  - method: System.IO.StreamReader..ctor
  - method: System.IO.TextReader.ReadToEnd*     # ReadToEnd, ReadToEndAsync
    from: [this]
  - method: System.IO.TextReader.ReadLine*
    from: [this]
  # A task's awaiter: ConfigureAwait keeps the task's value (ConfiguredTaskAwaitable is neither string-like nor a
  # collection).
  - method: System.Threading.Tasks.Task`1.ConfigureAwait
    from: [this]
  - method: System.Threading.Tasks.ValueTask`1.ConfigureAwait
    from: [this]
  # LINQ: the source sequence (an extension method's `this` is its first argument) and the other arguments
  # (a second sequence, a seed) reach the result.
  - method: System.Linq.Enumerable.*
unmodelled-external: string-or-collection-return
