# The engine's model of csharp.command-injection (format v1, models/README.md): the sinks of
# rules/csharp/command/command-injection.yml with types in place of names, written as conditional sinks (`when:`)
# where the OpenGrep rule checks the program or the command switch. Sources and propagators: sources.yml and
# propagators.yml (shared).
#
# Sources (learn.microsoft.com): dotnet/api/system.diagnostics.process.start,
# dotnet/api/system.diagnostics.processstartinfo, dotnet/api/system.diagnostics.processstartinfo.argumentlist,
# windows-server/administration/windows-commands/cmd, dotnet/api/system.diagnostics.process.standardinput,
# dotnet/api/system.diagnostics.processstartinfo.redirectstandardinput, powershell/module/microsoft.powershell.core/about/about_pwsh,
# powershell/module/microsoft.powershell.core/about/about_powershell_exe; www.gnu.org/software/bash/manual
# (Invoking Bash); pubs.opengroup.org/onlinepubs/9799919799/utilities/sh.html (sh).
#
# The patterns the conditions use, as in the OpenGrep rule:
# - a shell: cmd, sh, bash, dash, zsh, ksh, mksh, ash, pwsh or powershell, with a path and .exe;
# - a command switch in an arguments string: /c, /k, -c (also -lc, -ec: any letters ending in c), -Command,
#   -CommandWithArgs (-cwa), -EncodedCommand;
# - in an argument vector, for a POSIX shell (and PowerShell's -CommandWithArgs, -EncodedCommand) the element right
#   after -c (-lc, -ec, -cwa, -e, ...) is the script and the later ones are positional parameters; for cmd /c or /k
#   and PowerShell -Command (-c) every later element is part of the command.
# Differences from the OpenGrep rule:
# - the program is followed by its constant values wherever they come from in the method (a literal, a const, a local
#   assigned literals, both branches of a ternary given to Process.Start too: an OpenGrep Known limit), and the
#   FileName of a ProcessStartInfo is the one set on that object anywhere in the method (an initializer, a
#   constructor, an assignment before or after);
# - FileName and Arguments are sinks on a real ProcessStartInfo only (look-alike classes are not), wherever it was
#   created; Process.Start given a ProcessStartInfo is no sink (its parts are checked where they are set), which the
#   engine knows from the overload.
# Argument injection into a fixed program that is not a shell (CWE-88) is out of scope, as in the OpenGrep rule.
rule: csharp.command-injection
kind: taint
sinks:
  # The program: the file name given to Process.Start or a ProcessStartInfo.
  - method: System.Diagnostics.Process.Start
    args: [0]
    param-types: [System.String]
  - method: System.Diagnostics.ProcessStartInfo..ctor
    args: [0]
  - property-set: System.Diagnostics.ProcessStartInfo.FileName
  # The command line of a shell given as one arguments string (or an argument vector held in a variable, taken as a
  # whole): when the program is a shell, and the arguments hold a command switch or no string literal at all.
  # (Process.Start(fileName, userName, password, domain) has a string at parameter 1 too: its user name given to a
  # shell with no literal text is reported as well; `param-types` cannot tell that overload apart, and a user name
  # chosen by the request for a fixed shell is rare.)
  - method: System.Diagnostics.Process.Start
    args: [1]
    param-types: [System.String, System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(cmd|sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - literal-text: '(?i)(^|[\s"''(])(/[ck]|-[a-z]*c|-command|-commandwithargs|-cwa|-encodedcommand)([\s"'']|$)'
  - method: System.Diagnostics.ProcessStartInfo..ctor
    args: [1]
    param-types: [System.String, System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(cmd|sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - literal-text: '(?i)(^|[\s"''(])(/[ck]|-[a-z]*c|-command|-commandwithargs|-cwa|-encodedcommand)([\s"'']|$)'
  - property-set: System.Diagnostics.ProcessStartInfo.Arguments
    when:
      - property: FileName
        matches: '(?i)^(.*[\\/])?(cmd|sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - literal-text: '(?i)(^|[\s"''(])(/[ck]|-[a-z]*c|-command|-commandwithargs|-cwa|-encodedcommand)([\s"'']|$)'
  # A shell's argument vector written in place (an array, a List<string>, a collection expression): the script
  # after the switch, element by element.
  - method: System.Diagnostics.Process.Start
    args: [1]
    param-types: [System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^-([a-z]*c[a-z]*|cwa|commandwithargs|e|encodedcommand)$'
        next: true
  - method: System.Diagnostics.Process.Start
    args: [1]
    param-types: [System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(cmd|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^(/[ck]|-c|-command)$'
  - method: System.Diagnostics.ProcessStartInfo..ctor
    args: [1]
    param-types: [System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^-([a-z]*c[a-z]*|cwa|commandwithargs|e|encodedcommand)$'
        next: true
  - method: System.Diagnostics.ProcessStartInfo..ctor
    args: [1]
    param-types: [System.Collections.Generic.IEnumerable`1]
    when:
      - arg: 0
        matches: '(?i)^(.*[\\/])?(cmd|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^(/[ck]|-c|-command)$'
  # ProcessStartInfo.ArgumentList of a shell (statements `psi.ArgumentList.Add(x)` or a collection initializer
  # `ArgumentList = { "-c", x }`): the element added right after -c (POSIX), or any element after /c, /k or -Command.
  - method: System.Collections.ObjectModel.Collection`1.Add
    args: [0]
    when:
      - receiver: System.Diagnostics.ProcessStartInfo.ArgumentList
      - property: FileName
        matches: '(?i)^(.*[\\/])?(sh|bash|dash|zsh|ksh|mksh|ash|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^-([a-z]*c[a-z]*|cwa|commandwithargs|e|encodedcommand)$'
        next: true
  - method: System.Collections.ObjectModel.Collection`1.Add
    args: [0]
    when:
      - receiver: System.Diagnostics.ProcessStartInfo.ArgumentList
      - property: FileName
        matches: '(?i)^(.*[\\/])?(cmd|pwsh|powershell)(\.exe)?$'
      - after: '(?i)^(/[ck]|-c|-command)$'
  # A shell's standard input (Task 29, decision R-10; BACKLOG csharp.command-injection#shell-stdin): text written
  # (TextWriter Write, WriteLine, WriteAsync, WriteLineAsync) to the StandardInput of a Process whose StartInfo starts a
  # shell that reads its standard input as commands. Per shell, from its documentation:
  # - cmd (windows-commands/cmd): `/c` carries out one command and stops; without it, `/k` included, cmd keeps reading
  #   commands.
  # - pwsh, powershell (about_pwsh, about_powershell_exe): `-Command`/`-c`, `-File`/`-f`, `-CommandWithArgs`/`-cwa` run
  #   their value, except the value `-`, which reads the commands from standard input; `-EncodedCommand`/`-e`/`-ec` runs
  #   its value; a value with no parameter name is a script (`-File` is the default parameter). The values of the
  #   value-taking parameters (`-ExecutionPolicy Bypass`, `-WindowStyle Hidden`, ...) are no script. With `-NoExit` the
  #   session keeps reading after its command.
  # - sh (pubs.opengroup.org utilities/sh: "-s Read commands from the standard input"; with no operand and no -c, -s is
  #   assumed) and bash (Invoking Bash): `-c` (also bundled: `-ec`) runs its command string; an operand is a command file,
  #   except with `-s`; the values of `-o`/`+o` (and bash's `-O`/`+O`, `--rcfile`, `--init-file`) are no operand.
  # The process is told apart by access path: `p.StartInfo`, `new Process { StartInfo = { FileName = "sh" } }`, a
  # ProcessStartInfo local given as `StartInfo` (assigned or in the initializer), or a local assigned
  # `Process.Start(info)` / `Process.Start("bash", arguments)` once. The writer is `p.StandardInput` in place or a local
  # assigned it once (`using (var input = p.StandardInput)`).
  # Not followed (FN): bytes written to `StandardInput.BaseStream`; a shell started through a launcher (`env bash`,
  # `busybox sh`: FileName env or busybox); other shells (dash, zsh, ksh, fish, csh, ...: not in the cited documents);
  # arguments given through ArgumentList (not read: the shell counts as reading its input).
  # Difference: the OpenGrep rule has no stdin sink (BACKLOG row kept open for it).
  - method: System.IO.TextWriter.Write*
    args: [0]
    when:
      - receiver: System.Diagnostics.Process.StandardInput
      - property: StartInfo.FileName
        matches: '(?i)^(.*[\\/])?cmd(\.exe)?$'
      - property: StartInfo.Arguments
        unless: '(?i)(^|\s)/c(\s|$)'
  - method: System.IO.TextWriter.Write*
    args: [0]
    when:
      - receiver: System.Diagnostics.Process.StandardInput
      - property: StartInfo.FileName
        matches: '(?i)^(.*[\\/])?(pwsh|powershell)(\.exe)?$'
      - property: StartInfo.Arguments
        unless: '(?i)^(?!(.*\s)?-noe(xit)?(\s|$)).*((^|\s)-(c|command|f|file|cwa|commandwithargs)\s+(?!-(\s|$))\S|(^|\s)-(e|ec|encodedcommand)(\s|$)|(^|\s)(?<!(^|\s)-(executionpolicy|ex|ep|windowstyle|w|inputformat|inp|if|outputformat|o|of|workingdirectory|wd|wo|configurationname|config|configurationfile|settingsfile|settings|custompipename|version|v)\s+)[^\s-]\S*)'
  - method: System.IO.TextWriter.Write*
    args: [0]
    when:
      - receiver: System.Diagnostics.Process.StandardInput
      - property: StartInfo.FileName
        matches: '^(.*[\\/])?(sh|bash)$'
      - property: StartInfo.Arguments
        unless: '(^|\s)-[a-zA-Z]*c[a-zA-Z]*(\s|$)|^(?!(.*\s)?-[a-zA-Z]*s[a-zA-Z]*(\s|$)).*(^|\s)(?<!(^|\s)([-+][oO]|--rcfile|--init-file)\s+)[^\s+-]\S*'
# Shared C# sanitizers (as in every taint model; see sql-injection.yml) and the shared allow-lists. The rule has none of
# its own.
sanitizers:
  - method: System.Int32.Parse
  - method: System.Int64.Parse
  - method: System.Guid.Parse
  - method: System.DateTime.Parse
  - method: System.Convert.ToInt32
  - method: System.Convert.ToInt64
  - method: System.Enum.Parse
  - allow-list: literal-tables
guards: []
